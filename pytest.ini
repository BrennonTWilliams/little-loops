# Root pytest config stub.
#
# The real configuration lives in scripts/pyproject.toml
# ([tool.pytest.ini_options]) — keep the two in sync. This stub exists because
# a bare `pytest` run from the repo root would otherwise find NO ini file at
# all (there is no root pyproject.toml): no worker cap, no per-test timeout,
# and recursive collection from the repo root. Several FSM loops fall back to
# bare `pytest` when project.test_cmd is unset, so this closes that hole.
#
# Invocations that pass scripts/tests explicitly (the configured test_cmd)
# resolve scripts/pyproject.toml instead, per pytest's rootdir rules.
[pytest]
testpaths = scripts/tests
addopts =
    --strict-markers
    --strict-config
    --timeout=120
    --timeout-method=thread
    -n logical
    --dist loadfile
markers =
    integration: marks tests as integration tests (deselect with '-m "not integration"')
    slow: marks tests as slow running (deselect with '-m "not slow"')
    conformance: marks tests as host conformance tests (deselect with '-m "not conformance"')
    no_parallel: marks tests that must not run on xdist workers (subprocess signal-handling, timing-sensitive) — see scripts/tests/conftest.py
tmp_path_retention_count = 1
tmp_path_retention_policy = failed
