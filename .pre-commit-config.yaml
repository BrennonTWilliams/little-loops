repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: ll-verify-decisions
        name: Validate .ll/decisions.yaml
        language: system
        entry: ll-verify-decisions
        files: ^\.ll/decisions(\.yaml|\.d/.*\.json)$
        pass_filenames: false
      - id: ll-verify-private-refs
        name: Check for private-codebase references
        language: system
        entry: ll-verify-private-refs --added-only
        pass_filenames: true
        exclude: ^(postmortems/|\.loops/|thoughts/|\.ll/private-refs-baseline\.json$)
