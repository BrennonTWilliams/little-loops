repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: ll-verify-decisions
        name: Validate .ll/decisions.yaml
        language: system
        entry: ll-verify-decisions
        files: ^\.ll/decisions(\.yaml|\.d/.*\.json)$
        pass_filenames: false
      - id: ll-verify-private-refs
        name: Check for private-codebase references
        language: system
        entry: ll-verify-private-refs --added-only
        pass_filenames: true
        exclude: ^(postmortems/|\.loops/|thoughts/|\.ll/private-refs-baseline\.json$)
      - id: ll-verify-evidence
        # BUG-3282: warn-only (non-blocking) on first release. This hook fires
        # inside ll-auto/ll-parallel/refine-loop automation, which commits
        # issue files continuously; a precision miss here must not block a
        # commit mid-run the way the pytest gate's --all can afford to. Flip
        # to blocking (drop `|| true`) once the whole-corpus precision smoke
        # test has a stable ceiling.
        name: Check evidence quotes against cited artifacts (warn-only)
        language: system
        entry: bash -c 'll-verify-evidence --added-only "$@" || true' --
        pass_filenames: true
        files: ^\.issues/.*\.md$
