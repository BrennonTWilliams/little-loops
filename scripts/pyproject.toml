[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "little-loops"
version = "1.160.0"
description = "Development workflow toolkit for AI coding-agent CLIs (Claude Code, Codex, Gemini, Kimi Code) with issue management, code quality commands, and automated processing"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Brennon Williams", email = "brennon@brenentech.com" }
]
maintainers = [
    { name = "Brennon Williams", email = "brennon@brenentech.com" }
]
keywords = [
    "claude-code",
    "codex",
    "gemini",
    "kimi-code",
    "development",
    "workflow",
    "issue-management",
    "automation"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pyyaml>=6.0",
    "ruamel.yaml>=0.18",
    "wcwidth>=0.2",
    "questionary>=2.0",
    "rich>=13.0",
    # Bounded pin (FEAT-2673 OQ #1): this is the EPIC's only network-side SDK
    # dependency and the sole proof of cache_control behavior has untested
    # live-API assertions (.ll/learning-tests/anthropic.md) — an upper bound
    # turns an unverified upstream shape change into a loud install failure
    # instead of a silent oracle break.
    "anthropic>=0.104,<1.0",
    # FEAT-2930: `ll-queue run --watch`'s stale-entry reclaim needs a
    # PID-liveness *identity* check (not just os.kill(pid, 0)), so a recycled
    # PID isn't mistaken for the original owner. cli/loop/queue.py already
    # imports this unconditionally at module scope despite it being dev-only
    # today (a latent ImportError risk on a bare `pip install little-loops`);
    # this promotion also fixes that.
    "psutil>=5.9",
    # FEAT-3036: artifact templates (`ll-artifact render`) need repeated/
    # conditional template regions (N data sections -> N rendered cards as a
    # loop) that the codebase's existing flat, single-pass substitution
    # schemes (sed `{{name}}`, `.replace()` token-stamping, regex
    # `{{config.xxx}}`) cannot express. jinja2 is sandboxable
    # (SandboxedEnvironment) and Python-native.
    "jinja2>=3.1",
]

[project.urls]
Homepage = "https://github.com/BrennonTWilliams/little-loops"
Documentation = "https://docs.little-loops.ai"
Repository = "https://github.com/BrennonTWilliams/little-loops"
"Bug Tracker" = "https://github.com/BrennonTWilliams/little-loops/issues"

[project.scripts]
ll-action = "little_loops.cli:main_action"
ll-advise = "little_loops.cli:main_advise"
ll-artifact = "little_loops.cli:main_artifact"
ll-harness = "little_loops.cli:main_harness"
ll-help = "little_loops.cli:main_help"
ll-auto = "little_loops.cli:main_auto"
ll-parallel = "little_loops.cli:main_parallel"
ll-messages = "little_loops.cli:main_messages"
ll-loop = "little_loops.cli:main_loop"
ll-sprint = "little_loops.cli:main_sprint"
ll-sync = "little_loops.cli:main_sync"
ll-workflows = "little_loops.workflow_sequence:main"
ll-history = "little_loops.cli:main_history"
ll-verify-docs = "little_loops.cli:main_verify_docs"
ll-verify-skill-budget = "little_loops.cli:main_verify_skill_budget"
ll-verify-skill-prose = "little_loops.cli:main_verify_skill_prose"
ll-verify-skills = "little_loops.cli:main_verify_skills"
ll-check-links = "little_loops.cli:main_check_links"
ll-create-extension = "little_loops.cli:main_create_extension"
ll-issues = "little_loops.cli:main_issues"
ll-deps = "little_loops.cli:main_deps"
ll-code = "little_loops.cli:main_code"
ll-doctor = "little_loops.cli:main_doctor"
ll-gitignore = "little_loops.cli:main_gitignore"
ll-migrate = "little_loops.cli:main_migrate"
ll-migrate-relationships = "little_loops.cli:main_migrate_relationships"
ll-migrate-labels = "little_loops.cli:main_migrate_labels"
ll-migrate-status = "little_loops.cli:main_migrate_status"
ll-logs = "little_loops.cli:main_logs"
ll-session = "little_loops.cli:main_session"
ll-compact-session = "little_loops.cli:main_compact_session"
ll-history-context = "little_loops.cli:main_history_context"
ll-ctx-stats = "little_loops.cli:main_ctx_stats"
ll-config = "little_loops.cli:main_config"
ll-queue = "little_loops.cli:main_queue"
# internal: dev tooling — regenerates docs/reference/schemas/ after LLEvent changes
ll-generate-schemas = "little_loops.cli:main_generate_schemas"
ll-generate-skill-descriptions = "little_loops.cli:main_generate_skill_descriptions"
ll-adapt = "little_loops.cli:main_adapt"
ll-adapt-skills-for-codex = "little_loops.cli:main_adapt_skills_for_codex"
ll-learning-tests = "little_loops.cli:main_learning_tests"
ll-verify-triggers = "little_loops.cli:main_verify_triggers"
ll-verify-package-data = "little_loops.cli:main_verify_package_data"
ll-verify-design-tokens = "little_loops.cli:main_verify_design_tokens"
ll-verify-decisions = "little_loops.cli:main_verify_decisions"
ll-verify-des-audit = "little_loops.cli:main_verify_des_audit"
ll-verify-cli-allowlist = "little_loops.cli:main_verify_cli_allowlist"
ll-verify-kinds = "little_loops.cli:main_verify_kinds"
ll-verify-host-map = "little_loops.cli:main_verify_host_map"
ll-verify-private-refs = "little_loops.cli:main_verify_private_refs"
ll-verify-evidence = "little_loops.cli:main_verify_evidence"
ll-adapt-agents-for-codex = "little_loops.cli:main_adapt_agents_for_codex"
ll-init = "little_loops.cli:main_init"
ll-mcp = "little_loops.mcp_server:main_mcp"
mcp-call = "little_loops.mcp_call:main"

[project.entry-points."little_loops.extensions"]
# Extensions register here for automatic discovery.
# Example: my_ext = "my_package:MyExtension"

[project.entry-points.pytest11]
# ENH-2459: records pytest run results into .ll/history.db (test_run_events).
# Opt out with PYTEST_DISABLE_PLUGIN_LL_HISTORY=1 or `-p no:ll_history`.
ll_history = "little_loops.pytest_history_plugin"

[project.optional-dependencies]
dev = [
    # Upper bound is deliberate. The full suite began hanging at ~98-99%
    # completion under xdist (`-n logical --dist loadfile` +
    # `--timeout-method=thread`, see [tool.pytest.ini_options] below) once the
    # uncapped `>=7.0` pin started resolving to pytest 9.x against
    # pytest-xdist 3.8.0. Thread-method timeouts leave watchdog threads on
    # idle workers rather than terminating them (pytest-xdist #1094/#117,
    # pytest-timeout #72/#137), which is what wedges the run at the tail when
    # most workers have gone idle. The ci.yml --timeout-method=signal switch
    # addresses the watchdog-leak mechanism directly (SIGALRM per-worker
    # timeout, reaped by xdist), so the xdist<3.8 pin is now the *secondary*
    # belt-and-suspenders guard against the original mechanism rather than the
    # primary fix. Lift only alongside a verified clean full-suite run on
    # the newer major.
    "pytest>=7.0,<9",
    "pytest-cov>=4.0",
    # xdist<3.8 secondary guard: see comment on the xdist pin above.
    "pytest-xdist>=3.0,<3.8",
    # psutil moved to [project].dependencies (FEAT-2930) — it now backs both
    # xdist's `-n logical` core detection and _reclaim_stale's PID-liveness
    # identity check, so it's no longer dev-only.
    # pytest-timeout pin: >=2.0 is the *minimum* that supports signal-method's
    # per-worker SIGALRM install (the race-fixed redesign). Pin lower bound
    # only; the timeout-method=signal ci.yml switch is the actual fix.
    "pytest-timeout>=2.0",
    "hypothesis>=6.0",
    "mutmut>=3.0",
    # Pinned (not >=): an unpinned ruff let formatting drift between
    # contributor machines, surfacing as a ~50-file reformat on unrelated
    # branches. Bump deliberately, in the same commit as a full reformat.
    "ruff==0.14.10",
    "mypy>=1.0",
    "hatch>=1.0",
    "syrupy>=4.0",
    "pre-commit>=3.0",
]
llm = []
# FEAT-3135: exact pin, not a range. The 1.x line does not implement the
# 2026-07-28 no-`initialize`-handshake behavior `ll-mcp` is built on
# (proven: .ll/learning-tests/mcp.md, installed 1.21.0 rejects it), and
# 2.0.0 is the first and only 2.x release — there is no 2.x track record to
# justify an open upper bound. Optional rather than base because mcp==2.0.0
# pulls 16 mandatory transitive deps including a full HTTP server stack
# (starlette, uvicorn, sse-starlette, httpx2), pyjwt[crypto],
# opentelemetry-api, python-multipart, and jsonschema. `ll-mcp` now uses the
# HTTP server stack directly for its streamable-HTTP transport (FEAT-3143,
# `run_http()`), so those pieces are no longer merely transitive baggage —
# but they still land on every `pip install little-loops[mcp]` regardless of
# whether a given install ever runs `ll-mcp --http`, which is why this stays
# an optional extra rather than a base dependency. Per CLAUDE.md § Code Style
# (minimize third-party dependencies).
mcp = ["mcp==2.0.0"]
otel = [
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-grpc>=1.20.0",
]
webhooks = [
    "httpx>=0.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["little_loops"]
include = ["little_loops/**", "LICENSE", "README.md"]

# BUG-3177: skills/ stays physically at the repo root (host-plugin glue,
# FEAT-2274/BUG-938's deliberate out-of-wheel boundary) but ll-mcp's
# prompts-from-skills surface (FEAT-3137) is package code that now genuinely
# reads it, so a build-time copy lands in the wheel without relocating the
# source tree or touching .claude-plugin/plugin.json's "./skills" reference.
#
# This is a custom build hook (hatch_build.py), not a static force-include table,
# because a static "../skills" mapping is required in both the wheel and sdist
# targets (a PyPI release also publishes an sdist, and `pip install` from source
# builds the wheel *from the sdist's contents*) — but building the wheel from an
# already-unpacked sdist has no "../skills" to find (the sdist already copied it
# in-place at little_loops/skills/), and hatchling's force-include hard-fails on a
# missing source rather than skipping it. See hatch_build.py's docstring.
[tool.hatch.build.targets.wheel.hooks.custom]

[tool.hatch.build.targets.sdist.hooks.custom]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Coverage is intentionally NOT in addopts: instrumentation adds ~30-100%
# overhead on every run. For a coverage report use the opt-in invocation:
#   python -m pytest scripts/tests/ --cov=little_loops \
#       --cov-report=term-missing:skip-covered --cov-report=html
# (the [tool.coverage.*] config below still applies when --cov is passed.)
# -n logical runs xdist across logical CPUs. The raw logical count would spawn
# one worker per core (e.g. 14/14 on Apple Silicon, where logical == physical
# since there is no SMT), saturating every core and starving the OS compositor
# -> 100% CPU + machine freeze (macOS "beachball"). tests/conftest.py defends on
# two axes: pytest_xdist_auto_num_workers caps workers to ~half the cores, and
# pytest_configure renices the pytest processes (os.nice) so the OS always
# preempts them for the UI. Overrides: PYTEST_XDIST_AUTO_NUM_WORKERS for worker
# count, LL_TEST_NO_NICE=1 to skip the renice, -n 0 to force serial (pdb).
# --timeout=120 is a per-test safety net: any test that hangs past 120s is
# killed and reported as a timeout, freeing the xdist worker slot before it
# can wedge a core indefinitely. Tests with legitimately slow wall-clock
# can opt out via @pytest.mark.timeout(N) per test.
# --timeout-method=signal is required because thread-method leaves watchdog
# threads on idle workers rather than terminating them (pytest-xdist
# #1094/#117, pytest-timeout #72/#137), which wedges the run at the tail
# when most workers have gone idle. Signal-method installs the SIGALRM
# handler in each worker process and fires it directly, so a wedged test
# triggers TimeoutExpired and pytest-xdist reaps the worker — surfacing
# the failure instead of letting the run silently die past the runner
# ceiling (BUG-3208 / PR #6-era hang).
#
# Tradeoff: signal-method historically raced with xdist worker process
# management. pytest-timeout 2.0+ redesigned signal-mode to install the
# handler per-worker (not via the controller), so the race is no longer
# load-bearing for our pytest-timeout pin (`>=2.0`). Accept this
# tradeoff deliberately to fix the wedge — see ci/fix-unit-test-hang.
# --dist loadfile gives each test file worker affinity: far fewer
# controller<->worker scheduling round-trips than the default per-test `load`
# on a ~13.7k-test suite, and per-file fixtures (git repos, subprocess envs)
# stay on one worker.
addopts = [
    "--strict-markers",
    "--strict-config",
    "--timeout=120",
    "--timeout-method=signal",
    "-n",
    "logical",
    "--dist",
    "loadfile",
]
# Keep only failed-test tmp dirs, and only the last session's tree. The default
# (keep everything, retain 3 sessions) makes pytest rmtree three full
# pytest-of-<user> trees at startup — tens of thousands of fs events that feed
# the same launchservicesd/fseventsd storm the conftest isolation fixtures were
# reworked to avoid (see tests/conftest.py `_isolate_history_db`).
tmp_path_retention_count = 1
tmp_path_retention_policy = "failed"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "slow: marks tests as slow running (deselect with '-m \"not slow\"')",
    "conformance: marks tests as host conformance tests (deselect with '-m \"not conformance\"')",
    "no_parallel: marks tests that must not run on xdist workers (subprocess signal-handling, timing-sensitive). Under the default -n logical addopts this SKIPS the test outright (the controller never runs tests under -n N); it only actually runs in a serial -n 0 invocation — see scripts/tests/conftest.py",
]

[tool.coverage.run]
source = ["little_loops"]
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
fail_under = 80

[tool.mutmut]
paths_to_mutate = ["little_loops/"]
pytest_add_cli_args_test_selection = ["tests/"]
# -n0 disables xdist for per-mutant runs: each mutant runs a tiny test subset,
# so worker spawn overhead would outweigh any parallelism gain.
pytest_add_cli_args = ["-x", "-q", "-n0"]
