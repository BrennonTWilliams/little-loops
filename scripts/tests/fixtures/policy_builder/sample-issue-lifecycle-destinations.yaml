name: sample-issue-lifecycle-destinations
description: |
  Sample issue_lifecycle builder output exercising the ENH-3492 explicit
  terminal destinations — a rule targeting a destination directly and a
  verb transition.kind routing to one.
max_steps: 20

import:
  - lib/policy-router.yaml

context:
  frontmatter_dimensions: "status:string|priority:string|priority_rank:numeric|confidence_score:numeric|outcome_confidence:numeric|decision_needed:boolean|spike_needed:boolean|blocked_by:list|deferred_reason:string"
  policy_rules: |
    status:==cancelled -> skipped
    confidence_score:>=85 -> implement
    * -> prepare

parameters:
  issue_id:
    type: string
    required: true

scope: ["."]

# every verb is a /ll: skill; MR-12 would otherwise warn per verb state
pruning_profile_ok: true

on_max_steps: needs_attention

timeout: 14400

initial: score

states:
  score:
    fragment: frontmatter_scores
    next: policy_dispatch
    on_error: failed

  policy_dispatch:
    fragment: policy_table_dispatch
    on_error: failed
    route:
      prepare: prepare
      gate: gate
      implement: implement
      stopped: stopped
      skipped: skipped
      needs_attention: needs_attention
      _: prepare
      _error: failed

  prepare:
    action_type: slash_command
    action: /ll:format-issue ${context.issue_id} --auto
    next: gate
    on_error: failed

  gate:
    action_type: slash_command
    action: /ll:confidence-check ${context.issue_id} --auto
    next: stopped
    on_error: failed

  implement:
    action_type: shell
    action: ll-auto --only ${context.issue_id:shell}
    next: needs_attention
    on_error: failed

  done:
    terminal: true

  stopped:
    terminal: true

  skipped:
    terminal: true

  needs_attention:
    terminal: true
    failure: true

  failed:
    terminal: true
    failure: true
