name: sample-issue-lifecycle
description: |
  Sample issue_lifecycle builder output used as a golden fixture for the
  serializeLoopYaml() round-trip (FEAT-3474).
max_steps: 20

import:
  - lib/policy-router.yaml

context:
  frontmatter_dimensions: "status:string|priority:string|priority_rank:numeric|confidence_score:numeric|outcome_confidence:numeric|decision_needed:boolean|spike_needed:boolean|blocked_by:list|deferred_reason:string|severity:string|review_status:string"
  policy_rules: |
    status:==done -> verify
    severity:==critical & review_status:==approved -> implement
    confidence_score:>=85 -> implement
    confidence_score:<85 -> refine
    * -> gate

parameters:
  issue_id:
    type: string
    required: true

scope: ["."]

# every verb is a /ll: skill; MR-12 would otherwise warn per verb state
pruning_profile_ok: true

on_max_steps: needs_attention

timeout: 14400

initial: score

states:
  score:
    fragment: frontmatter_scores
    next: policy_dispatch
    on_error: failed

  policy_dispatch:
    fragment: policy_table_dispatch
    on_error: failed
    route:
      refine: refine
      gate: gate
      implement: implement
      verify: verify
      _: gate
      _error: failed

  refine:
    action_type: slash_command
    action: /ll:refine-issue ${context.issue_id} --auto
    next: gate
    on_error: failed

  gate:
    action_type: slash_command
    action: /ll:confidence-check ${context.issue_id} --auto
    next: score
    on_error: failed

  implement:
    action_type: shell
    action: ll-auto --only ${context.issue_id:shell}
    next: done
    on_error: failed

  verify:
    action_type: slash_command
    action: /ll:verify-issues ${context.issue_id} --auto
    next: done
    on_error: failed

  done:
    terminal: true

  needs_attention:
    terminal: true
    failure: true

  failed:
    terminal: true
    failure: true
