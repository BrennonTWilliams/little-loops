name: history-dashboard
version: 1
renderer: jinja2
output: history-dashboard.html
theme: design-tokens
data_schema:
  type: object
  required:
    - snapshot_gzip_b64
    - sql_wasm_b64
    - sql_wasm_js
    - exported_at
    - filter_tables
    - filter_since
    - export_mode
    - allowlist_version
    - source_schema_version
    - installed_schema_version
    - schema_version_warning
    - row_cap
    - serve_enabled
    - serve_history_enabled
  properties:
    snapshot_gzip_b64: {type: string}
    sql_wasm_b64: {type: string}
    sql_wasm_js: {type: string}
    exported_at: {type: string}
    filter_tables: {type: string}
    filter_since: {type: string}
    export_mode:
      type: string
      enum: [shareable, local]
    allowlist_version: {type: integer}
    source_schema_version: {type: string}
    installed_schema_version: {type: integer}
    schema_version_warning: {type: string}
    row_cap: {type: integer}
    # ENH-3351/FEAT-3321: serve-mode fields. serve_enabled and
    # serve_history_enabled are always present (False on the default file://
    # path — serve_history_enabled is read outside the `[[% if serve_enabled
    # %]]` region, by the base query-box script deciding whether to install
    # the refresh timer). The rest are only present (and only referenced
    # inside `[[% if serve_enabled %]]`) when `ll-loop run --serve` or
    # `ll-artifact serve` with `events.bridge.history: true` builds the page.
    serve_enabled: {type: boolean}
    serve_htmax_js: {type: string}
    serve_events_url: {type: string}
    serve_interaction_enabled: {type: boolean}
    serve_interaction_url_js: {type: string}
    serve_history_enabled: {type: boolean}
    serve_history_url_js: {type: string}
    serve_history_poll_s: {type: integer}
