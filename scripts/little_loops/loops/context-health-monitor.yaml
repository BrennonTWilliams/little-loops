name: context-health-monitor
category: meta
description: |
  Monitor context health via scratch file accumulation and session log size.
  Compact scratch files and archive stale outputs when pressure is detected.
initial: assess_context
scope:
  - "${context.scratch_dir}"
  - ".loops/archive/"
context:
  scratch_size_kb_warn: 500
  log_age_days_warn: 7
  scratch_dir: .loops/tmp
max_steps: 10
timeout: 3600

states:
  assess_context:
    action_type: shell
    action: |
      echo "=== Scratch Dir ==="
      SCRATCH_SIZE=$(du -sk ${context.scratch_dir} 2>/dev/null | awk '{print $1}' || echo 0)  # ll-lint: mr11-ok(context.scratch_dir) ENH-3358 - ENH-3342 widening residual, tracked for conversion
      FILE_COUNT=$(find ${context.scratch_dir} -maxdepth 1 -type f 2>/dev/null | wc -l | tr -d ' ')  # ll-lint: mr11-ok(context.scratch_dir) ENH-3358 - ENH-3342 widening residual, tracked for conversion
      echo "scratch_kb: $SCRATCH_SIZE"
      echo "file_count: $FILE_COUNT"
      TOKENS=$(jq -r '.estimated_tokens // "n/a"' .ll/ll-context-state.json 2>/dev/null || echo "n/a")
      echo "estimated_tokens: $TOKENS"
      find ${context.scratch_dir} -maxdepth 1 -type f -size +100k -exec du -sk {} \; 2>/dev/null | sort -rn || true  # ll-lint: mr11-ok(context.scratch_dir) ENH-3358 - ENH-3342 widening residual, tracked for conversion
    capture: snapshot
    next: self_assess

  self_assess:
    action_type: prompt
    timeout: 120
    action: |
      Evaluate this context health snapshot and emit a diagnosis tag:

      ${captured.snapshot.output}

      Thresholds: scratch_size_warn=${context.scratch_size_kb_warn}KB

      Emit exactly one of:
      PRESSURE_SCRATCH
      PRESSURE_OUTPUTS
      CONTEXT_HEALTHY
    capture: diagnosis
    next: route

  route:
    evaluate:
      type: output_contains
      source: "${captured.diagnosis.output}"
      pattern: "CONTEXT_HEALTHY"
    on_yes: done
    on_no: route_scratch
    on_error: diagnose_failure

  route_scratch:
    evaluate:
      type: output_contains
      source: "${captured.diagnosis.output}"
      pattern: "PRESSURE_SCRATCH"
    on_yes: compact_scratch
    on_no: archive_outputs
    on_error: archive_outputs

  compact_scratch:
    action_type: prompt
    timeout: 300
    action: |
      Here is the current scratch directory snapshot:
      ${captured.snapshot.output}

      Compact large scratch files in ${context.scratch_dir}. For each file >100KB listed above,
      summarize to essential findings and overwrite. Delete clearly stale files.
      Do NOT delete files referenced in active issues.
    next: verify

  archive_outputs:
    action_type: prompt
    timeout: 300
    action: |
      Here is the current scratch directory snapshot:
      ${captured.snapshot.output}

      Archive stale outputs from ${context.scratch_dir}. Move files older than
      ${context.log_age_days_warn} days to .loops/archive/. Delete zero-byte files.
    next: verify

  verify:
    action_type: shell
    action: |
      SCRATCH_SIZE=$(du -sk ${context.scratch_dir} 2>/dev/null | awk '{print $1}' || echo 0)  # ll-lint: mr11-ok(context.scratch_dir) ENH-3358 - ENH-3342 widening residual, tracked for conversion
      echo "post_remediation_kb: $SCRATCH_SIZE"
    next: assess_context

  # ENH-2825: diagnostic predecessor for `failed` — the executor finishes the run
  # the instant a terminal is entered, so the explanation must live in a
  # non-terminal state that routes into it.
  diagnose_failure:
    action_type: shell
    action: |
      echo "context-health-monitor: context health assessment failed — remediation was not attempted" >&2
    next: failed
    on_error: failed

  done:
    terminal: true

  # ENH-2825: a failed health assessment is not a healthy context — exit 2, not 0.
  failed:
    terminal: true
    failure: true
