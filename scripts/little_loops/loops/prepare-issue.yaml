name: "prepare-issue"
description: "Preparation dispatch loop for one issue (ENH-3623): little_loops.preparation_policy decides every step from the issue and an append-only fact log; this loop only runs the chosen command (refine-to-ready-issue or one slash command), records it, and ends through `ll-issues prep apply`, the sole terminal writer."
category: issue-management
visibility: internal
# Exactly 16 states (pinned by test_prepare_issue.py): select_step, 8 run_* states
# (run_child, run_wire, run_refine_gap, run_rescore, run_reconcile, run_size_review,
# run_go_no_go, run_advise_go_no_go), classify_guard2, record_guard2, record_step,
# apply_outcome, mark_rate_limited, done, failed. Call chain:
#   autodev.refine_current -> prepare-issue -> {refine-to-ready-issue | one slash command}
#   select_step -> run_<kind> -> record_step -> select_step ... -> apply_outcome -> done|failed
# Every decision lives in `ll-issues prep step` (little_loops.preparation_policy.decide);
# every terminal write (ledger row, set-status, run record, inflight clear) lives in
# `ll-issues prep apply`. The loop owns no routing predicate, no file handshake, no
# `rm`, and never writes autodev-staged.txt (autodev's check_passed owns it). A
# resume/handoff restart re-enters select_step, which replays the open intent of the
# pass (at most one command re-runs) or decides the next.
# The issue ID arrives as ${context.input} (context_passthrough flattens autodev's
# captured.input); readiness/outcome thresholds arrive the same way (seeded at launch
# from commands.confidence_gate), so this file declares no `context:` block.
# Slash states are `next:`-shaped, so an exhausted 429 routes on_rate_limit_exhausted
# -> mark_rate_limited (BUG-3622), which autodev turns into finalize_rate_limited.
# max_steps mirrors little_loops.preparation_policy.MAX_STEPS = 4 * DONE_FACT_CAP + 3:
# a command step visits 3 states (select_step, run_*, record_step), a size-review
# step 4 (+ classify_guard2), plus the select_step -> apply_outcome -> done tail.
# A structural test asserts the two stay equal. on_max_steps runs apply_outcome once,
# which writes RETRYABLE_ERROR:infra when no FINISH/STOP intent is open.
initial: select_step
max_steps: 91
on_max_steps: apply_outcome
on_handoff: spawn
# classify_guard2 reads captured.size_review_output, which only run_size_review writes;
# the policy only reaches classify_guard2 from run_size_review.
capture_reachability_ok: true
scope:
  - ".issues/"
  - "${context.run_dir}"
import:
  - lib/common.yaml

states:
  select_step:
    # ENH-3590: ADVISE_FLAG mirrors autodev.yaml's SKIP_FLAG idiom for
    # skip_learning_gate — a context flag threaded into a CLI flag only when set.
    action: |
      ADVISE_FLAG=""
      if [ -n "${context.advise_go_no_go}" ]; then  # ll-lint: mr11-ok(context.advise_go_no_go) ENH-3590 - opt-in veto consult flag, empty/absent is falsy
        ADVISE_FLAG="--advise-go-no-go"
      fi
      ll-issues prep step ${context.input:shell} --run-dir ${context.run_dir} \
        --readiness-threshold ${context.readiness_threshold:shell} \
        --outcome-threshold ${context.outcome_threshold:shell} \
        $ADVISE_FLAG
    action_type: shell
    evaluate:
      type: classify
    route:
      RUN_CHILD: run_child
      WIRE: run_wire
      REFINE_GAP: run_refine_gap
      RESCORE: run_rescore
      RECONCILE: run_reconcile
      SIZE_REVIEW: run_size_review
      GO_NO_GO: run_go_no_go
      ADVISE_GO_NO_GO: run_advise_go_no_go
      FINISH: apply_outcome
      STOP: apply_outcome
      _: apply_outcome
      _error: apply_outcome

  run_child:
    # No `on_no:` (BUG-2611), no `timeout:` (TestSubLoopStateTimeoutAudit) and no
    # rate-limit fragment (inert on a `loop:` state, BUG-3390): the inner loop's own
    # rate-limit record reaches autodev as RETRYABLE_ERROR:rate_limited via apply.
    loop: refine-to-ready-issue
    context_passthrough: true
    on_yes: record_step
    on_failure: record_step
    on_error: record_step

  run_wire:
    fragment: with_rate_limit_handling
    action: "/ll:wire-issue ${context.input} --auto"
    action_type: slash_command
    pruning_profile:
      enabled: true
      name: wire-issue-auto
      suppress_claude_md: true
    next: record_step
    on_error: record_step
    on_rate_limit_exhausted: mark_rate_limited

  run_refine_gap:
    fragment: with_rate_limit_handling
    action: "/ll:refine-issue ${context.input} --auto --gap-analysis"
    action_type: slash_command
    pruning_profile:
      enabled: true
      name: refine-issue-repair
      suppress_claude_md: true
    next: record_step
    on_error: record_step
    on_rate_limit_exhausted: mark_rate_limited

  run_rescore:
    fragment: with_rate_limit_handling
    action: "/ll:confidence-check ${context.input}"
    action_type: slash_command
    pruning_profile:
      enabled: true
      name: confidence-check-recheck
      suppress_claude_md: true
    next: record_step
    on_error: record_step
    on_rate_limit_exhausted: mark_rate_limited

  run_reconcile:
    fragment: with_rate_limit_handling
    action: "/ll:reconcile-issue ${context.input}"
    action_type: slash_command
    pruning_profile:
      enabled: true
      name: reconcile-issue-auto
      suppress_claude_md: true
    next: record_step
    on_error: record_step
    on_rate_limit_exhausted: mark_rate_limited

  run_size_review:
    fragment: with_rate_limit_handling
    action: "/ll:issue-size-review ${context.input} --auto"
    action_type: slash_command
    pruning_profile:
      enabled: true
      name: issue-size-review-auto
      suppress_claude_md: true
    capture: size_review_output
    next: classify_guard2
    on_error: classify_guard2
    on_rate_limit_exhausted: mark_rate_limited

  classify_guard2:
    # BUG-2734/BUG-2752: guard-2 (Very Large, decomposition declined) matched on the
    # captured status line through evaluate.source, never interpolated into shell
    # (BUG-2594). "score (8|9|10|11)" subsumes both of today's patterns.
    evaluate:
      type: output_contains
      source: "${captured.size_review_output.output}"
      pattern: "score (8|9|10|11)\\b"
    on_yes: record_guard2
    on_no: record_step
    on_error: record_step

  record_guard2:
    action: >-
      ll-issues prep record ${context.input:shell} --run-dir ${context.run_dir} --guard2
    action_type: shell
    next: select_step
    on_error: select_step

  record_step:
    # Never reads captured.run_child: prep record classifies a RUN_CHILD step from
    # the child's own run record (cleared by the RUN_CHILD precondition; absent means
    # the inner loop errored).
    action: >-
      ll-issues prep record ${context.input:shell} --run-dir ${context.run_dir}
    action_type: shell
    next: select_step
    on_error: select_step

  run_go_no_go:
    fragment: with_rate_limit_handling
    action: "/ll:go-no-go ${context.input} --auto"
    action_type: slash_command
    pruning_profile:
      enabled: true
      name: go-no-go-auto
      suppress_claude_md: true
    next: record_step
    on_error: record_step
    on_rate_limit_exhausted: mark_rate_limited

  run_advise_go_no_go:
    # ENH-3590: veto-only second-model consult on a go/no-go waiver, reached
    # only when advise_go_no_go is set. Calls the shipped ENH-3632 helper
    # (`ll-issues advise-consult`), which always exits 0 (never a traceback,
    # SKIPPED on any failure) and persists advise-<ID>.json/.verdict under
    # run_dir; record_step's `ll-issues prep record` reads the verdict back
    # (embedded Python, no stdout parsing). No `with_rate_limit_handling`: the
    # helper's own consult never trips the executor's rate-limit detection
    # because it always exits 0. `--write-note` mirrors ENH-3633's
    # run_advise_ready, recording the recommendation on the issue itself.
    action: >-
      ll-issues advise-consult ${context.input:shell} --run-dir ${context.run_dir}
      --signal autodev_go_no_go_waiver --write-note
      --question "An adversarial go/no-go review approved this oversized_atomic
      issue for implementation despite its outcome confidence falling below
      threshold, and stamped a waiver. Should the waiver stand? Begin your
      recommendation with exactly one word, PROCEED or VETO, then give the
      reason. VETO only for a concrete defect the go/no-go review missed that
      would make implementation fail or be wasted; otherwise PROCEED."
    action_type: shell
    next: record_step
    on_error: record_step

  apply_outcome:
    # Sole terminal writer. Also the step-cap handler: with no open FINISH/STOP intent
    # it writes the ladder-error infra record (ENH-3606 mark_ladder_error).
    action: >-
      ll-issues prep apply ${context.input:shell} --run-dir ${context.run_dir}
      --readiness-threshold ${context.readiness_threshold:shell}
      --outcome-threshold ${context.outcome_threshold:shell}
    fragment: shell_exit
    on_yes: done
    on_no: failed
    on_error: failed

  mark_rate_limited:
    action: >-
      ll-issues prep apply ${context.input:shell} --run-dir ${context.run_dir} --rate-limited
    action_type: shell
    next: failed
    on_error: failed

  done:
    terminal: true

  failed:
    terminal: true
    failure: true
