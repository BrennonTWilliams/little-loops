name: "general-task"
description: "General-purpose task loop: writes a Definition of Done, decomposes the task into steps, executes one step at a time, and loops until all DoD criteria are verified."
category: harness
initial: check_baseline_tests
max_steps: 500
default_timeout: 14400
on_handoff: spawn
artifact_versioning_ok: true
on_max_steps: summarize_partial

import:
  - lib/common.yaml

context:
  min_pass_rate: 0.95
  hard_criteria_tags: "hard"
  # Whole-suite test command, run ONLY by the final-only gate (run_final_tests),
  # NOT per-step (ENH-2225). Empty = read project.test_cmd from .ll/ll-config.json,
  # else fall back to bare "pytest". A whole-artifact gate embedded here (e.g. a
  # coverage threshold) is enforced at completion time, not after every step.
  test_cmd: ""
  max_step_attempts: 3 # max verify attempts per step before abandoning it (Fix #2)

circuit:
  repeated_failure:
    window: 3
    on_repeated_failure: diagnose
    exclude_paths:
      - "${context.run_dir}/plan.md"
      - "${context.run_dir}/dod.md"

states:
  check_baseline_tests:
    action: |
      CMD=$(python3 -c "import json,pathlib; p=pathlib.Path('.ll/ll-config.json'); cfg=json.loads(p.read_text()) if p.exists() else {}; print(cfg.get('project',{}).get('test_cmd','pytest'))")
      eval "$CMD" > "${context.run_dir}/baseline-test-output.txt" 2>&1
      echo $? > "${context.run_dir}/baseline-exit.txt"
      git rev-parse HEAD > "${context.run_dir}/baseline-ref.txt" 2>/dev/null || echo "" > "${context.run_dir}/baseline-ref.txt"
    action_type: shell
    next: define_done
    on_error: define_done

  define_done:
    action: >
      Your task is: ${context.input}

      Before planning or executing anything, write a concrete Definition of Done
      to ${context.run_dir}/dod.md in this format:
      ```
      # Definition of Done
      ## Verification Criteria
      - [ ] <Hard criterion — must be satisfied for done> [hard]
      - [ ] <Another hard criterion — e.g., "Tests pass", "File X exists"> [hard]
      - [ ] <Soft criterion — desirable but non-blocking if pass rate is met>
      ```

      Tag each criterion that MUST be verified (technical correctness, tests, file existence)
      with `[hard]` at the end of the line. Leave criteria that depend on human decisions or
      pre-existing environment state (e.g., "Working tree is clean") untagged — these are
      soft criteria and are non-blocking once all hard criteria and the pass rate threshold
      (${context.min_pass_rate}) are met.

      Each criterion must be independently verifiable by checking files, running commands,
      or reading outputs.

      Do NOT write DoD criteria that target this loop's own internal tracking artifacts
      (${context.run_dir}/plan.md, ${context.run_dir}/dod.md)
      — e.g. "duplicate plan steps are struck through" or "the plan file has no pending
      steps." Those files are loop bookkeeping, not task deliverables; criteria about them
      are unsatisfiable by the worker (which is forbidden to edit them) and make the loop
      spin. Write criteria only about the actual task output.

      If the task involves running code, executing tests, installing a service, or
      producing output at runtime, the DoD MUST include criteria for that runtime
      behavior (e.g., "dry-run exits 0", "service plist loads without launchd errors",
      "first injection produces expected output"). Static file/import checks alone
      are insufficient when the task has a runtime surface.

      In addition to the criteria above, ALWAYS include this fixed block verbatim
      (with criterion 4 included only when it applies) in ${context.run_dir}/dod.md.
      These criteria are not derived from the task description; apply to every
      changed module on every run:

      ```
      ## Standing Criteria
      - [ ] Every parameter of every changed public function is read on every code path. [hard]
      - [ ] Contract-over-mechanism: any criterion naming a data structure or library
        (e.g. "threading.local()", "a cache", "a lock") is accompanied by a behavioral
        criterion phrased over inputs and outputs, not just the mechanism's presence. [hard]
      - [ ] Any model- or user-supplied string interpolated into a filesystem path, shell
        command, or SQL statement is validated before use. [hard]
      - [ ] Conditional — include only if this task produces an installable package: any
        file the package must read at runtime is reachable from a built artifact,
        verified by building a wheel and importing from it in a tmpdir (not an editable
        install). [hard]
      - [ ] No module carrying a PROVISIONAL/TODO/GUESS/REPLACE BEFORE SHIPPING marker
        survives without removal or an explicit deferral criterion. This is enforced
        separately as a mechanical shell grep over files changed since the run's
        baseline git ref — not by LLM judgment against this criterion text. [hard]
      ```

      Lint/type criteria (ruff, mypy, or equivalent) MUST be phrased as an absolute
      gate — "ruff check exits 0", "mypy exits 0" — never as a delta claim like "no new
      errors" or "no new lint failures introduced." If a legacy baseline of pre-existing
      errors genuinely must be tolerated, the criterion must reference an enumerated
      allowlist file checked into the repo (specific error IDs/locations) whose set can
      only shrink over time, not a fuzzy "no new" comparison — a new instance of an
      already-allowlisted error class still fails the criterion.

      Do NOT start any work. Only write the DoD file.
    action_type: prompt
    next: plan
    on_error: diagnose

  plan:
    action: >
      Your task is: ${context.input}

      Before starting, decompose this task into a numbered list of discrete,
      independently completable steps. Each step should be small enough to
      complete in a single focused session.

      Write the step list to ${context.run_dir}/plan.md in this format:
      ```
      # Task Plan
      - [ ] Step 1: ...
      - [ ] Step 2: ...
      ```

      Do NOT start executing any steps yet. Only write the plan file.
    action_type: prompt
    next: resume_check
    on_error: diagnose

  resume_check:
    action: |
      CHECKPOINT="${context.run_dir}/checkpoint.json"
      CURRENT_STEP="${context.run_dir}/current-step.txt"
      LAST_FILES_PATH="${context.run_dir}/last-files.txt"
      if [ ! -f "$CHECKPOINT" ]; then
        echo "RESUME_NONE"
        exit 0
      fi
      # Fix 3: Reject checkpoint from a different task (task fingerprinting).
      STORED_HASH=$(grep -o '"task_hash":"[^"]*"' "$CHECKPOINT" 2>/dev/null | sed 's/"task_hash":"//;s/"//')
      if [ -n "$STORED_HASH" ] && [ "${context.input_hash}" != "$STORED_HASH" ]; then
        rm -f "$CHECKPOINT" "$CURRENT_STEP" "$LAST_FILES_PATH"
        echo "RESUME_CLEAN"
        exit 0
      fi
      # Fix 2: Inconsistent file set — checkpoint exists but current-step.txt doesn't.
      # mark_done deletes the checkpoint (BUG-2538 inverted the lifecycle: current-step.txt
      # is now overwritten by the next select_step rather than rm'd mid-loop, so that
      # downstream check_done / continue_work can still read it as their LAST_STEP marker).
      # A checkpoint without its current-step.txt is therefore a stale/corrupt artifact
      # from a prior interrupted run; this guard still cleans it up defensively.
      if [ ! -f "$CURRENT_STEP" ]; then
        rm -f "$CHECKPOINT"
        echo "RESUME_CLEAN"
        exit 0
      fi
      if [ -f "$LAST_FILES_PATH" ]; then
        FILES=$(grep 'LAST_FILES:' "$LAST_FILES_PATH" 2>/dev/null | sed 's/LAST_FILES:[[:space:]]*//')
        if [ -n "$FILES" ]; then
          MISSING=0
          for f in $FILES; do
            [ ! -e "$f" ] && MISSING=1 && break
          done
          if [ "$MISSING" = "0" ]; then
            echo "RESUME_SKIP"
            exit 0
          fi
        fi
      fi
      rm -f "$CHECKPOINT" "$CURRENT_STEP"
      echo "RESUME_CLEAN"
    action_type: shell
    capture: resume_check_result
    evaluate:
      type: output_contains
      source: "${captured.resume_check_result.output}"
      pattern: "RESUME_SKIP"
    on_yes: mark_done
    on_no: select_step
    on_error: diagnose

  select_step:
    action: |
      PLAN="${context.run_dir}/plan.md"
      SPIN_COUNTER="${context.run_dir}/continue-work-spin-counter.txt"
      STEP=$(grep -m1 '^- \[ \]' "$PLAN" || echo "")
      if [ -z "$STEP" ]; then
        SPIN=$(cat "$SPIN_COUNTER" 2>/dev/null || echo 0)
        SPIN=$((SPIN + 1)); printf '%s' "$SPIN" > "$SPIN_COUNTER"
        echo "NO_UNCHECKED_STEPS"
        exit 0
      fi
      # Per-step attempt cap (Fix #2): a step whose verify keeps failing is never
      # marked [x], so it would be re-selected forever, spinning the loop to
      # max_iterations (do_work succeeds and verify_step's on_no is a verdict,
      # not a state failure, so the repeated_failure circuit never trips). Count
      # attempts per exact step line; once a step exhausts its budget, mark it
      # [!] with an abandonment note and fall through to check_done so the DoD
      # machinery — not an unbounded retry — decides whether the underlying
      # criterion is satisfied.
      ATTEMPTS="${context.run_dir}/step-attempts.txt"
      PRIOR=$(grep -Fx -- "$STEP" "$ATTEMPTS" 2>/dev/null | wc -l | tr -d ' ')
      if [ "$PRIOR" -ge "${context.max_step_attempts}" ]; then
        # ENH-2857: two-direction blocker check BEFORE the abandonment rewrite,
        # so a hard-blocker step (Hermes defect 5: the abandoned step's own text
        # said "Hard blocker for Steps 13, 16, 27", and none of those dependents
        # ever mentioned it back) halts the run instead of silently continuing
        # on guesses. Direction (a): the abandoned step's own line names itself
        # a blocker/gate/prerequisite alongside a step reference. Direction (b):
        # any remaining unchecked step textually references this step's number,
        # tolerating comma-separated lists ("Steps 13, 16, 27"), not just the
        # first number in the list. Direction (b) must exclude the exhausted
        # step's OWN line from the candidate set: the [!] rewrite happens below,
        # so it is still '- [ ]' here, and its own text ("Step N: ...") always
        # contains its own number — leaving it in makes HALT=1 unconditional and
        # misreports every abandonment as STEP_BLOCKER_HALT.
        HALT=0
        if printf '%s' "$STEP" | grep -Eq '([Bb]locker|[Gg]ated|[Pp]rerequisite).*[Ss]teps?[[:space:]]+[0-9]+|[Ss]teps?[[:space:]]+[0-9]+.*([Bb]locker|[Gg]ated|[Pp]rerequisite)'; then
          HALT=1
        fi
        STEP_NUM=$(printf '%s' "$STEP" | grep -Eo 'Step[[:space:]]+[0-9]+' | grep -Eo '[0-9]+' | head -1)
        if [ -n "$STEP_NUM" ] && [ "$HALT" -eq 0 ]; then
          while IFS= read -r line; do
            NUMS=$(printf '%s' "$line" | grep -Eo '[Ss]teps?[[:space:]]+[0-9]+([,][[:space:]]*[0-9]+)*' | grep -Eo '[0-9]+')
            if printf '%s\n' "$NUMS" | grep -qx "$STEP_NUM"; then
              HALT=1
              break
            fi
          done < <(grep '^- \[ \]' "$PLAN" | grep -Fxv -- "$STEP")
        fi
        # Still rewrite to [!] first — the step DID exhaust its attempts; the
        # halt only changes what happens to the remaining steps. Without this
        # rewrite, write_partial_summary's abandoned count would read 0 for the
        # exact run that halted because of an abandonment.
        awk -v target="$STEP" -v n="${context.max_step_attempts}" \
          'found==0 && $0==target && /^- \[ \]/ { sub(/^- \[ \]/, "- [!]"); $0=$0 "  (abandoned: verify failed after " n " attempts)"; found=1 } 1' \
          "$PLAN" > "$PLAN.tmp" && mv "$PLAN.tmp" "$PLAN"
        rm -f "${context.run_dir}/current-step.txt" "${context.run_dir}/checkpoint.json"
        if [ "$HALT" -eq 1 ]; then
          echo "STEP_BLOCKER_HALT: $STEP"
        else
          echo "STEP_ABANDONED: $STEP"
        fi
        exit 0
      fi
      echo "$STEP" >> "$ATTEMPTS"
      rm -f "$SPIN_COUNTER"
      echo "$STEP" > "${context.run_dir}/current-step.txt"
      CHECKPOINT="${context.run_dir}/checkpoint.json"
      printf '{"in_flight_step":"%s","timestamp":"%s","task_hash":"%s"}\n' \
        "$STEP" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${context.input_hash}" > "$CHECKPOINT"
      echo "SELECTED_STEP: $STEP"
    action_type: shell
    capture: selected_step
    evaluate:
      type: output_contains
      source: "${captured.selected_step.output}"
      pattern: "SELECTED_STEP:"
    on_yes: do_work
    on_no: check_step_halt
    on_error: diagnose

  # ENH-2857: distinguishes a plain STEP_ABANDONED (fall through to spin_gate
  # as before) from a STEP_BLOCKER_HALT (the just-abandoned step was a hard
  # blocker for other steps — halt via summarize_partial rather than
  # continuing on guesses). ${captured.selected_step} is captured by the
  # immediately-preceding select_step on every path that reaches this state,
  # so the reference is dominated.
  check_step_halt:
    action: |
      printf '%s' "${captured.selected_step.output}"
    action_type: shell
    evaluate:
      type: output_contains
      source: "${captured.selected_step.output}"
      pattern: "STEP_BLOCKER_HALT"
    on_yes: summarize_partial
    on_no: spin_gate
    on_error: spin_gate

  # Guards the NO_UNCHECKED_STEPS spin (ENH-2585): once every remaining plan
  # step has been abandoned (max_step_attempts exhausted), select_step returns
  # NO_UNCHECKED_STEPS on every subsequent pass in ~20ms, but continue_work
  # still burns 50-210s of LLM re-deliberation each cycle without producing a
  # new actionable step. This counter (reset only on a genuine SELECTED_STEP:)
  # caps consecutive no-progress cycles before diverting to the ENH-2583
  # partial-credit chain instead of looping back through check_done/count_done/
  # continue_work indefinitely.
  spin_gate:
    action: |
      SPIN_COUNTER="${context.run_dir}/continue-work-spin-counter.txt"
      cat "$SPIN_COUNTER" 2>/dev/null || echo 0
    action_type: shell
    evaluate:
      type: output_numeric
      operator: lt
      target: 3
    on_yes: check_done
    on_no: summarize_partial
    on_error: check_done

  do_work:
    action: |
      Your task is: ${context.input}

      The step you must complete is in ${context.run_dir}/current-step.txt.
      Read that file to learn exactly which step to implement.

      Implement ONLY that step. Do NOT modify ${context.run_dir}/plan.md
      or ${context.run_dir}/dod.md.

      After completing the step, write exactly one line to
      ${context.run_dir}/last-files.txt:
      LAST_FILES: <space-separated list of files you created or modified>
    action_type: prompt
    capture: work_result
    next: verify_step
    on_error: do_work
    max_retries: 2
    retryable_exit_codes: [124]
    on_retry_exhausted: capture_work_exit
    timeout: 900

  capture_work_exit:
    action: |
      echo "${captured.work_result.exit_code:default=0}" > "${context.run_dir}/last-exit-code.txt"
    action_type: shell
    next: continue_work
    on_error: continue_work

  verify_step:
    action: |
      FILES=$(grep 'LAST_FILES:' "${context.run_dir}/last-files.txt" 2>/dev/null | sed 's/LAST_FILES:[[:space:]]*//')
      if [ -z "$FILES" ]; then
        echo "VERIFY_PASS"
        exit 0
      fi
      # ENH-2225: verify_step is a per-step SMOKE gate, not a whole-suite gate.
      # It deliberately does NOT resolve/run ${context.test_cmd} (or project.test_cmd
      # from .ll/ll-config.json) — that whole-artifact command runs only at completion
      # time in run_final_tests. Running it per-step meant a whole-suite gate embedded
      # in the command (the canonical case: pytest --cov-fail-under=N injected via
      # pyproject.toml addopts) failed for EVERY step until the entire task was done,
      # because total coverage stays below threshold during partial implementation —
      # a category error that abandoned otherwise-correct steps.
      #
      # The smoke check is language-agnostic (cf. BUG-2127): confirm that every file
      # the step claimed to create/modify in LAST_FILES actually exists on disk. A
      # step that reported work but produced nothing fails here; per-step CORRECTNESS
      # (DoD criteria affected by this step) is verified separately by check_done, and
      # the whole suite is enforced by run_final_tests before terminal done.
      MISSING=""
      for f in $FILES; do
        [ ! -e "$f" ] && MISSING="$MISSING $f"
      done
      if [ -n "$MISSING" ]; then
        echo "VERIFY_FAIL: step reported files that do not exist:$MISSING" \
          > "${context.run_dir}/verify-output.txt"
        echo "VERIFY_FAIL"
      else
        echo "VERIFY_PASS"
      fi
    action_type: shell
    capture: verify_result
    evaluate:
      type: output_contains
      source: "${captured.verify_result.output}"
      pattern: "VERIFY_PASS"
    on_yes: mark_done
    on_no: continue_work
    on_error: diagnose

  mark_done:
    action: |
      PLAN="${context.run_dir}/plan.md"
      STEP_FILE="${context.run_dir}/current-step.txt"
      # Mark the step that select_step actually selected (bound to current-step.txt),
      # NOT just the first unchecked line. This decouples marking from selection order
      # so the two states can never desync (BUG-1766). $0==target is an exact string
      # compare, so bracket/slash chars in the step text are literal and safe.
      STEP_TEXT=$(cat "$STEP_FILE" 2>/dev/null)
      if [ -n "$STEP_TEXT" ]; then
        awk -v target="$STEP_TEXT" 'found==0 && $0==target && /^- \[ \]/ { sub(/^- \[ \]/, "- [x]"); found=1 } 1' "$PLAN" > "$PLAN.tmp" && mv "$PLAN.tmp" "$PLAN"
      else
        awk 'found==0 && /^- \[ \]/ { sub(/^- \[ \]/, "- [x]"); found=1 } 1' "$PLAN" > "$PLAN.tmp" && mv "$PLAN.tmp" "$PLAN"
      fi
      rm -f "${context.run_dir}/checkpoint.json"
    action_type: shell
    next: check_done
    on_error: diagnose

  check_done:
    action: |
      The previous step just completed. Use the following to scope delta verification.

      ENH-2486: the LAST_STEP and LAST_FILES markers are read from small bounded
      files rather than re-embedding the full captured select_step / do_work stdout,
      which grows with the size of each implementation turn. This keeps this prompt
      from ballooning over a long run — the markers below are all check_done needs.

      Read these two bounded marker files to recover the delta context:
      - ${context.run_dir}/current-step.txt — the step that was selected (LAST_STEP:
        the single "- [ ] Step N: ..." line select_step wrote before do_work ran).
      - ${context.run_dir}/last-files.txt — the LAST_FILES line do_work wrote,
        listing the files created or modified by the step (may be absent/empty if
        the step produced no files).

      Read both task artifacts:
      - ${context.run_dir}/dod.md — Definition of Done (criteria)
      - ${context.run_dir}/plan.md — Task Plan (steps)

      A plan step marked `- [!]` is ABANDONED, not done: it exhausted its verify-attempt
      budget and was never actually completed (see ${context.run_dir}/plan.md for any
      "(abandoned: ...)" note on the line). Do NOT treat a `[!]` step as satisfying its
      DoD criterion. If a DoD criterion depends on an abandoned step, leave that
      criterion [ ] (or flip it back to [ ] if previously marked [x]) with a note that
      the step was abandoned, so it surfaces as unmet rather than silently passing.

      Step 1 — Plan-vs-DoD coverage reconciliation:
      For EVERY plan step, confirm at least one DoD criterion covers it. If a plan step
      has no matching DoD criterion, ADD a new criterion to the DoD file before
      evaluating completion. Do NOT silently mark plan steps [x] without DoD coverage.

      Step 2 — Delta-scoped criterion verification:
      Use LAST_STEP and LAST_FILES from the step selection and work result above to scope verification:
      - For DoD criteria that mention or depend on any file in LAST_FILES, OR that are
        plausibly affected by LAST_STEP: VERIFY BY EVIDENCE now (filesystem read /
        command run / file read). Update each criterion to [x] if verified, or leave
        [ ] with a one-line note on what is missing.
      - For previously-[x] criteria NOT plausibly affected by LAST_STEP or LAST_FILES:
        KEEP [x] without re-running their commands.
      - For previously-[ ] criteria NOT plausibly affected by LAST_STEP or LAST_FILES:
        leave [ ] with their existing one-line note.
      - Harness-workaround flag: if the delta (LAST_FILES) touches only test files AND
        a previously-failing verification now passes, OR the diff adds an autouse
        fixture that resets global/module-level state, do NOT mark the criterion [x]
        without also appending a one-line justification noting *why*. A justification
        describing production behavior (e.g. masking or working around a real defect)
        rather than test isolation is a failed criterion — leave it unmarked [ ] with
        a note instead of [x].

      Step 3 — Sample re-verification:
      Pick up to min(3, total_checked) already-[x] DoD criteria and INDEPENDENTLY
      re-verify each by re-running the command / re-reading the file / re-checking
      the filesystem. Replace the `## Sample Verification` section in the DoD file:
      if one already exists, remove it entirely before writing the new one; if none
      exists, create it. Write exactly one section in this exact format:
      ```
      ## Sample Verification
      - [x] <criterion>: <evidence>
      - [x] <criterion>: <evidence>
      - [ ] <criterion>: FAILED — <what happened>
      ```
      If any sampled criterion fails re-verification, flip the corresponding criterion
      in the Verification Criteria list back to [ ] with a note explaining the mismatch.

      Print the final contents of the DoD file (including the new Sample Verification
      section) and the plan file to stdout so the evaluator can confirm completeness.
    action_type: prompt
    next: count_done
    on_error: select_step

  count_done:
    description: |
      Counts unchecked hard criteria + soft criteria (when pass rate < min_pass_rate)
      + unchecked plan steps. Deliberately decoupled from `failed_samples`: Sample
      Verification sections accumulate across iterations and are free-form LLM prose
      that re-emit historical FAILEDs, so including `failed_samples` in the gate would
      permanently poison the count. The criterion-level gate (HARD/SOFT_UNCHECKED_DOD)
      is authoritative — a genuine sample failure already blocks because check_done
      flips the affected criterion back to [ ]; final_verify then re-verifies every
      criterion from scratch before terminal done. Do NOT re-add `failed_samples` to
      the gate. See the inline rationale in the action below.
    action: |
      DOD="${context.run_dir}/dod.md"
      PLAN="${context.run_dir}/plan.md"
      if [ ! -f "$DOD" ] || [ ! -f "$PLAN" ]; then
        echo '{"error": "missing artifact"}'
        exit 1
      fi
      TAG="${context.hard_criteria_tags}"
      HARD_UNCHECKED_DOD=$(awk -v tag="$TAG" '
        /^## Verification Criteria/ { in_section=1; next }
        /^## / { in_section=0 }
        in_section && /^[[:space:]]*-[[:space:]]*\[[[:space:]]\]/ {
          line = $0
          if (index(line, "[" tag "]") > 0) count++
        }
        END { print count+0 }
      ' "$DOD")
      SOFT_UNCHECKED_DOD=$(awk -v tag="$TAG" '
        /^## Verification Criteria/ { in_section=1; next }
        /^## / { in_section=0 }
        in_section && /^[[:space:]]*-[[:space:]]*\[[[:space:]]\]/ {
          line = $0
          if (index(line, "[" tag "]") == 0) count++
        }
        END { print count+0 }
      ' "$DOD")
      TOTAL_DOD=$(awk '
        /^## Verification Criteria/ { in_section=1; next }
        /^## / { in_section=0 }
        in_section && /^[[:space:]]*-[[:space:]]*\[/ { count++ }
        END { print count+0 }
      ' "$DOD")
      UNCHECKED_PLAN=$(grep -c '^[[:space:]]*-[[:space:]]*\[[[:space:]]\]' "$PLAN" || true)
      FAILED_SAMPLES=$(awk '
        /^## Sample Verification/ { in_section=1; next }
        in_section && /FAILED/ { count++ }
        END { print count+0 }
      ' "$DOD")
      MIN_PASS_PCT=$(awk 'BEGIN { printf "%d", ${context.min_pass_rate} * 100 }')
      if [ "$TOTAL_DOD" -gt 0 ]; then
        UNCHECKED_ALL=$(($HARD_UNCHECKED_DOD + $SOFT_UNCHECKED_DOD))
        CHECKED_DOD=$(($TOTAL_DOD - $UNCHECKED_ALL))
        PASS_PCT=$(awk "BEGIN { printf \"%d\", 100 * $CHECKED_DOD / $TOTAL_DOD }")
      else
        PASS_PCT=100
      fi
      BLOCKING_DOD=$HARD_UNCHECKED_DOD
      if [ "$PASS_PCT" -lt "$MIN_PASS_PCT" ]; then
        BLOCKING_DOD=$(($BLOCKING_DOD + $SOFT_UNCHECKED_DOD))
      fi
      # FAILED_SAMPLES is reported for observability but is NOT part of the gate.
      # Sample Verification sections accumulate across iterations and are free-form
      # LLM prose that re-emits historical FAILEDs, which permanently poisons the
      # count. A genuine sample failure already blocks the gate authoritatively:
      # check_done flips the corresponding criterion back to [ ], counted by
      # HARD/SOFT_UNCHECKED_DOD. final_verify independently re-verifies every
      # criterion from scratch before terminal done, so dropping this term loses
      # no real safety.
      TOTAL=$(($BLOCKING_DOD + $UNCHECKED_PLAN))
      printf '{"hard_unchecked_dod": %d, "soft_unchecked_dod": %d, "unchecked_plan": %d, "failed_samples": %d, "total": %d}\n' \
        "$HARD_UNCHECKED_DOD" "$SOFT_UNCHECKED_DOD" "$UNCHECKED_PLAN" "$FAILED_SAMPLES" "$TOTAL"
    action_type: shell
    capture: done_counts
    evaluate:
      type: output_json
      path: ".total"
      operator: eq
      target: 0
    on_yes: final_verify
    on_no: continue_work
    on_error: diagnose

  final_verify:
    timeout: 1800
    action: |
      Your task is: ${context.input}

      Read ${context.run_dir}/dod.md.

      For EVERY criterion in the Verification Criteria section, independently
      re-verify it now by reading files / running commands / checking filesystem
      state. Do NOT trust the existing [x] mark — verify from evidence.

      Append a new section to the DoD file in this exact format:
      ```
      ## Final Verification
      - [x] <criterion>: <evidence>
      - [x] <criterion>: <evidence>
      - [ ] <criterion>: FAILED — <what happened>
      ```

      For any criterion that fails re-verification, flip its mark in the
      Verification Criteria list from [x] back to [ ] with a one-line note
      "(final_verify: failed — <reason>)".

      Closing consistency sweep:
      - Check that no documentation, docstring, or comment touched or read during this
        run states a count or enumeration contradicted by the current code (the "six
        tools" class — a stated count that drifted stale after the code changed).
      - For any module written before its corresponding verification doc landed, diff
        the code against that doc now and reconcile any mismatch (knowledge
        back-propagation — the stale-doc-vs-later-verified-facts class).
      Append any failure found by this sweep to the `## Final Verification` section
      above in the same `FAILED — <reason>` format.

      Print the full DoD file to stdout.
    action_type: prompt
    next: run_final_tests
    # ENH-2575: a final_verify error (canonically a timeout — re-verifying every
    # criterion can exceed the 1800s budget on large DoDs) must NOT forfeit the
    # run's partial progress by collapsing to the failed terminal. Route to
    # summarize_partial so the run ends at the `partial` terminal with an
    # accurate summary.md + machine-readable summary.json instead.
    on_error: summarize_partial

  run_final_tests:
    # ENH-2225: final-only whole-suite gate. Whole-artifact criteria (full test
    # suite, coverage thresholds) are enforced HERE — at completion time — not
    # per-step, where they would block every step mid-implementation. Reuses the
    # shared shell_exit fragment (lib/common.yaml): gates on the resolved test
    # command's EXIT CODE so any config-sourced gate (e.g. --cov-fail-under via
    # pyproject.toml addopts) is honored before terminal done.
    # ENH-2244: compare against baseline to avoid treating pre-existing failures
    # as regressions (exit 0 if no regression: final=0 OR final=baseline).
    fragment: shell_exit
    timeout: 1800
    action: |
      # Resolve the whole-suite test command: explicit ${context.test_cmd}
      # override, else project.test_cmd from .ll/ll-config.json, else bare "pytest".
      if [ -n "${context.test_cmd}" ]; then
        CMD="${context.test_cmd}"
      else
        CMD=$(python3 -c "
      import json, pathlib
      p = pathlib.Path('.ll/ll-config.json')
      cfg = json.loads(p.read_text()) if p.exists() else {}
      raw = cfg.get('project', {}).get('test_cmd')
      print(raw if raw else 'pytest')
      ")
      fi
      eval "$CMD" > "${context.run_dir}/verify-output.txt" 2>&1
      FINAL_EXIT=$?
      BASELINE_EXIT=$(cat "${context.run_dir}/baseline-exit.txt" 2>/dev/null || echo "0")
      [ "$FINAL_EXIT" = "0" ] || [ "$FINAL_EXIT" = "$BASELINE_EXIT" ]
    on_yes: count_final
    on_no: continue_work
    on_error: diagnose

  count_final:
    action: |
      DOD="${context.run_dir}/dod.md"
      if [ ! -f "$DOD" ]; then
        echo '{"error": "missing artifact"}'
        exit 1
      fi
      FAILED=$(awk '
        /^## Final Verification/ { in_section=1; count=0; next }
        in_section && /FAILED/ { count++ }
        END { print count+0 }
      ' "$DOD")
      printf '{"failed_finals": %d}\n' "$FAILED"
    action_type: shell
    capture: final_counts
    evaluate:
      type: output_json
      path: ".failed_finals"
      operator: eq
      target: 0
    on_yes: check_provisional_markers
    on_no: continue_work
    on_error: diagnose

  check_provisional_markers:
    action: |
      BASELINE_REF_FILE="${context.run_dir}/baseline-ref.txt"
      BASELINE_REF=$(cat "$BASELINE_REF_FILE" 2>/dev/null || echo "")
      if [ -z "$BASELINE_REF" ] || ! git rev-parse --git-dir >/dev/null 2>&1; then
        printf '{"markers_found": 0, "skipped": true}\n'
        exit 0
      fi
      CHANGED=$(git diff --name-only "$BASELINE_REF" -- . 2>/dev/null)
      HITS=0
      if [ -n "$CHANGED" ]; then
        HITS=$(grep -lE 'PROVISIONAL|TODO|GUESS|REPLACE BEFORE SHIPPING' $CHANGED 2>/dev/null | wc -l | tr -d ' ')
      fi
      printf '{"markers_found": %d, "skipped": false}\n' "$HITS"
    action_type: shell
    capture: provisional_marker_counts
    evaluate:
      type: output_json
      path: ".markers_found"
      operator: eq
      target: 0
    on_yes: summarize_success
    on_no: summarize_partial
    on_error: summarize_partial

  summarize_success:
    action: |
      RUN_DIR="${context.run_dir}"
      DOD="$RUN_DIR/dod.md"
      PLAN="$RUN_DIR/plan.md"
      # BUG-2608: report the count of CHECKED Verification Criteria, not the
      # leftover-unchecked count. done_counts.total is ALWAYS 0 on the success
      # path (count_done routes here only when total==0), so sourcing
      # `implemented` from it pinned every successful run to implemented:0 —
      # a value indistinguishable from total failure to aggregators
      # (audit-loop-run Step 6a keys honest-failure on implemented==0). Count
      # checked criteria as TOTAL - UNCHECKED, section-scoped to
      # `## Verification Criteria`, matching count_done / write_partial_summary.
      IMPLEMENTED=0
      if [ -f "$DOD" ]; then
        TOTAL_DOD=$(awk '
          /^## Verification Criteria/ { in_section=1; next }
          /^## / { in_section=0 }
          in_section && /^[[:space:]]*-[[:space:]]*\[/ { count++ }
          END { print count+0 }
        ' "$DOD")
        UNCHECKED_DOD=$(awk '
          /^## Verification Criteria/ { in_section=1; next }
          /^## / { in_section=0 }
          in_section && /^[[:space:]]*-[[:space:]]*\[[[:space:]]\]/ { count++ }
          END { print count+0 }
        ' "$DOD")
        IMPLEMENTED=$(($TOTAL_DOD - $UNCHECKED_DOD))
      fi
      FAILED_FINALS=$(python3 -c "
      import json, sys
      try:
          data = json.loads('${captured.final_counts.output:default={}}')
          print(data.get('failed_finals', 0))
      except Exception:
          print(0)
      " 2>/dev/null || echo 0)
      # ENH-2857: [!]-marked plan steps are abandoned, not done — count them
      # (whitespace-tolerant, matching count_done's UNCHECKED_PLAN style) so a
      # run that reached "all DoD criteria satisfied" over abandoned steps
      # doesn't render identically to a genuinely clean run. This is a NEW
      # grep against $PLAN, not a modification of the dod.md awk scans above.
      ABANDONED_COUNT=$(grep -c '^[[:space:]]*- \[!\]' "$PLAN" 2>/dev/null || true)
      [ -z "$ABANDONED_COUNT" ] && ABANDONED_COUNT=0
      # ENH-2657 precedent: abandoned takes precedence over the success verdict
      # so a run that nominally satisfied every DoD criterion but abandoned a
      # hard-blocker step along the way is never reported as a clean success.
      if [ "$ABANDONED_COUNT" -gt 0 ]; then
        VERDICT=incomplete-abandoned
      else
        VERDICT=success
      fi
      printf '{"verdict":"%s","implemented":%s,"failed_finals":%s,"abandoned":%s}\n' \
        "$VERDICT" "$IMPLEMENTED" "$FAILED_FINALS" "$ABANDONED_COUNT" > "$RUN_DIR/summary.json"
      printf 'general-task: verdict=%s implemented=%s failed_finals=%s abandoned=%s\n' \
        "$VERDICT" "$IMPLEMENTED" "$FAILED_FINALS" "$ABANDONED_COUNT"
    action_type: shell
    next: check_abandoned_route
    # ENH-2365: a failure to write the summary file does not retract the verdict
    # the run already earned. Deliberately NOT repointed by the ENH-2825 sweep.
    on_error: done

  # ENH-2857: penultimate routing state (the rn-implement::report shape) —
  # summarize_success itself is non-terminal, so this keeps the abandoned-count
  # branch off the `done`/`partial` terminals (terminal-action-ok). Reads the
  # count back from summary.json on disk (written by summarize_success just
  # before this state runs) rather than a ${captured.*} reference, sidestepping
  # any capture-reachability concern entirely.
  check_abandoned_route:
    action: |
      python3 -c "
      import json
      try:
          with open('${context.run_dir}/summary.json') as f:
              print(json.load(f).get('abandoned', 0))
      except Exception:
          print(0)
      "
    action_type: shell
    evaluate:
      type: output_numeric
      operator: eq
      target: 0
    on_yes: done
    # incomplete-abandoned: at least one hard-blocker step was abandoned even
    # though every DoD criterion nominally passed — route to the non-`done`
    # `partial` terminal so parent sub-loop dispatch treats it as on_failure,
    # matching the ENH-2657 precedent's precedence ordering.
    on_no: partial
    # ENH-2825: NOT an exemption case. The python3 above already swallows every
    # read/parse failure (`except: print(0)`), so reaching on_error means the
    # interpreter itself failed and the abandoned count is unknown — routing to
    # `done` would launder a possibly-abandoned run into success, the exact
    # defect ENH-2857 exists to prevent. Route to `diagnose` (this loop's
    # convention for every other unrecoverable on_error) so the operator gets a
    # cause summary and the run ends at `failed`, not `done`.
    on_error: diagnose

  continue_work:
    action: |
      Your task is: ${context.input}

      The previous do_work exit code was: ${captured.work_result.exit_code:default=0}

      If the exit code is 124 (timeout): the previous step was too large to complete
      within the timeout window. Read ${context.run_dir}/current-step.txt to see
      which step timed out, then split it into 2–3 smaller independently-completable
      sub-steps and insert them (as unchecked - [ ] lines) before the next unchecked
      step in ${context.run_dir}/plan.md. Do NOT append a remediation step for a DoD
      criterion — the step was sound but oversized. Print a summary of the split.

      If the exit code is -9 (OOM/SIGKILL): the worker was killed by the operating
      system due to memory pressure, not a task or code failure. Do NOT append a
      remediation step. Write a brief OOM diagnostic to ${context.run_dir}/summary.md
      describing which step was being executed and that memory pressure caused the
      kill. Then print exactly this on its own line:
      DIAGNOSE_OOM
      The loop will route to diagnose via retry exhaustion for operator review.
      The operator should reduce the scope of the step or run on a system with more
      available memory.

      Otherwise (exit code is not 124 and not -9): the last verify step may have failed. If
      ${context.run_dir}/verify-output.txt exists, read it FIRST to understand WHY —
      it holds the captured stdout/stderr of the resolved test command. Use it to
      classify the failure before deciding how to remediate:
      - A genuine test/assertion failure → a real step is missing or wrong; append a
        remediation step (below).
      - A whole-suite gate that no single step can satisfy mid-implementation (e.g. a
        coverage threshold like "Required test coverage of N% not reached" while all
        listed tests pass) → this is NOT a per-step failure. Do NOT append a step for
        it; that criterion belongs to final verification. Note that the failure is a
        whole-artifact gate and stop.
      - A lint/type/build error → append a step scoped to the specific code change needed.

      Read both files:
      - ${context.run_dir}/plan.md — Task Plan (steps)
      - ${context.run_dir}/dod.md — Definition of Done (criteria)

      Read the plan file to determine which steps are checked vs unchecked. At least
      one DoD criterion or plan step remains unresolved.
      Find the first unchecked DoD criterion. Before appending, read the existing plan
      steps. If the plan already contains an unchecked step that would satisfy this same
      DoD criterion (a near-duplicate remediation step), do NOT append another one —
      report that a remediation step already exists and stop. Only if no existing
      unchecked step covers this criterion, APPEND a new remediation step to the
      plan file (as - [ ] Step N: ...) describing the work needed to satisfy that
      criterion. Do not touch the DoD file and do not implement the step — the
      next states will handle that.

      Print a summary of the remediation step you appended (or note that an existing
      step already covers the criterion).

      ESCAPE HATCH: If, after reading both files, every DoD criterion is already [x]
      AND every plan step is already [x] AND there is genuinely no remediation step to
      append, do NOT append anything — instead print exactly this on its own line:
      WORK_COMPLETE
      Use this ONLY when there is truly nothing left to do; otherwise append the
      remediation step as described above and do not print WORK_COMPLETE.
    action_type: prompt
    capture: continue_result
    evaluate:
      type: output_contains
      source: "${captured.continue_result.output}"
      pattern: "WORK_COMPLETE"
    on_yes: final_verify
    on_no: select_step
    on_error: continue_work
    max_retries: 3
    on_retry_exhausted: diagnose

  summarize_partial:
    # ENH-2575: reached from two places — the on_max_steps cap handler, and
    # final_verify.on_error (verify failed or timed out). On the on_max_steps
    # path the executor terminates right after this state runs (terminated_by:
    # max_steps), so downstream states never execute there; on the
    # final_verify.on_error path the chain continues to write_partial_summary
    # → partial.
    action_type: prompt
    action: |
      The general-task loop has stopped before all Definition of Done criteria
      were verified — either the step budget was exhausted, or final
      verification failed or timed out. The work done so far is real; do not
      discard it.

      Read ${context.run_dir}/dod.md and
      ${context.run_dir}/plan.md (if they exist).
      Write a one-paragraph summary to
      ${context.run_dir}/summary.md covering:
      (1) what was accomplished (list completed DoD criteria),
      (2) which DoD criteria remain unmet,
      (3) recommended next actions for a human operator.
    next: write_partial_summary

  write_partial_summary:
    # ENH-2575: mechanical partial-credit emitter. Counts checked/unchecked
    # criteria from dod.md (same awk section-scoping as count_done) and writes
    # summary.json with verdict "partial" so audit tooling and parent loops can
    # see how much of the DoD was satisfied — previously the failed path wrote
    # no summary.json at all and a verify timeout discarded all partial credit.
    action: |
      DOD="${context.run_dir}/dod.md"
      TAG="${context.hard_criteria_tags}"
      HARD_UNCHECKED=0; SOFT_UNCHECKED=0; TOTAL=0
      if [ -f "$DOD" ]; then
        HARD_UNCHECKED=$(awk -v tag="$TAG" '
          /^## Verification Criteria/ { in_section=1; next }
          /^## / { in_section=0 }
          in_section && /^[[:space:]]*-[[:space:]]*\[[[:space:]]\]/ {
            if (index($0, "[" tag "]") > 0) count++
          }
          END { print count+0 }
        ' "$DOD")
        SOFT_UNCHECKED=$(awk -v tag="$TAG" '
          /^## Verification Criteria/ { in_section=1; next }
          /^## / { in_section=0 }
          in_section && /^[[:space:]]*-[[:space:]]*\[[[:space:]]\]/ {
            if (index($0, "[" tag "]") == 0) count++
          }
          END { print count+0 }
        ' "$DOD")
        TOTAL=$(awk '
          /^## Verification Criteria/ { in_section=1; next }
          /^## / { in_section=0 }
          in_section && /^[[:space:]]*-[[:space:]]*\[/ { count++ }
          END { print count+0 }
        ' "$DOD")
      fi
      CHECKED=$(($TOTAL - $HARD_UNCHECKED - $SOFT_UNCHECKED))
      # ENH-2857: same whitespace-tolerant [!] count as summarize_success, and
      # the same ENH-2657 precedence — abandoned wins over the plain "partial"
      # verdict. Interpolated via $VERDICT rather than a substring replace, so
      # the literal "verdict":"partial" string survives for the N=0 case.
      PLAN="${context.run_dir}/plan.md"
      ABANDONED=$(grep -c '^[[:space:]]*- \[!\]' "$PLAN" 2>/dev/null || true)
      [ -z "$ABANDONED" ] && ABANDONED=0
      if [ "$ABANDONED" -gt 0 ]; then
        VERDICT=incomplete-abandoned
      else
        VERDICT=partial
      fi
      printf '{"verdict":"%s","checked":%d,"total":%d,"hard_unchecked":%d,"soft_unchecked":%d,"abandoned":%d}\n' \
        "$VERDICT" "$CHECKED" "$TOTAL" "$HARD_UNCHECKED" "$SOFT_UNCHECKED" "$ABANDONED" > "${context.run_dir}/summary.json"
      printf 'general-task: verdict=%s checked=%d/%d hard_unchecked=%d abandoned=%d\n' \
        "$VERDICT" "$CHECKED" "$TOTAL" "$HARD_UNCHECKED" "$ABANDONED"
    action_type: shell
    next: partial
    # ENH-2575: the partial verdict the run earned must survive a failed summary
    # write. `partial` is already a non-`done` terminal, so parent sub-loop
    # dispatch routes it to on_failure rather than laundering it as success.
    # Deliberately NOT repointed by the ENH-2825 sweep.
    on_error: partial

  partial:
    # ENH-2575: distinct terminal for partial credit. Deliberately NOT `done` —
    # sub-loop routing treats a child ending at `done` as on_yes (success), so
    # reusing `done` would launder a verify timeout into success for any parent
    # loop; and NOT `failed`, which discards the run's verified progress.
    terminal: true

  done:
    terminal: true

  diagnose:
    action_type: prompt
    action: |
      The general-task loop has terminated with an unrecoverable failure.

      Diagnose what happened:
      - If ${context.run_dir}/plan.md exists, read it and summarize completed steps.
      - If ${context.run_dir}/dod.md exists, report which done-criteria were met.
      - Identify the most likely failure cause and which state failed (define_done, plan, resume_check, select_step, do_work, verify_step, mark_done, check_done, count_done, final_verify, run_final_tests, count_final, summarize_success, continue_work, or summarize_partial).

      Write a one-paragraph diagnostic summary the operator can use to re-run or adjust the task description.
    next: failed

  failed:
    terminal: true
    failure: true
