name: rl-coding-agent
category: rl
description: |
  Policy+RLHF composite loop for agentic coding. An outer policy loop adapts the
  coding strategy (which files, which approach) while an inner RLHF loop polishes
  each artifact to a quality threshold before the outer loop observes results.
  Reward = weighted composite of test pass rate, lint score, and live LLM-as-judge score.
  Upgrade path: when FEAT-659 (Hierarchical FSM Loops) lands, replace the refine
  state's shell subprocess with a native `loop: rl-rlhf` sub-loop state.
initial: act
scope:
  - "."
context:
  reward_target: 0.85      # Convergence threshold for composite reward (0.0–1.0)
  quality_threshold: 7     # Min quality score for rl-rlhf inner loop (0–10)
  target_files: ""         # Override: space-separated file globs to act on
  # BUG-3269: test_cmd/lint_cmd resolve via `ll-config get project.<key>`
  # (config-first — see observe below), which already carries its own
  # ProjectConfig field defaults ("pytest" / "ruff check ."). No context
  # override key here: one declared here would never be reachable, since
  # `ll-config get` always wins over it under the config-first shape.
import:
  - lib/common.yaml
states:

  # POLICY OUTER: Execute the current coding strategy on target files.
  # Replace the echo stubs with your coding action: the /ll:manage-issue skill,
  # a Claude prompt via claude -p, a patch application, etc.
  act:
    action: |
      echo "Executing coding strategy on: ${context.target_files:default=<all changed files>}"  # ll-lint: mr11-ok(context.target_files) ENH-3358 - ENH-3342 widening residual, tracked for conversion
      # Replace: run your coding action (/ll:manage-issue skill, claude prompt, patch, etc.)
      echo "strategy_applied"
    action_type: shell
    capture: action_result
    next: refine

  # RLHF INNER: Polish the artifact until its quality meets quality_threshold.
  # Delegates to rl-rlhf as a subprocess so it gets its own convergence loop.
  # When FEAT-659 lands, replace this state with:
  #   loop: rl-rlhf
  #   context_passthrough: true
  #   on_success: observe
  #   on_failure: failed
  refine:
    action: |
      ll-loop run rl-rlhf \
        --context quality_dimension="correctness and test coverage" \
        --max-iterations 10
    action_type: shell
    capture: refine_result
    next: observe

  # POLICY OUTER: Compute composite reward from test pass rate + lint score + LLM judge score.
  # Composite formula: TEST_SCORE * 0.5 + LINT_SCORE * 0.3 + LLM_SCORE * 0.2
  observe:
    action: |
      # Load test_cmd / lint_cmd via `ll-config get` (BUG-3269): honors
      # .ll/ll.local.md, and present-and-null means "opt out of scoring" —
      # never guess "pytest"/"ruff check" against a null config, which
      # previously scored every rollout against a shell `command not found`.
      TEST_CMD=$(ll-config get project.test_cmd)
      LINT_CMD=$(ll-config get project.lint_cmd)

      # Test score (0.0–1.0): fraction of tests that pass. Empty TEST_CMD
      # (explicit null / unresolvable) means no test signal — score 0.0
      # rather than running a guessed command against a null config.
      if [ -z "$TEST_CMD" ]; then
        TEST_SCORE=0.0
      else
        TEST_OUT=$(eval "$TEST_CMD" --tb=no -q 2>&1 | tail -1)
        PASSED=$(echo "$TEST_OUT" | grep -oE '[0-9]+ passed' | grep -oE '[0-9]+' || echo 0)
        TOTAL=$(echo "$TEST_OUT" | grep -oE '[0-9]+ (passed|failed)' | grep -oE '[0-9]+' | paste -sd+ | bc || echo 1)
        TEST_SCORE=$(python3 -c "print(round($PASSED / max($TOTAL, 1), 3))")
      fi

      # Lint score (0.0–1.0): 1 minus clamped error density. Empty LINT_CMD
      # means no lint signal — score 0.0 rather than a guessed command.
      if [ -z "$LINT_CMD" ]; then
        LINT_SCORE=0.0
      else
        LINT_ERRORS=$(eval "$LINT_CMD" --select E,W 2>/dev/null | grep -c '^' || true)
        [ -z "$LINT_ERRORS" ] && LINT_ERRORS=0
        LINT_SCORE=$(python3 -c "print(round(max(0, 1 - $LINT_ERRORS / 10), 3))")
      fi

      # LLM quality score (0.0–1.0): live judge via Claude
      TARGETS="${context.target_files}"  # ll-lint: mr11-ok(context.target_files) ENH-3358 - ENH-3342 widening residual, tracked for conversion
      [ -z "$TARGETS" ] && TARGETS=$(git diff --name-only HEAD 2>/dev/null | tr '\n' ' ' || echo ".")
      LLM_SCORE=$(claude -p "Review $TARGETS for code quality. Rate overall quality (correctness, clarity, test coverage) as a decimal 0.0–1.0. Output ONLY the number." \
        --output-format text --no-session-persistence --dangerously-skip-permissions 2>/dev/null | \
        grep -oE '(0?\.[0-9]+|1\.0)' | head -1 || echo "0.5")
      LLM_SCORE=$(python3 -c "print(round(max(0.0, min(1.0, float('$LLM_SCORE' or '0.5'))), 3))")

      # Composite reward: tests 50% + lint 30% + LLM judge 20%
      REWARD=$(python3 -c "print(round($TEST_SCORE * 0.5 + $LINT_SCORE * 0.3 + $LLM_SCORE * 0.2, 3))")
      echo "test=$TEST_SCORE lint=$LINT_SCORE composite=$REWARD"
      echo "$REWARD"
    action_type: shell
    capture: observation
    next: score

  # POLICY OUTER: Extract numeric reward and route via convergence evaluator.
  # Routes: target → done, progress → improve, stall → act, error → failed.
  score:
    fragment: convergence_gate
    action: |
      echo "${captured.observation.output}" | tail -1 | tr -d '[:space:]'  # ll-lint: mr11-ok(captured.observation.output) ENH-3358 - ENH-3342 widening residual, tracked for conversion
    evaluate:
      target: "${context.reward_target}"
      tolerance: 0.05
      previous: "${captured.prev_reward.output}"
    route:
      target: done
      progress: improve
      stall: act
      error: diagnose

  # POLICY OUTER: Update the coding strategy based on observed reward and refine output.
  # Replace the echo stubs with real strategy adaptation logic: update a prompt file,
  # adjust target_files, change the approach (e.g., switch from patching to rewriting), etc.
  improve:
    action: |
      echo "Reward achieved: ${captured.observation.output}"  # ll-lint: mr11-ok(captured.observation.output) ENH-3358 - ENH-3342 widening residual, tracked for conversion
      echo "Refine output: ${captured.refine_result.output}"  # ll-lint: mr11-ok(captured.refine_result.output) ENH-3358 - ENH-3342 widening residual, tracked for conversion
      # Replace: update strategy file, adjust prompt, change target files, etc.
      echo "Strategy updated based on observations."
    action_type: shell
    next: persist_reward

  # POLICY OUTER: Persist current reward for stall detection on the next iteration.
  # Emits only the numeric reward so the convergence evaluator can parse it cleanly.
  persist_reward:
    action: |
      echo "${captured.observation.output}" | tail -1 | tr -d '[:space:]'  # ll-lint: mr11-ok(captured.observation.output) ENH-3358 - ENH-3342 widening residual, tracked for conversion
    action_type: shell
    capture: prev_reward
    next: act

  done:
    terminal: true

  diagnose:
    action_type: prompt
    action: |
      The rl-coding-agent loop has terminated with an unrecoverable failure.

      Diagnose what happened:
      - Report the last known observation: ${captured.observation.output}
      - Report the last known reward: ${captured.prev_reward.output:default=not-reached}
      - Identify the most likely failure cause (convergence evaluator error in the score state).

      Write a one-paragraph diagnostic summary the operator can use to re-run or adjust the eval suite.
    next: failed

  failed:
    terminal: true

max_steps: 50
on_handoff: spawn
