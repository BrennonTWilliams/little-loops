name: proof-first-task
category: gate
description: Opt-in wrapper that gates any implementation loop on the Learning-Test Registry — proves a caller-supplied targets_csv directly when given, otherwise extracts external-API assumptions from the issue file via assumption-firewall — then delegates to a caller-specified impl loop. When no issue_file is given, skips the gate and runs the impl loop directly.
initial: check_issue_file
max_steps: 150
timeout: 7200
on_handoff: spawn
# BUG-2864: narrow lock scope so this subprocess-shelled-out gate never
# conflicts with unrelated concurrently running scoped loops (mirrors
# autodev.yaml / prompt-across-issues.yaml).
scope:
  - "${context.run_dir}"
import:
  - lib/common.yaml

context:
  task: ""
  issue_file: ""
  impl_loop: "general-task"
  targets_csv: ""

states:

  check_issue_file:
    fragment: shell_exit
    action: test -n "${context.issue_file}" && test -f "${context.issue_file}"
    on_yes: check_targets_csv
    on_no: resolve_task

  check_targets_csv:
    fragment: shell_exit
    action: test -n "${context.targets_csv}"
    on_yes: gate_direct
    on_no: gate

  gate_direct:
    loop: ready-to-implement-gate
    with:
      targets: "${context.targets_csv}"
    on_success: resolve_task
    on_failure: blocked
    on_error: blocked

  gate:
    loop: assumption-firewall
    with:
      input: "${context.issue_file}"
    capture: gate_result
    on_success: resolve_task
    on_failure: check_gate_blocked
    on_error: blocked

  check_gate_blocked:
    action_type: shell
    action: |
      cat > "${context.run_dir}/check_gate_blocked-gate.extracted.txt" << 'LL_RAW_9F3C1A7E_EOF'
      ${captured.gate.extracted.output}
      LL_RAW_9F3C1A7E_EOF
      python3 << 'PYEOF'
      import json, sys
      try:
          with open("${context.run_dir}/check_gate_blocked-gate.extracted.txt") as _f:
              data = json.loads(_f.read())
          count = data.get("count", -1)
      except Exception:
          count = -1
      sys.exit(0 if count == 0 else 1)
      PYEOF
    evaluate:
      type: exit_code
    on_yes: resolve_task
    on_no: blocked

  resolve_task:
    # Synthesizes a fallback task from issue_file when the caller (e.g. the
    # learning gate, ENH-2834) passes issue_file without task — prevents
    # general-task from silently improvising a plan against ambient repo
    # state on an empty input.
    action_type: shell
    action: |
      task=${context.task:shell}
      issue_file=${context.issue_file:shell}
      if [ -n "$task" ]; then
        printf '%s' "$task"
      elif [ -n "$issue_file" ]; then
        printf 'Implement the issue described in %s. Read the issue file for full requirements and acceptance criteria.' "$issue_file"
      else
        exit 1
      fi
    capture: resolved_task
    on_error: task_missing
    next: run_impl

  run_impl:
    loop: "${context.impl_loop}"
    with:
      input: "${captured.resolve_task.output}"
    on_success: done
    on_failure: impl_failed
    on_error: impl_failed

  done:
    terminal: true

  blocked:
    terminal: true
    failure: true

  impl_failed:
    terminal: true
    failure: true

  task_missing:
    terminal: true
    failure: true
