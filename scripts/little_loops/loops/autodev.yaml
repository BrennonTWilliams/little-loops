name: "autodev"
category: issue-management
description: |
  Targeted refine-and-implement for a specific set of issues. Accepts a single
  issue ID or a comma-separated list. Interleaves refinement and implementation:
  refines one issue; on threshold pass, implements it immediately via
  `ll-auto --only`; on decomposition into children, prepends children to the
  queue depth-first and refines them before the next sibling. First
  implementation runs as soon as the first leaf passes refinement.

  Unlike auto-refine-and-implement, this loop does not poll the backlog and
  does not maintain a skip list — the input set is finite and fixed.

  Usage:
    ll-loop run autodev "ISSUE_ID"
    ll-loop run autodev "ID1,ID2,ID3"
initial: init
max_steps: 500
timeout: 28800
on_handoff: spawn
# ENH-2748: check_guard2_verdict is statically reachable via check_broke_down's
# on_no shortcut, bypassing run_size_review's capture. BUG-2744 closed the
# actual correctness gap with a runtime marker-file gate
# (check_size_review_ran_this_pass) the static validator can't model.
capture_reachability_ok: true
scope:
- "${context.run_dir}"
# BUG-2526: serialize loop-name conflicts at the lock layer so two concurrent
# `ll-loop run autodev` instances do not both shell out to `ll-auto --only`
# on the main working tree (corrupts .auto-manage-state.json and git state).
singleton: true
context:
  # readiness_threshold / outcome_threshold are seeded at launch from
  # commands.confidence_gate.{readiness,outcome}_threshold in ll-config.json
  # (defaults 85 / 65). Declaring them here would shadow that config —
  # override per-run with `--context readiness_threshold=NN` instead (BUG-2767).
  # Learning-gate skip knob: parity with `ll-auto --skip-learning-gate`. Threaded
  # into implement_current's inner `ll-auto --only` via the SKIP_FLAG. Default
  # empty = the ENH-2319 gate stays active (config-gated by learning_tests.enabled).
  # Passed down from auto-refine-and-implement via with: so the sprint path honors it too.
  #   ll-loop run autodev <ids> --context skip_learning_gate=1
  skip_learning_gate: ""
  # FEAT-3573: post-implement quality gate. "true" (default) makes closure credit for
  # an implemented (done/completed) issue depend on a passing format-check/lint/type/
  # test run recorded against the commit it produced. Set "false" to fall back to the
  # old status-only closure check (e.g. a repo whose base branch is already red).
  #   ll-loop run autodev <ids> --context quality_gate=false
  # Forwarded from auto-refine-and-implement via with: so the sprint/EPIC path honors it.
  quality_gate: "true"
import:
- lib/common.yaml

states:
  init:
    # Validate input, reset autodev tmp files, and seed the unified queue from
    # the comma-separated context.input. The same ${context.run_dir}/autodev-queue.txt
    # serves both refinement and implementation throughout — there is no
    # separate impl queue.
    action: |
      mkdir -p .loops/tmp
      # Write context.input via a quoted heredoc so shell metacharacters in the
      # value are read literally, not paste-injected into bash (BUG-2622).
      cat > ${context.run_dir}/autodev-input.txt <<'LL_INPUT_EOF'
      ${context.input}
      LL_INPUT_EOF
      if ! grep -q '[^[:space:]]' ${context.run_dir}/autodev-input.txt; then
        echo "ERROR: input is required. Usage: ll-loop run autodev \"ID1,ID2\""
        exit 1
      fi
      printf '' > ${context.run_dir}/autodev-staged.txt
      printf '' > ${context.run_dir}/autodev-passed.txt
      printf '' > ${context.run_dir}/autodev-unverified.txt
      printf '' > ${context.run_dir}/autodev-skipped.txt
      printf '' > ${context.run_dir}/autodev-gate-blocked.txt
      printf '' > ${context.run_dir}/autodev-decision-unresolved.txt
      printf '' > ${context.run_dir}/autodev-spike-inconclusive.txt
      printf '' > ${context.run_dir}/autodev-proposal-unsound.txt
      printf '' > ${context.run_dir}/autodev-proof-gate-infra.txt
      printf '' > ${context.run_dir}/autodev-not-started.txt
      printf '' > ${context.run_dir}/autodev-not-started-attempts.txt
      rm -f ${context.run_dir}/autodev-broke-down
      rm -f ${context.run_dir}/autodev-inflight
      rm -f ${context.run_dir}/autodev-stop-reason
      tr ',' '\n' < ${context.run_dir}/autodev-input.txt \
        | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' \
        | grep -v '^[[:space:]]*$' \
        > ${context.run_dir}/autodev-queue.txt
      COUNT=$(wc -l < ${context.run_dir}/autodev-queue.txt | tr -d ' ')
      echo "Queued $COUNT issue(s) for autodev"
    fragment: shell_exit
    on_yes: dequeue_next
    on_no: finalize_done
    on_error: finalize_done

  dequeue_next:
    # Pop the head of the unified queue; snapshot current active issue IDs as
    # the per-iteration baseline for child detection; clear the broke-down
    # handshake flags so each iteration starts clean. Captures the ID as
    # 'input' so context_passthrough forwards it to refine-to-ready-issue as
    # context.input. Exits 1 (→ done) when the queue is empty.
    action: |
      if [ ! -s ${context.run_dir}/autodev-queue.txt ]; then
        exit 1
      fi
      CURRENT=$(head -1 ${context.run_dir}/autodev-queue.txt)
      tail -n +2 ${context.run_dir}/autodev-queue.txt > ${context.run_dir}/autodev-queue.tmp
      mv ${context.run_dir}/autodev-queue.tmp ${context.run_dir}/autodev-queue.txt

      # BUG-1226: record the in-flight issue so `done` can surface it if the
      # loop terminates before this issue reaches a clean resolution
      # (enqueue_or_skip / enqueue_children / next dequeue_next overwrite).
      printf '%s' "$CURRENT" > ${context.run_dir}/autodev-inflight

      rm -f ${context.run_dir}/refine-broke-down ${context.run_dir}/autodev-broke-down
      # ENH-3075: per-issue marker shared with oracles/resolve-decision.yaml
      # (which now owns deposit_options/record_options_deposited). Unlike the
      # neighbouring per-issue markers on this line, which deliberately are
      # NOT cleared because filename-scoping alone already self-isolates them
      # (see :130/:157 below), this one IS cleared here: it gates a bounded
      # retry that should be available again if this issue is re-dequeued in
      # the same run, not a one-shot-per-issue bound (the write-once bound
      # comes from the marker's presence, not from this clear).
      rm -f ${context.run_dir}/decide-options-deposited-$CURRENT
      # BUG-3390: positive guard-2 provenance marker (written only by
      # count_repair_cycle_size_review) — cleared per issue.
      rm -f ${context.run_dir}/autodev-size-review-ran-this-pass
      # BUG-3588: rescore-retry markers (check_scores_present_*) get their retry
      # back if this issue is re-dequeued in the same run.
      rm -f ${context.run_dir}/autodev-rescore-retry-*-$CURRENT
      # ENH-3610: obligation-selector re-entry caps get their budget back if this
      # issue is re-dequeued in the same run.
      rm -f ${context.run_dir}/autodev-reentry-*-$CURRENT

      # FEAT-2751: snapshot the pre-refine Readiness score per-issue so
      # check_reconcile_needed can detect a plateau even on the common
      # spiked and non-spiked paths alike (ENH-3611 removed the separate
      # spike-only snapshot). Reset the repair-cycle
      # counter, which is run-dir-scoped and would otherwise leak across issues.
      (ll-issues show "$CURRENT" --json | python3 -c "
      import json, sys
      try:
          d = json.load(sys.stdin)
          print(d.get('confidence') or '')
      except Exception:
          pass
      " > ${context.run_dir}/autodev-pre-readiness.txt) || true
      printf '0' > ${context.run_dir}/autodev-repair-cycle-count.txt
      # ENH-2992: the contradiction-reconcile budget is per-issue-per-run (cap
      # 2), so reset it alongside the repair-cycle counter — leaving it would
      # make one queue-head issue's fires exhaust every later issue's budget.
      # Clear the armed handshake too, so a fire that never reached
      # count_repair_cycle_reconcile cannot leak into the next issue. The
      # per-issue autodev-contradiction-reconcile-<ID> stamp is filename-scoped
      # and self-isolates, so it is deliberately NOT cleared here.
      printf '0' > ${context.run_dir}/autodev-contradiction-reconcile-count.txt
      rm -f ${context.run_dir}/autodev-contradiction-reconcile-armed
      # BUG-2803: clear the pre-deferral remedy handshake files so a prior
      # issue's armed-but-unconsumed remedy (or fired marker) never leaks
      # into this issue's deferral decision.
      rm -f ${context.run_dir}/autodev-pre-deferral-remedy.txt
      rm -f ${context.run_dir}/autodev-pre-deferral-remedy-fired
      # ENH-2870: clear the atomic-remediation design-remedy handshake so a
      # prior issue's armed-but-unconsumed remedy never leaks into this
      # issue's decision (the design-gate-failed-<ID> marker is already
      # per-issue-scoped by filename, so it self-isolates without cleanup).
      rm -f ${context.run_dir}/autodev-atomic-design-remedy-pending

      (ll-issues list --json | python3 -c "
      import json, sys
      try:
          issues = json.load(sys.stdin)
          for i in sorted(i['id'] for i in issues):
              print(i)
      except Exception:
          pass
      " > ${context.run_dir}/autodev-pre-ids.txt) || true

      echo "$CURRENT"
    fragment: queue_pop
    capture: input
    on_yes: check_status_at_dequeue
    on_no: finalize_done
    on_error: finalize_done

  check_status_at_dequeue:
    # ENH-2868: status pre-flight gate. autodev is invoked with explicit
    # comma-separated ID lists (by hand, by auto-refine-and-implement, and by
    # the sprint path) and those lists go stale — an issue completed
    # out-of-band in a parallel worktree, cancelled during triage, or deferred
    # by a prior run. Without this gate the stale ID burns a full
    # refine-to-ready-issue delegation (format → refine → wire →
    # confidence-check, four LLM calls) before any downstream guard notices:
    # every existing status check is downstream (rn-implement's
    # check_issue_status, BUG-2201; issue_manager's active-status filter under
    # implement_current's inner `ll-auto --only`), and autodev's own
    # [SKIP-DEFER] guards only defend the status *write* side.
    #
    # `deferred` is in the skip set deliberately: ENH-2666 made `deferred` the
    # unified not-ready exit for autodev's own gates, with visibility owned by
    # `ll-issues deferred-triage` rather than by re-evaluating the issue on
    # every run. Re-passing a deferred ID therefore skips by policy; clear it
    # with `ll-issues set-status <ID> open` to force a retry. `blocked` is NOT
    # skipped — the status value is distinct from unmet `blocked_by` deps
    # (which rn-implement's check_blocked_by already gates), and refining a
    # blocked issue is often what unblocks it.
    #
    # `ll-issues show --json` reports status display-cased ("Done", "Deferred")
    # — lowercase before comparing, the same idiom as record_reentry_exhausted
    # and mark_gate_blocked. Fail-open: an unresolvable ID, missing status, or
    # parse error yields PROCESS so a gate error never blocks the queue.
    action_type: shell
    action: |
      ID="${captured.input.output}"  # ll-lint: mr11-ok(captured.input.output) ENH-3358 - ENH-3342 widening residual, tracked for conversion
      STATUS=$(ll-issues show "$ID" --json 2>/dev/null \
        | python3 -c "import json,sys; print((json.load(sys.stdin).get('status') or '').lower())" \
        2>/dev/null || echo "")
      case "$STATUS" in
        done|completed|cancelled|deferred)
          echo "SKIP_CLOSED $STATUS" ;;
        *)
          echo "PROCESS" ;;
      esac
    evaluate:
      type: output_contains
      pattern: "SKIP_CLOSED"
    capture: dequeue_status
    on_yes: skip_already_resolved
    on_no: check_blockers_at_dequeue
    on_error: check_blockers_at_dequeue

  skip_already_resolved:
    # ENH-2868: ledger a pre-flight status skip and advance the queue. Uses the
    # `already_<status>` reason stem so finalize_done can surface it as its own
    # bucket rather than misattributing it as a refine-quality failure (the
    # same separate-bucket rationale as ENH-2727's refine_failed_infra).
    # Clears autodev-inflight like skip_inflight so BUG-1226's done-state
    # warning is not triggered for an issue that resolved cleanly.
    action: |
      # ll-lint: mr11-ok(captured.dequeue_status.output) ENH-3358 - ENH-3342 widening residual, tracked for conversion
      STATUS=$(printf '%s' "${captured.dequeue_status.output}" \
        | awk '/SKIP_CLOSED/ {print $2; exit}')
      [ -n "$STATUS" ] || STATUS=resolved
      echo "${captured.input.output}  already_$STATUS" >> ${context.run_dir}/autodev-skipped.txt  # ll-lint: mr11-ok(captured.input.output) ENH-3358 - ENH-3342 widening residual, tracked for conversion
      rm -f ${context.run_dir}/autodev-inflight
      echo "[SKIP-CLOSED] ${captured.input.output} already $STATUS; no refinement attempted"  # ll-lint: mr11-ok(captured.input.output) ENH-3358 - ENH-3342 widening residual, tracked for conversion
    fragment: queue_track
    action_type: shell
    next: dequeue_next
    on_error: dequeue_next

  check_blockers_at_dequeue:
    # ENH-2909: cheap upfront gate ported from rn-implement.yaml's check_blocked_by
    # (ENH-2008, lines ~407-510). If the dequeued issue has unmet `blocked_by`
    # frontmatter deps (any blocker not yet done/cancelled), skip it BEFORE
    # spending a full refine → wire → confidence-check cycle on a structurally
    # doomed issue — that chain can never move scores past a declared blocker.
    #
    # Deliberately parses the issue file's YAML frontmatter directly rather than
    # `ll-issues show --json`, matching rn-implement's posture: shell-escape
    # safety and consistency with the existing get_frontmatter/get_blocked_by
    # idiom (handles both list and comma-separated scalar forms).
    #
    # BUG-2897: `deferred` is non-terminal for dependency purposes — only
    # done/cancelled resolve a blocking edge, so a deferred blocker still counts
    # as unmet here.
    #
    # Fail-open: unresolved issue file, parse error, or an inability to compute
    # the done-set all yield no unmet deps -> READY -> refine_current.
    # Processing is never blocked on a gate error.
    action_type: shell
    action: |
      ID="${captured.input.output}"  # ll-lint: mr11-ok(captured.input.output) ENH-3358 - ENH-3342 widening residual, tracked for conversion
      cat > "${context.run_dir}/check_blockers_at_dequeue-input.txt" << 'LL_RAW_9F3C1A7E_EOF'
      ${captured.input.output}
      LL_RAW_9F3C1A7E_EOF
      UNMET=$(python3 << 'PYEOF'
      import re, subprocess, json, sys
      from pathlib import Path
      try:
          import yaml as _yaml
          def _parse_yaml(text):
              return _yaml.safe_load(text) or {}
      except ImportError:
          def _parse_yaml(text):
              result = {}
              for line in text.splitlines():
                  m = re.match(r'^([\w-]+):\s*(.*)', line)
                  if m:
                      result[m.group(1)] = m.group(2).strip()
              return result

      with open("${context.run_dir}/check_blockers_at_dequeue-input.txt") as _f:
          issue_id = _f.read().rstrip("\n")

      issue_path = None
      for d in (".issues/bugs", ".issues/features", ".issues/enhancements", ".issues/epics"):
          dp = Path(d)
          if not dp.exists():
              continue
          for p in dp.glob("*.md"):
              m = re.match(r'P\d-([A-Z]+-\d+)-', p.name)
              if m and m.group(1) == issue_id:
                  issue_path = p
                  break
          if issue_path:
              break

      if not issue_path:
          print("UNRESOLVED", file=sys.stderr)
          sys.exit(0)  # unresolved -> fail-open

      try:
          content = issue_path.read_text()
          m = re.match(r'^---\n(.*?)\n---', content, re.DOTALL)
          fm = _parse_yaml(m.group(1)) if m else {}
      except Exception:
          print("PARSE_ERROR", file=sys.stderr)
          sys.exit(0)  # parse error -> fail-open

      val = fm.get("blocked_by") or []
      if isinstance(val, str):
          deps = [v.strip() for v in val.split(",") if v.strip()]
      else:
          deps = [str(v).strip() for v in (val if isinstance(val, list) else []) if v]

      if not deps:
          sys.exit(0)  # no deps -> ready

      done_ids = set()
      try:
          r = subprocess.run(
              ["ll-issues", "list", "--json", "--status", "done"],
              capture_output=True, text=True, timeout=30,
          )
          if r.returncode == 0:
              done_ids = {i["id"] for i in json.loads(r.stdout) if "id" in i}
          else:
              print("DONE_SET_ERROR", file=sys.stderr)
              sys.exit(0)  # cannot determine done set -> fail-open
      except Exception:
          print("DONE_SET_ERROR", file=sys.stderr)
          sys.exit(0)  # fail-open

      # BUG-2897: deferred is non-terminal for dependency purposes; only
      # done/cancelled resolve an edge. done_ids above is already scoped to
      # --status done, so a deferred blocker naturally stays "unmet" here.
      unmet = [d for d in deps if d not in done_ids]
      if unmet:
          print(" ".join(unmet))
      PYEOF
      )
      if [ -n "$UNMET" ]; then
        echo "[BLOCKED_BY] $ID has unmet deps:$UNMET"
        echo "BLOCKED"
      else
        echo "READY"
      fi
    evaluate:
      type: output_contains
      pattern: "BLOCKED"
    capture: blockers_status
    on_yes: skip_blocked
    on_no: check_gate_at_dequeue
    on_error: check_gate_at_dequeue

  skip_blocked:
    # ENH-2909: ledger a pre-flight blocker skip and advance the queue. Uses
    # the `blocked_by_unmet` reason stem so finalize_done can surface it as its
    # own bucket, mirroring ENH-2868's already_* bucket. Unlike rn-implement's
    # mark_deferred, this does NOT set status:deferred — the issue remains
    # `open` and will be re-checked on its next dequeue (queue-scheduling
    # changes are out of scope, per the issue's Scope Boundaries).
    action: |
      echo "${captured.input.output}  blocked_by_unmet" >> ${context.run_dir}/autodev-skipped.txt  # ll-lint: mr11-ok(captured.input.output) ENH-3358 - ENH-3342 widening residual, tracked for conversion
      rm -f ${context.run_dir}/autodev-inflight
      echo "[SKIP-BLOCKED] ${captured.input.output} has unmet blocked_by deps; no refinement attempted"  # ll-lint: mr11-ok(captured.input.output) ENH-3358 - ENH-3342 widening residual, tracked for conversion
    fragment: queue_track
    action_type: shell
    next: dequeue_next
    on_error: dequeue_next

  check_gate_at_dequeue:
    # ENH-3148: recognize an issue that is explicitly gated by policy BEFORE
    # spending refine_current's format -> refine -> wire -> confidence-check
    # cycle on an issue that cycle cannot unblock (measured cost: $4.48 /
    # 38m37s / 36 iterations on one FEAT-3145 run, per this issue's Summary).
    # Detection signals, in preference order: (1) structural frontmatter `gate`
    # field and (2) prose gate-phrase matching, both resolved by
    # `ll-issues check-gate` (ENH-3575 extracted the regex BUG-3147/ENH-3148
    # had duplicated inline); (3) a placeholder Acceptance Criteria section (no checkbox
    # items, and its prose reads as a deferral note) is independently
    # disqualifying since the gate cannot be verified either way.
    #
    # Fail-open: unresolved issue file or parse error yields GATE_NO ->
    # refine_current, matching check_blockers_at_dequeue's posture -- a gate
    # error never blocks the queue.
    action_type: shell
    action: |
      ID="${captured.input.output}"  # ll-lint: mr11-ok(captured.input.output) ENH-3358 - ENH-3342 widening residual, tracked for conversion
      ISSUE_FILE=$(ll-issues path "$ID" 2>/dev/null || echo "")
      GATED="false"
      if [ -n "$ISSUE_FILE" ] && [ -f "$ISSUE_FILE" ]; then
        # ENH-3575: structured `gate` field first, prose fallback inside the helper.
        # Empty output (helper error / exit 2) is fail-open: treated as no verdict.
        VERDICT=$(ll-issues check-gate "$ID" 2>/dev/null || true)
        case "$VERDICT" in
          structured_open|prose) GATED="true" ;;
        esac
        # Placeholder-AC runs only when the helper reports no gate signal at all
        # (`none`); a present `gate` field replaces both prose signals.
        if [ "$GATED" = "false" ] && [ "$VERDICT" = "none" ]; then
          PLACEHOLDER=$(ISSUE_FILE="$ISSUE_FILE" python3 << 'PYEOF'
      import os, re, sys
      from pathlib import Path
      path = Path(os.environ.get("ISSUE_FILE", ""))
      try:
          text = path.read_text()
      except Exception:
          sys.exit(0)
      m = re.search(r'(?ims)^##\s*Acceptance Criteria\s*\n(.*?)(?=\n##\s|\Z)', text)
      if not m:
          sys.exit(0)
      body = m.group(1).strip()
      if not body or re.search(r'^\s*-\s*\[[ xX]\]', body, re.MULTILINE):
          sys.exit(0)  # real checkbox criteria present -> not a placeholder
      if re.search(r'to be settled|to be determined|\bTBD\b', body, re.IGNORECASE):
          print("PLACEHOLDER")
      PYEOF
          )
          if [ "$PLACEHOLDER" = "PLACEHOLDER" ]; then
            GATED="true"
          fi
        fi
      fi
      if [ "$GATED" = "true" ]; then
        echo "[GATE-CHECK] $ID is explicitly gated; skipping remediation ladder"
        echo "GATE_YES"
      else
        echo "GATE_NO"
      fi
    evaluate:
      type: output_contains
      pattern: "GATE_YES"
    capture: gate_status
    on_yes: defer_gated
    on_no: refine_current
    on_error: refine_current

  defer_gated:
    # ENH-3148: gated issue deferred with a distinct, honest reason code
    # (blocked_by_gate) instead of low_readiness -- the remediation ladder
    # never ran, so "needs more refinement" would be misleading. Mirrors
    # mark_gate_blocked's deferral-write idiom, including the BUG-2729
    # postmortem guard: never flip an already-resolved issue to deferred.
    action: |
      ID="${captured.input.output}"  # ll-lint: mr11-ok(captured.input.output) ENH-3358 - ENH-3342 widening residual, tracked for conversion
      echo "$ID  blocked_by_gate" >> ${context.run_dir}/autodev-skipped.txt
      rm -f ${context.run_dir}/autodev-inflight
      STATUS=$(ll-issues show "$ID" --json 2>/dev/null \
        | python3 -c "import json,sys; print((json.load(sys.stdin).get('status') or '').lower())" \
        2>/dev/null || echo "")
      if [ "$STATUS" = "done" ] || [ "$STATUS" = "completed" ] || [ "$STATUS" = "cancelled" ]; then
        echo "[SKIP-DEFER] $ID already $STATUS; leaving status untouched"
      else
        ll-issues set-status "$ID" deferred --by automation --reason blocked_by_gate 2>/dev/null || true
        echo "[GATE-DEFER] $ID is explicitly gated by policy; deferred (blocked_by_gate)"
      fi
    action_type: shell
    next: dequeue_next
    on_error: dequeue_next

  refine_current:
    # Delegate format → refine → wire → confidence-check for a single issue to the
    # prepare-issue wrapper (ENH-3605), which runs refine-to-ready-issue and forwards
    # its typed run record under the prepare-issue writer. context_passthrough forwards
    # captured.input as context.input to the sub-loop. The wrapper mirrors the inner
    # terminal type: on_success = inner reached 'done' (true confidence pass OR
    # breakdown_issue path); on_failure = inner reached 'failed' (or died, see on_error
    # below) — routed through route_refine_outcome so the issue is recorded as skipped
    # and the queue advances without passing an unrefined issue to implement_current.
    #
    # BUG-2611: do NOT add an `on_no:` key here. `_execute_delegate_state`
    # (executor.py) routes any non-"done" terminal — including a genuine
    # crash — through `on_no`, and schema.py's `on_no = on_no or on_failure`
    # means an explicit `on_no` silently shadows `on_failure`, permanently
    # dead-coding the skip_inflight route above. Leaving on_no unset lets it
    # fall back to on_failure's value ("route_refine_outcome"), which is correct for
    # every failure mode (crash, max_iterations, timeout, signal).
    # ENH-3607: on_failure routes through route_refine_outcome, which reads the
    # wrapper's run record; only RETRYABLE_ERROR:rate_limited diverts (to
    # finalize_rate_limited), every other token still reaches skip_inflight or
    # ledger_child_stop.
    # BUG-3390: no `fragment: with_rate_limit_handling` / `on_rate_limit_exhausted`
    # here — both are inert on a `loop:` call state. The inner loop's own rate-limit
    # handling writes refine-terminal-class=infra and a record carrying
    # rate_limit_exhausted, which prepare-issue forwards unchanged.
    loop: prepare-issue
    context_passthrough: true
    on_success: count_repair_cycle_refine
    on_failure: route_refine_outcome
    # ENH-2727: on_error fires when the wrapper itself raised a runtime exception / was
    # signalled (a crash — no refine verdict was produced), which is an infra-class,
    # re-runnable failure by the issue's own definition ("host CLI SIGTERM'd, OOM,
    # crash"). Route it straight to skip_inflight_infra (refine_failed_infra) so it is
    # NOT laundered as a quality failure. This is complementary to — not a substitute
    # for — the sentinel path on on_failure: the *evidenced* exit-143 case reaches the
    # sub-loop's `failed` terminal (on_no → on_failure → skip_inflight), where the
    # termination-class sentinel written by classify_terminal selects the reason. Do
    # NOT add on_no here (BUG-2611): compiled on_no must keep falling back to
    # on_failure (skip_inflight), the sentinel-driven path that catches the evidenced
    # kill.
    on_error: skip_inflight_infra

  route_refine_outcome:
    # ENH-3607: failure-path router over the child's typed run record. Tokens
    # match exactly (closed RUN_RECORD_TOKENS vocabulary). An exhausted 429 in the
    # child's spike/decision path halts the run like autodev's own routes;
    # everything else keeps the existing skip behavior.
    action: >-
      ll-issues run-record read ${captured.input.output:shell}
      --run-dir ${context.run_dir} --writer prepare-issue --format token
    action_type: shell
    evaluate:
      type: classify
    # ENH-3609: the child's own ledgered stops go to ledger_child_stop (no
    # autodev-skipped row; the child already ledgered them in its marker file).
    # No edge to check_passed / detect_children: a
    # failed child never reuses the success path (ENH-1679).
    route:
      RETRYABLE_ERROR:rate_limited: finalize_rate_limited
      RETRYABLE_ERROR:infra: skip_inflight_infra
      BLOCKED:decision_unresolved: ledger_child_stop
      BLOCKED:proposal_unsound: ledger_child_stop
      DEFERRED:spike_inconclusive: ledger_child_stop
      # ENH-3605 ledger-ownership rule: prepare-issue's forward_stop already wrote the
      # refine_failed row for these two, so skip_inflight would double-count them.
      BLOCKED:quality: ledger_child_stop
      DEFERRED:gate_unmet: ledger_child_stop
      READY: skip_inflight
      BLOCKED: skip_inflight
      DECOMPOSED: skip_inflight
      CANCELLED: skip_inflight
      MISSING: skip_inflight
      _: skip_inflight
      _error: skip_inflight

  ledger_child_stop:
    # ENH-3609: a child stop already ledgered in its own marker file
    # (decision_unresolved / proposal_unsound / spike_inconclusive). Clear the
    # in-flight sentinel and advance WITHOUT an autodev-skipped row so
    # finalize_done does not double-count it as refine_failed. Same rule as
    # skip_inflight's marker greps, keyed on the record token instead.
    action: |
      rm -f ${context.run_dir}/autodev-inflight
    fragment: queue_track
    action_type: shell
    next: dequeue_next
    on_error: dequeue_next

  skip_inflight:
    # ENH-1679: record the in-flight issue as skipped and clear the inflight
    # sentinel so `done` does not surface a stale warning. Reached when
    # refine-to-ready-issue exits via its `failed` terminal or the executor
    # receives a signal/crash (on_error). Mirrors the skip_and_continue pattern
    # in auto-refine-and-implement.yaml.
    # ENH-2404: two-space-delimited "ID  REASON" (matches rn-implement.yaml
    # mark_deferred), so finalize can distinguish failure reasons.
    #
    # ENH-2727: consult the sub-loop's termination-class sentinel
    # (${context.run_dir}/refine-terminal-class, written by refine-to-ready-issue's
    # classify_terminal). An infra-class kill (SIGTERM/OOM/timeout — exit
    # 143/137/124, re-runnable) routes to skip_inflight_infra (reason
    # refine_failed_infra); a genuine quality failure is ledgered HERE as
    # refine_failed. The classification lives INSIDE the skip path so
    # refine_current.on_failure reaches here via route_refine_outcome (ENH-3607;
    # every token but RETRYABLE_ERROR:rate_limited defaults to skip_inflight) and
    # its compiled on_no fallback is preserved (BUG-2611).
    # exit 0 (quality, already ledgered) → on_yes: dequeue_next; exit 1 (infra) →
    # on_no: skip_inflight_infra.
    action: |
      CLASS=quality
      if [ -f ${context.run_dir}/refine-terminal-class ]; then
        CLASS=$(cat ${context.run_dir}/refine-terminal-class 2>/dev/null || printf 'quality')
      fi
      if [ "$CLASS" = infra ]; then
        exit 1
      fi
      # ENH-3609: the three marker greps below are now the fallback for a MISSING
      # run record (a child stop whose `|| true` record write failed); a present
      # record routes to ledger_child_stop. ENH-3600 removes them with the markers.
      # BUG-3390: refine-to-ready-issue's record_decision_unresolved writes the ID
      # to autodev-decision-unresolved.txt and exits `failed` WITHOUT passing
      # through classify_terminal, so it lands here with no refine-terminal-class.
      # finalize_done already surfaces that ledger as Decision-unresolved; a
      # refine_failed line would double-count it under Skipped. -x: whole-line.
      ID="${captured.input.output}"  # ll-lint: mr11-ok(captured.input.output) BUG-3390 - ID bound once via quoted assignment
      if grep -qxF "$ID" ${context.run_dir}/autodev-decision-unresolved.txt 2>/dev/null; then
        echo "[DECISION_UNRESOLVED] $ID already ledgered by sub-loop; not counting as refine_failed"
        rm -f ${context.run_dir}/autodev-inflight
        exit 0
      fi
      # BUG-3593: same for a nested refine-to-ready spike_inconclusive stop — its
      # record_spike_inconclusive (child state) already deferred the issue and ledgered it.
      if grep -qxF "$ID" ${context.run_dir}/autodev-spike-inconclusive.txt 2>/dev/null; then
        echo "[SPIKE_INCONCLUSIVE] $ID already ledgered by sub-loop; not counting as refine_failed"
        rm -f ${context.run_dir}/autodev-inflight
        exit 0
      fi
      # BUG-3574: same for a nested refine-to-ready proposal_unsound stop.
      if grep -qxF "$ID" ${context.run_dir}/autodev-proposal-unsound.txt 2>/dev/null; then
        echo "[PROPOSAL_UNSOUND] $ID already ledgered by sub-loop; not counting as refine_failed"
        rm -f ${context.run_dir}/autodev-inflight
        exit 0
      fi
      echo "$ID  refine_failed" >> ${context.run_dir}/autodev-skipped.txt
      rm -f ${context.run_dir}/autodev-inflight
    fragment: shell_exit
    action_type: shell
    on_yes: dequeue_next
    on_no: skip_inflight_infra
    on_error: dequeue_next

  skip_inflight_infra:
    # ENH-2727: infra-class sibling of skip_inflight. Reached when the refine
    # sub-loop's termination-class sentinel reports `infra` — an external
    # SIGTERM/OOM/timeout kill (exit 143/137/124) that is re-runnable rather than a
    # genuine refine-quality defect. Ledgers `refine_failed_infra` (GATE_FAILED_INFRA
    # stem-suffix precedent, rn-remediate.yaml) so the `done` summary and downstream
    # triage (skipped_breakdown, deferred-triage) surface it as a separate,
    # re-runnable bucket instead of misattributing it as a quality failure (the
    # on_error == on_no laundering ENH-1679 left un-fixed). Clears autodev-inflight
    # like skip_inflight so BUG-1226's done-state warning is not triggered.
    action: |
      echo "${captured.input.output}  refine_failed_infra" >> ${context.run_dir}/autodev-skipped.txt  # ll-lint: mr11-ok(captured.input.output) ENH-3358 - ENH-3342 widening residual, tracked for conversion
      rm -f ${context.run_dir}/autodev-inflight
    fragment: queue_track
    action_type: shell
    next: dequeue_next
    on_error: dequeue_next

  count_repair_cycle_refine:
    # FEAT-2751: refine_current is one of the six repair-class states whose
    # success returns to the score-checking chain. Increment the per-issue
    # repair-cycle counter (reset at dequeue_next) so
    # recheck_after_size_review's stagnation backstop can distinguish "never
    # got a real remedy attempt" from "genuinely tried and still stuck".
    action: |
      N=$(cat ${context.run_dir}/autodev-repair-cycle-count.txt 2>/dev/null || echo 0)
      N=$((N + 1))
      printf '%s' "$N" > ${context.run_dir}/autodev-repair-cycle-count.txt
    action_type: shell
    next: copy_broke_down
    on_error: copy_broke_down

  copy_broke_down:
    # Handshake: refine-to-ready-issue writes ${context.run_dir}/refine-broke-down
    # (0 at resolve_issue start, 1 at write_broke_down) via context_passthrough.
    # Copy it into autodev's namespace so the rest of the state machine reads
    # autodev-* temp files consistently.
    action: |
      if [ -f ${context.run_dir}/refine-broke-down ]; then
        cp ${context.run_dir}/refine-broke-down ${context.run_dir}/autodev-broke-down
      else
        printf '0' > ${context.run_dir}/autodev-broke-down
      fi
    action_type: shell
    next: route_refine_success
    on_error: route_refine_success

  route_refine_success:
    # ENH-3609: success-path router over the child's typed run record. Tokens
    # match exactly, so every RUN_RECORD_TOKENS member is listed. READY and
    # unsuffixed BLOCKED (done, thresholds unmet) keep today's path so the
    # remediation ladder stays reachable via check_passed.on_no. MISSING / _ /
    # _error fail open to check_passed (a `|| true` record write may have failed
    # after a real done). Suffixed tokens cannot occur here; they fail safe.
    action: >-
      ll-issues run-record read ${captured.input.output:shell}
      --run-dir ${context.run_dir} --writer prepare-issue --format token
    action_type: shell
    evaluate:
      type: classify
    route:
      READY: check_passed
      BLOCKED: check_passed
      MISSING: check_passed
      DECOMPOSED: detect_children
      CANCELLED: skip_cancelled
      BLOCKED:decision_unresolved: skip_inflight
      BLOCKED:proposal_unsound: skip_inflight
      BLOCKED:quality: skip_inflight
      DEFERRED:gate_unmet: skip_inflight
      DEFERRED:spike_inconclusive: skip_inflight
      RETRYABLE_ERROR:infra: skip_inflight
      RETRYABLE_ERROR:rate_limited: skip_inflight
      _: check_passed
      _error: check_passed

  skip_cancelled:
    # ENH-3609: the child's record says the issue was cancelled during
    # refinement. Ledger `cancelled` and clear autodev-inflight (dequeue_next only
    # overwrites it when the queue is non-empty, so a last-issue cancel would
    # otherwise report inflight_unresolved). Not skip_already_resolved: that
    # stem means "closed before refinement".
    action: |
      echo "${captured.input.output}  cancelled" >> ${context.run_dir}/autodev-skipped.txt  # ll-lint: mr11-ok(captured.input.output) ENH-3358 - ENH-3342 widening residual, tracked for conversion
      rm -f ${context.run_dir}/autodev-inflight
    fragment: queue_track
    action_type: shell
    next: dequeue_next
    on_error: dequeue_next

  check_passed:
    # Verify confidence and outcome scores meet project thresholds. Even on
    # sub-loop success the issue may not have met thresholds —
    # refine-to-ready-issue can exit via breakdown_issue → done rather than a
    # genuine confidence pass. BUG-2908: records staged (not yet
    # closure-verified) issues in autodev-staged.txt — finalize_done promotes
    # only those it can verify closed to autodev-passed.txt.
    # and routes to implement_current to interleave implementation.
    action: |
      # ll-lint: mr11-ok(captured.input.output) ENH-3358 - ENH-3342 widening residual, tracked for conversion
      ll-issues check-readiness ${captured.input.output} \
        --readiness ${context.readiness_threshold:shell} \
        --outcome ${context.outcome_threshold:shell} \
        --honor-waiver \
        && echo "${captured.input.output}" >> ${context.run_dir}/autodev-staged.txt  # ll-lint: mr11-ok(captured.input.output) ENH-3358 - ENH-3342 widening residual, tracked for conversion
    # BUG-3588: exit 3 = scores absent. Reached after the refine-to-ready
    # sub-loop, which can break the issue down before scoring — absence is
    # legitimate here, so keep the pre-existing exit-1 path (→ detect_children).
    fragment: harness_exit
    on_yes: select_obligation_pre_implement
    on_no: select_obligation_post_refine
    on_cannot_judge: select_obligation_post_refine
    on_error: detect_children

  select_obligation_post_refine:
    # ENH-3610: post-refine obligation selector (check_passed.on_no /
    # .on_cannot_judge). Replaces triage_outcome_failure's decide leg: autodev
    # never resolves a decision itself — a still-set decision_needed flag sends
    # the issue back into refine-to-ready-issue (whose check_decision_before_done
    # and mid-chain gates own resolution). Probe order: `check-flag` first (valid
    # at any score state), then `next-obligation` (its DECISION predicate is the
    # same flag, so it cannot print DECISION here; it is present so ENH-3611 can
    # add PROOF:* routes). Re-entry is capped at one per issue
    # (autodev-reentry-DECISION-<ID>, cleared at dequeue_next) and by the lifetime
    # refine cap (BUG-3614: refine_count >= commands.max_refine_count, default 5);
    # either term routes DECISION_EXHAUSTED → record_reentry_exhausted. `_error`
    # copies triage_outcome_failure.on_error (detect_children).
    action: |
      ID=${captured.input.output:shell}
      # ENH-3611: refine_count / lifetime cap read once (BUG-3614 snippet). The child's
      # check_lifetime_limit routes a capped issue to breakdown_issue, so no re-entry
      # (DECISION or PROOF) is attempted at the cap; unreadable values fall back to 0/5.
      CNT=$(ll-issues refine-status "$ID" --json 2>/dev/null | python3 -c 'import json,sys; print(int(json.load(sys.stdin).get("refine_count", 0)))' 2>/dev/null || echo 0)
      CAP=$(python3 -c 'import json; print(int(json.load(open(".ll/ll-config.json")).get("commands", {}).get("max_refine_count", 5)))' 2>/dev/null || echo 5)
      [ -z "$CNT" ] && CNT=0
      [ -z "$CAP" ] && CAP=5
      ll-issues check-flag "$ID" decision_needed
      RC=$?
      if [ "$RC" -eq 0 ]; then
        # Flag set: never run next-obligation (it reports NONE once scores pass).
        # Un-stage first (grep -vxF idiom from mark_not_started): every
        # pre-implement placement site appends the ID to autodev-staged.txt
        # before this selector runs.
        if [ -f "${context.run_dir}/autodev-staged.txt" ]; then
          grep -vxF "$ID" "${context.run_dir}/autodev-staged.txt" \
            > "${context.run_dir}/autodev-staged.tmp" 2>/dev/null || true
          mv "${context.run_dir}/autodev-staged.tmp" "${context.run_dir}/autodev-staged.txt"
        fi
        # BUG-3614: lifetime-cap term (CNT/CAP read above), evaluated before the marker write.
        if [ "$CNT" -ge "$CAP" ] 2>/dev/null; then
          echo "[DECISION_CAPPED] $ID refine_count=$CNT cap=$CAP" >&2
          echo "DECISION_EXHAUSTED"
          exit 0
        fi
        F="${context.run_dir}/autodev-reentry-DECISION-$ID"
        N=$(cat "$F" 2>/dev/null || echo 0)
        if [ "$N" -ge 1 ] 2>/dev/null; then
          echo "DECISION_EXHAUSTED"
        else
          printf '%s' "$((N + 1))" > "$F"
          echo "DECISION"
        fi
        exit 0
      fi
      TOK=$(ll-issues next-obligation "$ID" --format token \
        --readiness-threshold ${context.readiness_threshold:shell} \
        --outcome-threshold ${context.outcome_threshold:shell} \
        --honor-waiver --skip FORMAT --skip VERIFY --skip HEDGES --skip PLACEHOLDERS --skip ACCEPTANCE_CRITERIA --skip DESIGN); RC=$?
      # ENH-3611: any PROOF:* token is a re-entry candidate; the sub-reason is
      # worst-status-wins across registry targets, so decide from the spike flags.
      case "$TOK" in
        PROOF*)
          SPIKE_N=$(cat "${context.run_dir}/spike-runs-$ID" 2>/dev/null || echo 0)
          F="${context.run_dir}/autodev-reentry-PROOF-$ID"
          ll-issues check-flag "$ID" spike_needed >/dev/null 2>&1; NEEDED=$?
          ll-issues check-flag "$ID" spike_attempted >/dev/null 2>&1; ATT=$?
          if [ "$NEEDED" -eq 0 ] && [ "$ATT" -eq 1 ] && [ "$SPIKE_N" -lt 2 ] 2>/dev/null \
             && [ ! -e "$F" ] && [ "$CNT" -lt "$CAP" ] 2>/dev/null; then
            if [ -f "${context.run_dir}/autodev-staged.txt" ]; then
              grep -vxF "$ID" "${context.run_dir}/autodev-staged.txt" \
                > "${context.run_dir}/autodev-staged.tmp" 2>/dev/null || true
              mv "${context.run_dir}/autodev-staged.tmp" "${context.run_dir}/autodev-staged.txt"
            fi
            printf '1' > "$F"
            echo "PROOF"
            exit 0
          fi
          ;;
      esac
      printf '%s\n' "$TOK"
      exit "$RC"
    action_type: shell
    evaluate:
      type: classify
    route:
      DECISION: refine_current
      DECISION_EXHAUSTED: record_reentry_exhausted
      PROOF: refine_current  # ENH-3611
      _: check_missing_artifacts
      _error: detect_children

  select_obligation_pre_implement:
    # ENH-3610: pre-implement obligation selector, shared by the five score-pass
    # sites (check_passed.on_yes, recheck_scores.on_yes,
    # recheck_after_size_review.on_yes, regate_after_atomic_remediation.on_yes,
    # reopen_waived.next). Replaces decide_current: `check-flag` runs first
    # because next-obligation returns NONE once scores pass. On DECISION /
    # DECISION_EXHAUSTED the ID is un-staged (all five sites append it to
    # autodev-staged.txt before this state runs) so a re-entry that defers never
    # lands in autodev-unverified.txt. `_` / `_error` go to the fail-closed proof
    # gate (BUG-3603), the removed decide_current's on_no / on_error target.
    action: |
      ID=${captured.input.output:shell}
      # ENH-3611: refine_count / lifetime cap read once (BUG-3614 snippet). The child's
      # check_lifetime_limit routes a capped issue to breakdown_issue, so no re-entry
      # (DECISION or PROOF) is attempted at the cap; unreadable values fall back to 0/5.
      CNT=$(ll-issues refine-status "$ID" --json 2>/dev/null | python3 -c 'import json,sys; print(int(json.load(sys.stdin).get("refine_count", 0)))' 2>/dev/null || echo 0)
      CAP=$(python3 -c 'import json; print(int(json.load(open(".ll/ll-config.json")).get("commands", {}).get("max_refine_count", 5)))' 2>/dev/null || echo 5)
      [ -z "$CNT" ] && CNT=0
      [ -z "$CAP" ] && CAP=5
      ll-issues check-flag "$ID" decision_needed
      RC=$?
      if [ "$RC" -eq 0 ]; then
        # Flag set: never run next-obligation (it reports NONE once scores pass).
        # Un-stage first (grep -vxF idiom from mark_not_started): every
        # pre-implement placement site appends the ID to autodev-staged.txt
        # before this selector runs.
        if [ -f "${context.run_dir}/autodev-staged.txt" ]; then
          grep -vxF "$ID" "${context.run_dir}/autodev-staged.txt" \
            > "${context.run_dir}/autodev-staged.tmp" 2>/dev/null || true
          mv "${context.run_dir}/autodev-staged.tmp" "${context.run_dir}/autodev-staged.txt"
        fi
        # BUG-3614: lifetime-cap term (CNT/CAP read above), evaluated before the marker write.
        if [ "$CNT" -ge "$CAP" ] 2>/dev/null; then
          echo "[DECISION_CAPPED] $ID refine_count=$CNT cap=$CAP" >&2
          echo "DECISION_EXHAUSTED"
          exit 0
        fi
        F="${context.run_dir}/autodev-reentry-DECISION-$ID"
        N=$(cat "$F" 2>/dev/null || echo 0)
        if [ "$N" -ge 1 ] 2>/dev/null; then
          echo "DECISION_EXHAUSTED"
        else
          printf '%s' "$((N + 1))" > "$F"
          echo "DECISION"
        fi
        exit 0
      fi
      # ENH-3611: scores pass, so next-obligation never reports PROOF (tier 3 needs a
      # low outcome); probe check-gate directly. Re-enter only a non-waived issue (the
      # child's route_score_obligation does not honor outcome_gate_waived, so a waived
      # re-entry would reach breakdown_issue). Any other verdict or helper error falls
      # through; the fail-closed check_proof_defer_or_implement defers it.
      GATE=$(ll-issues check-gate "$ID" 2>/dev/null) || GATE=""
      if [ "$GATE" = "structured_proof" ]; then
        SPIKE_N=$(cat "${context.run_dir}/spike-runs-$ID" 2>/dev/null || echo 0)
        F="${context.run_dir}/autodev-reentry-PROOF-$ID"
        ll-issues check-flag "$ID" spike_attempted >/dev/null 2>&1; ATT=$?
        ll-issues check-flag "$ID" outcome_gate_waived >/dev/null 2>&1; WAIVED=$?
        if [ "$ATT" -eq 1 ] && [ "$WAIVED" -eq 1 ] && [ "$SPIKE_N" -lt 2 ] 2>/dev/null \
           && [ ! -e "$F" ] && [ "$CNT" -lt "$CAP" ] 2>/dev/null; then
          if [ -f "${context.run_dir}/autodev-staged.txt" ]; then
            grep -vxF "$ID" "${context.run_dir}/autodev-staged.txt" \
              > "${context.run_dir}/autodev-staged.tmp" 2>/dev/null || true
            mv "${context.run_dir}/autodev-staged.tmp" "${context.run_dir}/autodev-staged.txt"
          fi
          printf '1' > "$F"
          echo "PROOF"
          exit 0
        fi
      fi
      ll-issues next-obligation "$ID" --format token \
        --readiness-threshold ${context.readiness_threshold:shell} \
        --outcome-threshold ${context.outcome_threshold:shell} \
        --honor-waiver
    action_type: shell
    evaluate:
      type: classify
    route:
      DECISION: refine_current
      DECISION_EXHAUSTED: record_reentry_exhausted
      PROOF: refine_current  # ENH-3611
      _: check_proof_defer_or_implement
      _error: check_proof_defer_or_implement

  select_obligation_post_size_review:
    # ENH-3611: post-size-review obligation selector (check_parent_resolved_post_size_review
    # on_no / on_error). The last chance to spike before the post-size-review skip:
    # re-enters refine-to-ready-issue on PROOF:* only when the child's low-outcome band
    # can actually spike (spike_needed set, spike_attempted unset) plus the shared guard
    # (spike-runs-<ID> < 2, autodev-reentry-PROOF-<ID> unused, refine_count < lifetime
    # cap). No decision_needed probe: next-obligation checks DECISION before PROOF and
    # DECISION falls to `_`, so recheck_after_size_review's ENH-2936 branch keeps that case.
    # --honor-waiver and the six tier-1 skips as in select_obligation_post_refine. Un-stage
    # is defensive (an earlier pass may have staged the ID).
    action: |
      ID=${captured.input.output:shell}
      # ENH-3611: refine_count / lifetime cap read once (BUG-3614 snippet). The child's
      # check_lifetime_limit routes a capped issue to breakdown_issue, so no re-entry
      # (DECISION or PROOF) is attempted at the cap; unreadable values fall back to 0/5.
      CNT=$(ll-issues refine-status "$ID" --json 2>/dev/null | python3 -c 'import json,sys; print(int(json.load(sys.stdin).get("refine_count", 0)))' 2>/dev/null || echo 0)
      CAP=$(python3 -c 'import json; print(int(json.load(open(".ll/ll-config.json")).get("commands", {}).get("max_refine_count", 5)))' 2>/dev/null || echo 5)
      [ -z "$CNT" ] && CNT=0
      [ -z "$CAP" ] && CAP=5
      TOK=$(ll-issues next-obligation "$ID" --format token \
        --readiness-threshold ${context.readiness_threshold:shell} \
        --outcome-threshold ${context.outcome_threshold:shell} \
        --honor-waiver --skip FORMAT --skip VERIFY --skip HEDGES --skip PLACEHOLDERS --skip ACCEPTANCE_CRITERIA --skip DESIGN); RC=$?
      # ENH-3611: any PROOF:* token is a re-entry candidate; the sub-reason is
      # worst-status-wins across registry targets, so decide from the spike flags.
      case "$TOK" in
        PROOF*)
          SPIKE_N=$(cat "${context.run_dir}/spike-runs-$ID" 2>/dev/null || echo 0)
          F="${context.run_dir}/autodev-reentry-PROOF-$ID"
          ll-issues check-flag "$ID" spike_needed >/dev/null 2>&1; NEEDED=$?
          ll-issues check-flag "$ID" spike_attempted >/dev/null 2>&1; ATT=$?
          if [ "$NEEDED" -eq 0 ] && [ "$ATT" -eq 1 ] && [ "$SPIKE_N" -lt 2 ] 2>/dev/null \
             && [ ! -e "$F" ] && [ "$CNT" -lt "$CAP" ] 2>/dev/null; then
            if [ -f "${context.run_dir}/autodev-staged.txt" ]; then
              grep -vxF "$ID" "${context.run_dir}/autodev-staged.txt" \
                > "${context.run_dir}/autodev-staged.tmp" 2>/dev/null || true
              mv "${context.run_dir}/autodev-staged.tmp" "${context.run_dir}/autodev-staged.txt"
            fi
            printf '1' > "$F"
            echo "PROOF"
            exit 0
          fi
          ;;
      esac
      printf '%s\n' "$TOK"
      exit "$RC"
    action_type: shell
    evaluate:
      type: classify
    route:
      PROOF: refine_current
      _: check_reconcile_needed  # ENH-3611: was check_spike_needed_before_skip (removed)
      _error: recheck_after_size_review

  record_reentry_exhausted:
    # ENH-3610: the obligation selectors' re-entry cap fired (the child was
    # re-entered once for the obligation and the flag is still set). Same shape
    # as recheck_after_size_review's decision branch (ENH-2936): ledger
    # `decision_unresolved`, clear inflight, defer via set-status (BUG-2729
    # guard leaves a done/completed/cancelled issue unchanged), advance.
    # Not skip_inflight (ledgers refine_failed, does not defer, so every run
    # would re-pick the issue). DECISION-only (ENH-3611: PROOF falls through the selectors' `_` route instead;
    # an open gate defers as blocked_by_gate via check_proof_defer_or_implement).
    action: |
      ID=${captured.input.output:shell}
      echo "$ID  decision_unresolved" >> ${context.run_dir}/autodev-skipped.txt
      rm -f ${context.run_dir}/autodev-inflight
      STATUS=$(ll-issues show "$ID" --json 2>/dev/null \
        | python3 -c "import json,sys; print((json.load(sys.stdin).get('status') or '').lower())" \
        2>/dev/null || echo "")
      if [ "$STATUS" = "done" ] || [ "$STATUS" = "completed" ] || [ "$STATUS" = "cancelled" ]; then
        echo "[SKIP-DEFER] $ID already $STATUS; leaving status untouched"
      else
        ll-issues set-status "$ID" deferred --by automation --reason decision_unresolved 2>/dev/null || true
        echo "[DECISION_UNRESOLVED] $ID — decision still needed after child re-entry; deferred"
      fi
    action_type: shell
    next: dequeue_next
    on_error: dequeue_next

  check_proof_defer_or_implement:
    # ENH-3575/ENH-3611: the only proof stage before implement_current (the spike
    # half, check_proof_gate_before_implement, was removed in ENH-3611; the child's
    # check_proof_before_done and the selectors' PROOF re-entry own the spike).
    # BUG-3603: fail-closed via classify routing — PROOF_CLEAR (a successful
    # check-gate call reporting no gate in force: none/structured_satisfied) is
    # the ONLY route to implement_current; prose joins structured_open/
    # structured_proof in PROOF_DEFER; helper failures and evaluator errors
    # (including any non-zero action exit, which the classify evaluator maps to
    # _error) route to the mark_proof_gate_infra deferral.
    action: |
      ID=${captured.input.output:shell}
      VERDICT=$(ll-issues check-gate "$ID" 2>/dev/null); RC=$?
      if [ "$RC" -ge 2 ] || [ -z "$VERDICT" ]; then
        echo "PROOF_INFRA"
      else
        case "$VERDICT" in
          structured_open|structured_proof|prose) echo "PROOF_DEFER" ;;
          none|structured_satisfied) echo "PROOF_CLEAR" ;;
          *) echo "PROOF_INFRA" ;;
        esac
      fi
    action_type: shell
    evaluate:
      type: classify
    route:
      PROOF_DEFER: defer_gated
      PROOF_CLEAR: implement_current
      PROOF_INFRA: mark_proof_gate_infra
      _: mark_proof_gate_infra
      _error: mark_proof_gate_infra

  run_wire:
    # Run /ll:wire-issue to resolve absent files or unwired integration points
    # identified by the missing_artifacts flag. Chains to run_refine so that
    # codebase context is filled in even when wiring alone is insufficient.
    fragment: with_rate_limit_handling
    action: "/ll:wire-issue ${captured.input.output} --auto"
    action_type: slash_command
    pruning_profile:
      enabled: true
      name: wire-issue-auto
      suppress_claude_md: true
    next: count_repair_cycle_wire
    on_error: count_repair_cycle_wire
    on_rate_limit_exhausted: finalize_rate_limited

  count_repair_cycle_wire:
    # FEAT-2751: run_wire is one of the six repair-class states counted
    # toward the stagnation backstop threshold (see count_repair_cycle_refine).
    action: |
      N=$(cat ${context.run_dir}/autodev-repair-cycle-count.txt 2>/dev/null || echo 0)
      N=$((N + 1))
      printf '%s' "$N" > ${context.run_dir}/autodev-repair-cycle-count.txt
    action_type: shell
    next: run_refine
    on_error: run_refine

  run_refine:
    # Run /ll:refine-issue to fill in missing codebase context when wiring alone
    # is insufficient. on_error falls through to rerun_confidence_after_wire safely.
    # ENH-2247 (mirrors rn-remediate refine_followup): this is a post-wire repair
    # pass — run_wire just edited the issue's integration points, so use additive
    # --gap-analysis (never removes content, does not consume refine budget) rather
    # than the destructive --full-rewrite, which could bulldoze the wiring changes
    # this branch exists to apply.
    fragment: with_rate_limit_handling
    action: "/ll:refine-issue ${captured.input.output} --auto --gap-analysis"
    action_type: slash_command
    pruning_profile:
      enabled: true
      name: refine-issue-repair
      suppress_claude_md: true
    next: clear_scores_before_wire
    on_error: clear_scores_before_wire
    on_rate_limit_exhausted: finalize_rate_limited

  rerun_confidence_after_wire:
    # After run_wire → run_refine repairs a wiring gap, frontmatter scores still hold
    # pre-repair values. Re-run confidence-check so enqueue_or_skip /
    # recheck_after_size_review evaluate fresh scores — mirrors
    # rerun_confidence_after_reconcile (BUG-1491).
    fragment: with_rate_limit_handling
    action: "/ll:confidence-check ${captured.input.output}"
    action_type: slash_command
    pruning_profile:
      enabled: true
      name: confidence-check-recheck
      suppress_claude_md: true
    next: check_scores_present_wire
    on_error: check_scores_present_wire
    on_rate_limit_exhausted: finalize_rate_limited

  clear_scores_before_wire:
    # BUG-3588: clear stale pre-repair scores immediately before the rescoring, so
    # the successor can only ever read scores the rescoring itself wrote. Cannot
    # live in the rerun state's action (slash command under with_rate_limit_handling).
    # Clearing an already-cleared issue is a no-op. A failed clear leaves stale
    # scores in place, which is exactly what this guards against — so infra.
    action: 'll-issues set-scores ${captured.input.output:shell} --clear'
    action_type: shell
    next: rerun_confidence_after_wire
    on_error: mark_scores_absent_infra

  check_scores_present_wire:
    # BUG-3588: presence gate for rerun_confidence_after_wire. Both scores
    # non-null → proceed to enqueue_or_skip. First miss → retry the rescoring once (the
    # dominant no-write cause is the model skipping `ll-issues set-scores`);
    # second miss → exit 3 → infra. The retry marker is per issue and cleared
    # here on a pass and at dequeue_next.
    action: |
      ID=${captured.input.output:shell}
      MARK=${context.run_dir}/autodev-rescore-retry-wire-$ID
      ABSENT=$(ll-issues show "$ID" --json 2>/dev/null | python3 -c "
      import json, sys
      d = json.load(sys.stdin)
      print('true' if d.get('confidence') is None or d.get('outcome') is None else 'false')" 2>/dev/null || echo true)
      if [ "$ABSENT" = "false" ]; then
        rm -f "$MARK"
        exit 0
      fi
      if [ ! -f "$MARK" ]; then
        touch "$MARK"
        echo "[RESCORE_RETRY] $ID — rescoring wrote no scores; retrying once"
        exit 1
      fi
      exit 3
    fragment: harness_exit
    on_yes: enqueue_or_skip
    on_no: rerun_confidence_after_wire
    on_cannot_judge: mark_scores_absent_infra
    on_error: mark_scores_absent_infra

  implement_current:
    # Interleaved implementation: as soon as a leaf passes refinement, run
    # ll-auto --only against it. Exit 0 (on_yes) → dequeue_next for next
    # queued issue. Exit non-zero → check_impl_auth to detect auth failures
    # before deciding whether to drain the queue or abort.
    fragment: shell_exit
    capture: ll_auto_output
    action: |
      # BUG-1870: re-queue any stale inflight issue left by a prior context handoff.
      # On resume, init is bypassed so autodev-inflight may hold an issue that was
      # dequeued-but-not-yet-implemented when the previous session was interrupted.
      # The $INFLIGHT != $CURRENT guard makes this a no-op on normal (non-resumed) runs.
      INFLIGHT=$(cat "${context.run_dir}/autodev-inflight" 2>/dev/null | tr -d '[:space:]')
      CURRENT="${captured.input.output}"  # ll-lint: mr11-ok(captured.input.output) ENH-3358 - ENH-3342 widening residual, tracked for conversion
      if [ -n "$INFLIGHT" ] && [ "$INFLIGHT" != "$CURRENT" ]; then
        INFLIGHT_FILE=$(ll-issues path "$INFLIGHT" 2>/dev/null)
        STATUS="open"
        if [ -n "$INFLIGHT_FILE" ]; then
          STATUS=$(grep '^status:' "$INFLIGHT_FILE" | awk '{print $2}' | tr -d "'\"" 2>/dev/null || echo "open")
        fi
        if [ "$STATUS" != "done" ] && [ "$STATUS" != "cancelled" ]; then
          { echo "$INFLIGHT"; cat "${context.run_dir}/autodev-queue.txt" 2>/dev/null; } \
            > "${context.run_dir}/autodev-queue.tmp" \
            && mv "${context.run_dir}/autodev-queue.tmp" "${context.run_dir}/autodev-queue.txt"
        fi
      fi
      # Learning-gate skip parity: append --skip-learning-gate when the caller set
      # the skip_learning_gate context (mirrors `ll-auto --skip-learning-gate`).
      SKIP_FLAG=""
      if [ -n "${context.skip_learning_gate}" ]; then  # ll-lint: mr11-ok(context.skip_learning_gate) ENH-3358 - ENH-3342 widening residual, tracked for conversion
        SKIP_FLAG="--skip-learning-gate"
      fi
      # BUG-2594: tee to a run-dir file rather than relying solely on the
      # `capture:` value, so the learning-gate/auth-check fragments can grep a
      # file instead of interpolating untrusted Markdown into a shell string.
      # `set -o pipefail` preserves ll-auto's exit code through the `tee` pipe.
      # FEAT-3573: snapshot the base revision and the pre-existing dirty set BEFORE
      # ll-auto runs — a later snapshot already contains the deliverable (BUG-2963).
      # route_quality_gate diffs against these to scope the format stage.
      QDIR="${context.run_dir}/quality"
      mkdir -p "$QDIR"
      git rev-parse HEAD > "$QDIR/$CURRENT.base" 2>/dev/null || true
      { git diff --name-only HEAD; git ls-files --others --exclude-standard; } 2>/dev/null \
        | sort -u > "$QDIR/$CURRENT.base-dirty" || true
      set -o pipefail
      ll-auto --only "$CURRENT" $SKIP_FLAG 2>&1 | tee "${context.run_dir}/ll_auto_last.txt"
    action_type: shell
    on_yes: verify_impl_closed
    on_no: check_impl_reached
    on_error: check_impl_reached

  verify_impl_closed:
    # BUG-3390: `ll-auto --only` exits 0 on "Issues processed: 0" (dependency
    # cycle — postmortems/audit-loop-run-autodev-2026-07-29T013824.md) and other
    # no-ops, so exit 0 is not closure. Re-read status the way finalize_done
    # does and ledger a not-closed exit-0 NOW with a reason (finalize would only
    # discover it at the end, reason-less). Clear autodev-inflight on BOTH
    # branches — the success path never cleared it, leaving a stale BUG-1226
    # sentinel at terminal on clean runs. The ID stays in autodev-staged.txt
    # (it did stage); finalize_done dedupes against the reasoned line.
    action: |
      ID="${captured.input.output}"  # ll-lint: mr11-ok(captured.input.output) BUG-3390 - ID bound once via quoted assignment
      STATUS=$(ll-issues show "$ID" --json 2>/dev/null \
        | python3 -c "import json,sys; print((json.load(sys.stdin).get('status') or '').lower())" \
        2>/dev/null || echo "")
      rm -f ${context.run_dir}/autodev-inflight
      case "$STATUS" in
        done|completed|cancelled)
          echo "[IMPL-CLOSED] $ID $STATUS"
          exit 0 ;;
        *)
          if ! grep -qE "^$ID([[:space:]]|$)" ${context.run_dir}/autodev-unverified.txt 2>/dev/null; then
            echo "$ID  impl_exit0_not_closed" >> ${context.run_dir}/autodev-unverified.txt
          fi
          echo "[IMPL-NOT-CLOSED] $ID: ll-auto exited 0 but status is '$STATUS'; ledgered as unverified"
          exit 1 ;;
      esac
    fragment: shell_exit
    action_type: shell
    on_yes: route_quality_gate
    on_no: dequeue_next
    on_error: dequeue_next

  route_quality_gate:
    # FEAT-3573: decide whether the closure just verified needs the quality gate,
    # and compute the changed-file set the format stage is scoped to. Exit 1 →
    # dequeue_next: the gate is disabled (quality_gate=false) or the closure was
    # `cancelled` (nothing was implemented). Exit 2 (no recorded base revision, git
    # failure) → mark_quality_infra. verify_impl_closed already cleared
    # autodev-inflight, so this chain sits outside the inflight-clearing chain.
    #
    # Changed set = committed diff <base>..HEAD, plus uncommitted tracked changes and
    # untracked files MINUS the pre-existing dirty set snapshotted before ll-auto
    # (the operator's WIP is not the deliverable; mirrors BUG-2963). Deleted files
    # are dropped (--diff-filter=d). The format stage gets the subset matching
    # project.format_check_extensions (unset = every file).
    action: |
      ID=${captured.input.output:shell}
      QDIR=${context.run_dir}/quality
      mkdir -p "$QDIR"
      rm -f "$QDIR/$ID.json" "$QDIR/$ID.route"
      GATE=$(printf '%s' ${context.quality_gate:shell:default=true} | tr '[:upper:]' '[:lower:]')
      case "$GATE" in
        false|0|no|off)
          echo "[QUALITY-GATE] $ID: disabled (quality_gate=$GATE) — status-only closure credit"
          exit 1 ;;
      esac
      STATUS=$(ll-issues show "$ID" --json 2>/dev/null \
        | python3 -c "import json,sys; print((json.load(sys.stdin).get('status') or '').lower())" \
        2>/dev/null || echo "")
      if [ "$STATUS" = cancelled ]; then
        echo "[QUALITY-GATE] $ID: cancelled closure — nothing implemented, gate skipped"
        exit 1
      fi
      BASE=$(tr -d '[:space:]' < "$QDIR/$ID.base" 2>/dev/null || true)
      if [ -z "$BASE" ]; then
        echo "[QUALITY-GATE] $ID: no base revision recorded before implement_current" >&2
        exit 2
      fi
      [ -f "$QDIR/$ID.base-dirty" ] || : > "$QDIR/$ID.base-dirty"
      COMMITTED=$(git diff --name-only --diff-filter=d "$BASE..HEAD") || exit 2
      UNCOMMITTED=$({ git diff --name-only --diff-filter=d HEAD; git ls-files --others --exclude-standard; } \
        | sort -u | grep -vxFf "$QDIR/$ID.base-dirty" || true)
      printf '%s\n' "$UNCOMMITTED" | grep -v '^$' > "$QDIR/$ID.dirtyset" || true
      { printf '%s\n' "$COMMITTED"; printf '%s\n' "$UNCOMMITTED"; } \
        | grep -v '^$' | sort -u > "$QDIR/$ID.changed" || true
      EXTS=$(ll-config get project.format_check_extensions 2>/dev/null || true)
      LL_ARG_EXTS="$EXTS" python3 -c "
      import ast, json, os, sys
      raw = os.environ.get('LL_ARG_EXTS', '').strip()
      exts = []
      if raw:
          try:
              exts = json.loads(raw)
          except ValueError:
              try:
                  exts = ast.literal_eval(raw)
              except (ValueError, SyntaxError):
                  exts = []
      exts = tuple(exts) if isinstance(exts, (list, tuple)) else ()
      files = [l.strip() for l in open(sys.argv[1]) if l.strip()]
      keep = [f for f in files if not exts or f.endswith(exts)]
      open(sys.argv[2], 'w').write(''.join(f + chr(10) for f in keep))
      " "$QDIR/$ID.changed" "$QDIR/$ID.format-files" || exit 2
      echo "[QUALITY-GATE] $ID: gating $(grep -c . "$QDIR/$ID.changed" || true) changed file(s) against base $BASE"
      exit 0
    fragment: shell_exit
    on_yes: run_quality_gate
    on_no: dequeue_next
    on_error: mark_quality_infra

  run_quality_gate:
    # FEAT-3573: the deterministic post-implement verdict — oracles/code-run-gate
    # with its opt-in format stage (changed_files_path). resolve_via_ll_config makes
    # the oracle resolve test/lint/type/format-check commands (and src_dir) with
    # `ll-config get`, so .ll/ll.local.md overrides are honored. min_pass_rate 1.0 is
    # belt-and-braces: aggregate already fails on any non-zero test exit. The
    # credited verdict is this state's ROUTE, never the oracle's
    # subloop_outcome_<ID>.txt (resolve_commands pre-seeds GATE_PASS there).
    loop: oracles/code-run-gate
    with:
      issue_id: "${captured.input.output}"
      run_dir: "${context.run_dir}/quality/${captured.input.output}"
      min_pass_rate: 1.0
      changed_files_path: "${context.run_dir}/quality/${captured.input.output}.format-files"
      resolve_via_ll_config: "1"
    on_success: mark_quality_pass
    on_failure: mark_quality_fail
    on_error: mark_quality_infra

  mark_quality_pass:
    action_type: shell
    action: |
      printf 'pass' > ${context.run_dir}/quality/${captured.input.output:shell}.route
    next: record_quality_evidence
    on_error: dequeue_next

  mark_quality_fail:
    # An oracle that ends by timeout/signal/interrupt/step-budget routes on_failure
    # through the compiled on_no → on_failure fallback, which would misreport infra
    # as a quality verdict. Only terminated_by == "terminal" (the oracle reached its
    # own `failed` terminal) is a real gate failure; every other class is infra
    # (ENH-3366 delegate_failed precedent).
    action_type: shell
    action: |
      case ${captured.run_quality_gate.terminated_by:shell?} in
        terminal) ROUTE=fail ;;
        *) ROUTE=infra ;;
      esac
      printf '%s' "$ROUTE" > ${context.run_dir}/quality/${captured.input.output:shell}.route
    next: record_quality_evidence
    on_error: dequeue_next

  mark_quality_infra:
    # Oracle crash / context-resolution failure (sub-loop on_error), or
    # route_quality_gate could not compute the changed set.
    action_type: shell
    action: |
      mkdir -p ${context.run_dir}/quality
      printf 'infra' > ${context.run_dir}/quality/${captured.input.output:shell}.route
    next: record_quality_evidence
    on_error: dequeue_next

  record_quality_evidence:
    # FEAT-3573: write ${run_dir}/quality/<ID>.json — the evidence finalize_done
    # promotes on — and ledger a failed/infra gate as `ID  quality_gate_failed|
    # quality_gate_infra` in autodev-unverified.txt. The issue file is never
    # modified: a quality-failed issue stays `done` and committed. The verdict is
    # derived from the route (pass|fail|infra); stage outcomes are informational.
    # head_sha is recorded at gate time — finalize_done must not compare against the
    # live HEAD, which later queue items move.
    action_type: shell
    action: |
      LL_ARG_ID=${captured.input.output:shell} LL_ARG_RUN_DIR=${context.run_dir:shell} python3 - <<'PYEOF'
      import json
      import os
      import subprocess
      from pathlib import Path

      issue_id = os.environ["LL_ARG_ID"]
      run_dir = Path(os.environ["LL_ARG_RUN_DIR"])
      q = run_dir / "quality"
      oracle = q / issue_id

      def read(path):
          try:
              return Path(path).read_text().strip()
          except OSError:
              return ""

      def lines(path):
          return [x.strip() for x in read(path).splitlines() if x.strip()]

      route = read(q / f"{issue_id}.route")
      if route not in ("pass", "fail", "infra"):
          route = "infra"
      try:
          cmds = json.loads(read(oracle / "commands.json") or "{}")
      except ValueError:
          cmds = {}
      format_files = lines(q / f"{issue_id}.format-files")

      def stage(sidecar, cmd_key):
          text = read(oracle / sidecar)
          if not text:
              wanted = bool(cmds.get(cmd_key))
              if cmd_key == "format_check_cmd":
                  wanted = wanted and bool(format_files)
              return "absent" if wanted else "skip"
          if text.splitlines()[0].startswith("SKIP"):
              return "skip"
          rc = [x for x in text.splitlines() if x.startswith("exit_code=")]
          if not rc:
              return "killed"
          return "pass" if rc[-1] == "exit_code=0" else "fail"

      stages = {
          "format_check": stage("format-check.txt", "format_check_cmd"),
          "lint": stage("lint.txt", "lint_cmd"),
          "typecheck": stage("typecheck.txt", "typecheck_cmd"),
          "test": stage("test-results.txt", "test_cmd"),
      }
      prepatch = "absent"
      try:
          prepatch = json.loads(read(oracle / f"prepatch_evidence_{issue_id}.json")).get(
              "verdict", "absent"
          )
      except (ValueError, AttributeError):
          pass

      def git(*args):
          r = subprocess.run(["git", *args], capture_output=True, text=True)
          return r.stdout.strip() if r.returncode == 0 else ""

      base_sha = read(q / f"{issue_id}.base")
      history_base = None
      try:
          from little_loops.history_reader.runs import read_base_sha

          history_base = read_base_sha(issue_id)
      except Exception:
          pass

      if route == "fail":
          verdict = "GATE_FAILED"
      elif route == "infra":
          verdict = "GATE_INFRA"
      elif all(v == "skip" for v in stages.values()):
          verdict = "GATE_SKIP"
      else:
          verdict = "GATE_PASS"

      record = {
          "issue_id": issue_id,
          "base_sha": base_sha,
          "head_sha": git("rev-parse", "HEAD"),
          "dirty": bool(lines(q / f"{issue_id}.dirtyset")),
          "changed_files": lines(q / f"{issue_id}.changed"),
          "format_check": stages["format_check"],
          "lint": stages["lint"],
          "typecheck": stages["typecheck"],
          "test": stages["test"],
          "prepatch": prepatch,
          "route": route,
          "verdict": verdict,
      }
      if history_base and history_base != base_sha:
          record["history_base_sha"] = history_base
      (q / f"{issue_id}.json").write_text(json.dumps(record, indent=2) + "\n")

      reason = {"GATE_FAILED": "quality_gate_failed", "GATE_INFRA": "quality_gate_infra"}.get(verdict)
      if reason:
          ledger = run_dir / "autodev-unverified.txt"
          existing = read(ledger)
          if not any(x.split()[:1] == [issue_id] for x in existing.splitlines()):
              with ledger.open("a") as f:
                  f.write(f"{issue_id}  {reason}\n")
      print(f"[QUALITY-GATE] {issue_id}: {verdict} (route={route}) {stages}")
      PYEOF
    next: dequeue_next
    on_error: dequeue_next

  check_impl_reached:
    # ENH-2989: distinguishes "Phase 1 rejected, implementation never
    # attempted" (PHASE1_NOT_STARTED) from a genuine Phase 2 failure. Checked
    # BEFORE check_learning_gate/check_impl_auth: a Phase 1 rejection never
    # prints LEARNING_GATE_BLOCKED / IMPLEMENT_FAILED / the auth signatures,
    # so this ordering cannot steal a real failure from either downstream
    # check — it only catches the otherwise-unclassified case that used to
    # fall through to finalize_done and be reported as `phantom`.
    fragment: ll_auto_not_started_check
    on_yes: mark_not_started
    on_no: check_learning_gate
    on_error: check_learning_gate

  mark_not_started:
    # ENH-2989: terminal/requeue handling for a Phase 1 rejection. Mirrors
    # mark_gate_blocked's shape. Both the requeue and terminal paths remove
    # the ID from autodev-staged.txt and clear the inflight sentinel — a
    # requeued issue re-stages via check_passed on its second pass, so
    # decision #4's staged-removal must run every time this state fires, not
    # only on the terminal path.
    action_type: shell
    action: |
      ID="${captured.input.output}"  # ll-lint: mr11-ok(captured.input.output) ENH-3358 - ENH-3342 widening residual, tracked for conversion

      if [ -f "${context.run_dir}/autodev-staged.txt" ]; then
        grep -vxF "$ID" "${context.run_dir}/autodev-staged.txt" \
          > "${context.run_dir}/autodev-staged.tmp" 2>/dev/null || true
        mv "${context.run_dir}/autodev-staged.tmp" "${context.run_dir}/autodev-staged.txt"
      fi
      rm -f ${context.run_dir}/autodev-inflight

      # ll_auto_last.txt is overwritten per issue (tee, not tee -a), so this
      # grep needs no ID-scoping beyond the marker's own second field.
      REASON=$(grep -F "PHASE1_NOT_STARTED $ID " "${context.run_dir}/ll_auto_last.txt" 2>/dev/null \
        | tail -1 | awk '{print $3}')
      case "$REASON" in
        unknown|not_ready|blocked|close_failed|path_mismatch|confidence_gate) ;;
        # An empty or unrecognized reason must be treated as terminal, never
        # as unknown — defaulting a parse miss to "unknown" would re-queue on
        # exactly the signal-loss condition this issue exists to stop
        # misreporting.
        *) REASON="unparsed" ;;
      esac

      TERMINAL=1
      if [ "$REASON" = "unknown" ]; then
        ATTEMPTS=$(grep -F "$ID " "${context.run_dir}/autodev-not-started-attempts.txt" 2>/dev/null \
          | tail -1 | awk '{print $2}')
        case "$ATTEMPTS" in
          ''|*[!0-9]*) ATTEMPTS=0 ;;
        esac
        if [ "$ATTEMPTS" -lt 1 ]; then
          TERMINAL=0
          # Prepend to the head (decision #3b), not append to the tail, so the
          # retried issue is the next one dequeued.
          { echo "$ID"; cat "${context.run_dir}/autodev-queue.txt" 2>/dev/null; } \
            > "${context.run_dir}/autodev-queue.tmp" \
            && mv "${context.run_dir}/autodev-queue.tmp" "${context.run_dir}/autodev-queue.txt"
          NEW_ATTEMPTS=$((ATTEMPTS + 1))
          if [ -f "${context.run_dir}/autodev-not-started-attempts.txt" ]; then
            grep -v -F "$ID " "${context.run_dir}/autodev-not-started-attempts.txt" \
              > "${context.run_dir}/autodev-not-started-attempts.tmp" 2>/dev/null || true
            mv "${context.run_dir}/autodev-not-started-attempts.tmp" "${context.run_dir}/autodev-not-started-attempts.txt"
          fi
          echo "$ID $NEW_ATTEMPTS" >> "${context.run_dir}/autodev-not-started-attempts.txt"
        fi
      fi

      # decision #2b: write nothing to either ledger on the requeue pass —
      # only a terminal classification (deterministic reason on first sight,
      # or unknown with attempts exhausted) is ledgered.
      if [ "$TERMINAL" = "1" ]; then
        echo "$ID  $REASON" >> ${context.run_dir}/autodev-not-started.txt
        echo "$ID  notstarted_$REASON" >> ${context.run_dir}/autodev-skipped.txt
      fi
    next: dequeue_next
    on_error: dequeue_next

  check_learning_gate:
    # Learning-gate consistency: a gate block (ENH-2319, marker LEARNING_GATE_BLOCKED
    # printed by process_issue_inplace) exits 1 from `ll-auto --only`, which would
    # otherwise be laundered into a generic implementation failure / auth check.
    # Detect it FIRST and record it distinctly so the run summary can tell a
    # gate block (remedy: /ll:explore-api) from a real failure. on_no falls through
    # to the infra discriminator (ENH-3084) before the auth check (mirrors
    # rn-remediate's ordering for cross-loop parity).
    # on_error (BUG-2594): a residual shell fault reading the run-dir file (e.g.
    # permission error) must not crash the loop — degrade to the auth check.
    fragment: ll_auto_learning_gate_check
    on_yes: mark_gate_blocked
    on_no: check_learning_gate_infra
    on_error: check_impl_auth

  check_learning_gate_infra:
    # ENH-3084: ll_auto_learning_gate_check emits GATE_INFRA (not GATE_BLOCKED) when
    # the inner `ll-auto --only` could not run the gate at all (scope-lock contention,
    # missing binary, wedged child). Its GATE_BLOCKED evaluate pattern does not match
    # GATE_INFRA, so this discriminator tells it apart from a clean OK and routes to a
    # distinct record (mark_gate_infra) rather than deferring the issue as gate_blocked
    # with the wrong reason/message. on_no/on_error degrade to the auth check.
    fragment: ll_auto_learning_gate_infra_check
    on_yes: mark_gate_infra
    on_no: check_impl_auth
    on_error: check_impl_auth

  mark_gate_infra:
    # ENH-3084: the learning gate could not run (infra contention/crash), so nothing
    # was implemented. Record it distinctly from a gate block and advance the queue —
    # do NOT defer as gate_blocked (the unproven-deps remedy is the wrong reason for a
    # transient infra condition) and do NOT burn a remediation cycle. The issue stays
    # in place to be retried on a later run.
    action: |
      ID="${captured.input.output}"  # ll-lint: mr11-ok(captured.input.output) ENH-3358 - ENH-3342 widening residual, tracked for conversion
      echo "$ID" >> ${context.run_dir}/autodev-gate-infra.txt
      rm -f ${context.run_dir}/autodev-inflight
      echo "[GATE_INFRA_FAILED] $ID — learning gate could not run (scope-lock contention, missing binary, or wedged child); retry later"
    action_type: shell
    next: dequeue_next
    on_error: dequeue_next

  mark_scores_absent_infra:
    # BUG-3588: a post-repair rescoring wrote no scores (after one retry), so no
    # gate could judge the issue. Record it distinctly from the learning-gate
    # record (autodev-gate-infra.txt) and advance the queue — do NOT defer: an
    # infra failure is not a quality verdict (low_readiness), and the issue is
    # left in place to be retried on a later run.
    action: |
      ID=${captured.input.output:shell}
      echo "$ID" >> ${context.run_dir}/autodev-scores-absent.txt
      rm -f ${context.run_dir}/autodev-inflight
      echo "[SCORES_ABSENT] $ID — confidence-check wrote no scores after repair; not deferred, retry later"
    action_type: shell
    next: dequeue_next
    on_error: dequeue_next

  mark_proof_gate_infra:
    # BUG-3603: the pre-implement check-gate call could not produce a verdict
    # (crash, unresolvable ID, unrecognised output) — infra, not a quality
    # verdict. Modeled on mark_gate_infra / mark_scores_absent_infra: ledger to
    # its own per-reason file, clear inflight, advance the queue, do NOT defer
    # (blocked_by_gate would fabricate a reason the helper never established)
    # and never reach implement_current. The issue is retried on a later run,
    # where the gate runs again.
    action: |
      ID=${captured.input.output:shell}
      echo "$ID" >> ${context.run_dir}/autodev-proof-gate-infra.txt
      rm -f ${context.run_dir}/autodev-inflight
      echo "[PROOF_GATE_INFRA] $ID — check-gate produced no verdict before implement; not deferred, retry later"
    action_type: shell
    next: dequeue_next
    on_error: dequeue_next

  mark_gate_blocked:
    # Record the gate-blocked issue distinctly and advance the queue. ENH-2666:
    # deferred via the same set-status transition rn-implement's mark_deferred
    # uses, so the issue leaves active selection and re-surfaces via
    # FEAT-2665's triage surface once its external-API deps are proven, rather
    # than being retried every run.
    action: |
      ID="${captured.input.output}"  # ll-lint: mr11-ok(captured.input.output) ENH-3358 - ENH-3342 widening residual, tracked for conversion
      echo "$ID" >> ${context.run_dir}/autodev-gate-blocked.txt
      rm -f ${context.run_dir}/autodev-inflight
      # BUG-2729 postmortem: never flip an already-resolved issue to deferred.
      STATUS=$(ll-issues show "$ID" --json 2>/dev/null \
        | python3 -c "import json,sys; print((json.load(sys.stdin).get('status') or '').lower())" \
        2>/dev/null || echo "")
      if [ "$STATUS" = "done" ] || [ "$STATUS" = "completed" ] || [ "$STATUS" = "cancelled" ]; then
        echo "[SKIP-DEFER] $ID already $STATUS; leaving status untouched"
      else
        ll-issues set-status "$ID" deferred --by automation --reason gate_blocked 2>/dev/null || true
        echo "[LEARNING_GATE_BLOCKED] $ID — unproven external-API deps; deferred (prove with /ll:explore-api, then re-run to resurface)"
      fi
    action_type: shell
    next: dequeue_next
    on_error: dequeue_next

  check_impl_auth:
    # ENH-2353: gate between ll-auto failure and queue drain. Auth failures abort
    # the queue (abort_env_not_ready); genuine implementation failures continue
    # draining (dequeue_next) so other issues still get a chance.
    fragment: ll_auto_auth_check
    on_yes: abort_env_not_ready
    on_no: clear_inflight_after_impl_failure
    on_error: clear_inflight_after_impl_failure

  clear_inflight_after_impl_failure:
    # BUG-2981 D1: check_impl_auth is a fragment state (no action body of its
    # own), so it cannot clear autodev-inflight itself. Both its non-auth legs
    # (on_no — genuine implementation failure; on_error — fault reading the
    # auth signal) route here so the sentinel is cleared before dequeue_next,
    # matching every other issue-resolving state's BUG-1226 convention.
    action_type: shell
    action: |
      rm -f ${context.run_dir}/autodev-inflight
    next: dequeue_next
    on_error: dequeue_next

  abort_env_not_ready:
    # ENH-2353: abort the autodev queue on auth misconfiguration.
    action_type: shell
    action: |
      echo "Aborting: host auth not configured — set the host credential or run the host login, then re-run"
    next: finalize_done

  detect_children:
    # Diff current issue IDs against the pre-refinement baseline to find any
    # child issues created during the sub-loop (e.g., via its breakdown_issue
    # state). Writes discovered child IDs to a temp file for use by
    # enqueue_children. Exits 0 (→ enqueue_children) if children found;
    # exits 1 (→ size_review_snap) if none were found.
    action: |
      ll-issues list --json | python3 -c "
      import json, sys
      issues = json.load(sys.stdin)
      for i in sorted(i['id'] for i in issues):
          print(i)
      " | sort > ${context.run_dir}/autodev-post-ids.txt

      comm -13 ${context.run_dir}/autodev-pre-ids.txt \
               ${context.run_dir}/autodev-post-ids.txt \
               > ${context.run_dir}/autodev-diff-ids.txt

      PARENT_ID="${captured.input.output}"  # ll-lint: mr11-ok(captured.input.output) ENH-3358 - ENH-3342 widening residual, tracked for conversion
      while IFS= read -r child_id; do
        child_file=$(ll-issues path "$child_id" 2>/dev/null)
        # BUG-2729 postmortem: match provenance on frontmatter `parent:` first
        # (deterministic — written by issue-size-review), with the prose marker
        # as a tolerant fallback (accepts wiki-link drift like
        # "Decomposed from [[ID]]"). An exact-literal prose grep alone rejected
        # real children and cascaded into a wrong low_readiness deferral.
        if [ -n "$child_file" ] && { \
             grep -qE "^parent:[[:space:]]*['\"]?$PARENT_ID['\"]?[[:space:]]*$" "$child_file" \
             || grep -qE "Decomposed from (\[\[)?$PARENT_ID([^0-9]|$)" "$child_file"; }; then
          echo "$child_id"
        fi
      done < ${context.run_dir}/autodev-diff-ids.txt \
        > ${context.run_dir}/autodev-new-children.txt

      if [ -s ${context.run_dir}/autodev-new-children.txt ]; then
        cat ${context.run_dir}/autodev-new-children.txt
        exit 0
      else
        exit 1
      fi
    fragment: shell_exit
    on_yes: enqueue_children
    on_no: size_review_snap
    on_error: size_review_snap

  enqueue_children:
    # Prepend newly-detected child issues to the front of the unified queue
    # (depth-first), so children are refined AND implemented before the next
    # sibling in the original list. Records the parent as skipped (it was
    # decomposed, not refined to ready) and closes it via `ll-issues
    # finalize-decomposition` (ENH-2615), which owns the status-done close
    # in place (BUG-2732: no completed/ move by default) AND repoints the
    # children's parent: to the EPIC when the parent had one — so
    # epic-scoped re-resolution recognizes the children.
    # Mirrors rn-decompose finalize_parent's WARN-not-fail shape.
    # ENH-2404: two-space-delimited "ID  REASON" — decomposed is a success
    # outcome, distinct from a refinement/readiness failure.
    action: |
      CHILDREN=$(cat ${context.run_dir}/autodev-new-children.txt)
      EXISTING=$(cat ${context.run_dir}/autodev-queue.txt 2>/dev/null || true)
      { echo "$CHILDREN"; echo "$EXISTING"; } \
        | grep -v '^[[:space:]]*$' \
        > ${context.run_dir}/autodev-queue.txt
      echo "${captured.input.output}  decomposed" >> ${context.run_dir}/autodev-skipped.txt  # ll-lint: mr11-ok(captured.input.output) ENH-3358 - ENH-3342 widening residual, tracked for conversion
      # ll-lint: mr11-ok(captured.input.output) ENH-3358 - ENH-3342 widening residual, tracked for conversion
      ll-issues finalize-decomposition "${captured.input.output}" \
        --children-file ${context.run_dir}/autodev-new-children.txt \
        || echo "WARN: finalize-decomposition failed for ${captured.input.output} (children remain enqueued)" >&2  # ll-lint: mr11-ok(captured.input.output) ENH-3358 - ENH-3342 widening residual, tracked for conversion
      CHILD_COUNT=$(wc -l < ${context.run_dir}/autodev-new-children.txt | tr -d ' ')
      echo "Parent ${captured.input.output} decomposed; enqueued $CHILD_COUNT child issue(s)"  # ll-lint: mr11-ok(captured.input.output) ENH-3358 - ENH-3342 widening residual, tracked for conversion
      # BUG-1226: parent is resolved (decomposed); clear the in-flight flag
      # so `done` does not warn about it.
      rm -f ${context.run_dir}/autodev-inflight
    action_type: shell
    next: dequeue_next
    on_error: dequeue_next

  size_review_snap:
    # Update pre-ids to the current state (captured in detect_children's
    # post-ids) so the enqueue_or_skip diff reflects only what the explicit
    # size-review creates, not children already created by the sub-loop.
    action: |
      if [ -f ${context.run_dir}/autodev-post-ids.txt ]; then
        cp ${context.run_dir}/autodev-post-ids.txt \
           ${context.run_dir}/autodev-pre-ids.txt
      fi
    action_type: shell
    next: check_broke_down
    on_error: check_broke_down

  check_broke_down:
    # Guard: shortcut to enqueue_or_skip ONLY when breakdown_issue ran inside
    # the sub-loop AND it actually produced child issues (detected and written
    # to autodev-new-children.txt by detect_children). If the flag is set but
    # no children exist (BUG-1183: /ll:issue-size-review --auto returned only
    # analysis, no files), fall through to recheck_scores → run_size_review so
    # the outer loop gets its own chance to decompose. This preserves the
    # BUG-1079 "no double size-review" invariant because flag=1 AND children
    # exist still shortcuts past run_size_review.
    # BUG-2744 / BUG-3390: this on_no branch reaches check_guard2_verdict
    # downstream without run_size_review ever running for the current issue.
    # `captured.size_review_output` is run-scoped (executor.py:227), so guard-2
    # must only be evaluated when run_size_review ran THIS pass. That is now
    # proven by a positive marker written by count_repair_cycle_size_review
    # (see check_size_review_ran_this_pass); this shortcut writes nothing.
    action: |
      FLAG=$(cat ${context.run_dir}/autodev-broke-down 2>/dev/null || echo 0)
      if [ "$FLAG" = "1" ] && [ -s ${context.run_dir}/autodev-new-children.txt ]; then
        echo 1
      else
        echo 0
      fi
    action_type: shell
    evaluate:
      type: output_numeric
      operator: lt
      target: 1
    on_yes: check_parent_resolved   # 0 → flag unset OR no children → check status first
    on_no: enqueue_or_skip          # 1 → flag set AND children exist → skip
    on_error: check_parent_resolved

  check_parent_resolved:
    # BUG-2729 postmortem: broke-down flag set but no detectable children used
    # to assume BUG-1183 (analysis-only size review) and re-run size-review —
    # but when the sub-loop already marked the parent done/cancelled,
    # decomposition DID happen and only child *detection* failed. Re-running
    # size-review then deferring a done issue is wrong on both counts. Check
    # the parent's current status; if the sub-loop resolved it, route to
    # recover_subloop_children instead of the score/size-review chain.
    # `show --json` reports status capitalized ("Deferred") — lowercase before
    # comparing.
    action: |
      # ll-lint: mr11-ok(captured.input.output) ENH-3358 - ENH-3342 widening residual, tracked for conversion
      STATUS=$(ll-issues show ${captured.input.output} --json 2>/dev/null \
        | python3 -c "import json,sys; print((json.load(sys.stdin).get('status') or '').lower())" \
        2>/dev/null || echo "")
      if [ "$STATUS" = "done" ] || [ "$STATUS" = "completed" ] || [ "$STATUS" = "cancelled" ]; then
        exit 0
      fi
      exit 1
    fragment: shell_exit
    on_yes: recover_subloop_children
    on_no: recheck_scores
    on_error: recheck_scores

  recover_subloop_children:
    # BUG-2729 postmortem: the parent is already resolved (done/cancelled) by
    # the sub-loop — typically via decomposition. Recover any open children by
    # deterministic frontmatter `parent:` match across the current issue list
    # (covers marker-drift cases where detect_children's diff+grep missed
    # them) and prepend depth-first, mirroring enqueue_children. Records the
    # parent as decomposed (children found) or resolved_by_subloop (none) —
    # never defers it.
    action: |
      ID="${captured.input.output}"  # ll-lint: mr11-ok(captured.input.output) ENH-3358 - ENH-3342 widening residual, tracked for conversion
      ll-issues list --json | python3 -c "
      import json, sys
      try:
          issues = json.load(sys.stdin)
          for cid in sorted(i['id'] for i in issues
                            if i.get('parent') == '$ID'
                            and (i.get('status') or 'open').lower() in ('open', 'in_progress')):
              print(cid)
      except Exception:
          pass
      " > ${context.run_dir}/autodev-new-children.txt || true
      if [ -s ${context.run_dir}/autodev-new-children.txt ]; then
        CHILDREN=$(cat ${context.run_dir}/autodev-new-children.txt)
        EXISTING=$(cat ${context.run_dir}/autodev-queue.txt 2>/dev/null || true)
        { echo "$CHILDREN"; echo "$EXISTING"; } \
          | grep -v '^[[:space:]]*$' \
          > ${context.run_dir}/autodev-queue.txt
        CHILD_COUNT=$(wc -l < ${context.run_dir}/autodev-new-children.txt | tr -d ' ')
        echo "$ID  decomposed" >> ${context.run_dir}/autodev-skipped.txt
        echo "Parent $ID resolved by sub-loop; recovered and enqueued $CHILD_COUNT child issue(s)"
      else
        echo "$ID  resolved_by_subloop" >> ${context.run_dir}/autodev-skipped.txt
        echo "[RESOLVED] $ID already resolved by sub-loop; advancing queue"
      fi
      rm -f ${context.run_dir}/autodev-inflight
    action_type: shell
    next: dequeue_next
    on_error: dequeue_next

  recheck_scores:
    # Gate before size-review: if the issue already meets thresholds, skip
    # size-review. Scores can pass even when the sub-loop failed/errored (e.g.,
    # max-iterations hit while the issue was already ready). Mirrors
    # check_passed logic exactly; on pass, interleave implementation.
    # ENH-2870 step 0: unlike the other two gate states this one has no local
    # `GATE` python variable — it routes on `ll-issues check-readiness`'s own
    # exit code (fragment: shell_exit). Hard-AND the deterministic Program
    # Design verdict by chaining a second `&&`-gated check: a design-caused
    # gap still lets check-readiness pass, but the compound command's overall
    # exit code goes non-zero, so on_no fires exactly like a score failure.
    # No new deferral branch here — the not-ready path already funnels
    # through run_size_review down to
    # recheck_after_size_review, which owns the design_gate_failed deferral.
    action: |
      ID="${captured.input.output}"  # ll-lint: mr11-ok(captured.input.output) ENH-3358 - ENH-3342 widening residual, tracked for conversion
      ll-issues check-design "$ID"; rc=$?
      # BUG-3294: only a genuine gate failure (rc=1) files the design-gate-failed
      # marker; rc>=2 (unresolvable ID) must not defer a nonexistent issue.
      if [ "$rc" -eq 1 ]; then
        touch ${context.run_dir}/autodev-design-gate-failed-$ID
      fi
      ll-issues check-readiness "$ID" \
        --readiness ${context.readiness_threshold:shell} \
        --outcome ${context.outcome_threshold:shell} \
        --honor-waiver \
        && ll-issues check-design "$ID" \
        && echo "$ID" >> ${context.run_dir}/autodev-staged.txt
    # BUG-3588: exit 3 = scores absent; post-sub-loop site, so behaviour is
    # unchanged (route as a score failure) — explicit rather than implicit.
    fragment: harness_exit
    on_yes: select_obligation_pre_implement
    on_no: run_size_review
    on_cannot_judge: run_size_review
    on_error: run_size_review

  check_missing_artifacts:
    # Gate before size-review: if missing_artifacts=true, route to run_wire so
    # absent files and unwired components are resolved before decomposition is
    # attempted. Mirrors the check-flag gate idiom; on_no falls
    # through to detect_children (size-review path).
    action: "ll-issues check-flag ${captured.input.output:shell} missing_artifacts"
    fragment: shell_exit
    on_yes: run_wire
    on_no: detect_children
    on_error: detect_children

  run_size_review:
    # Explicitly run issue-size-review when the sub-loop did not decompose the
    # issue. If this creates child issues, enqueue_or_skip will detect and
    # enqueue them. on_rate_limit_exhausted skips this issue and moves to the
    # next queued one rather than masquerading as a clean "no decomposition"
    # outcome (which enqueue_or_skip would otherwise report).
    # BUG-2734: capture the skill's status-line output so check_guard2_verdict
    # can later detect the guard-2 "declined to decompose, Very Large, ready"
    # verdict without re-running size-review. The captured text is only ever
    # matched via evaluate.source (Python-side regex, see check_guard2_verdict)
    # — never interpolated into a shell action string (BUG-2594).
    fragment: with_rate_limit_handling
    action: "/ll:issue-size-review ${captured.input.output} --auto"
    action_type: slash_command
    pruning_profile:
      enabled: true
      name: issue-size-review-auto
      suppress_claude_md: true
    capture: size_review_output
    next: count_repair_cycle_size_review
    on_error: count_repair_cycle_size_review
    on_rate_limit_exhausted: dequeue_next

  count_repair_cycle_size_review:
    # FEAT-2751: run_size_review is one of the six repair-class states
    # counted toward the stagnation backstop threshold (see
    # count_repair_cycle_refine). Other paths into enqueue_or_skip
    # (rerun_confidence_after_wire, check_broke_down.on_no) are confidence
    # rechecks or normal continuations of an already-counted repair cycle, not
    # new repair attempts, so they route to enqueue_or_skip directly.
    # BUG-3390: run_size_review's only successor — record that size-review ran
    # for THIS issue this pass so check_size_review_ran_this_pass can prove the
    # captured.size_review_output it is about to evaluate is not a prior issue's.
    action: |
      N=$(cat ${context.run_dir}/autodev-repair-cycle-count.txt 2>/dev/null || echo 0)
      N=$((N + 1))
      printf '%s' "$N" > ${context.run_dir}/autodev-repair-cycle-count.txt
      touch ${context.run_dir}/autodev-size-review-ran-this-pass
    action_type: shell
    next: enqueue_or_skip
    on_error: enqueue_or_skip

  enqueue_or_skip:
    # After explicit size-review: diff IDs against the pre-size-review
    # baseline. If children found: prepend to queue depth-first; mark parent
    # as skipped; close the parent via ll-issues finalize-decomposition
    # (ENH-2615 — closes in place, BUG-2732, and repoints children to the EPIC).
    # If none: route to recheck_after_size_review so a score check can decide
    # whether to implement or skip (BUG-1230).
    # ENH-2404: two-space-delimited "ID  REASON" — decomposed is a success
    # outcome, distinct from a refinement/readiness failure.
    action: |
      ll-issues list --json | python3 -c "
      import json, sys
      issues = json.load(sys.stdin)
      for i in sorted(i['id'] for i in issues):
          print(i)
      " | sort > ${context.run_dir}/autodev-post-ids.txt

      comm -13 ${context.run_dir}/autodev-pre-ids.txt \
               ${context.run_dir}/autodev-post-ids.txt \
               > ${context.run_dir}/autodev-diff-ids.txt

      PARENT_ID="${captured.input.output}"  # ll-lint: mr11-ok(captured.input.output) ENH-3358 - ENH-3342 widening residual, tracked for conversion
      while IFS= read -r child_id; do
        child_file=$(ll-issues path "$child_id" 2>/dev/null)
        # BUG-2729 postmortem: match provenance on frontmatter `parent:` first
        # (deterministic — written by issue-size-review), with the prose marker
        # as a tolerant fallback (accepts wiki-link drift like
        # "Decomposed from [[ID]]"). An exact-literal prose grep alone rejected
        # real children and cascaded into a wrong low_readiness deferral.
        if [ -n "$child_file" ] && { \
             grep -qE "^parent:[[:space:]]*['\"]?$PARENT_ID['\"]?[[:space:]]*$" "$child_file" \
             || grep -qE "Decomposed from (\[\[)?$PARENT_ID([^0-9]|$)" "$child_file"; }; then
          echo "$child_id"
        fi
      done < ${context.run_dir}/autodev-diff-ids.txt \
        > ${context.run_dir}/autodev-new-children.txt

      if [ -s ${context.run_dir}/autodev-new-children.txt ]; then
        CHILDREN=$(cat ${context.run_dir}/autodev-new-children.txt)
        EXISTING=$(cat ${context.run_dir}/autodev-queue.txt 2>/dev/null || true)
        { echo "$CHILDREN"; echo "$EXISTING"; } \
          | grep -v '^[[:space:]]*$' \
          > ${context.run_dir}/autodev-queue.txt
        echo "${captured.input.output}  decomposed" >> ${context.run_dir}/autodev-skipped.txt  # ll-lint: mr11-ok(captured.input.output) ENH-3358 - ENH-3342 widening residual, tracked for conversion
        # ll-lint: mr11-ok(captured.input.output) ENH-3358 - ENH-3342 widening residual, tracked for conversion
        ll-issues finalize-decomposition "${captured.input.output}" \
          --children-file ${context.run_dir}/autodev-new-children.txt \
          || echo "WARN: finalize-decomposition failed for ${captured.input.output} (children remain enqueued)" >&2  # ll-lint: mr11-ok(captured.input.output) ENH-3358 - ENH-3342 widening residual, tracked for conversion
        CHILD_COUNT=$(wc -l < ${context.run_dir}/autodev-new-children.txt | tr -d ' ')
        echo "Parent ${captured.input.output} decomposed by size-review; enqueued $CHILD_COUNT child issue(s)"  # ll-lint: mr11-ok(captured.input.output) ENH-3358 - ENH-3342 widening residual, tracked for conversion
        # BUG-1226: parent resolved by decomposition; clear in-flight flag.
        rm -f ${context.run_dir}/autodev-inflight
        exit 0
      else
        # No children: let recheck_after_size_review decide whether to implement or skip.
        exit 1
      fi
    fragment: shell_exit
    on_yes: dequeue_next
    on_no: check_parent_resolved_post_size_review
    on_error: dequeue_next

  check_parent_resolved_post_size_review:
    # BUG-2729 postmortem: same guard as check_parent_resolved, on the
    # post-size-review no-children edge. run_size_review (or the sub-loop
    # before it) may have resolved the parent with children the diff+grep
    # missed; without this gate the chain falls through to
    # recheck_after_size_review, which would defer an already-done issue as
    # low_readiness. On unresolved parents, behaviour is unchanged
    # (→ select_obligation_post_size_review, ENH-3611).
    action: |
      # ll-lint: mr11-ok(captured.input.output) ENH-3358 - ENH-3342 widening residual, tracked for conversion
      STATUS=$(ll-issues show ${captured.input.output} --json 2>/dev/null \
        | python3 -c "import json,sys; print((json.load(sys.stdin).get('status') or '').lower())" \
        2>/dev/null || echo "")
      if [ "$STATUS" = "done" ] || [ "$STATUS" = "completed" ] || [ "$STATUS" = "cancelled" ]; then
        exit 0
      fi
      exit 1
    fragment: shell_exit
    on_yes: recover_subloop_children
    on_no: select_obligation_post_size_review  # ENH-3611
    on_error: select_obligation_post_size_review

  check_reconcile_needed:
    # ENH-2689: plateau detector. The post-size-review path funnels through
    # select_obligation_post_size_review (ENH-3611; it replaced
    # check_spike_needed_before_skip) → here → recheck_after_size_review before
    # the low_readiness deferral. When a repair already ran but the
    # /ll:confidence-check produced a Readiness
    # score bit-identical to the pre-refine snapshot, the findings accumulated but
    # the issue's own directive sections were never reconciled — /ll:refine-issue
    # only appends. Route to reconcile_current for one targeted rewrite pass.
    # Predicate is a two-condition guard (pre-repair snapshot == current
    # Readiness AND NOT reconcile_attempted), mirroring the
    # two-field inline-Python one-shot idiom. The reconcile_attempted guard
    # (written by /ll:reconcile-issue) makes this fire at most once per issue
    # per run. On no plateau, no snapshot, or any error, fall through unchanged
    # to recheck_after_size_review — non-plateau issues behave exactly as
    # before.
    # FEAT-2751: the baseline is autodev-pre-readiness.txt, the dequeue-time
    # snapshot written for every issue (ENH-3611 removed the separate
    # autodev-pre-spike-readiness.txt preference with the spike states).
    # BUG-2803: a freshly captured issue has no confidence_score at dequeue, so
    # its pre-readiness snapshot is EMPTY and the plateau predicate (pre != '')
    # excluded it by construction — the most common below-threshold case
    # reached the low_readiness deferral with every readiness remedy
    # structurally unreachable. Relax: an empty snapshot with a current
    # Readiness below the configured threshold is also reconcile-eligible
    # (one-shot, still guarded by reconcile_attempted). On that branch,
    # backfill the empty dequeue-time snapshot with the current score so the
    # post-remedy revisit can apply the readiness_stagnated discriminator
    # (FEAT-2751) instead of falling back to low_readiness.
    # ENH-2992: third predicate term — `contradiction`. Both terms above are
    # readiness-shaped, so a directive section contradicted by the issue's own
    # findings only ever reached reconcile when it happened to also stall the
    # score (measured: 1,703 issues refined, 19 reconciled). The signal is
    # ENH-2995's `⚠ Superseded` marker, read through the public
    # `superseded_marker_count` key on `ll-issues format-check --format json`
    # (issue_parser.superseded_marker_count) — deterministic Python, no LLM in
    # the routing chain (MR-1). Deliberately NOT gated by reconcile_attempted:
    # that flag is permanent frontmatter no state ever clears, so gating on it
    # would make a second reconcile structurally impossible — the exact defect
    # this widening exists to fix. Bounded instead by (1) structure —
    # /ll:reconcile-issue clears the marker on every directive line it
    # evaluates, including on its no-op branch, so a consumed marker cannot
    # re-arm the gate; and (2) count — a reconcile-scoped per-issue fire
    # counter capped at 2, reset at dequeue_next. The shared
    # autodev-repair-cycle-count.txt / CYCLE_COUNT >= 2 ceiling does NOT bound
    # this branch: it is conditioned on CUR <= PRE (a contradiction fire that
    # raises the score is never capped by it), it is a deferral-reason branch
    # rather than a gate, and it is shared across all six repair classes.
    # The format-check payload is captured into a shell variable and passed
    # through the environment rather than parsed by a second `python3 -c` —
    # single-inline-script shape, matching the GATE_MARKER precedent in
    # recheck_after_size_review.
    action: |
      ID="${captured.input.output}"  # ll-lint: mr11-ok(captured.input.output) ENH-3358 - ENH-3342 widening residual, tracked for conversion
      FMT_JSON=$(ll-issues format-check "$ID" --format json 2>/dev/null || echo '{}')
      ISSUE_JSON=$(ll-issues show "$ID" --json)
      READINESS_THRESHOLD=${context.readiness_threshold:shell}
      LL_ISSUE_ID="$ID" LL_FORMAT_CHECK_JSON="$FMT_JSON" LL_ISSUE_JSON="$ISSUE_JSON" LL_ARG_READINESS_THRESHOLD="$READINESS_THRESHOLD" python3 << 'PYEOF'
      import json, os, sys
      d = json.loads(os.environ['LL_ISSUE_JSON'])
      cur = str(d.get('confidence') or '')
      attempted = d.get('reconcile_attempted') == 'true'
      fallback_snap = '${context.run_dir}/autodev-pre-readiness.txt'
      snap = fallback_snap
      pre = ''
      if os.path.exists(snap):
          with open(snap) as fh:
              pre = fh.read().strip()
      plateau = (pre != '' and pre == cur and not attempted)
      readiness_threshold = int(os.environ['LL_ARG_READINESS_THRESHOLD'])
      fresh_below = (pre == '' and cur != ''
                     and int(cur) < readiness_threshold and not attempted)
      try:
          fmt = json.loads(os.environ.get('LL_FORMAT_CHECK_JSON') or '{}') or {}
          markers = int(fmt.get('superseded_marker_count') or 0)
      except Exception:
          markers = 0
      fires = 0
      count_file = '${context.run_dir}/autodev-contradiction-reconcile-count.txt'
      if os.path.exists(count_file):
          try:
              with open(count_file) as fh:
                  fires = int(fh.read().strip() or 0)
          except (OSError, ValueError):
              fires = 0
      contradiction = (markers > 0 and fires < 2)
      if fresh_below:
          with open(fallback_snap, 'w') as fh:
              fh.write(cur)
      if contradiction and not (plateau or fresh_below):
          open('${context.run_dir}/autodev-contradiction-reconcile-armed', 'w').close()
      sys.exit(0 if (plateau or fresh_below or contradiction) else 1)
      PYEOF
    fragment: shell_exit
    on_yes: reconcile_current
    on_no: check_size_review_ran_this_pass
    on_error: recheck_after_size_review

  check_size_review_ran_this_pass:
    # BUG-2744, re-cut by BUG-3390: guard-2 semantics (check_guard2_verdict)
    # only make sense when run_size_review actually executed for the CURRENT
    # issue this pass — `captured.size_review_output` is run-scoped, not
    # per-issue (executor.py:227). The original gate keyed on a NEGATIVE marker
    # written only by check_broke_down's shortcut, so provenances that skip
    # BOTH run_size_review and check_broke_down — rerun_confidence_after_wire
    # (whose `next` is enqueue_or_skip; formerly also rerun_confidence_after_spike, removed in ENH-3611) —
    # reached check_guard2_verdict with a PRIOR issue's capture and could defer
    # the wrong issue as oversized_atomic. Require a POSITIVE marker instead:
    # written by count_repair_cycle_size_review (run_size_review's only
    # successor), cleared at dequeue_next. Not consumed here — a post-wire
    # re-entry via enqueue_or_skip in the same pass still refers to this
    # issue's own capture. on_error fails CLOSED: unverifiable provenance must
    # never evaluate possibly-stale text.
    action: "[ -f ${context.run_dir}/autodev-size-review-ran-this-pass ]"
    fragment: shell_exit
    on_yes: check_guard2_verdict
    on_no: recheck_after_size_review
    on_error: recheck_after_size_review

  check_guard2_verdict:
    # BUG-2734 (bug found in first live run against BUG-2731, fixed same day):
    # run_size_review's guard-2 status line is "[ID] skipped: score X (...)"
    # with X in 8-11 (Very Large, decomposition deliberately declined) — a
    # distinct, machine-detectable verdict from guard-1's qualitative-skip line
    # ("skipped: structural score N but outcome_confidence low is qualitative
    # ...", see check_parent_resolved_post_size_review's sibling states) and
    # from a genuine no-verdict decomposition failure (BUG-1183 shape). The
    # trailing parenthetical is freeform prose for guard-2 (SKILL.md only
    # fixes the literal "(ambiguous)" wording for guard-1's 5-7 range, per
    # skills/issue-size-review/SKILL.md:242) — e.g. observed real output
    # "skipped: score 11 (Very Large) — strictly sequential, ...". Matching a
    # required "(ambiguous)" suffix therefore never matched guard-2 output in
    # practice, silently defeating this whole routing branch. "skipped: score"
    # (vs guard-1's "skipped: structural score") plus the 8-11 range alone is
    # sufficient to disambiguate — no need to also match the parenthetical.
    # Only the guard-2 shape means "ready to implement as one issue" per the
    # skill's own recommendation; only route THAT case to the earn-the-pass
    # remediation attempt. Evaluated via evaluate.source against the captured
    # size-review output (Python-side regex match) rather than interpolating
    # that text into a shell action, per BUG-2594.
    evaluate:
      type: output_contains
      source: "${captured.size_review_output.output}"
      pattern: "skipped:.* score (8|9|10|11)\\b"
    on_yes: check_readiness_for_atomic_remediation
    on_no: check_guard2_score_fallback
    on_error: recheck_after_size_review

  check_guard2_score_fallback:
    # BUG-2752: the guard-2 skip wording is freeform agent-generated prose
    # (no fixed template in skills/issue-size-review/SKILL.md for the
    # Very Large 8-11 case — only guard-1's "(ambiguous)" wording is
    # fixed), so check_guard2_verdict's "skipped:...score N" pattern can
    # still drift out of sync even after loosening it. This fallback
    # probes the same captured output for a bare "score (8|9|10|11)"
    # substring with no "skipped:" prefix requirement, via the same
    # evaluate.source mechanism (Python-side interpolation against
    # self.captured, never shell-interpolated) so untrusted captured
    # text is never embedded in a shell action, per BUG-2594.
    evaluate:
      type: output_contains
      source: "${captured.size_review_output.output}"
      pattern: "score (8|9|10|11)\\b"
    on_yes: check_readiness_for_atomic_remediation
    on_no: recheck_after_size_review
    on_error: recheck_after_size_review

  check_readiness_for_atomic_remediation:
    # BUG-2734: the guard-2 verdict alone isn't sufficient — only attempt the
    # earn-the-pass remediation when Readiness (not Outcome) already passes.
    # `ll-issues check-readiness` hard-ANDs both halves against config
    # thresholds (ignoring CLI overrides when config sets them), so read
    # confidence_score directly from frontmatter instead, mirroring
    # the child's check_spike_needed inline-Python idiom.
    action: |
      ISSUE_JSON=$(ll-issues show ${captured.input.output} --json)  # ll-lint: mr11-ok(captured.input.output) ENH-3358 - ENH-3342 widening residual, tracked for conversion
      READINESS_THRESHOLD=${context.readiness_threshold:shell}
      LL_ISSUE_JSON="$ISSUE_JSON" LL_ARG_READINESS_THRESHOLD="$READINESS_THRESHOLD" python3 << 'PYEOF'
      import json, os, sys
      d = json.loads(os.environ['LL_ISSUE_JSON'])
      threshold = int(os.environ['LL_ARG_READINESS_THRESHOLD'])
      sys.exit(0 if int(d.get('confidence') or 0) >= threshold else 1)
      PYEOF
    fragment: shell_exit
    on_yes: remediate_oversized_atomic
    on_no: recheck_after_size_review
    on_error: recheck_after_size_review

  remediate_oversized_atomic:
    # BUG-2734 Step 1 (earn the pass, not bypass the gate): a Very Large,
    # deliberately-atomic, ready issue's outcome_confidence commonly fails only
    # because Criterion D scored it under Pattern A (blast radius) instead of
    # Pattern B (enumerated mechanical fanout) — see the confidence-check
    # SKILL.md/rubric.md Criterion D changes in this same fix. /ll:wire-issue
    # is the existing repair pass for missing integration points / wiring,
    # which is exactly the enumerated call-site list + wiring test Pattern B
    # needs; mirrors run_wire's shape.
    fragment: with_rate_limit_handling
    action: "/ll:wire-issue ${captured.input.output} --auto"
    action_type: slash_command
    pruning_profile:
      enabled: true
      name: wire-issue-auto
      suppress_claude_md: true
    next: clear_scores_before_atomic
    on_error: clear_scores_before_atomic
    on_rate_limit_exhausted: finalize_rate_limited

  rerun_confidence_after_atomic_remediation:
    # BUG-2734: re-run confidence-check once so remediate_oversized_atomic's
    # wiring pass gets a fresh Outcome Confidence score before the one-shot
    # re-gate below. Mirrors rerun_confidence_after_wire.
    fragment: with_rate_limit_handling
    action: "/ll:confidence-check ${captured.input.output}"
    action_type: slash_command
    pruning_profile:
      enabled: true
      name: confidence-check-recheck
      suppress_claude_md: true
    next: check_scores_present_atomic
    on_error: check_scores_present_atomic
    on_rate_limit_exhausted: finalize_rate_limited

  clear_scores_before_atomic:
    # BUG-3588: clear stale pre-repair scores immediately before the rescoring, so
    # the successor can only ever read scores the rescoring itself wrote. Cannot
    # live in the rerun state's action (slash command under with_rate_limit_handling).
    # Clearing an already-cleared issue is a no-op. A failed clear leaves stale
    # scores in place, which is exactly what this guards against — so infra.
    action: 'll-issues set-scores ${captured.input.output:shell} --clear'
    action_type: shell
    next: rerun_confidence_after_atomic_remediation
    on_error: mark_scores_absent_infra

  check_scores_present_atomic:
    # BUG-3588: presence gate for rerun_confidence_after_atomic_remediation. Both scores
    # non-null → proceed to regate_after_atomic_remediation. First miss → retry the rescoring once (the
    # dominant no-write cause is the model skipping `ll-issues set-scores`);
    # second miss → exit 3 → infra. The retry marker is per issue and cleared
    # here on a pass and at dequeue_next.
    action: |
      ID=${captured.input.output:shell}
      MARK=${context.run_dir}/autodev-rescore-retry-atomic-$ID
      ABSENT=$(ll-issues show "$ID" --json 2>/dev/null | python3 -c "
      import json, sys
      d = json.load(sys.stdin)
      print('true' if d.get('confidence') is None or d.get('outcome') is None else 'false')" 2>/dev/null || echo true)
      if [ "$ABSENT" = "false" ]; then
        rm -f "$MARK"
        exit 0
      fi
      if [ ! -f "$MARK" ]; then
        touch "$MARK"
        echo "[RESCORE_RETRY] $ID — rescoring wrote no scores; retrying once"
        exit 1
      fi
      exit 3
    fragment: harness_exit
    on_yes: regate_after_atomic_remediation
    on_no: rerun_confidence_after_atomic_remediation
    on_cannot_judge: mark_scores_absent_infra
    on_error: mark_scores_absent_infra

  regate_after_atomic_remediation:
    # BUG-2734 Step 2 (honest deferral): one-shot re-check of the full
    # readiness+outcome gate after remediation — this state is reached at most
    # once per issue per run (no loop back to check_guard2_verdict), so there
    # is no rescore loop. A pass routes to select_obligation_pre_implement exactly like
    # recheck_after_size_review's on_yes. A still-failing outcome defers with
    # the oversized_atomic reason code (never low_readiness — readiness itself
    # already passed to get here) so deferred-triage surfaces it distinctly and
    # a human can review/waive via outcome_gate_waived. `outcome_gate_waived`
    # is honored here too in case a prior run already stamped a waiver.
    # ENH-2870: step-0 hard-AND of the deterministic Program Design verdict
    # (see recheck_after_size_review for the parser/marker recipe). This state
    # has no pre-deferral remedy machinery of its own (BUG-2734: it fires at
    # most once per issue per run), so a design-caused FAIL is not deferred
    # directly here — it routes once through the dedicated design remedy via
    # check_atomic_design_remedy/refine_for_design (BUG-3002: retargeted from
    # reconcile_current, whose contract excludes ## Program Design), and only
    # defers design_gate_failed (never oversized_atomic) if that remedy was
    # already attempted.
    action: |
      ID="${captured.input.output}"  # ll-lint: mr11-ok(captured.input.output) ENH-3358 - ENH-3342 widening residual, tracked for conversion
      ll-issues check-design "$ID"; rc=$?
      # BUG-3294: only a genuine gate failure (rc=1) files the design-gate-failed
      # marker; rc>=2 (unresolvable ID) must not defer a nonexistent issue.
      if [ "$rc" -eq 0 ]; then
        DESIGN_FAIL="false"
      elif [ "$rc" -eq 1 ]; then
        DESIGN_FAIL="true"
        touch ${context.run_dir}/autodev-design-gate-failed-$ID
      else
        DESIGN_FAIL="false"
      fi
      ISSUE_JSON=$(ll-issues show "$ID" --json 2>/dev/null)
      READINESS_THRESHOLD=${context.readiness_threshold:shell}
      OUTCOME_THRESHOLD=${context.outcome_threshold:shell}
      GATE=$(LL_ISSUE_JSON="$ISSUE_JSON" LL_ARG_READINESS_THRESHOLD="$READINESS_THRESHOLD" LL_ARG_OUTCOME_THRESHOLD="$OUTCOME_THRESHOLD" python3 << 'PYEOF'
      import json, os
      d = json.loads(os.environ['LL_ISSUE_JSON'] or '{}')
      conf = int(d.get('confidence') or 0)
      outc = int(d.get('outcome') or 0)
      waived = str(d.get('outcome_gate_waived')).lower() == 'true'
      readiness_threshold = int(os.environ['LL_ARG_READINESS_THRESHOLD'])
      outcome_threshold = int(os.environ['LL_ARG_OUTCOME_THRESHOLD'])
      readiness_ok = conf >= readiness_threshold
      outcome_ok = waived or (outc >= outcome_threshold)
      print('PASS' if (readiness_ok and outcome_ok) else 'FAIL')
      PYEOF
      2>/dev/null || echo "FAIL")
      if [ "$DESIGN_FAIL" = "true" ]; then
        GATE="FAIL"
      fi
      if [ "$GATE" = "PASS" ]; then
        echo "$ID" >> ${context.run_dir}/autodev-staged.txt
      else
        STATUS=$(ll-issues show "$ID" --json 2>/dev/null \
          | python3 -c "import json,sys; print((json.load(sys.stdin).get('status') or '').lower())" \
          2>/dev/null || echo "")
        if [ "$STATUS" = "done" ] || [ "$STATUS" = "completed" ] || [ "$STATUS" = "cancelled" ]; then
          echo "$ID  resolved_by_subloop" >> ${context.run_dir}/autodev-skipped.txt
          rm -f ${context.run_dir}/autodev-inflight
          exit 1
        fi
        # BUG-3588: absent scores are an infra outcome, not a quality verdict.
        # Placed after resolved_by_subloop (a done parent with no scores must still
        # record that) and before every deferral branch.
        ABSENT=$(ll-issues show "$ID" --json 2>/dev/null | python3 -c "
      import json, sys
      d = json.load(sys.stdin)
      print('true' if d.get('confidence') is None or d.get('outcome') is None else 'false')" 2>/dev/null || echo false)
        if [ "$ABSENT" = "true" ]; then
          echo "[SCORES_ABSENT] $ID — confidence/outcome score absent at gate"
          exit 3
        fi
        if [ -f ${context.run_dir}/autodev-design-gate-failed-$ID ]; then
          if [ ! -f ${context.run_dir}/autodev-design-remedy-attempted-$ID ]; then
            touch ${context.run_dir}/autodev-atomic-design-remedy-pending
            exit 1
          fi
          echo "$ID  design_gate_failed" >> ${context.run_dir}/autodev-skipped.txt
          rm -f ${context.run_dir}/autodev-inflight
          ll-issues set-status "$ID" deferred --by automation --reason design_gate_failed 2>/dev/null || true
          exit 1
        fi
        echo "$ID  oversized_atomic" >> ${context.run_dir}/autodev-skipped.txt
        rm -f ${context.run_dir}/autodev-inflight
        ll-issues set-status "$ID" deferred --by automation --reason oversized_atomic 2>/dev/null || true
        exit 1
      fi
    fragment: harness_exit
    on_yes: select_obligation_pre_implement
    on_no: check_atomic_design_remedy
    on_cannot_judge: mark_scores_absent_infra
    on_error: dequeue_next

  check_atomic_design_remedy:
    # ENH-2870: dispatcher gate mirroring BUG-2803's check_pre_deferral_remedy
    # shape. regate_after_atomic_remediation's FAIL branch exits 1 both when
    # it deferred (skip → advance the queue) and when it armed the dedicated
    # design remedy instead. Disambiguate via the pending-remedy marker:
    # present → route to refine_for_design; absent → the issue was
    # deferred/skipped, advance to the next queued issue (the pre-ENH-2870
    # on_no behaviour).
    # BUG-3002: retargeted from reconcile_current — /ll:reconcile-issue's
    # contract excludes ## Program Design, so it could never fix the failure
    # that triggered this remedy. /ll:refine-issue (BUG-3001) can.
    action: |
      if [ -f ${context.run_dir}/autodev-atomic-design-remedy-pending ]; then
        rm -f ${context.run_dir}/autodev-atomic-design-remedy-pending
        exit 0
      fi
      exit 1
    fragment: shell_exit
    on_yes: refine_for_design
    # BUG-3390: the no-design-remedy leg now passes through the go-no-go
    # eligibility gate (which itself advances the queue unless this issue was
    # just deferred oversized_atomic).
    on_no: check_go_no_go_eligible
    on_error: dequeue_next

  check_go_no_go_eligible:
    # BUG-3390: regate_after_atomic_remediation's FAIL branch exits 1 for three
    # outcomes (resolved_by_subloop, design_gate_failed, oversized_atomic); only
    # the last is /ll:go-no-go's input — skills/go-no-go/SKILL.md keys its
    # outcome_gate_waived stamp off `deferred_reason: oversized_atomic`, so the
    # deferral MUST precede this state. Re-read the frontmatter the deferral
    # just wrote rather than the ledger. One shot per issue per run:
    # autodev-go-no-go-attempted-<ID> is filename-scoped like
    # autodev-design-remedy-attempted-<ID> and deliberately NOT cleared at
    # dequeue_next. Fail-closed on any error — a gate fault must not spend the
    # skill's three subagents.
    action: |
      ID="${captured.input.output}"  # ll-lint: mr11-ok(captured.input.output) BUG-3390 - ID bound once via quoted assignment
      MARKER=${context.run_dir}/autodev-go-no-go-attempted-$ID
      if [ -f "$MARKER" ]; then
        exit 1
      fi
      ISSUE_JSON=$(ll-issues show "$ID" --json 2>/dev/null || echo '{}')
      ELIGIBLE=$(LL_ISSUE_JSON="$ISSUE_JSON" python3 << 'PYEOF'
      import json, os
      d = json.loads(os.environ['LL_ISSUE_JSON'] or '{}')
      ok = ((d.get('raw_status') or d.get('status') or '').lower() == 'deferred'
            and (d.get('deferred_reason') or '') == 'oversized_atomic')
      print('YES' if ok else 'NO')
      PYEOF
      2>/dev/null || echo "NO")
      [ "$ELIGIBLE" = "YES" ] || exit 1
      touch "$MARKER"
      echo "[GO-NO-GO] $ID deferred oversized_atomic; requesting adversarial go/no-go review"
    fragment: shell_exit
    on_yes: run_go_no_go
    on_no: dequeue_next
    on_error: dequeue_next

  run_go_no_go:
    # BUG-3390: automated counterpart of BUG-2734's "a human can review/waive
    # via outcome_gate_waived". A GO verdict on an oversized_atomic-deferred
    # issue stamps outcome_gate_waived: true in frontmatter; NO-GO never
    # stamps. The verdict is read back by check_go_no_go_waiver from
    # frontmatter — the skill's stdout is never parsed (MR-1). Mirrors
    # run_wire's shape.
    fragment: with_rate_limit_handling
    action: "/ll:go-no-go ${captured.input.output} --auto"
    action_type: slash_command
    pruning_profile:
      enabled: true
      name: go-no-go-auto
      suppress_claude_md: true
    next: check_go_no_go_waiver
    on_error: check_go_no_go_waiver
    on_rate_limit_exhausted: finalize_rate_limited

  check_go_no_go_waiver:
    # BUG-3390: check-flag reads raw frontmatter, so this is correct even where
    # `show --json` predates the outcome_gate_waived key.
    action: "ll-issues check-flag ${captured.input.output:shell} outcome_gate_waived"
    fragment: shell_exit
    on_yes: reopen_waived
    on_no: dequeue_next
    on_error: dequeue_next

  reopen_waived:
    # BUG-3390: GO + waiver — undo this pass's oversized_atomic deferral and
    # re-enter the implement chain at select_obligation_pre_implement (regate's own on_yes
    # target). `set-status open` leaves deferred_reason/deferred_by/
    # deferred_date in place (set_status.py's status_frontmatter_updates only
    # adds keys) — harmless, every consumer keys on status. Re-arm
    # autodev-inflight (regate cleared it) so BUG-1226 accounting covers the
    # implement attempt. `|| exit 1` on set-status is deliberate: a
    # still-deferred issue would be rejected by ll-auto's active-status filter
    # as PHASE1_NOT_STARTED, so bail to dequeue_next instead — the waiver stays
    # stamped and a human `set-status open` resurfaces it.
    action: |
      ID="${captured.input.output}"  # ll-lint: mr11-ok(captured.input.output) BUG-3390 - ID bound once via quoted assignment
      ll-issues set-status "$ID" open --by automation || exit 1
      if [ -f ${context.run_dir}/autodev-skipped.txt ]; then
        grep -vxF "$ID  oversized_atomic" ${context.run_dir}/autodev-skipped.txt \
          > ${context.run_dir}/autodev-skipped.tmp 2>/dev/null || true
        mv ${context.run_dir}/autodev-skipped.tmp ${context.run_dir}/autodev-skipped.txt
      fi
      echo "$ID" >> ${context.run_dir}/autodev-staged.txt
      printf '%s' "$ID" > ${context.run_dir}/autodev-inflight
      echo "[GO-NO-GO] $ID GO with outcome gate waived; re-opened and staged for implementation"
    action_type: shell
    next: select_obligation_pre_implement
    on_error: dequeue_next

  refine_for_design:
    # BUG-3002: dedicated remedy for a Program-Design-only gate failure,
    # modeled on reconcile_current but calling /ll:refine-issue instead —
    # /ll:reconcile-issue's contract (commands/reconcile-issue.md:44-47)
    # excludes ## Program Design, so it can never fix the failure that
    # triggers this route. --auto --gap-analysis is additive (never removes
    # content, does not consume max_refine_count) and, per BUG-3001, writes
    # ## Program Design at Step 5a when the analyzer axis is unmet (BUG-3003
    # makes that axis unmet reachable for already-refined issues). Rate-limit
    # handling and pruning profile mirror run_refine (:772-775).
    fragment: with_rate_limit_handling
    action: "/ll:refine-issue ${captured.input.output} --auto --gap-analysis"
    action_type: slash_command
    pruning_profile:
      enabled: true
      name: refine-issue-repair
      suppress_claude_md: true
    next: count_repair_cycle_refine_for_design
    on_error: count_repair_cycle_refine_for_design
    on_rate_limit_exhausted: finalize_rate_limited

  count_repair_cycle_refine_for_design:
    # BUG-3002: refine_for_design is one of the six repair-class states
    # counted toward the stagnation backstop threshold (see
    # count_repair_cycle_refine). Also writes the design-remedy-attempted
    # marker — the reconcile_attempted-frontmatter replacement described at
    # check_atomic_design_remedy / recheck_after_size_review — so both design
    # routes see the same one-shot state and an issue cannot burn one refine
    # pass per route. Per-issue-scoped by filename like
    # autodev-design-gate-failed-$ID, so it is intentionally NOT cleared at
    # dequeue_next (clearing it there would let one issue take two refine
    # passes within a single run).
    action: |
      ID="${captured.input.output}"  # ll-lint: mr11-ok(captured.input.output) ENH-3358 - ENH-3342 widening residual, tracked for conversion
      N=$(cat ${context.run_dir}/autodev-repair-cycle-count.txt 2>/dev/null || echo 0)
      N=$((N + 1))
      printf '%s' "$N" > ${context.run_dir}/autodev-repair-cycle-count.txt
      touch ${context.run_dir}/autodev-design-remedy-attempted-$ID
    action_type: shell
    next: clear_scores_before_reconcile
    on_error: clear_scores_before_reconcile

  reconcile_current:
    # ENH-2689: targeted, in-place rewrite of the issue's Implementation Steps /
    # Acceptance Criteria / Files to Modify sections from its own accumulated
    # Codebase Research Findings / Wiring Phase, via the /ll:reconcile-issue skill
    # (the state owns no rewrite logic — only the call and routing). The skill
    # writes reconcile_attempted: true, arming the check_reconcile_needed one-shot
    # guard. Rate-limit handling mirrors the child's run_spike.
    fragment: with_rate_limit_handling
    action: "/ll:reconcile-issue ${captured.input.output}"
    action_type: slash_command
    pruning_profile:
      enabled: true
      name: reconcile-issue-auto
      suppress_claude_md: true
    next: count_repair_cycle_reconcile
    on_error: count_repair_cycle_reconcile
    on_rate_limit_exhausted: finalize_rate_limited

  count_repair_cycle_reconcile:
    # FEAT-2751: reconcile_current is one of the six repair-class states
    # counted toward the stagnation backstop threshold (see
    # count_repair_cycle_refine). That shared increment is left untouched —
    # the stagnation backstop still needs it.
    # ENH-2992: additionally maintain the reconcile-scoped contradiction
    # budget, via a consume-once handshake with check_reconcile_needed. That
    # gate touches autodev-contradiction-reconcile-armed only when it fired on
    # a contradiction ALONE (neither plateau nor fresh_below), so a
    # readiness-driven reconcile arriving here never burns the contradiction
    # budget and never claims the pre-deferral exemption below. Consuming the
    # marker here rather than incrementing inside the predicate keeps the
    # count tied to actual reconcile passes — the predicate can be re-entered
    # without a reconcile ever running. The per-issue
    # autodev-contradiction-reconcile-$ID stamp records that THIS issue's
    # reconcile_attempted frontmatter flag is contradiction-sourced, which
    # recheck_after_size_review's pre-deferral dispatcher reads so a healthy
    # issue does not silently lose its spike remedy (see there). It is
    # filename-scoped per issue and so, like autodev-design-remedy-attempted-$ID,
    # is intentionally NOT cleared at dequeue_next.
    action: |
      ID="${captured.input.output}"  # ll-lint: mr11-ok(captured.input.output) ENH-3358 - ENH-3342 widening residual, tracked for conversion
      N=$(cat ${context.run_dir}/autodev-repair-cycle-count.txt 2>/dev/null || echo 0)
      N=$((N + 1))
      printf '%s' "$N" > ${context.run_dir}/autodev-repair-cycle-count.txt
      ARMED=${context.run_dir}/autodev-contradiction-reconcile-armed
      if [ -f "$ARMED" ]; then
        rm -f "$ARMED"
        C=$(cat ${context.run_dir}/autodev-contradiction-reconcile-count.txt 2>/dev/null || echo 0)
        C=$((C + 1))
        printf '%s' "$C" > ${context.run_dir}/autodev-contradiction-reconcile-count.txt
        touch ${context.run_dir}/autodev-contradiction-reconcile-$ID
      fi
    action_type: shell
    next: clear_scores_before_reconcile
    on_error: clear_scores_before_reconcile

  rerun_confidence_after_reconcile:
    # ENH-2689: after reconcile_current rewrites the stale directive sections,
    # re-run /ll:confidence-check once so a successful reconciliation gets one more
    # chance to cross the readiness threshold, then fall through to
    # recheck_after_size_review (the existing implement-or-defer gate). Mirrors
    # rerun_confidence_after_wire's rate-limit shape.
    # BUG-3002: also the successor for refine_for_design (the Program Design
    # remedy) — this state is remedy-agnostic, it just reruns confidence-check
    # and falls into recheck_after_size_review, so it serves both the plateau
    # (reconcile) and design-gate (refine) repair paths without a second
    # near-identical state.
    fragment: with_rate_limit_handling
    action: "/ll:confidence-check ${captured.input.output}"
    action_type: slash_command
    pruning_profile:
      enabled: true
      name: confidence-check-recheck
      suppress_claude_md: true
    next: check_scores_present_reconcile
    on_error: check_scores_present_reconcile
    on_rate_limit_exhausted: finalize_rate_limited

  clear_scores_before_reconcile:
    # BUG-3588: clear stale pre-repair scores immediately before the rescoring, so
    # the successor can only ever read scores the rescoring itself wrote. Cannot
    # live in the rerun state's action (slash command under with_rate_limit_handling).
    # Clearing an already-cleared issue is a no-op. A failed clear leaves stale
    # scores in place, which is exactly what this guards against — so infra.
    action: 'll-issues set-scores ${captured.input.output:shell} --clear'
    action_type: shell
    next: rerun_confidence_after_reconcile
    on_error: mark_scores_absent_infra

  check_scores_present_reconcile:
    # BUG-3588: presence gate for rerun_confidence_after_reconcile. Both scores
    # non-null → proceed to recheck_after_size_review. First miss → retry the rescoring once (the
    # dominant no-write cause is the model skipping `ll-issues set-scores`);
    # second miss → exit 3 → infra. The retry marker is per issue and cleared
    # here on a pass and at dequeue_next.
    action: |
      ID=${captured.input.output:shell}
      MARK=${context.run_dir}/autodev-rescore-retry-reconcile-$ID
      ABSENT=$(ll-issues show "$ID" --json 2>/dev/null | python3 -c "
      import json, sys
      d = json.load(sys.stdin)
      print('true' if d.get('confidence') is None or d.get('outcome') is None else 'false')" 2>/dev/null || echo true)
      if [ "$ABSENT" = "false" ]; then
        rm -f "$MARK"
        exit 0
      fi
      if [ ! -f "$MARK" ]; then
        touch "$MARK"
        echo "[RESCORE_RETRY] $ID — rescoring wrote no scores; retrying once"
        exit 1
      fi
      exit 3
    fragment: harness_exit
    on_yes: recheck_after_size_review
    on_no: rerun_confidence_after_reconcile
    on_cannot_judge: mark_scores_absent_infra
    on_error: mark_scores_absent_infra

  recheck_after_size_review:
    # BUG-1230: size-review declined to decompose the issue (leaf-sized or
    # effort genuinely small). Perform a final score check before deciding to
    # skip. Mirrors recheck_scores exactly; on pass routes to implement_current
    # so ready leaf issues are not silently dropped.
    # ENH-2404: two-space-delimited "ID  REASON" on the skip path — the
    # issue stayed below threshold after size-review declined to split it.
    # ENH-2666: the skip path also defers the issue (mirrors rn-implement's
    # mark_deferred), so it leaves active selection and re-surfaces via
    # FEAT-2665's triage surface rather than being retried every run.
    # BUG-2734: honor a per-issue `outcome_gate_waived: true` frontmatter flag
    # (stamped manually or by /ll:go-no-go after an explicit risk review) by
    # bypassing only the outcome half of the gate — readiness is still
    # enforced. `ll-issues check-readiness` hard-ANDs both halves against
    # config thresholds regardless of CLI overrides, so the waiver check reads
    # frontmatter directly instead (mirrors regate_after_atomic_remediation).
    # FEAT-2751: stagnation backstop. When ≥ 2 repair-class attempts have run
    # this cycle (autodev-repair-cycle-count.txt, incremented by each
    # count_repair_cycle_* state) AND the current Readiness score is no better
    # than the dequeue-time snapshot (autodev-pre-readiness.txt), defer with
    # the distinct `readiness_stagnated` reason instead of `low_readiness` —
    # this now truthfully means "all remedies including reconcile were
    # attempted" rather than masking that no rewrite was ever tried.
    # ENH-2870: step-0 hard-AND of the deterministic Program Design verdict
    # into GATE, plus a design-gate branch positioned after
    # resolved_by_subloop but BEFORE readiness_stagnated — a design-gate FAIL
    # can arrive with passing scores, so it must not be swallowed by the
    # CYCLE_COUNT>=2 stagnation branch below. The remedy is hardcoded to
    # `refine_design` (bypassing the BUG-2803 weakest-subscore spike/reconcile
    # heuristic — BUG-3002: retargeted from `reconcile`, whose contract
    # excludes ## Program Design) and reuses the existing one-shot remedy
    # handshake (autodev-pre-deferral-remedy-fired / autodev-pre-deferral-remedy.txt);
    # an `autodev-design-remedy-attempted-$ID` fall-through defers as
    # design_gate_failed, never low_readiness.
    action: |
      ID="${captured.input.output}"  # ll-lint: mr11-ok(captured.input.output) ENH-3358 - ENH-3342 widening residual, tracked for conversion
      ll-issues check-design "$ID"; rc=$?
      # BUG-3294: only a genuine gate failure (rc=1) files the design-gate-failed
      # marker; rc>=2 (unresolvable ID) must not defer a nonexistent issue.
      if [ "$rc" -eq 0 ]; then
        DESIGN_FAIL="false"
      elif [ "$rc" -eq 1 ]; then
        DESIGN_FAIL="true"
        touch ${context.run_dir}/autodev-design-gate-failed-$ID
      else
        DESIGN_FAIL="false"
      fi
      ISSUE_JSON=$(ll-issues show "$ID" --json 2>/dev/null)
      READINESS_THRESHOLD=${context.readiness_threshold:shell}
      OUTCOME_THRESHOLD=${context.outcome_threshold:shell}
      GATE=$(LL_ISSUE_JSON="$ISSUE_JSON" LL_ARG_READINESS_THRESHOLD="$READINESS_THRESHOLD" LL_ARG_OUTCOME_THRESHOLD="$OUTCOME_THRESHOLD" python3 << 'PYEOF'
      import json, os
      d = json.loads(os.environ['LL_ISSUE_JSON'] or '{}')
      conf = int(d.get('confidence') or 0)
      outc = int(d.get('outcome') or 0)
      waived = str(d.get('outcome_gate_waived')).lower() == 'true'
      readiness_threshold = int(os.environ['LL_ARG_READINESS_THRESHOLD'])
      outcome_threshold = int(os.environ['LL_ARG_OUTCOME_THRESHOLD'])
      readiness_ok = conf >= readiness_threshold
      outcome_ok = waived or (outc >= outcome_threshold)
      print('PASS' if (readiness_ok and outcome_ok) else 'FAIL')
      PYEOF
      2>/dev/null || echo "FAIL")
      if [ "$DESIGN_FAIL" = "true" ]; then
        GATE="FAIL"
      fi
      if [ "$GATE" = "PASS" ]; then
        echo "$ID" >> ${context.run_dir}/autodev-staged.txt
      else
        # BUG-2729 postmortem: never flip an already-resolved issue to
        # deferred — a done/cancelled status here means the sub-loop (or
        # size-review) resolved it and only child detection fell short.
        STATUS=$(ll-issues show "$ID" --json 2>/dev/null \
          | python3 -c "import json,sys; print((json.load(sys.stdin).get('status') or '').lower())" \
          2>/dev/null || echo "")
        if [ "$STATUS" = "done" ] || [ "$STATUS" = "completed" ] || [ "$STATUS" = "cancelled" ]; then
          echo "$ID  resolved_by_subloop" >> ${context.run_dir}/autodev-skipped.txt
          rm -f ${context.run_dir}/autodev-inflight
          echo "[SKIP-DEFER] $ID already $STATUS; leaving status untouched"
          exit 1
        fi
        # BUG-3588: absent scores are an infra outcome, not a quality verdict.
        # Placed after resolved_by_subloop (a done parent with no scores must still
        # record that) and before every deferral branch.
        ABSENT=$(ll-issues show "$ID" --json 2>/dev/null | python3 -c "
      import json, sys
      d = json.load(sys.stdin)
      print('true' if d.get('confidence') is None or d.get('outcome') is None else 'false')" 2>/dev/null || echo false)
        if [ "$ABSENT" = "true" ]; then
          echo "[SCORES_ABSENT] $ID — confidence/outcome score absent at gate"
          exit 3
        fi
        CYCLE_COUNT=$(cat ${context.run_dir}/autodev-repair-cycle-count.txt 2>/dev/null || echo 0)
        PRE_READINESS=$(cat ${context.run_dir}/autodev-pre-readiness.txt 2>/dev/null || echo "")
        CUR_CONFIDENCE=$(ll-issues show "$ID" --json 2>/dev/null | python3 -c "
      import json, sys
      d = json.load(sys.stdin)
      print(int(d.get('confidence') or 0))" 2>/dev/null || echo 0)
        if [ -f ${context.run_dir}/autodev-design-gate-failed-$ID ]; then
          FIRED=${context.run_dir}/autodev-pre-deferral-remedy-fired
          if [ ! -f "$FIRED" ]; then
            if [ -f ${context.run_dir}/autodev-design-remedy-attempted-$ID ]; then
              REMEDY=""
            else
              REMEDY="refine_design"
            fi
            if [ -n "$REMEDY" ]; then
              touch "$FIRED"
              printf '%s' "$REMEDY" > ${context.run_dir}/autodev-pre-deferral-remedy.txt
              if [ -z "$PRE_READINESS" ]; then
                printf '%s' "$CUR_CONFIDENCE" > ${context.run_dir}/autodev-pre-readiness.txt
              fi
              echo "[PRE-DEFER] $ID program-design gate failed; routing to refine"
              exit 1
            fi
          fi
          echo "$ID  design_gate_failed" >> ${context.run_dir}/autodev-skipped.txt
          rm -f ${context.run_dir}/autodev-inflight
          ll-issues set-status "$ID" deferred --by automation --reason design_gate_failed 2>/dev/null || true
          exit 1
        fi
        # ENH-2936: the score-failing deferral cascade never consulted
        # decision_needed, so an issue whose decide-issue run correctly found
        # nothing actionable (Pattern E's own bar included) fell through to
        # readiness_stagnated/low_readiness — a truthful-sounding but wrong
        # reason (ENH-2866 postmortem). Re-check the flag directly, mirroring
        # the same "re-verify decision_needed directly rather than trusting a
        # score" idiom oracles/resolve-decision.yaml's assert_decision_cleared
        # uses (ENH-3075 moved the inline states that idiom originally named
        # here — check_decision_after_decide_error and assert_decision_cleared
        # — into that sub-loop), before the stagnation/low-readiness branches
        # below get a chance to mask it.
        DECISION_NEEDED=$(ll-issues show "$ID" --json 2>/dev/null | python3 -c "
      import json, sys
      d = json.load(sys.stdin)
      print(str(d.get('decision_needed')).lower())" 2>/dev/null || echo "false")
        if [ "$DECISION_NEEDED" = "true" ]; then
          echo "$ID  decision_unresolved" >> ${context.run_dir}/autodev-skipped.txt
          rm -f ${context.run_dir}/autodev-inflight
          ll-issues set-status "$ID" deferred --by automation --reason decision_unresolved 2>/dev/null || true
          exit 1
        fi
        if [ "$CYCLE_COUNT" -ge 2 ] 2>/dev/null && [ -n "$PRE_READINESS" ] && [ "$CUR_CONFIDENCE" -le "$PRE_READINESS" ] 2>/dev/null; then
          echo "$ID  readiness_stagnated" >> ${context.run_dir}/autodev-skipped.txt
          rm -f ${context.run_dir}/autodev-inflight
          ll-issues set-status "$ID" deferred --by automation --reason readiness_stagnated 2>/dev/null || true
          exit 1
        fi
        # BUG-2803: never write a low_readiness deferral when NO non-refine
        # readiness remedy (spike or reconcile) was ever attempted — for a
        # freshly captured issue every remedy arming flag is unset by
        # construction, so the loop's "defer only after remedies" policy was
        # violated for exactly the most common case. Arm a one-shot remedy
        # instead: spike when the ambiguity subscore is the strictly weakest
        # dimension (ambiguity-driven readiness gap → prove the mechanism),
        # else reconcile. The run-dir fired marker (cleared at dequeue_next)
        # bounds this to one extra remedy per issue per run even if the
        # remedy skill fails to stamp its frontmatter flag.
        # ENH-2978: an explicit unresolved measurement/proof gate in the issue
        # body ("do not start otherwise" style language) means the readiness
        # gap is an unproven-mechanism problem, not an ambiguity problem —
        # route straight to spike regardless of which subscore is weakest.
        # The ambiguity-subscore comparison remains the fallback when no such
        # gate marker is present.
        # ENH-2992: `reconcile_attempted` was a sound proxy for "this issue
        # already spent its readiness remedy" only while reconcile fired
        # exclusively on a readiness plateau. Now that it also fires on a
        # contradiction — a condition with no relationship to readiness — a
        # perfectly healthy issue can carry the stamp, and this dispatcher
        # would then refuse BOTH remedies for it, silently removing its access
        # to `spike` forever. count_repair_cycle_reconcile stamps
        # autodev-contradiction-reconcile-$ID when (and only when) this issue's
        # reconcile fire was contradiction-only; on that stamp the flag is not
        # evidence of a spent readiness remedy, so dispatch `spike` — the
        # remedy that would otherwise be lost — provided spike itself has not
        # already run. Plateau/readiness-driven reconciles are unaffected:
        # without the stamp the predicate is byte-identical to before.
        FIRED=${context.run_dir}/autodev-pre-deferral-remedy-fired
        if [ ! -f "$FIRED" ]; then
          ISSUE_FILE=$(ll-issues path "$ID" 2>/dev/null || echo "")
          GATE_MARKER="false"
          # ENH-3575: shared helper; a spike can satisfy a proof gate or a legacy
          # prose gate, never an external/manual prerequisite.
          # BUG-3603: this call STAYS fail-open deliberately — unlike the
          # pre-implement proof gate, every path out of this state is backstopped
          # by it (on_yes -> select_obligation_pre_implement -> proof gate; on_no/on_error ->
          # remedy/dequeue paths that never implement), so a helper error here
          # can never put an unproven issue into implement_current.
          if [ -n "$ISSUE_FILE" ]; then
            case "$(ll-issues check-gate "$ID" 2>/dev/null || true)" in
              structured_proof|prose) GATE_MARKER="true" ;;
            esac
          fi
          CONTRA_ONLY="false"
          if [ -f ${context.run_dir}/autodev-contradiction-reconcile-$ID ]; then
            CONTRA_ONLY="true"
          fi
          # Env assignments must prefix python3 (the os.environ reader), not
          # ll-issues — a `VAR=x a | b` prefix binds only to `a`.
          # BUG-3593: spike budget spent (counter >= 2) -> spike-exhausted, so the
          # selector never picks `spike` for a re-armed issue.
          SPIKE_N=$(cat ${context.run_dir}/spike-runs-$ID 2>/dev/null || echo 0)
          SPIKE_SPENT="false"
          [ "$SPIKE_N" -ge 2 ] 2>/dev/null && SPIKE_SPENT="true"
          REMEDY=$(ll-issues show "$ID" --json 2>/dev/null | GATE_MARKER="$GATE_MARKER" CONTRA_ONLY="$CONTRA_ONLY" SPIKE_SPENT="$SPIKE_SPENT" python3 -c "
      import json, os, sys
      d = json.load(sys.stdin)
      spent = os.environ.get('SPIKE_SPENT') == 'true'
      if d.get('spike_attempted') == 'true':
          print('')
      elif (d.get('reconcile_attempted') == 'true'
            and os.environ.get('CONTRA_ONLY') == 'true'):
          print('' if spent else 'spike')
      elif d.get('reconcile_attempted') == 'true':
          print('')
      elif spent:
          print('reconcile')
      elif os.environ.get('GATE_MARKER') == 'true':
          print('spike')
      else:
          amb = int(d.get('score_ambiguity') or 0)
          others = [int(d.get(k) or 0) for k in
                    ('score_complexity', 'score_test_coverage', 'score_change_surface')]
          print('spike' if (amb and amb < min(others)) else 'reconcile')" 2>/dev/null || echo "")
          if [ -n "$REMEDY" ]; then
            touch "$FIRED"
            printf '%s' "$REMEDY" > ${context.run_dir}/autodev-pre-deferral-remedy.txt
            # Backfill an empty dequeue-time snapshot (fresh issue) so the
            # post-remedy revisit can defer as readiness_stagnated (FEAT-2751)
            # rather than low_readiness.
            if [ -z "$PRE_READINESS" ]; then
              printf '%s' "$CUR_CONFIDENCE" > ${context.run_dir}/autodev-pre-readiness.txt
            fi
            echo "[PRE-DEFER] $ID below readiness with no remedy attempted; routing to $REMEDY"
            exit 1
          fi
        fi
        echo "$ID  low_readiness" >> ${context.run_dir}/autodev-skipped.txt
        rm -f ${context.run_dir}/autodev-inflight
        ll-issues set-status "$ID" deferred --by automation --reason low_readiness 2>/dev/null || true
        exit 1
      fi
    fragment: harness_exit
    on_yes: select_obligation_pre_implement
    on_no: check_pre_deferral_remedy
    on_cannot_judge: mark_scores_absent_infra
    on_error: dequeue_next

  check_pre_deferral_remedy:
    # BUG-2803: post-recheck dispatcher gate. recheck_after_size_review's FAIL
    # branch exits 1 both when it deferred (skip → advance the queue) and when
    # it armed a pre-deferral remedy instead of deferring. Disambiguate via the
    # remedy handshake file: present → dispatch the armed remedy; absent → the
    # issue was deferred/skipped, advance to the next queued issue (the
    # pre-BUG-2803 on_no behaviour).
    # BUG-3002: on_yes now routes through dispatch_design_remedy first, since
    # the design remedy needs its own target (refine_for_design) that
    # dispatch_pre_deferral_remedy's spike/reconcile-only routing cannot
    # express.
    action: |
      if [ -s ${context.run_dir}/autodev-pre-deferral-remedy.txt ]; then
        exit 0
      fi
      exit 1
    fragment: shell_exit
    on_yes: dispatch_design_remedy
    on_no: dequeue_next
    on_error: dequeue_next

  dispatch_design_remedy:
    # BUG-3002: gate chained BEFORE dispatch_pre_deferral_remedy so the
    # refine_design token can be routed to refine_for_design — a target
    # dispatch_pre_deferral_remedy's on_no (reconcile_current) does not cover.
    # Reads the remedy token, clearing it only on the refine_design match (so
    # a later revisit of check_pre_deferral_remedy — e.g. the design_gate_failed
    # deferral itself exits 1 through the same on_no edge — does not replay
    # the same remedy dispatch). Any other token (spike, reconcile, empty) is
    # left untouched for dispatch_pre_deferral_remedy to consume itself; that
    # state `rm -f`s it after reading, so this gate MUST run first or it would
    # always observe an empty token and silently fall back to
    # reconcile_current, reproducing this bug.
    action: |
      REMEDY=$(cat ${context.run_dir}/autodev-pre-deferral-remedy.txt 2>/dev/null || echo "")
      if [ "$REMEDY" = "refine_design" ]; then
        rm -f ${context.run_dir}/autodev-pre-deferral-remedy.txt
        exit 0
      fi
      exit 1
    fragment: shell_exit
    on_yes: refine_for_design
    on_no: dispatch_pre_deferral_remedy
    on_error: dispatch_pre_deferral_remedy

  dispatch_pre_deferral_remedy:
    # BUG-2803: consume the armed remedy and route to it. Anything unexpected
    # falls through to reconcile_current (the generic rewrite remedy) rather
    # than dead-ending. The reconcile remedy re-runs /ll:confidence-check and
    # funnels back to recheck_after_size_review.
    # ENH-3611 (interim until ENH-3606): the `spike` leg no longer runs a spike
    # in autodev (run_spike was removed). It routes to refine_current, so the
    # refine-to-ready-issue child gets another pass and spikes only if it reaches
    # `done` with an open structured_proof gate or spike_needed is set in its
    # low-outcome band; a remedy armed by the ambiguity heuristic alone gets a
    # plain refine pass. The leg neither increments `spike-runs-<ID>` (the child
    # owns that budget; a pre-bumped counter would make a child-spike refutation
    # see N=2 and skip the refute -> decide step) nor writes a pre-spike
    # snapshot (check_reconcile_needed reads autodev-pre-readiness.txt). Budget
    # spent (counter >= 2) or refine_count at the lifetime cap (a capped child
    # routes to breakdown_issue) -> exit 1 -> reconcile_current. Return path:
    # refine_current -> count_repair_cycle_refine -> route_refine_success ->
    # check_passed -> selectors -> full post-refine triage; the
    # autodev-pre-deferral-remedy-fired marker (cleared only at dequeue_next)
    # blocks a second arming, so a still-failing issue reaches
    # recheck_after_size_review again and defers as
    # readiness_stagnated/low_readiness.
    # BUG-3002: the refine_design token is intercepted upstream by
    # dispatch_design_remedy and never reaches here; this state's own routing
    # (spike / reconcile_current) is unmodified.
    action: |
      REMEDY=$(cat ${context.run_dir}/autodev-pre-deferral-remedy.txt 2>/dev/null || echo "")
      rm -f ${context.run_dir}/autodev-pre-deferral-remedy.txt
      if [ "$REMEDY" = "spike" ]; then
        # BUG-3593: shared spike budget (read only) — exhausted -> exit 1 -> reconcile_current.
        ID=${captured.input.output:shell}
        SPIKE_N=$(cat "${context.run_dir}/spike-runs-$ID" 2>/dev/null || echo 0)
        [ "$SPIKE_N" -lt 2 ] || exit 1
        # ENH-3611: lifetime refine cap (BUG-3614 snippet) — a capped child would
        # route to breakdown_issue, so defer via reconcile_current instead.
        CNT=$(ll-issues refine-status "$ID" --json 2>/dev/null | python3 -c 'import json,sys; print(int(json.load(sys.stdin).get("refine_count", 0)))' 2>/dev/null || echo 0)
        CAP=$(python3 -c 'import json; print(int(json.load(open(".ll/ll-config.json")).get("commands", {}).get("max_refine_count", 5)))' 2>/dev/null || echo 5)
        [ -z "$CNT" ] && CNT=0
        [ -z "$CAP" ] && CAP=5
        [ "$CNT" -lt "$CAP" ] 2>/dev/null || exit 1
        exit 0
      fi
      exit 1
    fragment: shell_exit
    on_yes: refine_current
    on_no: reconcile_current
    on_error: reconcile_current

  finalize_rate_limited:
    # Every 429-budget-exhaustion exit used to route straight to the bare
    # `done` terminal, skipping finalize_done — no summary.json, no
    # staged→passed promotion, no abandoned-inflight detection, and the
    # unprocessed queue silently dropped. Stamp the stop reason and run the
    # same finalization; finalize_done reports it as verdict rate_limited.
    action: |
      printf 'rate_limit' > ${context.run_dir}/autodev-stop-reason
    action_type: shell
    next: finalize_done
    on_error: finalize_done

  finalize_done:
    action_type: shell
    action: |
      # BUG-2908: check_passed/recheck_*/regate_* only ever recorded that an
      # issue STAGED past the readiness/outcome thresholds — that happens
      # before implement_current runs, so a no-op or crashed implementation
      # left the same ID in autodev-passed.txt as a genuinely closed one, with
      # nothing to ever revoke the entry. Promote staged IDs to
      # autodev-passed.txt here, ONLY once verified closed; anything staged
      # but not closed lands in autodev-unverified.txt instead so it can be
      # reported and gate the verdict below rather than laundered as a pass.
      STAGED_IDS=$(cat ${context.run_dir}/autodev-staged.txt 2>/dev/null \
        | grep -v '^[[:space:]]*$' | sort -u || true)
      # ENH-3613: cancelled closures are tallied in memory (CANCELLED_IDS) so the
      # summary can split them from implemented ones; they still land in
      # autodev-passed.txt as bare IDs.
      CANCELLED_IDS=""
      # FEAT-3573: with the quality gate on, an implemented (done/completed) ID is
      # promoted only if quality/<ID>.json records GATE_PASS or GATE_SKIP. A
      # GATE_FAILED / GATE_INFRA record was already ledgered by
      # record_quality_evidence (`quality_gate_failed` / `quality_gate_infra`); a
      # done ID with no record at all is `quality_evidence_missing`. Cancelled
      # closures are promoted on status alone.
      QUALITY_GATE=$(printf '%s' ${context.quality_gate:shell:default=true} | tr '[:upper:]' '[:lower:]')
      QUALITY_DIR=${context.run_dir}/quality
      for ID in $STAGED_IDS; do
        STATUS=$(ll-issues show "$ID" --json 2>/dev/null \
          | python3 -c "import json,sys; print((json.load(sys.stdin).get('status') or '').lower())" \
          2>/dev/null || echo "")
        case "$STATUS" in
          done|completed)
            case "$QUALITY_GATE" in
              false|0|no|off)
                echo "$ID" >> ${context.run_dir}/autodev-passed.txt ;;
              *)
                QUALITY_VERDICT=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get('verdict') or '')" \
                  "$QUALITY_DIR/$ID.json" 2>/dev/null || echo "")
                case "$QUALITY_VERDICT" in
                  GATE_PASS|GATE_SKIP)
                    echo "$ID" >> ${context.run_dir}/autodev-passed.txt ;;
                  GATE_FAILED) QUALITY_REASON=quality_gate_failed ;;
                  GATE_INFRA) QUALITY_REASON=quality_gate_infra ;;
                  *) QUALITY_REASON=quality_evidence_missing ;;
                esac
                case "$QUALITY_VERDICT" in
                  GATE_PASS|GATE_SKIP) ;;
                  *)
                    if ! grep -qE "^$ID([[:space:]]|$)" ${context.run_dir}/autodev-unverified.txt 2>/dev/null; then
                      echo "$ID  $QUALITY_REASON" >> ${context.run_dir}/autodev-unverified.txt
                    fi ;;
                esac ;;
            esac ;;
          cancelled)
            echo "$ID" >> ${context.run_dir}/autodev-passed.txt
            CANCELLED_IDS="$CANCELLED_IDS $ID"
            ;;
          *)
            # BUG-3390: verify_impl_closed may already hold "ID  reason"; sort -u
            # cannot merge that with a bare "ID", so guard like the ABANDONED
            # branch below.
            if ! grep -qE "^$ID([[:space:]]|$)" ${context.run_dir}/autodev-unverified.txt 2>/dev/null; then
              echo "$ID" >> ${context.run_dir}/autodev-unverified.txt
            fi ;;
        esac
      done

      PASSED_IDS=$(cat ${context.run_dir}/autodev-passed.txt 2>/dev/null \
        | grep -v '^[[:space:]]*$' | sort -u || true)
      UNVERIFIED_IDS=$(cat ${context.run_dir}/autodev-unverified.txt 2>/dev/null \
        | grep -v '^[[:space:]]*$' | sort -u || true)
      # ENH-2727: exclude infra-class skips from the generic Skipped bucket so
      # they are surfaced separately (re-runnable) below and not double-counted.
      # ENH-2868: likewise exclude pre-flight status skips (already_done /
      # already_cancelled / already_deferred) — these never entered refinement
      # at all and are not a failure signal.
      # ENH-2909: exclude blocked_by_unmet pre-flight skips from the generic
      # Skipped bucket too — these never entered refinement (see the already_*
      # exclusion below for the identical ENH-2868 precedent).
      # ENH-2989: exclude notstarted_* skips — a Phase 1 rejection never
      # reached implementation, so it belongs in the not_started bucket, not
      # double-counted here too (decision #2a).
      SKIPPED_IDS=$(cat ${context.run_dir}/autodev-skipped.txt 2>/dev/null \
        | grep -v '^[[:space:]]*$' | grep -v 'refine_failed_infra' \
        | grep -v '[[:space:]]already_' | grep -v '[[:space:]]blocked_by_unmet' \
        | grep -v '[[:space:]]notstarted_' \
        | sort -u || true)
      INFRA_SKIPPED_IDS=$(grep 'refine_failed_infra' ${context.run_dir}/autodev-skipped.txt 2>/dev/null \
        | awk '{print $1}' | grep -v '^[[:space:]]*$' | sort -u || true)
      ALREADY_RESOLVED_IDS=$(grep '[[:space:]]already_' ${context.run_dir}/autodev-skipped.txt 2>/dev/null \
        | awk '{print $1" ("$2")"}' | sed 's/already_//' \
        | grep -v '^[[:space:]]*$' | sort -u || true)
      BLOCKED_BY_UNMET_IDS=$(grep '[[:space:]]blocked_by_unmet' ${context.run_dir}/autodev-skipped.txt 2>/dev/null \
        | awk '{print $1}' | grep -v '^[[:space:]]*$' | sort -u || true)
      GATE_BLOCKED_IDS=$(cat ${context.run_dir}/autodev-gate-blocked.txt 2>/dev/null \
        | grep -v '^[[:space:]]*$' | sort -u || true)
      DECISION_UNRESOLVED_IDS=$(cat ${context.run_dir}/autodev-decision-unresolved.txt 2>/dev/null \
        | grep -v '^[[:space:]]*$' | sort -u || true)
      # ENH-2989: "ID  reason" ledger lines formatted "ID (reason)" so the
      # operator sees why without opening the ledger — the Already-resolved
      # line's exact idiom.
      NOT_STARTED_IDS=$(cat ${context.run_dir}/autodev-not-started.txt 2>/dev/null \
        | awk '{print $1" ("$2")"}' | grep -v '^[[:space:]]*$' | sort -u || true)

      PASSED_COUNT=$(echo "$PASSED_IDS" | grep -c '[^[:space:]]' || true)
      [ -z "$PASSED_COUNT" ] && PASSED_COUNT=0
      # ENH-3613: closed_implemented + closed_cancelled == closed by construction.
      CLOSED_CANCELLED=$(echo "$CANCELLED_IDS" | tr ' ' '\n' | grep -c '[^[:space:]]' || true)
      [ -z "$CLOSED_CANCELLED" ] && CLOSED_CANCELLED=0
      CLOSED_IMPLEMENTED=$((PASSED_COUNT - CLOSED_CANCELLED))
      CANCELLED_LIST=$(echo "$CANCELLED_IDS" | tr ' ' '\n' | grep -v '^[[:space:]]*$' | tr '\n' ',' | sed 's/,$//')
      SKIPPED_COUNT=$(echo "$SKIPPED_IDS" | grep -c '[^[:space:]]' || true)
      [ -z "$SKIPPED_COUNT" ] && SKIPPED_COUNT=0
      INFRA_SKIPPED_COUNT=$(echo "$INFRA_SKIPPED_IDS" | grep -c '[^[:space:]]' || true)
      [ -z "$INFRA_SKIPPED_COUNT" ] && INFRA_SKIPPED_COUNT=0
      ALREADY_RESOLVED_COUNT=$(echo "$ALREADY_RESOLVED_IDS" | grep -c '[^[:space:]]' || true)
      [ -z "$ALREADY_RESOLVED_COUNT" ] && ALREADY_RESOLVED_COUNT=0
      BLOCKED_BY_UNMET_COUNT=$(echo "$BLOCKED_BY_UNMET_IDS" | grep -c '[^[:space:]]' || true)
      [ -z "$BLOCKED_BY_UNMET_COUNT" ] && BLOCKED_BY_UNMET_COUNT=0
      GATE_BLOCKED_COUNT=$(echo "$GATE_BLOCKED_IDS" | grep -c '[^[:space:]]' || true)
      [ -z "$GATE_BLOCKED_COUNT" ] && GATE_BLOCKED_COUNT=0
      DECISION_UNRESOLVED_COUNT=$(echo "$DECISION_UNRESOLVED_IDS" | grep -c '[^[:space:]]' || true)
      [ -z "$DECISION_UNRESOLVED_COUNT" ] && DECISION_UNRESOLVED_COUNT=0
      NOT_STARTED_COUNT=$(echo "$NOT_STARTED_IDS" | grep -c '[^[:space:]]' || true)
      [ -z "$NOT_STARTED_COUNT" ] && NOT_STARTED_COUNT=0
      # BUG-3603: pre-implement proof-gate helper failures get their own bucket,
      # sourced from the mark_proof_gate_infra ledger.
      PROOF_GATE_INFRA_COUNT=$(grep -c '[^[:space:]]' ${context.run_dir}/autodev-proof-gate-infra.txt 2>/dev/null || true)
      [ -z "$PROOF_GATE_INFRA_COUNT" ] && PROOF_GATE_INFRA_COUNT=0

      INFLIGHT=$(cat ${context.run_dir}/autodev-inflight 2>/dev/null | tr -d '[:space:]' || true)
      # BUG-2908 Step 4: a residual autodev-inflight sentinel at finalize means
      # dequeue_next dispatched an issue that never reached passed/skipped —
      # fold it into the unverified bucket (with a distinct reason) instead of
      # a standalone advisory line so it feeds the verdict below rather than
      # being invisible to it.
      ABANDONED=0
      if [ -n "$INFLIGHT" ] && ! grep -qxF "$INFLIGHT" ${context.run_dir}/autodev-passed.txt 2>/dev/null; then
        ABANDONED=1
        # BUG-2981 D2: only skip the append if this ID is already recorded in
        # the unverified bucket (bare or otherwise) — the guard previously
        # asked "was this already passed?" when the correct question is "was
        # this already recorded at all?" ABANDONED stays set either way; it is
        # a verdict input independent of whether the line gets appended.
        if ! grep -qE "^$INFLIGHT([[:space:]]|$)" ${context.run_dir}/autodev-unverified.txt 2>/dev/null; then
          echo "$INFLIGHT  inflight_at_finalize" >> ${context.run_dir}/autodev-unverified.txt
        fi
      fi
      UNVERIFIED_IDS=$(cat ${context.run_dir}/autodev-unverified.txt 2>/dev/null \
        | grep -v '^[[:space:]]*$' | sort -u || true)
      UNVERIFIED_COUNT=$(echo "$UNVERIFIED_IDS" | grep -c '[^[:space:]]' || true)
      [ -z "$UNVERIFIED_COUNT" ] && UNVERIFIED_COUNT=0
      # FEAT-3573: quality-gate outcomes are ledgered in the unverified bucket (so they
      # count in not_closed and feed the verdict ladder) but get their own summary
      # keys and lines; the generic Unverified "re-queue to retry" hint is wrong for
      # them — the issue is already `done`, so a rerun skips it as already_done and
      # will not re-gate it.
      QUALITY_FAILED_COUNT=$(grep -cE '[[:space:]]quality_gate_failed([[:space:]]|$)' ${context.run_dir}/autodev-unverified.txt 2>/dev/null || true)
      [ -z "$QUALITY_FAILED_COUNT" ] && QUALITY_FAILED_COUNT=0
      QUALITY_INFRA_COUNT=$(grep -cE '[[:space:]]quality_gate_infra([[:space:]]|$)' ${context.run_dir}/autodev-unverified.txt 2>/dev/null || true)
      [ -z "$QUALITY_INFRA_COUNT" ] && QUALITY_INFRA_COUNT=0
      UNVERIFIED_DISPLAY_IDS=$(echo "$UNVERIFIED_IDS" | grep -vE '[[:space:]]quality_gate_(failed|infra)([[:space:]]|$)' || true)
      UNVERIFIED_DISPLAY_COUNT=$(echo "$UNVERIFIED_DISPLAY_IDS" | grep -c '[^[:space:]]' || true)
      [ -z "$UNVERIFIED_DISPLAY_COUNT" ] && UNVERIFIED_DISPLAY_COUNT=0
      # "ID@<short head_sha>[ (dirty)]" per ID, read from the evidence record.
      quality_list() {
        for QID in $(grep -E "[[:space:]]$1([[:space:]]|\$)" ${context.run_dir}/autodev-unverified.txt 2>/dev/null | awk '{print $1}' | sort -u); do
          python3 -c "
      import json, sys
      try:
          d = json.load(open(sys.argv[1]))
      except Exception:
          d = {}
      sha = (d.get('head_sha') or '')[:8]
      print(sys.argv[2] + ('@' + sha if sha else '') + (' (dirty)' if d.get('dirty') else ''))
      " "$QUALITY_DIR/$QID.json" "$QID"
        done | paste -sd, -
      }
      QUALITY_FAILED_LIST=$(quality_list quality_gate_failed)
      QUALITY_INFRA_LIST=$(quality_list quality_gate_infra)
      QUALITY_GATED_COUNT=$(find "$QUALITY_DIR" -maxdepth 1 -name '*.json' 2>/dev/null | grep -c . || true)
      [ -z "$QUALITY_GATED_COUNT" ] && QUALITY_GATED_COUNT=0

      PASSED_LIST=$(echo "$PASSED_IDS" | tr '\n' ',' | sed 's/,$//')
      SKIPPED_LIST=$(echo "$SKIPPED_IDS" | tr '\n' ',' | sed 's/,$//')
      INFRA_SKIPPED_LIST=$(echo "$INFRA_SKIPPED_IDS" | tr '\n' ',' | sed 's/,$//')
      ALREADY_RESOLVED_LIST=$(echo "$ALREADY_RESOLVED_IDS" | tr '\n' ',' | sed 's/,$//')
      BLOCKED_BY_UNMET_LIST=$(echo "$BLOCKED_BY_UNMET_IDS" | tr '\n' ',' | sed 's/,$//')
      GATE_BLOCKED_LIST=$(echo "$GATE_BLOCKED_IDS" | tr '\n' ',' | sed 's/,$//')
      DECISION_UNRESOLVED_LIST=$(echo "$DECISION_UNRESOLVED_IDS" | tr '\n' ',' | sed 's/,$//')
      NOT_STARTED_LIST=$(echo "$NOT_STARTED_IDS" | tr '\n' ',' | sed 's/,$//')
      UNVERIFIED_LIST=$(echo "$UNVERIFIED_DISPLAY_IDS" | grep -v '^[[:space:]]*$' | tr '\n' ',' | sed 's/,$//')

      printf '\n=== Autodev Summary ===\n\n'
      if [ "$CLOSED_CANCELLED" -gt 0 ]; then
        printf 'Passed       (%d): %s  (%d implemented, %d cancelled: %s)\n' "$PASSED_COUNT" "$${PASSED_LIST:-none}" "$CLOSED_IMPLEMENTED" "$CLOSED_CANCELLED" "$CANCELLED_LIST"
      else
        printf 'Passed       (%d): %s\n' "$PASSED_COUNT" "$${PASSED_LIST:-none}"
      fi
      printf 'Skipped      (%d): %s\n' "$SKIPPED_COUNT" "$${SKIPPED_LIST:-none}"
      if [ "$INFRA_SKIPPED_COUNT" -gt 0 ]; then
        printf 'Infra-skipped (%d): %s  (transient kill — just re-run)\n' "$INFRA_SKIPPED_COUNT" "$INFRA_SKIPPED_LIST"
      fi
      if [ "$ALREADY_RESOLVED_COUNT" -gt 0 ]; then
        printf 'Already-resolved (%d): %s  (pre-flight skip — no refinement attempted)\n' "$ALREADY_RESOLVED_COUNT" "$ALREADY_RESOLVED_LIST"
      fi
      if [ "$BLOCKED_BY_UNMET_COUNT" -gt 0 ]; then
        printf 'Blocked-by-unmet (%d): %s  (unmet blocked_by deps — resolve them, then re-run)\n' "$BLOCKED_BY_UNMET_COUNT" "$BLOCKED_BY_UNMET_LIST"
      fi
      if [ "$GATE_BLOCKED_COUNT" -gt 0 ]; then
        printf 'Gate-blocked (%d): %s  (prove deps with /ll:explore-api, then re-run)\n' "$GATE_BLOCKED_COUNT" "$GATE_BLOCKED_LIST"
      fi
      if [ "$DECISION_UNRESOLVED_COUNT" -gt 0 ]; then
        printf 'Decision-unresolved (%d): %s  (resolve with /ll:decide-issue, then re-run)\n' "$DECISION_UNRESOLVED_COUNT" "$DECISION_UNRESOLVED_LIST"
      fi
      SPIKE_INCONCLUSIVE_LIST=$(grep -v '^[[:space:]]*$' ${context.run_dir}/autodev-spike-inconclusive.txt 2>/dev/null | sort -u | tr '\n' ',' | sed 's/,$//' || true)
      if [ -n "$SPIKE_INCONCLUSIVE_LIST" ]; then
        printf 'Spike-inconclusive (%d): %s  (fix the cause, run /ll:spike <ID> --force, then re-run)\n' "$(echo "$SPIKE_INCONCLUSIVE_LIST" | tr ',' '\n' | wc -l | tr -d ' ')" "$SPIKE_INCONCLUSIVE_LIST"
      fi
      PROPOSAL_UNSOUND_LIST=$(grep -v '^[[:space:]]*$' ${context.run_dir}/autodev-proposal-unsound.txt 2>/dev/null | sort -u | tr '\n' ',' | sed 's/,$//' || true)
      if [ -n "$PROPOSAL_UNSOUND_LIST" ]; then
        printf 'Proposal-unsound (%d): %s  (selected proposal refuted, no alternative; revise ## Proposed Solution, then re-run)\n' "$(echo "$PROPOSAL_UNSOUND_LIST" | tr ',' '\n' | wc -l | tr -d ' ')" "$PROPOSAL_UNSOUND_LIST"
      fi
      PROOF_GATE_INFRA_LIST=$(grep -v '^[[:space:]]*$' ${context.run_dir}/autodev-proof-gate-infra.txt 2>/dev/null | sort -u | tr '\n' ',' | sed 's/,$//' || true)
      if [ -n "$PROOF_GATE_INFRA_LIST" ]; then
        printf 'Proof-gate-infra [infra] (%d): %s  (check-gate produced no verdict before implement; retry later)\n' "$PROOF_GATE_INFRA_COUNT" "$PROOF_GATE_INFRA_LIST"
      fi
      if [ "$NOT_STARTED_COUNT" -gt 0 ]; then
        printf 'Not-started  (%d): %s  (never reached implementation — Phase 1 rejected)\n' "$NOT_STARTED_COUNT" "$NOT_STARTED_LIST"
      fi
      if [ "$QUALITY_FAILED_COUNT" -gt 0 ]; then
        printf 'Quality-failed (%d): %s  (marked done but gate failed — review these commits; rerun will not re-gate)\n' "$QUALITY_FAILED_COUNT" "$QUALITY_FAILED_LIST"
      fi
      if [ "$QUALITY_INFRA_COUNT" -gt 0 ]; then
        printf 'Quality-gate-infra [infra] (%d): %s  (gate crashed — re-run the oracle manually)\n' "$QUALITY_INFRA_COUNT" "$QUALITY_INFRA_LIST"
      fi
      if [ "$QUALITY_GATED_COUNT" -gt 0 ] && [ $((QUALITY_FAILED_COUNT + QUALITY_INFRA_COUNT)) -eq "$QUALITY_GATED_COUNT" ]; then
        printf 'Hint: every gated issue failed the quality gate — if the base branch is already red, re-run with --context quality_gate=false (auto-refine-and-implement forwards quality_gate too)\n'
      fi
      if [ "$UNVERIFIED_DISPLAY_COUNT" -gt 0 ]; then
        printf 'Unverified   (%d): %s  (threshold passed; implementation did not close — re-queue to retry)\n' "$UNVERIFIED_DISPLAY_COUNT" "$UNVERIFIED_LIST"
      fi
      # finalize_rate_limited stamps the stop reason; the queue still holds
      # every issue never dequeued, so surface it rather than dropping it.
      STOP_REASON=$(cat ${context.run_dir}/autodev-stop-reason 2>/dev/null | tr -d '[:space:]' || true)
      [ -z "$STOP_REASON" ] && STOP_REASON=completed
      PENDING_IDS=$(cat ${context.run_dir}/autodev-queue.txt 2>/dev/null \
        | grep -v '^[[:space:]]*$' || true)
      PENDING_COUNT=$(echo "$PENDING_IDS" | grep -c '[^[:space:]]' || true)
      [ -z "$PENDING_COUNT" ] && PENDING_COUNT=0
      if [ "$STOP_REASON" != completed ]; then
        PENDING_LIST=$(echo "$PENDING_IDS" | tr '\n' ',' | sed 's/,$//')
        printf 'Stopped early: %s — pending (%d): %s  (re-run to continue)\n' "$STOP_REASON" "$PENDING_COUNT" "$${PENDING_LIST:-none}"
      fi
      printf '\n'

      # BUG-2908: verdict reflects verified closure, not threshold-pass. A run
      # only reports success/partial when at least one issue is verifiably
      # implemented (ENH-3613: cancelled closures do not count, matching
      # BUG-3449 in auto-refine-and-implement); anything staged-but-unverified or abandoned mid-flight makes
      # it phantom regardless of legitimate skips (decomposed/gate-blocked/
      # decision-unresolved/low-readiness parking is not a failure signal).
      if [ "$CLOSED_IMPLEMENTED" -gt 0 ] && [ "$UNVERIFIED_COUNT" -eq 0 ] && [ "$ABANDONED" -eq 0 ]; then
        VERDICT=success
      elif [ "$CLOSED_IMPLEMENTED" -gt 0 ]; then
        VERDICT=partial
      elif [ "$UNVERIFIED_COUNT" -gt 0 ] || [ "$ABANDONED" -gt 0 ]; then
        VERDICT=phantom
      elif [ "$NOT_STARTED_COUNT" -gt 0 ]; then
        # ENH-2989: a Phase 1 rejection is a legitimate parking outcome, not
        # an infrastructure failure — distinct from both `phantom` (a real
        # implementation failure) and `no-op` (nothing implemented,
        # including an all-cancelled run; refine/wire/confidence-check ran here
        # before the rejection).
        VERDICT=not_started
      else
        VERDICT=no-op
      fi
      # A rate-limit stop is an interrupted run, not a phantom implementation
      # failure: the in-flight issue (if any) is already counted as abandoned
      # above, and the verdict names the stop so callers can retry.
      if [ "$STOP_REASON" = rate_limit ]; then
        VERDICT=rate_limited
      fi

      printf '{"verdict":"%s","closed":%s,"not_closed":%s,"skipped":%s,"gate_blocked":%s,"decision_unresolved":%s,"not_started":%s,"inflight_unresolved":%s,"abandoned":%s,"stop_reason":"%s","pending":%s,"proof_gate_infra":%s,"closed_implemented":%s,"closed_cancelled":%s,"quality_failed":%s,"quality_gate_infra":%s}\n' \
        "$VERDICT" "$PASSED_COUNT" "$UNVERIFIED_COUNT" "$SKIPPED_COUNT" "$GATE_BLOCKED_COUNT" "$DECISION_UNRESOLVED_COUNT" "$NOT_STARTED_COUNT" "$ABANDONED" "$ABANDONED" "$STOP_REASON" "$PENDING_COUNT" "$PROOF_GATE_INFRA_COUNT" "$CLOSED_IMPLEMENTED" "$CLOSED_CANCELLED" "$QUALITY_FAILED_COUNT" "$QUALITY_INFRA_COUNT" \
        > ${context.run_dir}/summary.json

      # BUG-2908: route the FSM terminal on verified closure, not "reached the
      # end" — mirrors BUG-2636's fix to auto-refine-and-implement.yaml's
      # finalize. Only `phantom` diverts to `failed`; success/partial/no-op
      # (a genuinely empty, fully-parked or all-cancelled backlog) still render `done`.
      case "$VERDICT" in
        phantom) exit 1 ;;
        *) exit 0 ;;
      esac
    fragment: shell_exit
    on_yes: done
    on_no: failed
    # ENH-2825: if the summary itself cannot be emitted, the operator has no
    # record of what passed or skipped — exit 2 rather than reporting success.
    on_error: failed
  failed:
    terminal: true
    failure: true
  done:
    # Bare terminal. The run summary (summary.json, inflight/abandoned
    # accounting) is written by finalize_done, which every exit — including
    # rate-limit stops via finalize_rate_limited — routes through first.
    terminal: true
