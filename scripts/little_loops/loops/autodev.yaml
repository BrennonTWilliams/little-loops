name: "autodev"
category: issue-management
description: |
  Targeted refine-and-implement for a specific set of issues. Accepts a single
  issue ID or a comma-separated list. Interleaves refinement and implementation:
  refines one issue; on threshold pass, implements it immediately via
  `ll-auto --only`; on decomposition into children, prepends children to the
  queue depth-first and refines them before the next sibling. First
  implementation runs as soon as the first leaf passes refinement.

  Unlike auto-refine-and-implement, this loop does not poll the backlog and
  does not maintain a skip list — the input set is finite and fixed.

  Usage:
    ll-loop run autodev "ISSUE_ID"
    ll-loop run autodev "ID1,ID2,ID3"
initial: init
max_steps: 500
# Step-cap exits run finalize_step_capped once so summary.json is still written.
on_max_steps: finalize_step_capped
timeout: 28800
on_handoff: spawn
# ENH-3623: the second-pass preparation ladder (size review, wire/refine repair,
# rescoring, reconcile/design remedies, go/no-go) lives in the prepare-issue dispatch
# loop (little_loops.preparation_policy). Its step cap (prepare-issue max_steps)
# bounds each issue's ladder, so this run-level max_steps only counts autodev's own
# queue / gate / implement states. capture_reachability_ok left with the ladder.
scope:
- "${context.run_dir}"
# BUG-2526: serialize loop-name conflicts at the lock layer so two concurrent
# `ll-loop run autodev` instances do not both shell out to `ll-auto --only`
# on the main working tree (corrupts .auto-manage-state.json and git state).
singleton: true
context:
  # readiness_threshold / outcome_threshold are seeded at launch from
  # commands.confidence_gate.{readiness,outcome}_threshold in ll-config.json
  # (defaults 85 / 65). Declaring them here would shadow that config —
  # override per-run with `--context readiness_threshold=NN` instead (BUG-2767).
  # Learning-gate skip knob: parity with `ll-auto --skip-learning-gate`. Threaded
  # into implement_current's inner `ll-auto --only` via the SKIP_FLAG. Default
  # empty = the ENH-2319 gate stays active (config-gated by learning_tests.enabled).
  # Passed down from auto-refine-and-implement via with: so the sprint path honors it too.
  #   ll-loop run autodev <ids> --context skip_learning_gate=1
  skip_learning_gate: ""
  # ENH-3633: opt-in second-model readiness consult on the refine-to-ready-issue
  # done path, reached via prepare-issue's context_passthrough. Default empty =
  # off. Veto-only, fails open on any helper error/timeout.
  #   ll-loop run autodev <ids> --context advise_ready=1
  advise_ready: ""
  # ENH-3590: opt-in second-model veto consult on the go/no-go waiver (the
  # oversized_atomic GO path only), reached via prepare-issue's select_step.
  # Default empty = off, today's behavior unchanged. Veto-only: it can block a
  # waiver go/no-go granted, never grant one. Fails open on any helper error.
  #   ll-loop run autodev <ids> --context advise_go_no_go=1
  advise_go_no_go: ""
  # FEAT-3573: post-implement quality gate. "true" (default) makes closure credit for
  # an implemented (done/completed) issue depend on a passing format-check/lint/type/
  # test run recorded against the commit it produced. Set "false" to fall back to the
  # old status-only closure check (e.g. a repo whose base branch is already red).
  #   ll-loop run autodev <ids> --context quality_gate=false
  # Forwarded from auto-refine-and-implement via with: so the sprint/EPIC path honors it.
  quality_gate: "true"
import:
- lib/common.yaml

states:
  init:
    # Validate input, reset autodev tmp files, and seed the unified queue from
    # the comma-separated context.input. The same ${context.run_dir}/autodev-queue.txt
    # serves both refinement and implementation throughout — there is no
    # separate impl queue.
    action: |
      mkdir -p .loops/tmp
      # Write context.input via a quoted heredoc so shell metacharacters in the
      # value are read literally, not paste-injected into bash (BUG-2622).
      cat > ${context.run_dir}/autodev-input.txt <<'LL_INPUT_EOF'
      ${context.input}
      LL_INPUT_EOF
      if ! grep -q '[^[:space:]]' ${context.run_dir}/autodev-input.txt; then
        echo "ERROR: input is required. Usage: ll-loop run autodev \"ID1,ID2\""
        exit 1
      fi
      printf '' > ${context.run_dir}/autodev-staged.txt
      printf '' > ${context.run_dir}/autodev-passed.txt
      printf '' > ${context.run_dir}/autodev-unverified.txt
      printf '' > ${context.run_dir}/autodev-skipped.txt
      printf '' > ${context.run_dir}/autodev-gate-blocked.txt
      printf '' > ${context.run_dir}/autodev-decision-unresolved.txt
      printf '' > ${context.run_dir}/autodev-spike-inconclusive.txt
      printf '' > ${context.run_dir}/autodev-proposal-unsound.txt
      printf '' > ${context.run_dir}/autodev-proof-gate-infra.txt
      printf '' > ${context.run_dir}/autodev-not-started.txt
      printf '' > ${context.run_dir}/autodev-not-started-attempts.txt
      rm -f ${context.run_dir}/autodev-inflight
      rm -f ${context.run_dir}/autodev-stop-reason
      tr ',' '\n' < ${context.run_dir}/autodev-input.txt \
        | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' \
        | grep -v '^[[:space:]]*$' \
        > ${context.run_dir}/autodev-queue.txt
      COUNT=$(wc -l < ${context.run_dir}/autodev-queue.txt | tr -d ' ')
      echo "Queued $COUNT issue(s) for autodev"
    fragment: shell_exit
    on_yes: dequeue_next
    on_no: finalize_done
    on_error: finalize_done

  dequeue_next:
    # Pop the head of the unified queue; snapshot current active issue IDs as
    # the per-iteration baseline for child detection; clear the broke-down
    # handshake flags so each iteration starts clean. Captures the ID as
    # 'input' so context_passthrough forwards it to refine-to-ready-issue as
    # context.input. Exits 1 (→ done) when the queue is empty.
    action: |
      if [ ! -s ${context.run_dir}/autodev-queue.txt ]; then
        exit 1
      fi
      CURRENT=$(head -1 ${context.run_dir}/autodev-queue.txt)
      tail -n +2 ${context.run_dir}/autodev-queue.txt > ${context.run_dir}/autodev-queue.tmp
      mv ${context.run_dir}/autodev-queue.tmp ${context.run_dir}/autodev-queue.txt

      # BUG-1226: record the in-flight issue so `done` can surface it if the
      # loop terminates before this issue reaches a clean resolution
      # (prep apply / enqueue_children / next dequeue_next overwrite).
      printf '%s' "$CURRENT" > ${context.run_dir}/autodev-inflight
      # ENH-3623: per-issue pass id for the preparation fact log
      # (prep-facts/<ID>.jsonl). Each dequeue starts a new pass, so a re-dequeued
      # issue gets fresh ladder budgets. A crash after this increment replays it and
      # skips a pass number, which is harmless (the skipped pass has no facts). The
      # prep-pass-* glob is also the run's dequeued-ID set.
      P=$(cat ${context.run_dir}/prep-pass-$CURRENT 2>/dev/null || echo 0)
      printf '%s' "$((P + 1))" > ${context.run_dir}/prep-pass-$CURRENT

      rm -f ${context.run_dir}/refine-broke-down
      # ENH-3075: per-issue marker shared with oracles/resolve-decision.yaml
      # (which now owns deposit_options/record_options_deposited). It IS cleared
      # here: it gates a bounded retry that should be available again if this
      # issue is re-dequeued in the same run, not a one-shot-per-issue bound (the
      # write-once bound comes from the marker's presence, not from this clear).
      rm -f ${context.run_dir}/decide-options-deposited-$CURRENT

      # FEAT-2751: snapshot the pre-refine Readiness score per-issue; the
      # preparation policy's reconcile rule reads it to detect a readiness
      # plateau. Reset the repair-cycle counter projection (prep record rewrites
      # it from the pass's done facts), which is run-dir-scoped and would
      # otherwise leak across issues.
      (ll-issues show "$CURRENT" --json | python3 -c "
      import json, sys
      try:
          d = json.load(sys.stdin)
          print(d.get('confidence') or '')
      except Exception:
          pass
      " > ${context.run_dir}/autodev-pre-readiness.txt) || true
      printf '0' > ${context.run_dir}/autodev-repair-cycle-count.txt
      # ENH-3623: the ladder's per-pass budgets (contradiction reconcile,
      # pre-deferral / atomic design remedies, rescore retries, guard-2 provenance)
      # are derived from the pass's own facts, so no handshake file needs a reset.
      # Snapshot the active IDs: the policy's child scan and detect_children diff
      # against this per-pass baseline.

      (ll-issues list --json | python3 -c "
      import json, sys
      try:
          issues = json.load(sys.stdin)
          for i in sorted(i['id'] for i in issues):
              print(i)
      except Exception:
          pass
      " > ${context.run_dir}/autodev-pre-ids.txt) || true

      echo "$CURRENT"
    fragment: queue_pop
    capture: input
    on_yes: check_status_at_dequeue
    on_no: finalize_done
    on_error: finalize_done

  check_status_at_dequeue:
    # ENH-2868: status pre-flight gate. autodev is invoked with explicit
    # comma-separated ID lists (by hand, by auto-refine-and-implement, and by
    # the sprint path) and those lists go stale — an issue completed
    # out-of-band in a parallel worktree, cancelled during triage, or deferred
    # by a prior run. Without this gate the stale ID burns a full
    # refine-to-ready-issue delegation (format → refine → wire →
    # confidence-check, four LLM calls) before any downstream guard notices:
    # every existing status check is downstream (rn-implement's
    # check_issue_status, BUG-2201; issue_manager's active-status filter under
    # implement_current's inner `ll-auto --only`), and autodev's own
    # [SKIP-DEFER] guards only defend the status *write* side.
    #
    # `deferred` is in the skip set deliberately: ENH-2666 made `deferred` the
    # unified not-ready exit for autodev's own gates, with visibility owned by
    # `ll-issues deferred-triage` rather than by re-evaluating the issue on
    # every run. Re-passing a deferred ID therefore skips by policy; clear it
    # with `ll-issues set-status <ID> open` to force a retry. `blocked` is NOT
    # skipped — the status value is distinct from unmet `blocked_by` deps
    # (which rn-implement's check_blocked_by already gates), and refining a
    # blocked issue is often what unblocks it.
    #
    # `ll-issues show --json` reports status display-cased ("Done", "Deferred")
    # — lowercase before comparing, the same idiom as record_reentry_exhausted
    # and mark_gate_blocked. Fail-open: an unresolvable ID, missing status, or
    # parse error yields PROCESS so a gate error never blocks the queue.
    action_type: shell
    action: |
      ID="${captured.input.output}"  # ll-lint: mr11-ok(captured.input.output) ENH-3358 - ENH-3342 widening residual, tracked for conversion
      STATUS=$(ll-issues show "$ID" --json 2>/dev/null \
        | python3 -c "import json,sys; print((json.load(sys.stdin).get('status') or '').lower())" \
        2>/dev/null || echo "")
      case "$STATUS" in
        done|completed|cancelled|deferred)
          echo "SKIP_CLOSED $STATUS" ;;
        *)
          echo "PROCESS" ;;
      esac
    evaluate:
      type: output_contains
      pattern: "SKIP_CLOSED"
    capture: dequeue_status
    on_yes: skip_already_resolved
    on_no: check_blockers_at_dequeue
    on_error: check_blockers_at_dequeue

  skip_already_resolved:
    # ENH-2868: ledger a pre-flight status skip and advance the queue. Uses the
    # `already_<status>` reason stem so finalize_done can surface it as its own
    # bucket rather than misattributing it as a refine-quality failure (the
    # same separate-bucket rationale as ENH-2727's refine_failed_infra).
    # Clears autodev-inflight like skip_inflight so BUG-1226's done-state
    # warning is not triggered for an issue that resolved cleanly.
    action: |
      # ll-lint: mr11-ok(captured.dequeue_status.output) ENH-3358 - ENH-3342 widening residual, tracked for conversion
      STATUS=$(printf '%s' "${captured.dequeue_status.output}" \
        | awk '/SKIP_CLOSED/ {print $2; exit}')
      [ -n "$STATUS" ] || STATUS=resolved
      echo "${captured.input.output}  already_$STATUS" >> ${context.run_dir}/autodev-skipped.txt  # ll-lint: mr11-ok(captured.input.output) ENH-3358 - ENH-3342 widening residual, tracked for conversion
      rm -f ${context.run_dir}/autodev-inflight
      echo "[SKIP-CLOSED] ${captured.input.output} already $STATUS; no refinement attempted"  # ll-lint: mr11-ok(captured.input.output) ENH-3358 - ENH-3342 widening residual, tracked for conversion
    fragment: queue_track
    action_type: shell
    next: dequeue_next
    on_error: dequeue_next

  check_blockers_at_dequeue:
    # ENH-2909: cheap upfront gate ported from rn-implement.yaml's check_blocked_by
    # (ENH-2008, lines ~407-510). If the dequeued issue has unmet `blocked_by`
    # frontmatter deps (any blocker not yet done/cancelled), skip it BEFORE
    # spending a full refine → wire → confidence-check cycle on a structurally
    # doomed issue — that chain can never move scores past a declared blocker.
    #
    # Deliberately parses the issue file's YAML frontmatter directly rather than
    # `ll-issues show --json`, matching rn-implement's posture: shell-escape
    # safety and consistency with the existing get_frontmatter/get_blocked_by
    # idiom (handles both list and comma-separated scalar forms).
    #
    # BUG-2897: `deferred` is non-terminal for dependency purposes — only
    # done/cancelled resolve a blocking edge, so a deferred blocker still counts
    # as unmet here.
    #
    # Fail-open: unresolved issue file, parse error, or an inability to compute
    # the done-set all yield no unmet deps -> READY -> refine_current.
    # Processing is never blocked on a gate error.
    action_type: shell
    action: |
      ID="${captured.input.output}"  # ll-lint: mr11-ok(captured.input.output) ENH-3358 - ENH-3342 widening residual, tracked for conversion
      cat > "${context.run_dir}/check_blockers_at_dequeue-input.txt" << 'LL_RAW_9F3C1A7E_EOF'
      ${captured.input.output}
      LL_RAW_9F3C1A7E_EOF
      UNMET=$(python3 << 'PYEOF'
      import re, subprocess, json, sys
      from pathlib import Path
      try:
          import yaml as _yaml
          def _parse_yaml(text):
              return _yaml.safe_load(text) or {}
      except ImportError:
          def _parse_yaml(text):
              result = {}
              for line in text.splitlines():
                  m = re.match(r'^([\w-]+):\s*(.*)', line)
                  if m:
                      result[m.group(1)] = m.group(2).strip()
              return result

      with open("${context.run_dir}/check_blockers_at_dequeue-input.txt") as _f:
          issue_id = _f.read().rstrip("\n")

      issue_path = None
      for d in (".issues/bugs", ".issues/features", ".issues/enhancements", ".issues/epics"):
          dp = Path(d)
          if not dp.exists():
              continue
          for p in dp.glob("*.md"):
              m = re.match(r'P\d-([A-Z]+-\d+)-', p.name)
              if m and m.group(1) == issue_id:
                  issue_path = p
                  break
          if issue_path:
              break

      if not issue_path:
          print("UNRESOLVED", file=sys.stderr)
          sys.exit(0)  # unresolved -> fail-open

      try:
          content = issue_path.read_text()
          m = re.match(r'^---\n(.*?)\n---', content, re.DOTALL)
          fm = _parse_yaml(m.group(1)) if m else {}
      except Exception:
          print("PARSE_ERROR", file=sys.stderr)
          sys.exit(0)  # parse error -> fail-open

      val = fm.get("blocked_by") or []
      if isinstance(val, str):
          deps = [v.strip() for v in val.split(",") if v.strip()]
      else:
          deps = [str(v).strip() for v in (val if isinstance(val, list) else []) if v]

      if not deps:
          sys.exit(0)  # no deps -> ready

      done_ids = set()
      try:
          r = subprocess.run(
              ["ll-issues", "list", "--json", "--status", "done"],
              capture_output=True, text=True, timeout=30,
          )
          if r.returncode == 0:
              done_ids = {i["id"] for i in json.loads(r.stdout) if "id" in i}
          else:
              print("DONE_SET_ERROR", file=sys.stderr)
              sys.exit(0)  # cannot determine done set -> fail-open
      except Exception:
          print("DONE_SET_ERROR", file=sys.stderr)
          sys.exit(0)  # fail-open

      # BUG-2897: deferred is non-terminal for dependency purposes; only
      # done/cancelled resolve an edge. done_ids above is already scoped to
      # --status done, so a deferred blocker naturally stays "unmet" here.
      unmet = [d for d in deps if d not in done_ids]
      if unmet:
          print(" ".join(unmet))
      PYEOF
      )
      if [ -n "$UNMET" ]; then
        echo "[BLOCKED_BY] $ID has unmet deps:$UNMET"
        echo "BLOCKED"
      else
        echo "READY"
      fi
    evaluate:
      type: output_contains
      pattern: "BLOCKED"
    capture: blockers_status
    on_yes: skip_blocked
    on_no: check_gate_at_dequeue
    on_error: check_gate_at_dequeue

  skip_blocked:
    # ENH-2909: ledger a pre-flight blocker skip and advance the queue. Uses
    # the `blocked_by_unmet` reason stem so finalize_done can surface it as its
    # own bucket, mirroring ENH-2868's already_* bucket. Unlike rn-implement's
    # mark_deferred, this does NOT set status:deferred — the issue remains
    # `open` and will be re-checked on its next dequeue (queue-scheduling
    # changes are out of scope, per the issue's Scope Boundaries).
    action: |
      echo "${captured.input.output}  blocked_by_unmet" >> ${context.run_dir}/autodev-skipped.txt  # ll-lint: mr11-ok(captured.input.output) ENH-3358 - ENH-3342 widening residual, tracked for conversion
      rm -f ${context.run_dir}/autodev-inflight
      echo "[SKIP-BLOCKED] ${captured.input.output} has unmet blocked_by deps; no refinement attempted"  # ll-lint: mr11-ok(captured.input.output) ENH-3358 - ENH-3342 widening residual, tracked for conversion
    fragment: queue_track
    action_type: shell
    next: dequeue_next
    on_error: dequeue_next

  check_gate_at_dequeue:
    # ENH-3148: recognize an issue that is explicitly gated by policy BEFORE
    # spending refine_current's format -> refine -> wire -> confidence-check
    # cycle on an issue that cycle cannot unblock (measured cost: $4.48 /
    # 38m37s / 36 iterations on one FEAT-3145 run, per this issue's Summary).
    # Detection signals, in preference order: (1) structural frontmatter `gate`
    # field and (2) prose gate-phrase matching, both resolved by
    # `ll-issues check-gate` (ENH-3575 extracted the regex BUG-3147/ENH-3148
    # had duplicated inline); (3) a placeholder Acceptance Criteria section (no checkbox
    # items, and its prose reads as a deferral note) is independently
    # disqualifying since the gate cannot be verified either way.
    #
    # Fail-open: unresolved issue file or parse error yields GATE_NO ->
    # refine_current, matching check_blockers_at_dequeue's posture -- a gate
    # error never blocks the queue.
    action_type: shell
    action: |
      ID="${captured.input.output}"  # ll-lint: mr11-ok(captured.input.output) ENH-3358 - ENH-3342 widening residual, tracked for conversion
      ISSUE_FILE=$(ll-issues path "$ID" 2>/dev/null || echo "")
      GATED="false"
      if [ -n "$ISSUE_FILE" ] && [ -f "$ISSUE_FILE" ]; then
        # ENH-3575: structured `gate` field first, prose fallback inside the helper.
        # Empty output (helper error / exit 2) is fail-open: treated as no verdict.
        VERDICT=$(ll-issues check-gate "$ID" 2>/dev/null || true)
        case "$VERDICT" in
          structured_open|prose) GATED="true" ;;
        esac
        # Placeholder-AC runs only when the helper reports no gate signal at all
        # (`none`); a present `gate` field replaces both prose signals.
        if [ "$GATED" = "false" ] && [ "$VERDICT" = "none" ]; then
          PLACEHOLDER=$(ISSUE_FILE="$ISSUE_FILE" python3 << 'PYEOF'
      import os, re, sys
      from pathlib import Path
      path = Path(os.environ.get("ISSUE_FILE", ""))
      try:
          text = path.read_text()
      except Exception:
          sys.exit(0)
      m = re.search(r'(?ims)^##\s*Acceptance Criteria\s*\n(.*?)(?=\n##\s|\Z)', text)
      if not m:
          sys.exit(0)
      body = m.group(1).strip()
      if not body or re.search(r'^\s*-\s*\[[ xX]\]', body, re.MULTILINE):
          sys.exit(0)  # real checkbox criteria present -> not a placeholder
      if re.search(r'to be settled|to be determined|\bTBD\b', body, re.IGNORECASE):
          print("PLACEHOLDER")
      PYEOF
          )
          if [ "$PLACEHOLDER" = "PLACEHOLDER" ]; then
            GATED="true"
          fi
        fi
      fi
      if [ "$GATED" = "true" ]; then
        echo "[GATE-CHECK] $ID is explicitly gated; skipping remediation ladder"
        echo "GATE_YES"
      else
        echo "GATE_NO"
      fi
    evaluate:
      type: output_contains
      pattern: "GATE_YES"
    capture: gate_status
    on_yes: defer_gated
    on_no: refine_current
    on_error: refine_current

  defer_gated:
    # ENH-3148: gated issue deferred with a distinct, honest reason code
    # (blocked_by_gate) instead of low_readiness -- the remediation ladder
    # never ran, so "needs more refinement" would be misleading. Mirrors
    # mark_gate_blocked's deferral-write idiom, including the BUG-2729
    # postmortem guard: never flip an already-resolved issue to deferred.
    action: |
      ID="${captured.input.output}"  # ll-lint: mr11-ok(captured.input.output) ENH-3358 - ENH-3342 widening residual, tracked for conversion
      echo "$ID  blocked_by_gate" >> ${context.run_dir}/autodev-skipped.txt
      rm -f ${context.run_dir}/autodev-inflight
      STATUS=$(ll-issues show "$ID" --json 2>/dev/null \
        | python3 -c "import json,sys; print((json.load(sys.stdin).get('status') or '').lower())" \
        2>/dev/null || echo "")
      if [ "$STATUS" = "done" ] || [ "$STATUS" = "completed" ] || [ "$STATUS" = "cancelled" ]; then
        echo "[SKIP-DEFER] $ID already $STATUS; leaving status untouched"
      else
        ll-issues set-status "$ID" deferred --by automation --reason blocked_by_gate 2>/dev/null || true
        echo "[GATE-DEFER] $ID is explicitly gated by policy; deferred (blocked_by_gate)"
      fi
    action_type: shell
    next: dequeue_next
    on_error: dequeue_next

  refine_current:
    # Delegate all preparation of a single issue to the prepare-issue dispatch loop
    # (ENH-3623): refine-to-ready-issue plus the whole second-pass ladder (size
    # review, wire/refine repair, rescoring, reconcile/design remedies, go/no-go),
    # decided by little_loops.preparation_policy. context_passthrough forwards
    # captured.input as context.input to the sub-loop. The wrapper ends through
    # `ll-issues prep apply`, which writes exactly one prepare-issue record:
    # on_success = READY / DECOMPOSED / CANCELLED (wrapper `done`); on_failure = a
    # ledgered BLOCKED:* / DEFERRED:* stop or RETRYABLE_ERROR:* (wrapper `failed`, or
    # its step cap) — routed through route_refine_outcome so the queue advances
    # without passing an unprepared issue to implement_current.
    #
    # BUG-2611: do NOT add an `on_no:` key here. `_execute_delegate_state`
    # (executor.py) routes any non-"done" terminal — including a genuine
    # crash — through `on_no`, and schema.py's `on_no = on_no or on_failure`
    # means an explicit `on_no` silently shadows `on_failure`, permanently
    # dead-coding the skip_inflight route above. Leaving on_no unset lets it
    # fall back to on_failure's value ("route_refine_outcome"), which is correct for
    # every failure mode (crash, max_iterations, timeout, signal).
    # ENH-3607: on_failure routes through route_refine_outcome, which reads the
    # wrapper's run record; only RETRYABLE_ERROR:rate_limited diverts (to
    # finalize_rate_limited), every other token still reaches skip_inflight or
    # ledger_child_stop.
    # BUG-3390: no `fragment: with_rate_limit_handling` / `on_rate_limit_exhausted`
    # here — both are inert on a `loop:` call state. The inner loop's own rate-limit
    # handling writes a record with legacy_class=infra carrying rate_limit_exhausted,
    # which prepare-issue's apply turns into RETRYABLE_ERROR:rate_limited; the
    # wrapper's own slash states halt through its mark_rate_limited terminal
    # (same token).
    loop: prepare-issue
    context_passthrough: true
    on_success: copy_broke_down
    on_failure: route_refine_outcome
    # ENH-2727: on_error fires when the wrapper itself raised a runtime exception / was
    # signalled (a crash — no refine verdict was produced), which is an infra-class,
    # re-runnable failure by the issue's own definition ("host CLI SIGTERM'd, OOM,
    # crash"). Route it straight to skip_inflight_infra (refine_failed_infra) so it is
    # NOT laundered as a quality failure. This is complementary to — not a substitute
    # for — the on_failure path: the *evidenced* exit-143 case reaches the sub-loop's
    # `failed` terminal (on_no → on_failure → skip_inflight), where a MISSING (ENH-3600:
    # record-only, no sentinel) run-record token selects the same reason. Do NOT add
    # on_no here (BUG-2611): compiled on_no must keep falling back to on_failure
    # (skip_inflight), the record-driven path that catches the evidenced kill.
    on_error: skip_inflight_infra

  route_refine_outcome:
    # ENH-3607: failure-path router over the child's typed run record. Tokens
    # match exactly (closed RUN_RECORD_TOKENS vocabulary). An exhausted 429 in the
    # child's spike/decision path halts the run like autodev's own routes;
    # everything else keeps the existing skip behavior.
    action: >-
      ll-issues run-record read ${captured.input.output:shell}
      --run-dir ${context.run_dir} --writer prepare-issue --format token
    action_type: shell
    evaluate:
      type: classify
    # ENH-3609: the child's own ledgered stops go to ledger_child_stop (no
    # autodev-skipped row; the child already ledgered them in its marker file).
    # No edge to check_passed / detect_children: a
    # failed child never reuses the success path (ENH-1679).
    route:
      RETRYABLE_ERROR:rate_limited: finalize_rate_limited
      RETRYABLE_ERROR:infra: skip_inflight_infra
      BLOCKED:decision_unresolved: ledger_child_stop
      BLOCKED:proposal_unsound: ledger_child_stop
      DEFERRED:spike_inconclusive: ledger_child_stop
      # ENH-3605/ENH-3623 ledger-ownership rule: prepare-issue's `prep apply` already
      # wrote the stop's row (refine_failed, or the gate_unmet deferral reason), so
      # skip_inflight would double-count them.
      BLOCKED:quality: ledger_child_stop
      DEFERRED:gate_unmet: ledger_child_stop
      READY: skip_inflight
      BLOCKED: skip_inflight
      DECOMPOSED: skip_inflight
      CANCELLED: skip_inflight
      MISSING: skip_inflight
      _: skip_inflight
      _error: skip_inflight

  ledger_child_stop:
    # ENH-3609: a child stop already ledgered in its own marker file
    # (decision_unresolved / proposal_unsound / spike_inconclusive). Clear the
    # in-flight sentinel and advance WITHOUT an autodev-skipped row so
    # finalize_done does not double-count it as refine_failed. Same rule as
    # skip_inflight's marker greps, keyed on the record token instead.
    action: |
      rm -f ${context.run_dir}/autodev-inflight
    fragment: queue_track
    action_type: shell
    next: dequeue_next
    on_error: dequeue_next

  skip_inflight:
    # ENH-1679: record the in-flight issue as skipped and clear the inflight
    # sentinel so `done` does not surface a stale warning. Reached when
    # refine-to-ready-issue exits via its `failed` terminal or the executor
    # receives a signal/crash (on_error). Mirrors the skip_and_continue pattern
    # in auto-refine-and-implement.yaml.
    # ENH-2404: two-space-delimited "ID  REASON" (matches rn-implement.yaml
    # mark_deferred), so finalize can distinguish failure reasons.
    #
    # ENH-3600: classification is record-only now — this state was the sole
    # reader of the (now-unread) legacy termination-class sentinel file. The three
    # marker greps below run FIRST, unchanged: they are the only guard for a
    # MISSING record after a child stop (ledger_child_stop's route only fires
    # when a record IS present, ENH-3609). A MISSING token, or a failed record
    # read, routes to skip_inflight_infra (refine_failed_infra) exactly like
    # the old infra sentinel class did.
    # BUG-3390: refine-to-ready-issue's record_decision_unresolved writes the ID
    # to autodev-decision-unresolved.txt and exits `failed`; finalize_done
    # already surfaces that ledger as Decision-unresolved, so a refine_failed
    # line would double-count it under Skipped. -x: whole-line.
    # exit 0 (quality, ledgered here) → on_yes: dequeue_next; exit 1
    # (MISSING/error) → on_no: skip_inflight_infra.
    action: |
      ID="${captured.input.output}"  # ll-lint: mr11-ok(captured.input.output) BUG-3390 - ID bound once via quoted assignment
      if grep -qxF "$ID" ${context.run_dir}/autodev-decision-unresolved.txt 2>/dev/null; then
        echo "[DECISION_UNRESOLVED] $ID already ledgered by sub-loop; not counting as refine_failed"
        rm -f ${context.run_dir}/autodev-inflight
        exit 0
      fi
      # BUG-3593: same for a nested refine-to-ready spike_inconclusive stop — its
      # record_spike_inconclusive (child state) already deferred the issue and ledgered it.
      if grep -qxF "$ID" ${context.run_dir}/autodev-spike-inconclusive.txt 2>/dev/null; then
        echo "[SPIKE_INCONCLUSIVE] $ID already ledgered by sub-loop; not counting as refine_failed"
        rm -f ${context.run_dir}/autodev-inflight
        exit 0
      fi
      # BUG-3574: same for a nested refine-to-ready proposal_unsound stop.
      if grep -qxF "$ID" ${context.run_dir}/autodev-proposal-unsound.txt 2>/dev/null; then
        echo "[PROPOSAL_UNSOUND] $ID already ledgered by sub-loop; not counting as refine_failed"
        rm -f ${context.run_dir}/autodev-inflight
        exit 0
      fi
      TOKEN=$(ll-issues run-record read "$ID" --run-dir ${context.run_dir} \
        --writer prepare-issue --format token 2>/dev/null) || TOKEN=""
      if [ "$TOKEN" = "MISSING" ] || [ -z "$TOKEN" ]; then
        exit 1
      fi
      echo "$ID  refine_failed" >> ${context.run_dir}/autodev-skipped.txt
      rm -f ${context.run_dir}/autodev-inflight
    fragment: shell_exit
    action_type: shell
    on_yes: dequeue_next
    on_no: skip_inflight_infra
    on_error: dequeue_next

  skip_inflight_infra:
    # ENH-2727: infra-class sibling of skip_inflight. Reached when the refine
    # sub-loop's prepare-issue run-record token reads MISSING or fails to read
    # (ENH-3600: record-only, no sentinel) — an external SIGTERM/OOM/timeout
    # kill (exit 143/137/124) that is re-runnable rather than a
    # genuine refine-quality defect. Ledgers `refine_failed_infra` (GATE_FAILED_INFRA
    # stem-suffix precedent, rn-remediate.yaml) so the `done` summary and downstream
    # triage (skipped_breakdown, deferred-triage) surface it as a separate,
    # re-runnable bucket instead of misattributing it as a quality failure (the
    # on_error == on_no laundering ENH-1679 left un-fixed). Clears autodev-inflight
    # like skip_inflight so BUG-1226's done-state warning is not triggered.
    action: |
      echo "${captured.input.output}  refine_failed_infra" >> ${context.run_dir}/autodev-skipped.txt  # ll-lint: mr11-ok(captured.input.output) ENH-3358 - ENH-3342 widening residual, tracked for conversion
      rm -f ${context.run_dir}/autodev-inflight
    fragment: queue_track
    action_type: shell
    next: dequeue_next
    on_error: dequeue_next

  copy_broke_down:
    # ENH-3615/ENH-3623: reset refine-to-ready-issue's refine-broke-down flag
    # (0 at resolve_issue start, 1 at write_broke_down). Nothing reads it after
    # this state (route_refine_success reads the saved record); left at 1 it would
    # make a later `run-record write` in the same run turn a stop record into
    # DECOMPOSED (outcome_from_legacy_class rule 2). A selector re-entry through
    # refine_current re-runs the child, which rewrites it.
    action: |
      printf '0' > ${context.run_dir}/refine-broke-down
    action_type: shell
    next: route_refine_success
    on_error: route_refine_success

  route_refine_success:
    # ENH-3609: success-path router over the child's typed run record. Tokens
    # match exactly, so every RUN_RECORD_TOKENS member is listed. The wrapper's
    # `done` writes READY / DECOMPOSED / CANCELLED; READY, unsuffixed BLOCKED,
    # MISSING, _ and _error go to check_passed, whose fail-closed gate is the only
    # way to implement_current. Suffixed tokens cannot occur here; they fail safe.
    action: >-
      ll-issues run-record read ${captured.input.output:shell}
      --run-dir ${context.run_dir} --writer prepare-issue --format token
    action_type: shell
    evaluate:
      type: classify
    route:
      READY: check_passed
      BLOCKED: check_passed
      MISSING: check_passed
      DECOMPOSED: detect_children
      CANCELLED: skip_cancelled
      BLOCKED:decision_unresolved: skip_inflight
      BLOCKED:proposal_unsound: skip_inflight
      BLOCKED:quality: skip_inflight
      DEFERRED:gate_unmet: skip_inflight
      DEFERRED:spike_inconclusive: skip_inflight
      RETRYABLE_ERROR:infra: skip_inflight
      RETRYABLE_ERROR:rate_limited: skip_inflight
      _: check_passed
      _error: check_passed

  skip_cancelled:
    # ENH-3609: the child's record says the issue was cancelled during
    # refinement. Ledger `cancelled` and clear autodev-inflight (dequeue_next only
    # overwrites it when the queue is non-empty, so a last-issue cancel would
    # otherwise report inflight_unresolved). Not skip_already_resolved: that
    # stem means "closed before refinement".
    action: |
      echo "${captured.input.output}  cancelled" >> ${context.run_dir}/autodev-skipped.txt  # ll-lint: mr11-ok(captured.input.output) ENH-3358 - ENH-3342 widening residual, tracked for conversion
      rm -f ${context.run_dir}/autodev-inflight
    fragment: queue_track
    action_type: shell
    next: dequeue_next
    on_error: dequeue_next

  check_passed:
    # ENH-3623: the implementation gate after a completed preparation ladder.
    # prepare-issue's FINISH(ready) already applied the same predicate, so on_no /
    # on_cannot_judge (a gate that disagrees with the wrapper's READY) skips the
    # issue and on_error ledgers refine_failed_infra; nothing re-enters the ladder.
    # ENH-3625 first-gate rule: hard-AND the Program Design verdict
    # (`ll-issues check-design`) with the readiness/outcome gate, as the policy's
    # post-RUN_CHILD row and the run-record `ready` predicate do.
    # check-design exits 0 (pass or not armed), 1 (fails) or 2 (unresolved ID);
    # never 3, so it cannot collide with the harness_exit abstain code.
    # BUG-2908: records staged (not yet closure-verified) issues in
    # autodev-staged.txt — finalize_done promotes only those it can verify
    # closed to autodev-passed.txt.
    action: |
      ID="${captured.input.output}"  # ll-lint: mr11-ok(captured.input.output) ENH-3358 - ENH-3342 widening residual, tracked for conversion
      ll-issues check-readiness "$ID" \
        --readiness ${context.readiness_threshold:shell} \
        --outcome ${context.outcome_threshold:shell} \
        --honor-waiver \
        && ll-issues check-design "$ID" \
        && echo "$ID" >> ${context.run_dir}/autodev-staged.txt
    # BUG-3588: exit 3 = scores absent (on_cannot_judge).
    fragment: harness_exit
    on_yes: check_proof_defer_or_implement
    on_no: skip_inflight
    on_cannot_judge: skip_inflight
    on_error: skip_inflight_infra

  check_proof_defer_or_implement:
    # ENH-3575/ENH-3611: the only proof stage before implement_current (the spike
    # half, check_proof_gate_before_implement, was removed in ENH-3611; the child's
    # check_proof_before_done and the selectors' PROOF re-entry own the spike).
    # BUG-3603: fail-closed via classify routing — PROOF_CLEAR (a successful
    # check-gate call reporting no gate in force: none/structured_satisfied) is
    # the ONLY route to implement_current; prose joins structured_open/
    # structured_proof in PROOF_DEFER; helper failures and evaluator errors
    # (including any non-zero action exit, which the classify evaluator maps to
    # _error) route to the mark_proof_gate_infra deferral.
    action: |
      ID=${captured.input.output:shell}
      VERDICT=$(ll-issues check-gate "$ID" 2>/dev/null); RC=$?
      if [ "$RC" -ge 2 ] || [ -z "$VERDICT" ]; then
        echo "PROOF_INFRA"
      else
        case "$VERDICT" in
          structured_open|structured_proof|prose) echo "PROOF_DEFER" ;;
          none|structured_satisfied) echo "PROOF_CLEAR" ;;
          *) echo "PROOF_INFRA" ;;
        esac
      fi
    action_type: shell
    evaluate:
      type: classify
    route:
      PROOF_DEFER: defer_gated
      PROOF_CLEAR: implement_current
      PROOF_INFRA: mark_proof_gate_infra
      _: mark_proof_gate_infra
      _error: mark_proof_gate_infra

  implement_current:
    # Interleaved implementation: as soon as a leaf passes refinement, run
    # ll-auto --only against it. Exit 0 (on_yes) → dequeue_next for next
    # queued issue. Exit non-zero → check_impl_auth to detect auth failures
    # before deciding whether to drain the queue or abort.
    fragment: shell_exit
    capture: ll_auto_output
    action: |
      # BUG-1870: re-queue any stale inflight issue left by a prior context handoff.
      # On resume, init is bypassed so autodev-inflight may hold an issue that was
      # dequeued-but-not-yet-implemented when the previous session was interrupted.
      # The $INFLIGHT != $CURRENT guard makes this a no-op on normal (non-resumed) runs.
      INFLIGHT=$(cat "${context.run_dir}/autodev-inflight" 2>/dev/null | tr -d '[:space:]')
      CURRENT="${captured.input.output}"  # ll-lint: mr11-ok(captured.input.output) ENH-3358 - ENH-3342 widening residual, tracked for conversion
      if [ -n "$INFLIGHT" ] && [ "$INFLIGHT" != "$CURRENT" ]; then
        INFLIGHT_FILE=$(ll-issues path "$INFLIGHT" 2>/dev/null)
        STATUS="open"
        if [ -n "$INFLIGHT_FILE" ]; then
          STATUS=$(grep '^status:' "$INFLIGHT_FILE" | awk '{print $2}' | tr -d "'\"" 2>/dev/null || echo "open")
        fi
        if [ "$STATUS" != "done" ] && [ "$STATUS" != "cancelled" ]; then
          { echo "$INFLIGHT"; cat "${context.run_dir}/autodev-queue.txt" 2>/dev/null; } \
            > "${context.run_dir}/autodev-queue.tmp" \
            && mv "${context.run_dir}/autodev-queue.tmp" "${context.run_dir}/autodev-queue.txt"
        fi
      fi
      # Learning-gate skip parity: append --skip-learning-gate when the caller set
      # the skip_learning_gate context (mirrors `ll-auto --skip-learning-gate`).
      SKIP_FLAG=""
      if [ -n "${context.skip_learning_gate}" ]; then  # ll-lint: mr11-ok(context.skip_learning_gate) ENH-3358 - ENH-3342 widening residual, tracked for conversion
        SKIP_FLAG="--skip-learning-gate"
      fi
      # BUG-2594: tee to a run-dir file rather than relying solely on the
      # `capture:` value, so the learning-gate/auth-check fragments can grep a
      # file instead of interpolating untrusted Markdown into a shell string.
      # `set -o pipefail` preserves ll-auto's exit code through the `tee` pipe.
      # FEAT-3573: snapshot the base revision and the pre-existing dirty set BEFORE
      # ll-auto runs — a later snapshot already contains the deliverable (BUG-2963).
      # route_quality_gate diffs against these to scope the format stage.
      QDIR="${context.run_dir}/quality"
      mkdir -p "$QDIR"
      git rev-parse HEAD > "$QDIR/$CURRENT.base" 2>/dev/null || true
      { git diff --name-only HEAD; git ls-files --others --exclude-standard; } 2>/dev/null \
        | sort -u > "$QDIR/$CURRENT.base-dirty" || true
      set -o pipefail
      ll-auto --only "$CURRENT" $SKIP_FLAG 2>&1 | tee "${context.run_dir}/ll_auto_last.txt"
    action_type: shell
    on_yes: verify_impl_closed
    on_no: check_impl_reached
    on_error: check_impl_reached

  verify_impl_closed:
    # BUG-3390: `ll-auto --only` exits 0 on "Issues processed: 0" (dependency
    # cycle — postmortems/audit-loop-run-autodev-2026-07-29T013824.md) and other
    # no-ops, so exit 0 is not closure. Re-read status the way finalize_done
    # does and ledger a not-closed exit-0 NOW with a reason (finalize would only
    # discover it at the end, reason-less). Clear autodev-inflight on BOTH
    # branches — the success path never cleared it, leaving a stale BUG-1226
    # sentinel at terminal on clean runs. The ID stays in autodev-staged.txt
    # (it did stage); finalize_done dedupes against the reasoned line.
    action: |
      ID="${captured.input.output}"  # ll-lint: mr11-ok(captured.input.output) BUG-3390 - ID bound once via quoted assignment
      STATUS=$(ll-issues show "$ID" --json 2>/dev/null \
        | python3 -c "import json,sys; print((json.load(sys.stdin).get('status') or '').lower())" \
        2>/dev/null || echo "")
      rm -f ${context.run_dir}/autodev-inflight
      case "$STATUS" in
        done|completed|cancelled)
          echo "[IMPL-CLOSED] $ID $STATUS"
          exit 0 ;;
        *)
          if ! grep -qE "^$ID([[:space:]]|$)" ${context.run_dir}/autodev-unverified.txt 2>/dev/null; then
            echo "$ID  impl_exit0_not_closed" >> ${context.run_dir}/autodev-unverified.txt
          fi
          echo "[IMPL-NOT-CLOSED] $ID: ll-auto exited 0 but status is '$STATUS'; ledgered as unverified"
          exit 1 ;;
      esac
    fragment: shell_exit
    action_type: shell
    on_yes: route_quality_gate
    on_no: dequeue_next
    on_error: dequeue_next

  route_quality_gate:
    # FEAT-3573: decide whether the closure just verified needs the quality gate,
    # and compute the changed-file set the format stage is scoped to. Exit 1 →
    # dequeue_next: the gate is disabled (quality_gate=false) or the closure was
    # `cancelled` (nothing was implemented). Exit 2 (no recorded base revision, git
    # failure) → mark_quality_infra. verify_impl_closed already cleared
    # autodev-inflight, so this chain sits outside the inflight-clearing chain.
    #
    # Changed set = committed diff <base>..HEAD, plus uncommitted tracked changes and
    # untracked files MINUS the pre-existing dirty set snapshotted before ll-auto
    # (the operator's WIP is not the deliverable; mirrors BUG-2963). Deleted files
    # are dropped (--diff-filter=d). The format stage gets the subset matching
    # project.format_check_extensions (unset = every file).
    action: |
      ID=${captured.input.output:shell}
      QDIR=${context.run_dir}/quality
      mkdir -p "$QDIR"
      rm -f "$QDIR/$ID.json" "$QDIR/$ID.route"
      GATE=$(printf '%s' ${context.quality_gate:shell:default=true} | tr '[:upper:]' '[:lower:]')
      case "$GATE" in
        false|0|no|off)
          echo "[QUALITY-GATE] $ID: disabled (quality_gate=$GATE) — status-only closure credit"
          exit 1 ;;
      esac
      STATUS=$(ll-issues show "$ID" --json 2>/dev/null \
        | python3 -c "import json,sys; print((json.load(sys.stdin).get('status') or '').lower())" \
        2>/dev/null || echo "")
      if [ "$STATUS" = cancelled ]; then
        echo "[QUALITY-GATE] $ID: cancelled closure — nothing implemented, gate skipped"
        exit 1
      fi
      BASE=$(tr -d '[:space:]' < "$QDIR/$ID.base" 2>/dev/null || true)
      if [ -z "$BASE" ]; then
        echo "[QUALITY-GATE] $ID: no base revision recorded before implement_current" >&2
        exit 2
      fi
      [ -f "$QDIR/$ID.base-dirty" ] || : > "$QDIR/$ID.base-dirty"
      COMMITTED=$(git diff --name-only --diff-filter=d "$BASE..HEAD") || exit 2
      UNCOMMITTED=$({ git diff --name-only --diff-filter=d HEAD; git ls-files --others --exclude-standard; } \
        | sort -u | grep -vxFf "$QDIR/$ID.base-dirty" || true)
      printf '%s\n' "$UNCOMMITTED" | grep -v '^$' > "$QDIR/$ID.dirtyset" || true
      { printf '%s\n' "$COMMITTED"; printf '%s\n' "$UNCOMMITTED"; } \
        | grep -v '^$' | sort -u > "$QDIR/$ID.changed" || true
      EXTS=$(ll-config get project.format_check_extensions 2>/dev/null || true)
      LL_ARG_EXTS="$EXTS" python3 -c "
      import ast, json, os, sys
      raw = os.environ.get('LL_ARG_EXTS', '').strip()
      exts = []
      if raw:
          try:
              exts = json.loads(raw)
          except ValueError:
              try:
                  exts = ast.literal_eval(raw)
              except (ValueError, SyntaxError):
                  exts = []
      exts = tuple(exts) if isinstance(exts, (list, tuple)) else ()
      files = [l.strip() for l in open(sys.argv[1]) if l.strip()]
      keep = [f for f in files if not exts or f.endswith(exts)]
      open(sys.argv[2], 'w').write(''.join(f + chr(10) for f in keep))
      " "$QDIR/$ID.changed" "$QDIR/$ID.format-files" || exit 2
      echo "[QUALITY-GATE] $ID: gating $(grep -c . "$QDIR/$ID.changed" || true) changed file(s) against base $BASE"
      exit 0
    fragment: shell_exit
    on_yes: run_quality_gate
    on_no: dequeue_next
    on_error: mark_quality_infra

  run_quality_gate:
    # FEAT-3573: the deterministic post-implement verdict — oracles/code-run-gate
    # with its opt-in format stage (changed_files_path). resolve_via_ll_config makes
    # the oracle resolve test/lint/type/format-check commands (and src_dir) with
    # `ll-config get`, so .ll/ll.local.md overrides are honored. min_pass_rate 1.0 is
    # belt-and-braces: aggregate already fails on any non-zero test exit. The
    # credited verdict is this state's ROUTE, never the oracle's
    # subloop_outcome_<ID>.txt (resolve_commands pre-seeds GATE_PASS there).
    loop: oracles/code-run-gate
    with:
      issue_id: "${captured.input.output}"
      run_dir: "${context.run_dir}/quality/${captured.input.output}"
      min_pass_rate: 1.0
      changed_files_path: "${context.run_dir}/quality/${captured.input.output}.format-files"
      resolve_via_ll_config: "1"
    on_success: mark_quality_pass
    on_failure: mark_quality_fail
    on_error: mark_quality_infra

  mark_quality_pass:
    action_type: shell
    action: |
      printf 'pass' > ${context.run_dir}/quality/${captured.input.output:shell}.route
    next: record_quality_evidence
    on_error: dequeue_next

  mark_quality_fail:
    # An oracle that ends by timeout/signal/interrupt/step-budget routes on_failure
    # through the compiled on_no → on_failure fallback, which would misreport infra
    # as a quality verdict. Only terminated_by == "terminal" (the oracle reached its
    # own `failed` terminal) is a real gate failure; every other class is infra
    # (ENH-3366 delegate_failed precedent).
    action_type: shell
    action: |
      case ${captured.run_quality_gate.terminated_by:shell?} in
        terminal) ROUTE=fail ;;
        *) ROUTE=infra ;;
      esac
      printf '%s' "$ROUTE" > ${context.run_dir}/quality/${captured.input.output:shell}.route
    next: record_quality_evidence
    on_error: dequeue_next

  mark_quality_infra:
    # Oracle crash / context-resolution failure (sub-loop on_error), or
    # route_quality_gate could not compute the changed set.
    action_type: shell
    action: |
      mkdir -p ${context.run_dir}/quality
      printf 'infra' > ${context.run_dir}/quality/${captured.input.output:shell}.route
    next: record_quality_evidence
    on_error: dequeue_next

  record_quality_evidence:
    # FEAT-3573: write ${run_dir}/quality/<ID>.json — the evidence finalize_done
    # promotes on — and ledger a failed/infra gate as `ID  quality_gate_failed|
    # quality_gate_infra` in autodev-unverified.txt. The issue file is never
    # modified: a quality-failed issue stays `done` and committed. The verdict is
    # derived from the route (pass|fail|infra); stage outcomes are informational.
    # head_sha is recorded at gate time — finalize_done must not compare against the
    # live HEAD, which later queue items move.
    action_type: shell
    action: |
      LL_ARG_ID=${captured.input.output:shell} LL_ARG_RUN_DIR=${context.run_dir:shell} python3 - <<'PYEOF'
      import json
      import os
      import subprocess
      from pathlib import Path

      issue_id = os.environ["LL_ARG_ID"]
      run_dir = Path(os.environ["LL_ARG_RUN_DIR"])
      q = run_dir / "quality"
      oracle = q / issue_id

      def read(path):
          try:
              return Path(path).read_text().strip()
          except OSError:
              return ""

      def lines(path):
          return [x.strip() for x in read(path).splitlines() if x.strip()]

      route = read(q / f"{issue_id}.route")
      if route not in ("pass", "fail", "infra"):
          route = "infra"
      try:
          cmds = json.loads(read(oracle / "commands.json") or "{}")
      except ValueError:
          cmds = {}
      format_files = lines(q / f"{issue_id}.format-files")

      def stage(sidecar, cmd_key):
          text = read(oracle / sidecar)
          if not text:
              wanted = bool(cmds.get(cmd_key))
              if cmd_key == "format_check_cmd":
                  wanted = wanted and bool(format_files)
              return "absent" if wanted else "skip"
          if text.splitlines()[0].startswith("SKIP"):
              return "skip"
          rc = [x for x in text.splitlines() if x.startswith("exit_code=")]
          if not rc:
              return "killed"
          return "pass" if rc[-1] == "exit_code=0" else "fail"

      stages = {
          "format_check": stage("format-check.txt", "format_check_cmd"),
          "lint": stage("lint.txt", "lint_cmd"),
          "typecheck": stage("typecheck.txt", "typecheck_cmd"),
          "test": stage("test-results.txt", "test_cmd"),
      }
      prepatch = "absent"
      try:
          prepatch = json.loads(read(oracle / f"prepatch_evidence_{issue_id}.json")).get(
              "verdict", "absent"
          )
      except (ValueError, AttributeError):
          pass

      def git(*args):
          r = subprocess.run(["git", *args], capture_output=True, text=True)
          return r.stdout.strip() if r.returncode == 0 else ""

      base_sha = read(q / f"{issue_id}.base")
      history_base = None
      try:
          from little_loops.history_reader.runs import read_base_sha

          history_base = read_base_sha(issue_id)
      except Exception:
          pass

      if route == "fail":
          verdict = "GATE_FAILED"
      elif route == "infra":
          verdict = "GATE_INFRA"
      elif all(v == "skip" for v in stages.values()):
          verdict = "GATE_SKIP"
      else:
          verdict = "GATE_PASS"

      record = {
          "issue_id": issue_id,
          "base_sha": base_sha,
          "head_sha": git("rev-parse", "HEAD"),
          "dirty": bool(lines(q / f"{issue_id}.dirtyset")),
          "changed_files": lines(q / f"{issue_id}.changed"),
          "format_check": stages["format_check"],
          "lint": stages["lint"],
          "typecheck": stages["typecheck"],
          "test": stages["test"],
          "prepatch": prepatch,
          "route": route,
          "verdict": verdict,
      }
      if history_base and history_base != base_sha:
          record["history_base_sha"] = history_base
      (q / f"{issue_id}.json").write_text(json.dumps(record, indent=2) + "\n")

      reason = {"GATE_FAILED": "quality_gate_failed", "GATE_INFRA": "quality_gate_infra"}.get(verdict)
      if reason:
          ledger = run_dir / "autodev-unverified.txt"
          existing = read(ledger)
          if not any(x.split()[:1] == [issue_id] for x in existing.splitlines()):
              with ledger.open("a") as f:
                  f.write(f"{issue_id}  {reason}\n")
      print(f"[QUALITY-GATE] {issue_id}: {verdict} (route={route}) {stages}")
      PYEOF
    next: dequeue_next
    on_error: dequeue_next

  check_impl_reached:
    # ENH-2989: distinguishes "Phase 1 rejected, implementation never
    # attempted" (PHASE1_NOT_STARTED) from a genuine Phase 2 failure. Checked
    # BEFORE check_learning_gate/check_impl_auth: a Phase 1 rejection never
    # prints LEARNING_GATE_BLOCKED / IMPLEMENT_FAILED / the auth signatures,
    # so this ordering cannot steal a real failure from either downstream
    # check — it only catches the otherwise-unclassified case that used to
    # fall through to finalize_done and be reported as `phantom`.
    fragment: ll_auto_not_started_check
    on_yes: mark_not_started
    on_no: check_learning_gate
    on_error: check_learning_gate

  mark_not_started:
    # ENH-2989: terminal/requeue handling for a Phase 1 rejection. Mirrors
    # mark_gate_blocked's shape. Both the requeue and terminal paths remove
    # the ID from autodev-staged.txt and clear the inflight sentinel — a
    # requeued issue re-stages via check_passed on its second pass, so
    # decision #4's staged-removal must run every time this state fires, not
    # only on the terminal path.
    action_type: shell
    action: |
      ID="${captured.input.output}"  # ll-lint: mr11-ok(captured.input.output) ENH-3358 - ENH-3342 widening residual, tracked for conversion

      if [ -f "${context.run_dir}/autodev-staged.txt" ]; then
        grep -vxF "$ID" "${context.run_dir}/autodev-staged.txt" \
          > "${context.run_dir}/autodev-staged.tmp" 2>/dev/null || true
        mv "${context.run_dir}/autodev-staged.tmp" "${context.run_dir}/autodev-staged.txt"
      fi
      rm -f ${context.run_dir}/autodev-inflight

      # ll_auto_last.txt is overwritten per issue (tee, not tee -a), so this
      # grep needs no ID-scoping beyond the marker's own second field.
      REASON=$(grep -F "PHASE1_NOT_STARTED $ID " "${context.run_dir}/ll_auto_last.txt" 2>/dev/null \
        | tail -1 | awk '{print $3}')
      case "$REASON" in
        unknown|not_ready|blocked|close_failed|path_mismatch|confidence_gate) ;;
        # An empty or unrecognized reason must be treated as terminal, never
        # as unknown — defaulting a parse miss to "unknown" would re-queue on
        # exactly the signal-loss condition this issue exists to stop
        # misreporting.
        *) REASON="unparsed" ;;
      esac

      TERMINAL=1
      if [ "$REASON" = "unknown" ]; then
        ATTEMPTS=$(grep -F "$ID " "${context.run_dir}/autodev-not-started-attempts.txt" 2>/dev/null \
          | tail -1 | awk '{print $2}')
        case "$ATTEMPTS" in
          ''|*[!0-9]*) ATTEMPTS=0 ;;
        esac
        if [ "$ATTEMPTS" -lt 1 ]; then
          TERMINAL=0
          # Prepend to the head (decision #3b), not append to the tail, so the
          # retried issue is the next one dequeued.
          { echo "$ID"; cat "${context.run_dir}/autodev-queue.txt" 2>/dev/null; } \
            > "${context.run_dir}/autodev-queue.tmp" \
            && mv "${context.run_dir}/autodev-queue.tmp" "${context.run_dir}/autodev-queue.txt"
          NEW_ATTEMPTS=$((ATTEMPTS + 1))
          if [ -f "${context.run_dir}/autodev-not-started-attempts.txt" ]; then
            grep -v -F "$ID " "${context.run_dir}/autodev-not-started-attempts.txt" \
              > "${context.run_dir}/autodev-not-started-attempts.tmp" 2>/dev/null || true
            mv "${context.run_dir}/autodev-not-started-attempts.tmp" "${context.run_dir}/autodev-not-started-attempts.txt"
          fi
          echo "$ID $NEW_ATTEMPTS" >> "${context.run_dir}/autodev-not-started-attempts.txt"
        fi
      fi

      # decision #2b: write nothing to either ledger on the requeue pass —
      # only a terminal classification (deterministic reason on first sight,
      # or unknown with attempts exhausted) is ledgered.
      if [ "$TERMINAL" = "1" ]; then
        echo "$ID  $REASON" >> ${context.run_dir}/autodev-not-started.txt
        echo "$ID  notstarted_$REASON" >> ${context.run_dir}/autodev-skipped.txt
      fi
    next: dequeue_next
    on_error: dequeue_next

  check_learning_gate:
    # Learning-gate consistency: a gate block (ENH-2319, marker LEARNING_GATE_BLOCKED
    # printed by process_issue_inplace) exits 1 from `ll-auto --only`, which would
    # otherwise be laundered into a generic implementation failure / auth check.
    # Detect it FIRST and record it distinctly so the run summary can tell a
    # gate block (remedy: /ll:explore-api) from a real failure. on_no falls through
    # to the infra discriminator (ENH-3084) before the auth check (mirrors
    # rn-remediate's ordering for cross-loop parity).
    # on_error (BUG-2594): a residual shell fault reading the run-dir file (e.g.
    # permission error) must not crash the loop — degrade to the auth check.
    fragment: ll_auto_learning_gate_check
    on_yes: mark_gate_blocked
    on_no: check_learning_gate_infra
    on_error: check_impl_auth

  check_learning_gate_infra:
    # ENH-3084: ll_auto_learning_gate_check emits GATE_INFRA (not GATE_BLOCKED) when
    # the inner `ll-auto --only` could not run the gate at all (scope-lock contention,
    # missing binary, wedged child). Its GATE_BLOCKED evaluate pattern does not match
    # GATE_INFRA, so this discriminator tells it apart from a clean OK and routes to a
    # distinct record (mark_gate_infra) rather than deferring the issue as gate_blocked
    # with the wrong reason/message. on_no/on_error degrade to the auth check.
    fragment: ll_auto_learning_gate_infra_check
    on_yes: mark_gate_infra
    on_no: check_impl_auth
    on_error: check_impl_auth

  mark_gate_infra:
    # ENH-3084: the learning gate could not run (infra contention/crash), so nothing
    # was implemented. Record it distinctly from a gate block and advance the queue —
    # do NOT defer as gate_blocked (the unproven-deps remedy is the wrong reason for a
    # transient infra condition) and do NOT burn a remediation cycle. The issue stays
    # in place to be retried on a later run.
    action: |
      ID="${captured.input.output}"  # ll-lint: mr11-ok(captured.input.output) ENH-3358 - ENH-3342 widening residual, tracked for conversion
      echo "$ID" >> ${context.run_dir}/autodev-gate-infra.txt
      rm -f ${context.run_dir}/autodev-inflight
      echo "[GATE_INFRA_FAILED] $ID — learning gate could not run (scope-lock contention, missing binary, or wedged child); retry later"
    action_type: shell
    next: dequeue_next
    on_error: dequeue_next

  mark_proof_gate_infra:
    # BUG-3603: the pre-implement check-gate call could not produce a verdict
    # (crash, unresolvable ID, unrecognised output) — infra, not a quality
    # verdict. Modeled on mark_gate_infra: ledger to
    # its own per-reason file, clear inflight, advance the queue, do NOT defer
    # (blocked_by_gate would fabricate a reason the helper never established)
    # and never reach implement_current. The issue is retried on a later run,
    # where the gate runs again.
    action: |
      ID=${captured.input.output:shell}
      echo "$ID" >> ${context.run_dir}/autodev-proof-gate-infra.txt
      rm -f ${context.run_dir}/autodev-inflight
      echo "[PROOF_GATE_INFRA] $ID — check-gate produced no verdict before implement; not deferred, retry later"
    action_type: shell
    next: dequeue_next
    on_error: dequeue_next

  mark_gate_blocked:
    # Record the gate-blocked issue distinctly and advance the queue. ENH-2666:
    # deferred via the same set-status transition rn-implement's mark_deferred
    # uses, so the issue leaves active selection and re-surfaces via
    # FEAT-2665's triage surface once its external-API deps are proven, rather
    # than being retried every run.
    action: |
      ID="${captured.input.output}"  # ll-lint: mr11-ok(captured.input.output) ENH-3358 - ENH-3342 widening residual, tracked for conversion
      echo "$ID" >> ${context.run_dir}/autodev-gate-blocked.txt
      rm -f ${context.run_dir}/autodev-inflight
      # BUG-2729 postmortem: never flip an already-resolved issue to deferred.
      STATUS=$(ll-issues show "$ID" --json 2>/dev/null \
        | python3 -c "import json,sys; print((json.load(sys.stdin).get('status') or '').lower())" \
        2>/dev/null || echo "")
      if [ "$STATUS" = "done" ] || [ "$STATUS" = "completed" ] || [ "$STATUS" = "cancelled" ]; then
        echo "[SKIP-DEFER] $ID already $STATUS; leaving status untouched"
      else
        ll-issues set-status "$ID" deferred --by automation --reason gate_blocked 2>/dev/null || true
        echo "[LEARNING_GATE_BLOCKED] $ID — unproven external-API deps; deferred (prove with /ll:explore-api, then re-run to resurface)"
      fi
    action_type: shell
    next: dequeue_next
    on_error: dequeue_next

  check_impl_auth:
    # ENH-2353: gate between ll-auto failure and queue drain. Auth failures abort
    # the queue (abort_env_not_ready); genuine implementation failures continue
    # draining (dequeue_next) so other issues still get a chance.
    fragment: ll_auto_auth_check
    on_yes: abort_env_not_ready
    on_no: clear_inflight_after_impl_failure
    on_error: clear_inflight_after_impl_failure

  clear_inflight_after_impl_failure:
    # BUG-2981 D1: check_impl_auth is a fragment state (no action body of its
    # own), so it cannot clear autodev-inflight itself. Both its non-auth legs
    # (on_no — genuine implementation failure; on_error — fault reading the
    # auth signal) route here so the sentinel is cleared before dequeue_next,
    # matching every other issue-resolving state's BUG-1226 convention.
    action_type: shell
    action: |
      rm -f ${context.run_dir}/autodev-inflight
    next: dequeue_next
    on_error: dequeue_next

  abort_env_not_ready:
    # ENH-2353: abort the autodev queue on auth misconfiguration.
    action_type: shell
    action: |
      echo "Aborting: host auth not configured — set the host credential or run the host login, then re-run"
    next: finalize_done

  detect_children:
    # Diff current issue IDs against the pre-refinement baseline to find any
    # child issues created during the sub-loop (its breakdown_issue state or the
    # ladder's size-review decomposition). Writes discovered child IDs to a temp
    # file for use by enqueue_children. Exits 0 (→ enqueue_children) if children
    # found; exits 1 (→ check_parent_resolved) if none were found.
    action: |
      ll-issues list --json | python3 -c "
      import json, sys
      issues = json.load(sys.stdin)
      for i in sorted(i['id'] for i in issues):
          print(i)
      " | sort > ${context.run_dir}/autodev-post-ids.txt

      comm -13 ${context.run_dir}/autodev-pre-ids.txt \
               ${context.run_dir}/autodev-post-ids.txt \
               > ${context.run_dir}/autodev-diff-ids.txt

      PARENT_ID="${captured.input.output}"  # ll-lint: mr11-ok(captured.input.output) ENH-3358 - ENH-3342 widening residual, tracked for conversion
      while IFS= read -r child_id; do
        child_file=$(ll-issues path "$child_id" 2>/dev/null)
        # BUG-2729 postmortem: match provenance on frontmatter `parent:` first
        # (deterministic — written by issue-size-review), with the prose marker
        # as a tolerant fallback (accepts wiki-link drift like
        # "Decomposed from [[ID]]"). An exact-literal prose grep alone rejected
        # real children and cascaded into a wrong low_readiness deferral.
        if [ -n "$child_file" ] && { \
             grep -qE "^parent:[[:space:]]*['\"]?$PARENT_ID['\"]?[[:space:]]*$" "$child_file" \
             || grep -qE "Decomposed from (\[\[)?$PARENT_ID([^0-9]|$)" "$child_file"; }; then
          echo "$child_id"
        fi
      done < ${context.run_dir}/autodev-diff-ids.txt \
        > ${context.run_dir}/autodev-new-children.txt

      if [ -s ${context.run_dir}/autodev-new-children.txt ]; then
        cat ${context.run_dir}/autodev-new-children.txt
        exit 0
      else
        exit 1
      fi
    fragment: shell_exit
    on_yes: enqueue_children
    on_no: check_parent_resolved
    on_error: check_parent_resolved

  enqueue_children:
    # Prepend newly-detected child issues to the front of the unified queue
    # (depth-first), so children are refined AND implemented before the next
    # sibling in the original list. Records the parent as skipped (it was
    # decomposed, not refined to ready) and closes it via `ll-issues
    # finalize-decomposition` (ENH-2615), which owns the status-done close
    # in place (BUG-2732: no completed/ move by default) AND repoints the
    # children's parent: to the EPIC when the parent had one — so
    # epic-scoped re-resolution recognizes the children.
    # Mirrors rn-decompose finalize_parent's WARN-not-fail shape.
    # ENH-2404: two-space-delimited "ID  REASON" — decomposed is a success
    # outcome, distinct from a refinement/readiness failure.
    action: |
      CHILDREN=$(cat ${context.run_dir}/autodev-new-children.txt)
      EXISTING=$(cat ${context.run_dir}/autodev-queue.txt 2>/dev/null || true)
      { echo "$CHILDREN"; echo "$EXISTING"; } \
        | grep -v '^[[:space:]]*$' \
        > ${context.run_dir}/autodev-queue.txt
      echo "${captured.input.output}  decomposed" >> ${context.run_dir}/autodev-skipped.txt  # ll-lint: mr11-ok(captured.input.output) ENH-3358 - ENH-3342 widening residual, tracked for conversion
      # ll-lint: mr11-ok(captured.input.output) ENH-3358 - ENH-3342 widening residual, tracked for conversion
      ll-issues finalize-decomposition "${captured.input.output}" \
        --children-file ${context.run_dir}/autodev-new-children.txt \
        || echo "WARN: finalize-decomposition failed for ${captured.input.output} (children remain enqueued)" >&2  # ll-lint: mr11-ok(captured.input.output) ENH-3358 - ENH-3342 widening residual, tracked for conversion
      CHILD_COUNT=$(wc -l < ${context.run_dir}/autodev-new-children.txt | tr -d ' ')
      echo "Parent ${captured.input.output} decomposed; enqueued $CHILD_COUNT child issue(s)"  # ll-lint: mr11-ok(captured.input.output) ENH-3358 - ENH-3342 widening residual, tracked for conversion
      # BUG-1226: parent is resolved (decomposed); clear the in-flight flag
      # so `done` does not warn about it.
      rm -f ${context.run_dir}/autodev-inflight
    action_type: shell
    next: dequeue_next
    on_error: dequeue_next

  check_parent_resolved:
    # BUG-2729 postmortem: a DECOMPOSED record with no detectable children
    # means the sub-loop resolved the parent (done/cancelled) and only child
    # *detection* failed — route to recover_subloop_children. prepare-issue only
    # emits DECOMPOSED with child_ids or a resolved parent (ENH-3623), so an
    # unresolved parent here is an inconsistency: skip it (no ladder re-entry).
    # `show --json` reports status capitalized ("Deferred") — lowercase before
    # comparing.
    action: |
      # ll-lint: mr11-ok(captured.input.output) ENH-3358 - ENH-3342 widening residual, tracked for conversion
      STATUS=$(ll-issues show ${captured.input.output} --json 2>/dev/null \
        | python3 -c "import json,sys; print((json.load(sys.stdin).get('status') or '').lower())" \
        2>/dev/null || echo "")
      if [ "$STATUS" = "done" ] || [ "$STATUS" = "completed" ] || [ "$STATUS" = "cancelled" ]; then
        exit 0
      fi
      exit 1
    fragment: shell_exit
    on_yes: recover_subloop_children
    on_no: skip_inflight
    on_error: skip_inflight_infra

  recover_subloop_children:
    # BUG-2729 postmortem: the parent is already resolved (done/cancelled) by
    # the sub-loop — typically via decomposition. Recover any open children by
    # deterministic frontmatter `parent:` match across the current issue list
    # (covers marker-drift cases where detect_children's diff+grep missed
    # them) and prepend depth-first, mirroring enqueue_children. Records the
    # parent as decomposed (children found) or resolved_by_subloop (none) —
    # never defers it.
    action: |
      ID="${captured.input.output}"  # ll-lint: mr11-ok(captured.input.output) ENH-3358 - ENH-3342 widening residual, tracked for conversion
      ll-issues list --json | python3 -c "
      import json, sys
      try:
          issues = json.load(sys.stdin)
          for cid in sorted(i['id'] for i in issues
                            if i.get('parent') == '$ID'
                            and (i.get('status') or 'open').lower() in ('open', 'in_progress')):
              print(cid)
      except Exception:
          pass
      " > ${context.run_dir}/autodev-new-children.txt || true
      if [ -s ${context.run_dir}/autodev-new-children.txt ]; then
        CHILDREN=$(cat ${context.run_dir}/autodev-new-children.txt)
        EXISTING=$(cat ${context.run_dir}/autodev-queue.txt 2>/dev/null || true)
        { echo "$CHILDREN"; echo "$EXISTING"; } \
          | grep -v '^[[:space:]]*$' \
          > ${context.run_dir}/autodev-queue.txt
        CHILD_COUNT=$(wc -l < ${context.run_dir}/autodev-new-children.txt | tr -d ' ')
        echo "$ID  decomposed" >> ${context.run_dir}/autodev-skipped.txt
        echo "Parent $ID resolved by sub-loop; recovered and enqueued $CHILD_COUNT child issue(s)"
      else
        echo "$ID  resolved_by_subloop" >> ${context.run_dir}/autodev-skipped.txt
        echo "[RESOLVED] $ID already resolved by sub-loop; advancing queue"
      fi
      rm -f ${context.run_dir}/autodev-inflight
    action_type: shell
    next: dequeue_next
    on_error: dequeue_next

  finalize_rate_limited:
    # Every 429-budget-exhaustion exit used to route straight to the bare
    # `done` terminal, skipping finalize_done — no summary.json, no
    # staged→passed promotion, no abandoned-inflight detection, and the
    # unprocessed queue silently dropped. Stamp the stop reason and run the
    # same finalization; finalize_done reports it as verdict rate_limited.
    action: |
      printf 'rate_limit' > ${context.run_dir}/autodev-stop-reason
    action_type: shell
    next: finalize_done
    on_error: finalize_done

  finalize_done:
    # Run finalization lives in little_loops.autodev_summary (formerly ~300
    # lines of inline shell). It promotes autodev-staged.txt IDs to
    # autodev-passed.txt only once verifiably closed (BUG-2908; with the
    # quality gate on, only with GATE_PASS/GATE_SKIP evidence — FEAT-3573),
    # ledgers everything else (and a residual autodev-inflight sentinel) in
    # autodev-unverified.txt, prints the "=== Autodev Summary ===" report, and
    # writes summary.json (verdict success/partial/phantom/not_started/no-op,
    # or rate_limited / max_steps for an interrupted run).
    # Exit: 0 -> done, 1 (phantom: staged or in-flight work never verifiably
    # closed) -> failed, 2 (summary could not be written, ENH-2825) -> failed.
    action: |
      python3 -m little_loops.autodev_summary --run-dir ${context.run_dir} \
        --quality-gate ${context.quality_gate:shell:default=true}
    fragment: shell_exit
    on_yes: done
    on_no: failed
    on_error: failed

  finalize_step_capped:
    # on_max_steps handler. At the step cap the executor runs exactly ONE
    # handler state's action and then terminates (terminated_by=max_steps);
    # the handler's routing target is recorded but never executed, so this
    # state cannot chain through finalize_done. It runs the same finalization
    # in its single action, with the stop reason forced to max_steps, so a
    # capped run still promotes verified closures, reports the pending queue,
    # and writes summary.json (verdict max_steps).
    action: |
      python3 -m little_loops.autodev_summary --run-dir ${context.run_dir} \
        --quality-gate ${context.quality_gate:shell:default=true} --stop-reason max_steps
    fragment: shell_exit
    on_yes: done
    on_no: failed
    on_error: failed
  failed:
    terminal: true
    failure: true
  done:
    # Bare terminal. The run summary (summary.json, inflight/abandoned
    # accounting) is written by finalize_done, which every exit — including
    # rate-limit stops via finalize_rate_limited — routes through first; the
    # step-cap exit writes it from finalize_step_capped instead.
    terminal: true
