name: generator-evaluator
visibility: internal
description: |
  Oracle sub-loop for iterative artifact generation with visual evaluation. Loops
  generate → evaluate (Playwright screenshot) → snapshot (per-iteration artifact
  versioning) → score (LLM rubric) until ALL_PASS or max_iterations. Returns done
  on success; parent routes on_yes to its next state.
  Used by html-website-generator, html-anything, hitl-md, p5js-sketch-generator, and
  svg-image-generator thin wrappers (ENH-1869).

initial: generate
on_handoff: spawn
timeout: 7200
# 7-state cycle (generate -> evaluate -> snapshot -> score -> record_score ->
# check_stall -> check_diff_stall); 40 >= 7 full scored iterations (BUG-2824 —
# the inherited max_steps: 20 capped this oracle at ~2.8 cycles, well short of
# check_diff_stall's own max_stall: 3, so the plateau detector was structurally
# unreachable). See generator-evaluator-flux.yaml for the sibling calibration.
max_steps: 40
on_max_steps: max_steps_summary
artifact_versioning: true

parameters:
  run_dir:
    type: string
    required: true
    description: Directory path for generated artifacts (relative runner-injected path or absolute path)
  generate_prompt:
    type: string
    required: true
    description: Full prompt to use in the generate state LLM call including where to write output
  rubric:
    type: string
    required: false
    description: Rubric criteria for scoring the generated artifact as markdown text
  pass_threshold:
    type: number
    required: false
    description: Minimum rubric score threshold to accept (default 6)
  artifact_path:
    type: string
    required: false
    description: Artifact filename relative to run_dir for screenshot capture (default index.html)

import:
  - lib/harness.yaml
  - lib/common.yaml

context:
  pass_threshold: 6
  rubric: ""
  artifact_path: "index.html"

states:
  generate:
    action_type: prompt
    action: |
      ${context.generate_prompt}
    # Generation hands off UNCONDITIONALLY to evaluate. The real quality gate is
    # the downstream evaluate (Playwright screenshot) → score (rubric) cycle,
    # which judges the rendered artifact. Routing only on_yes here would gate
    # generation on the default LLM judge's read of the agent's *narration*:
    # a later pass that describes its fixes ("here's what I changed") instead of
    # asserting them earns a `partial`/`no` verdict, which has no route → the
    # sub-loop dead-ends and the parent treats it as `failed`. Mapping yes/no/
    # partial all to evaluate removes that nondeterministic dead-end while
    # keeping on_error: failed for genuine action crashes. See ENH-1907 / the
    # site-generator-20260603T191934 failure.
    on_yes: evaluate
    on_no: evaluate
    on_partial: evaluate
    on_error: failed

  evaluate:
    fragment: playwright_screenshot
    timeout: 120
    action: |
      case "${context.run_dir}" in
        /*) ABS_DIR="${context.run_dir}" ;;
        *) ABS_DIR="$(pwd)/${context.run_dir}" ;;
      esac
      playwright screenshot --full-page "file://$${ABS_DIR}/${context.artifact_path}" "$${ABS_DIR}/screenshot.png" 2>&1 && echo "CAPTURED"
    on_yes: snapshot
    on_no: snapshot
    on_error: snapshot

  snapshot:
    description: |
      Per-iteration artifact versioning — copies the current artifact and screenshot
      into an iter-N/ subdirectory within the run directory. Iteration counter is
      tracked via .iter_counter file.
      ENH-2903: also detects a missing/stale screenshot.png or a missing artifact
      copy (evaluate's on_yes/on_no/on_error all route here identically, so this
      is the only place downstream of evaluate that can see the failure) and
      records the consecutive-miss count to .screenshot_misses under run_dir
      (MR-3). Runs unconditionally (next: score_gate, which reads the counter).
    action_type: shell
    action: |
      RUN_DIR="${context.run_dir}"
      COUNTER=$(cat "$RUN_DIR/.iter_counter" 2>/dev/null || echo 0)
      COUNTER=$((COUNTER + 1))
      echo "$COUNTER" > "$RUN_DIR/.iter_counter"
      mkdir -p "$RUN_DIR/iter-$COUNTER"

      MISS=0
      if cp "$RUN_DIR/${context.artifact_path}" "$RUN_DIR/iter-$COUNTER/" 2>/dev/null; then
        ART_MTIME=$(stat -f %m "$RUN_DIR/${context.artifact_path}" 2>/dev/null || stat -c %Y "$RUN_DIR/${context.artifact_path}" 2>/dev/null || echo 0)
      else
        MISS=1
        ART_MTIME=0
      fi

      if [ -f "$RUN_DIR/screenshot.png" ]; then
        SHOT_MTIME=$(stat -f %m "$RUN_DIR/screenshot.png" 2>/dev/null || stat -c %Y "$RUN_DIR/screenshot.png" 2>/dev/null || echo 0)
        if [ "$SHOT_MTIME" -lt "$ART_MTIME" ]; then
          MISS=1
        fi
      else
        MISS=1
      fi
      cp "$RUN_DIR/screenshot.png" "$RUN_DIR/iter-$COUNTER/" 2>/dev/null || true

      PREV_MISSES=$(cat "$RUN_DIR/.screenshot_misses" 2>/dev/null || echo 0)
      if [ "$MISS" -eq 1 ]; then
        MISSES=$((PREV_MISSES + 1))
      else
        MISSES=0
      fi
      echo "$MISSES" > "$RUN_DIR/.screenshot_misses"
      echo "iter=$COUNTER screenshot_miss=$MISS consecutive_misses=$MISSES"
    next: score_gate

  score_gate:
    description: |
      ENH-2903 screenshot-miss gate (first half). Reads .screenshot_misses,
      written by snapshot above. A count of 0 means this iteration's screenshot
      is fresh — proceed to score exactly as before (no behavior change for
      consumers whose screenshots succeed). A nonzero count routes to
      check_screenshot_abandon to distinguish a transient miss (skip scoring,
      keep iterating) from a persistent one (abandon).
    action_type: shell
    action: |
      MISS_COUNT=$(cat "${context.run_dir}/.screenshot_misses" 2>/dev/null || echo 0)
      if [ "$MISS_COUNT" -eq 0 ]; then
        echo "SCORE"
      else
        echo "MISS count=$MISS_COUNT"
      fi
    evaluate:
      type: output_contains
      pattern: "SCORE"
    on_yes: score
    on_no: check_screenshot_abandon
    on_error: check_screenshot_abandon

  check_screenshot_abandon:
    description: |
      ENH-2903 screenshot-miss gate (second half). score_gate has already
      ruled out the fresh-screenshot case; this distinguishes a below-cap
      transient miss (skip rubric-scoring this round only, per AC "score does
      not silently rubric-score a stale screenshot") from a persistent one
      (converge to an honest abandoned verdict rather than exhausting
      max_steps — MR-13). The cap is a max_step_attempts-style attempt cap on
      consecutive screenshot misses, distinct from the loop's own max_steps.
    action_type: shell
    action: |
      screenshot_max_step_attempts=3
      MISS_COUNT=$(cat "${context.run_dir}/.screenshot_misses" 2>/dev/null || echo 0)
      if [ "$MISS_COUNT" -ge "$screenshot_max_step_attempts" ]; then
        echo "ABANDON count=$MISS_COUNT cap=$screenshot_max_step_attempts"
      else
        echo "SKIP count=$MISS_COUNT cap=$screenshot_max_step_attempts"
      fi
    evaluate:
      type: output_contains
      pattern: "ABANDON"
    on_yes: screenshot_abandoned_summary
    on_no: record_screenshot_skip
    on_error: record_screenshot_skip

  record_screenshot_skip:
    description: |
      Below-cap screenshot miss: do not rubric-score a stale/missing
      screenshot. Skips score/record_score entirely for this iteration and
      falls through to the existing stall-convergence chain (check_stall /
      check_diff_stall) so a run stuck on repeated misses still converges
      instead of looping generate/evaluate/snapshot indefinitely.
    action_type: shell
    action: |
      echo "skipping rubric score this iteration: no fresh screenshot"
    next: check_stall

  score:
    # Scoped numeric-scoring override (ENH-2428, Option B): keeps the shared
    # ll_rubric_score fragment's binary ALL_PASS/NEEDS_WORK evaluator (via
    # output_contains) but overrides the prompt to ALSO emit a numeric per-round
    # aggregate on the final line (SCORE: <0-10>) and captures the output so the
    # downstream record_score state can persist it to the per-run score history.
    # This mirrors the rubric_score/rubric_parse_scores capture/parse pattern in
    # lib/rubric-router.yaml as a LOCAL override here — NOT by editing the
    # shared lib/harness.yaml ll_rubric_score fragment (which stays test-locked
    # for its 6 other consumers). Precedent: the local evaluate: override in
    # generator-evaluator-cli.yaml.
    fragment: ll_rubric_score
    with:
      run_dir: "${context.run_dir}"
      rubric: "${context.rubric}"
      pass_threshold: "${context.pass_threshold}"
    action: |
      Review the generated artifact in ${param.run_dir} against the rubric below.

      ${param.rubric}

      Pass threshold: ${param.pass_threshold}/10 per criterion.
      Score EACH criterion on a 0-10 scale. If every criterion meets or exceeds
      the threshold, output ALL_PASS on its own line. Otherwise output NEEDS_WORK
      and describe the specific improvements required.

      On the FINAL line, output the mean of your per-criterion scores as a single
      number in the form: SCORE: <number 0-10>
    capture: score_output
    on_yes: done
    on_no: record_score
    on_error: generate

  record_score:
    # HARNESS (ENH-2428): parse the mean rubric SCORE emitted by the score state
    # and append it to the per-run .score_history file (one score per line) so
    # the score_stall evaluator can detect a scored-output plateau. Per-run
    # isolation (MR-3): writes under ${context.run_dir}/, never bare .loops/tmp/.
    # Runs unconditionally (next: check_stall).
    action_type: shell
    action: |
      python3 << 'PYEOF'
      import re
      output = """${captured.score_output.output}"""
      m = re.search(r'SCORE:\s*([0-9]+(?:\.[0-9]+)?)', output)
      score = m.group(1) if m else "0"
      with open("${context.run_dir}/.score_history", "a") as f:
          f.write(score + "\n")
      print(f"recorded score={score}")
      PYEOF
    next: check_stall
    on_error: check_stall

  check_stall:
    # HARNESS (ENH-2428): score-plateau guard (primary stall axis). If the rubric
    # score has not improved by more than epsilon for max_stall consecutive refine
    # cycles, the plateau is detected early and the loop routes to done (accept
    # best-so-far) rather than burning the remaining iteration budget. This
    # replaces byte-diff as the primary signal because index.html can keep growing
    # byte-for-byte while the visible/scored output plateaus (the
    # html-website-generator-20260701T105614 failure mode). diff_stall is retained
    # as a cheap secondary/OR condition (check_diff_stall). on_yes = score still
    # improving → fall through to the diff-stall check; on_no = plateaued → done.
    # on_error = no/short history yet → keep going (route to diff-stall check).
    fragment: score_stall_gate
    action: echo "score stall check"
    action_type: shell
    evaluate:
      max_stall: 2
    on_yes: check_diff_stall
    on_no: done
    on_error: check_diff_stall

  check_diff_stall:
    # HARNESS: Secondary diff-stall guard (OR condition, per ENH-2428 Scope
    # Boundaries — diff_stall is retained, not removed). If the model has produced
    # no file changes for max_stall consecutive refine cycles, route to done.
    # on_yes = new changes observed → continue generating; on_no = byte plateau →
    # done. on_error = git unavailable → don't block the loop, continue generating.
    fragment: diff_stall_gate
    action: echo "diff stall check"
    action_type: shell
    evaluate:
      max_stall: 3
    on_yes: generate
    on_no: done
    on_error: generate

  done:
    terminal: true

  failed:
    terminal: true

  screenshot_abandoned_summary:
    # MR-13 penultimate summary state (ENH-2903, the rn-implement::report /
    # general-task summarize_success shape). Reached only when
    # check_screenshot_abandon's max_step_attempts-style cap is breached — the
    # loop has never managed to capture a usable screenshot for that many
    # consecutive iterations. Non-terminal (terminal-action-ok: a terminal
    # state's own action is dead code), so this writes summary.json with an
    # explicit "abandoned" key and a downgraded verdict before routing to the
    # screenshot_abandoned terminal. The best-scoring iteration already on
    # disk (if any) is untouched under iter-N/.
    action_type: shell
    action: |
      MISS_COUNT=$(cat "${context.run_dir}/.screenshot_misses" 2>/dev/null || echo 0)
      printf '{"verdict":"abandoned-screenshot","abandoned":%s}\n' "$MISS_COUNT" > "${context.run_dir}/summary.json"
      echo "generator-evaluator: abandoned after $MISS_COUNT consecutive screenshot misses"
    next: screenshot_abandoned
    on_error: screenshot_abandoned

  screenshot_abandoned:
    # Distinct from done: a downgraded verdict for a run whose screenshot
    # capture never recovered, so parent dispatch does not treat this as an
    # ordinary ALL_PASS success. failure: true (ENH-2825) so the run exits
    # non-zero and persists as a failure terminal, not "completed" — both
    # screenshot_abandoned_summary's on_error edge into this terminal and the
    # abandoned outcome itself are genuine non-successes.
    terminal: true
    failure: true

  max_steps_summary:
    # HARNESS (BUG-2824): terminal-doubling summary state fired when the engine
    # hits max_steps before ALL_PASS/done is reached. Per BUG-158 semantics
    # (executor.py:590-601), a terminal: true state named by on_max_steps DOES
    # still execute its action, so this is the sanctioned shape (precedent:
    # generator-evaluator-flux.yaml, vega-viz.yaml:553-577,
    # cua-agent-desktop.yaml:1213-1264) — surface the best-scoring iteration
    # already on disk instead of silently discarding it.
    action_type: prompt
    action: |
      The generator-evaluator oracle exhausted its max_steps budget before
      reaching ALL_PASS.

      Score history: $(cat ${context.run_dir}/.score_history 2>/dev/null || echo "no scores recorded")
      Iterations completed: $(cat ${context.run_dir}/.iter_counter 2>/dev/null || echo "0")

      Identify the highest-scoring iteration from the score history above (the
      Nth line of .score_history corresponds to iter-N/ under run_dir) and name
      it explicitly, along with its score. If no scores were recorded, say so.

      SUMMARY_EMITTED
    evaluate:
      type: output_contains
      pattern: "SUMMARY_EMITTED"
    terminal: true
