name: code-run-gate
visibility: internal
description: |
  Reusable Tier-1 deterministic oracle (FEAT-2551) — runs the project's
  build / test / typecheck / lint / format-check / service_health command
  matrix and emits GATE_PASS / GATE_FAILED / GATE_SKIP via the parent↔sub-loop
  token channel. The format-check stage (FEAT-3573) is opt-in: it runs only
  when the caller passes `changed_files_path`, so existing callers get SKIP.

  Resolves commands from `.ll/ll-config.json` `project.*` (with alias support
  per ARCHITECTURE-123: `type_cmd`/`typecheck_cmd`, `run_cmd`/`start_cmd`).
  Each null command short-circuits its gate to a SKIP pass-through. When all
  six command fields are null/empty, the oracle emits GATE_SKIP (docs-only
  no-op) and routes to done — modeled on the missing-artifact graceful-skip
  pattern in `cli-anything-bootstrap.yaml:97-105`.

  Only Tier-1 deterministic evaluators are used (`exit_code`, `output_numeric`,
  `classify`); MR-1 is satisfied trivially (the oracle is not a meta-loop —
  actions only write under `${context.run_dir}/`). MR-3 compliant: every
  artifact lives under `${context.run_dir}/`, never bare `.loops/tmp/`.

  Used by FEAT-2552's wiring into `rn-implement`/`rn-remediate`. Safe to call
  directly via `ll-loop run oracles/code-run-gate` with `parameters.run_dir`
  pointing at a per-invocation absolute path.

initial: resolve_commands
on_handoff: spawn
timeout: 1800
max_steps: 10

# ENH-2934 / ENH-2958: this oracle IS the post-implement verification step on
# the FSM path — `rn-remediate`'s `implement` state runs `ll-auto`, then
# delegates here to decide IMPLEMENTED. Bracketing it is exactly the shape
# ENH-2958 wants to replicate for the non-FSM orchestrators, so it is enabled
# here first to prove the FSM bracket works end-to-end before that work starts.
#
# Loop-level (not state-level) because every action state in this oracle is
# part of the verification window and none of them has any business editing a
# test file or pytest config.
#
# Safe against TDD false positives: `run_tamper_guard` diffs the entry snapshot
# against current on-disk state, so test files legitimately written earlier by
# the parent's `implement` state hash-match at both ends and produce no
# finding. Only a mutation made *inside* this oracle's own window trips it.
#
# Enforced (BUG-2962): a fail-policy finding jumps the run straight to the
# FSM's declared failure terminal (`failed`, ENH-2814) regardless of the
# guarded state's own routing shape — the convergent on_yes/on_no/on_error
# ->run_* shape here no longer defeats it. Findings accumulate across all
# guarded states in `ctx.context["_tamper_guard"]` rather than being
# clobbered by later clean states.
tamper_guard: fail

parameters:
  run_dir:
    type: string
    required: true
    description: |
      Per-invocation absolute path for artifact isolation (MR-3).
      Resolved via the case-absolute-path idiom (see resolve_commands action).
  issue_id:
    type: string
    required: true
    description: Token-channel identifier used in subloop_outcome_<ID>.txt.
  min_pass_rate:
    type: number
    required: false
    default: 0.95
    description: |
      Minimum pass_rate threshold for run_test's output_numeric evaluator
      (default 0.95).
  health_bound_seconds:
    type: number
    required: false
    default: 10
    description: curl --max-time budget for service_health probe (default 10).
  build_cmd:
    type: string
    required: false
    description: Caller-supplied build command (null → skip run_build).
  test_cmd:
    type: string
    required: false
    description: Caller-supplied test command (null → skip run_test).
  typecheck_cmd:
    type: string
    required: false
    description: |
      Caller-supplied type-check command. Alias: type_cmd (ARCHITECTURE-123).
  lint_cmd:
    type: string
    required: false
    description: Caller-supplied lint command (null → skip run_lint).
  run_cmd:
    type: string
    required: false
    description: |
      Caller-supplied run/start command (smoke test). Alias: start_cmd
      (ARCHITECTURE-123).
  health_url:
    type: string
    required: false
    description: |
      URL to probe for service readiness. When null together with no run_cmd,
      service_health short-circuits to SKIP.
  format_check_cmd:
    type: string
    required: false
    description: |
      Check-only format command with a {files} placeholder (FEAT-3573), e.g.
      `ruff format --check --force-exclude {files}`. Also read from
      `project.format_check_cmd`. Null → run_format_check skips.
  changed_files_path:
    type: string
    required: false
    description: |
      File holding the newline-separated changed-file list the format stage is
      scoped to (FEAT-3573). The format stage runs ONLY when this is passed;
      omitting it (every pre-existing caller) makes run_format_check SKIP. An
      empty or missing file also skips.
  src_dir:
    type: string
    required: false
    description: |
      Project source dir (FEAT-3573). When set (here, or via
      resolve_via_ll_config) and the cwd is a linked git worktree, it is
      prepended to PYTHONPATH for run_test / run_typecheck so an editable
      install does not shadow the worktree's package (BUG-2629).
  resolve_via_ll_config:
    type: string
    required: false
    description: |
      Opt-in (FEAT-3573). Any non-empty value makes resolve_commands resolve
      build/test/typecheck/lint/run/health_url/format_check_cmd and src_dir
      with `ll-config get project.<key>` (which honors `.ll/ll.local.md` and
      config defaults) instead of reading `.ll/ll-config.json` directly.
      Explicit per-command caller overrides still win. Unset (every
      pre-existing caller) keeps the file-only resolution.

states:
  resolve_commands:
    # Resolves commands from `.ll/ll-config.json` `project.*` with alias
    # support per ARCHITECTURE-123 (type_cmd/typecheck_cmd, run_cmd/start_cmd).
    # Writes:
    #   ${run_dir}/commands.json         — resolved command matrix (F2a → F2b contract)
    #   ${run_dir}/subloop_outcome_<ID>  — placeholder token; aggregate rewrites
    # When ALL six command fields are null/empty, emits GATE_SKIP and exits 0
    # so the parent's on_yes→done wires success without running any gate.
    # The pure-shell action does NOT use an evaluator — it sets up sidecars
    # then unconditionally chains to run_build via `next:`. Each run_* state
    # self-skips when its command is null (see run_build action).
    description: |
      Resolve the command matrix from `.ll/ll-config.json`, write the
      commands.json sidecar + initial subloop_outcome placeholder, then
      chain to run_build. Each run_* state self-skips if its command is null.
    action_type: shell
    timeout: 60
    action: |
      # Resolve run_dir to absolute path (MR-3 / generator-evaluator.yaml:71-74 idiom)
      case "${context.run_dir}" in
        /*) ABS_DIR="${context.run_dir}" ;;
        *) ABS_DIR="$(pwd)/${context.run_dir}" ;;
      esac
      mkdir -p "$${ABS_DIR}"

      # Read .ll/ll-config.json (best-effort — may be absent in unit tests).
      CONFIG_FILE="${context.project_root:default=$(pwd)}/.ll/ll-config.json"  # ll-lint: mr11-ok(context.project_root) ENH-3358 - ENH-3342 widening residual, tracked for conversion
      CFG_PROJECT=""
      if [ -f "$CONFIG_FILE" ]; then
        CFG_PROJECT=$(python3 -c "import json,sys; print(json.dumps(json.load(open(sys.argv[1])).get('project',{})))" "$CONFIG_FILE" 2>/dev/null || echo "")
      fi

      # Alias resolution per ARCHITECTURE-123:
      #   typecheck_cmd or type_cmd  →  typecheck_cmd (canonical in commands.json)
      #   start_cmd    or run_cmd    →  run_cmd       (canonical in commands.json)
      get_value() {
        local cfg="$1" key1="$2" key2="$3"
        python3 -c "
      import json,sys
      cfg = json.loads(sys.argv[1]) if sys.argv[1] else {}
      for k in (sys.argv[2], sys.argv[3]):
          v = cfg.get(k)
          if v:
              print(v)
              break
      " "$cfg" "$key1" "$key2" 2>/dev/null
      }

      BUILD_CMD=$(get_value "$CFG_PROJECT" "build_cmd" "build_cmd")
      TEST_CMD=$(get_value "$CFG_PROJECT" "test_cmd" "test_cmd")
      TYPECHECK_CMD=$(get_value "$CFG_PROJECT" "typecheck_cmd" "type_cmd")
      LINT_CMD=$(get_value "$CFG_PROJECT" "lint_cmd" "lint_cmd")
      RUN_CMD=$(get_value "$CFG_PROJECT" "start_cmd" "run_cmd")
      HEALTH_URL=$(get_value "$CFG_PROJECT" "health_url" "health_url")
      FORMAT_CHECK_CMD=$(get_value "$CFG_PROJECT" "format_check_cmd" "format_check_cmd")

      # FEAT-3573: opt-in resolution through `ll-config get` (honors ll.local.md and
      # config defaults). ll-config is authoritative here: an unset/null key blanks
      # the command so its stage SKIPs. Caller overrides below still win.
      SRC_DIR=""
      if [ -n ${context.resolve_via_ll_config:shell:default=} ]; then
        BUILD_CMD=$(ll-config get project.build_cmd 2>/dev/null | head -1)
        TEST_CMD=$(ll-config get project.test_cmd 2>/dev/null | head -1)
        TYPECHECK_CMD=$(ll-config get project.typecheck_cmd 2>/dev/null | head -1)
        [ -z "$TYPECHECK_CMD" ] && TYPECHECK_CMD=$(ll-config get project.type_cmd 2>/dev/null | head -1)
        LINT_CMD=$(ll-config get project.lint_cmd 2>/dev/null | head -1)
        RUN_CMD=$(ll-config get project.run_cmd 2>/dev/null | head -1)
        HEALTH_URL=$(ll-config get project.health_url 2>/dev/null | head -1)
        FORMAT_CHECK_CMD=$(ll-config get project.format_check_cmd 2>/dev/null | head -1)
        SRC_DIR=$(ll-config get project.src_dir 2>/dev/null | head -1)
      fi

      # Honour caller-supplied overrides via parameters (when provided).
      # NOTE: both the guard AND the assignment RHS must carry :default= — the
      # FSM interpolates the entire action string BEFORE bash runs, so a bare
      # context.build_cmd reference (no :default=) on the RHS raises "Path
      # 'build_cmd' not found in context" whenever the caller omits the override
      # (e.g. rn-remediate, which resolves commands from config instead). The
      # bash && short-circuit only gates runtime execution, not interpolation.
      # (Do not write the brace-substitution form in this comment — it would
      # itself be interpolated and reintroduce the crash.)
      # ll-lint: mr11-ok(context.build_cmd) ENH-3358 - ENH-3342 widening residual, tracked for conversion
      # ll-lint: mr11-ok(context.build_cmd) ENH-3358 - ENH-3342 widening residual, tracked for conversion
      [ -n "${context.build_cmd:default=}" ] && BUILD_CMD="${context.build_cmd:default=}"
      # ll-lint: mr11-ok(context.test_cmd) ENH-3358 - ENH-3342 widening residual, tracked for conversion
      # ll-lint: mr11-ok(context.test_cmd) ENH-3358 - ENH-3342 widening residual, tracked for conversion
      [ -n "${context.test_cmd:default=}" ] && TEST_CMD="${context.test_cmd:default=}"
      # ll-lint: mr11-ok(context.typecheck_cmd) ENH-3358 - ENH-3342 widening residual, tracked for conversion
      # ll-lint: mr11-ok(context.typecheck_cmd) ENH-3358 - ENH-3342 widening residual, tracked for conversion
      [ -n "${context.typecheck_cmd:default=}" ] && TYPECHECK_CMD="${context.typecheck_cmd:default=}"
      # ll-lint: mr11-ok(context.lint_cmd) ENH-3358 - ENH-3342 widening residual, tracked for conversion
      # ll-lint: mr11-ok(context.lint_cmd) ENH-3358 - ENH-3342 widening residual, tracked for conversion
      [ -n "${context.lint_cmd:default=}" ] && LINT_CMD="${context.lint_cmd:default=}"
      # ll-lint: mr11-ok(context.run_cmd) ENH-3358 - ENH-3342 widening residual, tracked for conversion
      # ll-lint: mr11-ok(context.run_cmd) ENH-3358 - ENH-3342 widening residual, tracked for conversion
      [ -n "${context.run_cmd:default=}" ] && RUN_CMD="${context.run_cmd:default=}"
      # ll-lint: mr11-ok(context.health_url) ENH-3358 - ENH-3342 widening residual, tracked for conversion
      # ll-lint: mr11-ok(context.health_url) ENH-3358 - ENH-3342 widening residual, tracked for conversion
      [ -n "${context.health_url:default=}" ] && HEALTH_URL="${context.health_url:default=}"
      # (:shell:default= on both refs — FEAT-3573; quoted so the value is never re-tokenized.)
      [ -n ${context.format_check_cmd:shell:default=} ] && FORMAT_CHECK_CMD=${context.format_check_cmd:shell:default=}
      [ -n ${context.src_dir:shell:default=} ] && SRC_DIR=${context.src_dir:shell:default=}

      # Write commands.json sidecar (F2a → F2b contract — canonical names only).
      # Serialized with json.dumps so a command containing a double quote still
      # yields valid JSON (FEAT-3573) — the old unescaped heredoc made every
      # run_* json.load fail and the stage SKIP silently.
      LL_C_BUILD="$BUILD_CMD" LL_C_TEST="$TEST_CMD" LL_C_TYPECHECK="$TYPECHECK_CMD" \
        LL_C_LINT="$LINT_CMD" LL_C_RUN="$RUN_CMD" LL_C_HEALTH="$HEALTH_URL" \
        LL_C_FORMAT="$FORMAT_CHECK_CMD" LL_C_SRC="$SRC_DIR" python3 -c "
      import json, os
      print(json.dumps({
          'build_cmd': os.environ['LL_C_BUILD'],
          'test_cmd': os.environ['LL_C_TEST'],
          'typecheck_cmd': os.environ['LL_C_TYPECHECK'],
          'lint_cmd': os.environ['LL_C_LINT'],
          'run_cmd': os.environ['LL_C_RUN'],
          'health_url': os.environ['LL_C_HEALTH'],
          'format_check_cmd': os.environ['LL_C_FORMAT'],
          'src_dir': os.environ['LL_C_SRC'],
      }))
      " > "$${ABS_DIR}/commands.json"

      # Write initial subloop_outcome placeholder. aggregate rewrites this
      # with the final GATE_PASS / GATE_FAILED / GATE_SKIP verdict (F2b reader).
      echo "GATE_PASS" > "$${ABS_DIR}/subloop_outcome_${context.issue_id}.txt"  # ll-lint: mr11-ok(context.issue_id) ENH-3358 - ENH-3342 widening residual, tracked for conversion

      # Chain to run_build (which self-skips if build_cmd is null)
      echo "resolved: build=$BUILD_CMD test=$TEST_CMD typecheck=$TYPECHECK_CMD lint=$LINT_CMD run=$RUN_CMD health=$HEALTH_URL"
    next: run_build

  run_build:
    # Self-skip when build_cmd is null (writes SKIP to build.txt). On real
    # invocation, captures exit code and stdout/stderr into build.txt.
    # All three routing outcomes (on_yes / on_no / on_error) → aggregate so
    # a single failed gate still produces an aggregated verdict (no MR-4
    # partial-route dead-end).
    description: |
      Run build_cmd (if non-null) and write output to build.txt. Self-skips
      when build_cmd is null. All routing outcomes chain to aggregate.
    action_type: shell
    timeout: 300
    action: |
      case "${context.run_dir}" in
        /*) ABS_DIR="${context.run_dir}" ;;
        *) ABS_DIR="$(pwd)/${context.run_dir}" ;;
      esac
      BUILD_CMD=$(python3 -c "import json; print(json.load(open('$${ABS_DIR}/commands.json')).get('build_cmd') or '')")
      if [ -z "$BUILD_CMD" ]; then
        echo "SKIP build_cmd=null" > "$${ABS_DIR}/build.txt"
        echo "SKIP"
        exit 0
      fi
      bash -c "$BUILD_CMD" > "$${ABS_DIR}/build.txt" 2>&1
      RC=$?
      echo "exit_code=$RC" >> "$${ABS_DIR}/build.txt"
      echo "exit_code=$RC"
    evaluate:
      type: exit_code
    on_yes: run_test
    on_no: run_test
    on_error: run_test

  run_test:
    # Captures pass_rate from pytest --json-report when available; falls back
    # to 1.0 on exit 0 (passes) or 0.0 on non-zero exit. output_numeric
    # operator `>=` against `${context.min_pass_rate}` (default 0.95) — both
    # here and independently in aggregate's pass_rate detector (ENH-2905).
    description: |
      Run test_cmd (if non-null); extract pass_rate from pytest-json-report
      when available. Evaluate via output_numeric (pass_rate >= min_pass_rate).
      All routing outcomes chain to aggregate.
    action_type: shell
    timeout: 600
    # ENH-2997: pre-patch-check guard, state-level (not loop-level) per the
    # Design Notes cost-preferred placement — `run_test` is the only state in
    # this oracle whose action can plausibly go green over a test file the
    # patch under evaluation adds or modifies, so this is the sole state
    # worth paying the worktree-fork cost on. Absent-key-means-SKIP and the
    # `(step_diff hash, base_ref)` memo apply exactly as for tamper_guard.
    prepatch_check: fail
    action: |
      case "${context.run_dir}" in
        /*) ABS_DIR="${context.run_dir}" ;;
        *) ABS_DIR="$(pwd)/${context.run_dir}" ;;
      esac
      TEST_CMD=$(python3 -c "import json; print(json.load(open('$${ABS_DIR}/commands.json')).get('test_cmd') or '')")
      # FEAT-3573 / BUG-2629: in a linked worktree, an editable install would
      # shadow the worktree's package with the main checkout's. Prepend the
      # worktree src_dir to PYTHONPATH — only when src_dir resolved (caller param or
      # resolve_via_ll_config); the value rides commands.json.
      SRC_DIR=$(python3 -c "import json; print(json.load(open('$${ABS_DIR}/commands.json')).get('src_dir') or '')")
      if [ -n "$SRC_DIR" ]; then
        GIT_DIR_ABS=$(cd "$(git rev-parse --absolute-git-dir 2>/dev/null)" 2>/dev/null && pwd -P)
        GIT_COMMON_ABS=$(cd "$(git rev-parse --git-common-dir 2>/dev/null)" 2>/dev/null && pwd -P)
        if [ -n "$GIT_DIR_ABS" ] && [ "$GIT_DIR_ABS" != "$GIT_COMMON_ABS" ]; then
          export PYTHONPATH="$(pwd)/$SRC_DIR$${PYTHONPATH:+:$PYTHONPATH}"
        fi
      fi
      if [ -z "$TEST_CMD" ]; then
        echo "SKIP test_cmd=null" > "$${ABS_DIR}/test-results.txt"
        echo "pass_rate=1.0" >> "$${ABS_DIR}/test-results.txt"
        echo "SKIP pass_rate=1.0"
        exit 0
      fi
      # BUG-3689: drop inherited interpreter / terminal-size overrides so the
      # suite sees a bare-terminal env. Explicit assignments inside test_cmd
      # still win. Keep in sync with worktree_utils.HERMETIC_ENV_VARS.
      unset LL_PYTHON COLUMNS LINES
      bash -c "$TEST_CMD" > "$${ABS_DIR}/test-results.txt" 2>&1
      RC=$?
      if [ -f "$${ABS_DIR}/pytest.json" ]; then
        python3 -c "
      import json
      d = json.load(open('$${ABS_DIR}/pytest.json'))
      s = d.get('summary', {})
      t = s.get('total', 0) or 0
      p = s.get('passed', 0) or 0
      rate = round(p / t, 3) if t else 1.0
      print(f'pass_rate={rate}')
      " >> "$${ABS_DIR}/test-results.txt"
      else
        RATE="1.0"
        [ "$RC" -ne 0 ] && RATE="0.0"
        echo "pass_rate=$RATE" >> "$${ABS_DIR}/test-results.txt"
      fi
      echo "exit_code=$RC" >> "$${ABS_DIR}/test-results.txt"
      RATE_LINE=$(grep '^pass_rate=' "$${ABS_DIR}/test-results.txt" | tail -1)
      echo "exit_code=$RC $${RATE_LINE}"
    capture: pass_rate
    evaluate:
      type: output_numeric
      key: pass_rate
      operator: "ge"
      target: "${context.min_pass_rate}"
    on_yes: run_typecheck
    on_no: run_typecheck
    on_error: run_typecheck

  run_typecheck:
    # Same shape as run_build but for the type-check command. Alias
    # `typecheck_cmd`/`type_cmd` already resolved by resolve_commands and
    # written into commands.json under the canonical `typecheck_cmd` key.
    description: |
      Run typecheck_cmd (if non-null) and write output to typecheck.txt.
      All routing outcomes chain to aggregate.
    action_type: shell
    timeout: 300
    action: |
      case "${context.run_dir}" in
        /*) ABS_DIR="${context.run_dir}" ;;
        *) ABS_DIR="$(pwd)/${context.run_dir}" ;;
      esac
      TYPECHECK_CMD=$(python3 -c "import json; print(json.load(open('$${ABS_DIR}/commands.json')).get('typecheck_cmd') or '')")
      # FEAT-3573 / BUG-2629: in a linked worktree, an editable install would
      # shadow the worktree's package with the main checkout's. Prepend the
      # worktree src_dir to PYTHONPATH — only when src_dir resolved (caller param or
      # resolve_via_ll_config); the value rides commands.json.
      SRC_DIR=$(python3 -c "import json; print(json.load(open('$${ABS_DIR}/commands.json')).get('src_dir') or '')")
      if [ -n "$SRC_DIR" ]; then
        GIT_DIR_ABS=$(cd "$(git rev-parse --absolute-git-dir 2>/dev/null)" 2>/dev/null && pwd -P)
        GIT_COMMON_ABS=$(cd "$(git rev-parse --git-common-dir 2>/dev/null)" 2>/dev/null && pwd -P)
        if [ -n "$GIT_DIR_ABS" ] && [ "$GIT_DIR_ABS" != "$GIT_COMMON_ABS" ]; then
          export PYTHONPATH="$(pwd)/$SRC_DIR$${PYTHONPATH:+:$PYTHONPATH}"
        fi
      fi
      if [ -z "$TYPECHECK_CMD" ]; then
        echo "SKIP typecheck_cmd=null" > "$${ABS_DIR}/typecheck.txt"
        echo "SKIP"
        exit 0
      fi
      bash -c "$TYPECHECK_CMD" > "$${ABS_DIR}/typecheck.txt" 2>&1
      RC=$?
      echo "exit_code=$RC" >> "$${ABS_DIR}/typecheck.txt"
      echo "exit_code=$RC"
    evaluate:
      type: exit_code
    on_yes: run_lint
    on_no: run_lint
    on_error: run_lint

  run_lint:
    description: |
      Run lint_cmd (if non-null) and write output to lint.txt. All routing
      outcomes chain to aggregate.
    action_type: shell
    timeout: 300
    action: |
      case "${context.run_dir}" in
        /*) ABS_DIR="${context.run_dir}" ;;
        *) ABS_DIR="$(pwd)/${context.run_dir}" ;;
      esac
      LINT_CMD=$(python3 -c "import json; print(json.load(open('$${ABS_DIR}/commands.json')).get('lint_cmd') or '')")
      if [ -z "$LINT_CMD" ]; then
        echo "SKIP lint_cmd=null" > "$${ABS_DIR}/lint.txt"
        echo "SKIP"
        exit 0
      fi
      bash -c "$LINT_CMD" > "$${ABS_DIR}/lint.txt" 2>&1
      RC=$?
      echo "exit_code=$RC" >> "$${ABS_DIR}/lint.txt"
      echo "exit_code=$RC"
    evaluate:
      type: exit_code
    on_yes: run_format_check
    on_no: run_format_check
    on_error: run_format_check

  run_format_check:
    # FEAT-3573: check-only format stage, scoped to the caller's changed-file
    # list. Opt-in: SKIPs unless `changed_files_path` is passed, so every
    # pre-existing caller is unchanged. The {files} placeholder in
    # format_check_cmd is replaced with the shell-quoted file list read straight
    # from changed_files_path (never via commands.json). A check-only command
    # never writes to the working tree.
    description: |
      Run format_check_cmd over the changed files (if configured and the caller
      passed a non-empty changed_files_path) and write output to
      format-check.txt. All routing outcomes chain to service_health.
    action_type: shell
    timeout: 120
    action: |
      case "${context.run_dir}" in
        /*) ABS_DIR="${context.run_dir}" ;;
        *) ABS_DIR="$(pwd)/${context.run_dir}" ;;
      esac
      FILES_PATH=${context.changed_files_path:shell:default=}
      if [ -z "$FILES_PATH" ]; then
        echo "SKIP changed_files_path=null" > "$${ABS_DIR}/format-check.txt"
        echo "SKIP"
        exit 0
      fi
      FULL_CMD=$(python3 -c "
      import json, shlex, sys
      cmd = json.load(open(sys.argv[1] + '/commands.json')).get('format_check_cmd') or ''
      try:
          files = [l.strip() for l in open(sys.argv[2]) if l.strip()]
      except OSError:
          files = []
      if cmd and files:
          quoted = ' '.join(shlex.quote(f) for f in files)
          print(cmd.replace('{files}', quoted) if '{files}' in cmd else cmd + ' ' + quoted)
      " "$${ABS_DIR}" "$FILES_PATH")
      if [ -z "$FULL_CMD" ]; then
        echo "SKIP format_check_cmd=null or no changed files" > "$${ABS_DIR}/format-check.txt"
        echo "SKIP"
        exit 0
      fi
      bash -c "$FULL_CMD" > "$${ABS_DIR}/format-check.txt" 2>&1
      RC=$?
      echo "exit_code=$RC" >> "$${ABS_DIR}/format-check.txt"
      echo "exit_code=$RC"
    evaluate:
      type: exit_code
    on_yes: service_health
    on_no: service_health
    on_error: service_health

  service_health:
    # Launches run_cmd as a background process, writes its PID to
    # ${run_dir}/service.pid, polls ${health_url} with curl --fail --max-time,
    # then tears down via `kill $(cat ${run_dir}/service.pid)` in an
    # ensure-clause pattern. Self-skips when both run_cmd and health_url
    # are null. exit_code 0 on HTTP 2xx; non-zero otherwise.
    description: |
      Launch run_cmd in background, poll health_url with curl, tear down
      via PID file. Self-skips when both run_cmd and health_url are null.
      All routing outcomes chain to aggregate.
    action_type: shell
    timeout: 60
    action: |
      case "${context.run_dir}" in
        /*) ABS_DIR="${context.run_dir}" ;;
        *) ABS_DIR="$(pwd)/${context.run_dir}" ;;
      esac
      RUN_CMD=$(python3 -c "import json; print(json.load(open('$${ABS_DIR}/commands.json')).get('run_cmd') or '')")
      HEALTH_URL=$(python3 -c "import json; print(json.load(open('$${ABS_DIR}/commands.json')).get('health_url') or '')")
      if [ -z "$RUN_CMD" ] && [ -z "$HEALTH_URL" ]; then
        echo "SKIP run_cmd=null health_url=null" > "$${ABS_DIR}/health.txt"
        echo "SKIP"
        exit 0
      fi
      if [ -z "$HEALTH_URL" ]; then
        echo "SKIP health_url=null" > "$${ABS_DIR}/health.txt"
        echo "SKIP"
        exit 0
      fi
      # Launch run_cmd in background if provided; record PID.
      SERVICE_PID=""
      if [ -n "$RUN_CMD" ]; then
        bash -c "$RUN_CMD" > "$${ABS_DIR}/service.log" 2>&1 &
        SERVICE_PID=$!
        echo "$SERVICE_PID" > "$${ABS_DIR}/service.pid"
      fi
      # Trap ensures we kill the service even if curl fails.
      cleanup() {
        [ -n "$SERVICE_PID" ] && kill "$SERVICE_PID" 2>/dev/null || true
        [ -f "$${ABS_DIR}/service.pid" ] && kill "$(cat $${ABS_DIR}/service.pid)" 2>/dev/null || true
        rm -f "$${ABS_DIR}/service.pid"
      }
      trap cleanup EXIT
      BOUND="${context.health_bound_seconds}"  # ll-lint: mr11-ok(context.health_bound_seconds) ENH-3358 - ENH-3342 widening residual, tracked for conversion
      [ -z "$BOUND" ] && BOUND=10
      # Poll the health URL (single attempt is sufficient for oracle scope).
      curl --fail --silent --max-time "$BOUND" "$HEALTH_URL" > "$${ABS_DIR}/health.txt" 2>&1
      RC=$?
      cleanup
      trap - EXIT
      echo "exit_code=$RC" >> "$${ABS_DIR}/health.txt"
      echo "exit_code=$RC"
    evaluate:
      type: exit_code
    on_yes: aggregate
    on_no: aggregate
    on_error: aggregate

  aggregate:
    # Reads all sidecar files (build.txt, test-results.txt, typecheck.txt,
    # lint.txt, format-check.txt, health.txt) and computes the final verdict:
    #   - All SKIP / empty          → GATE_SKIP   (docs-only no-op pass)
    #   - Any non-SKIP with FAIL     → GATE_FAILED
    #   - Otherwise                  → GATE_PASS
    # Writes the verdict to ${run_dir}/subloop_outcome_<ID>.txt so F2b can
    # read it. classify evaluator picks up the LAST non-empty stdout line
    # (per scripts/little_loops/fsm/evaluators.py:evaluate_classify lines
    # 453-504). route: table routes the verdict to done/failed.
    description: |
      Aggregate gate outcomes into GATE_PASS / GATE_FAILED / GATE_SKIP.
      route: table maps verdict → done/failed.
    action_type: shell
    timeout: 30
    action: |
      case "${context.run_dir}" in
        /*) ABS_DIR="${context.run_dir}" ;;
        *) ABS_DIR="$(pwd)/${context.run_dir}" ;;
      esac
      # Resolve changed_files_path to an absolute path BEFORE the cd below.
      FILES_PATH=${context.changed_files_path:shell:default=}
      case "$FILES_PATH" in
        ""|/*) ;;
        *) FILES_PATH="$(pwd)/$FILES_PATH" ;;
      esac
      cd "$${ABS_DIR}" || true

      ALL_SKIP=true
      ANY_FAIL=false
      ANY_RAN=false
      # FEAT-3573: a stage whose command is configured but whose sidecar is
      # absent was killed before its redirect created the file — that is a
      # failure, not a pass. format-check.txt is required only when the caller
      # passed changed_files_path AND a non-empty file list AND a command.
      MISSING=$(python3 -c "
      import json, os, sys
      try:
          cmds = json.load(open('commands.json'))
      except (OSError, ValueError):
          cmds = {}
      need = []
      for f, k in (('build.txt', 'build_cmd'), ('test-results.txt', 'test_cmd'),
                   ('typecheck.txt', 'typecheck_cmd'), ('lint.txt', 'lint_cmd'),
                   ('health.txt', 'health_url')):
          if cmds.get(k) and not os.path.isfile(f):
              need.append(f)
      fp = sys.argv[1]
      if fp and cmds.get('format_check_cmd') and not os.path.isfile('format-check.txt'):
          try:
              if any(l.strip() for l in open(fp)):
                  need.append('format-check.txt')
          except OSError:
              pass
      print(' '.join(need))
      " "$FILES_PATH" 2>/dev/null || true)
      [ -n "$MISSING" ] && ANY_FAIL=true
      for f in build.txt test-results.txt typecheck.txt lint.txt format-check.txt health.txt; do
        [ -f "$f" ] || continue
        # Detect SKIP vs real run via first-line prefix.
        FIRST=$(head -1 "$f")
        case "$FIRST" in
          SKIP*) ;;
          *)
            ANY_RAN=true
            if grep -q "^exit_code=[1-9]" "$f" 2>/dev/null; then
              ANY_FAIL=true
            fi
            # FEAT-3573: a non-SKIP sidecar with no exit_code= line was killed
            # at its state timeout (partial output only) — a failure, never a
            # pass.
            if ! grep -q "^exit_code=" "$f" 2>/dev/null; then
              ANY_FAIL=true
            fi
            if [ "$f" = "test-results.txt" ]; then
              PASS_RATE=$(grep '^pass_rate=' "$f" 2>/dev/null | tail -1 | cut -d= -f2)
              if [ -n "$PASS_RATE" ]; then
                MIN_PASS_RATE=${context.min_pass_rate:shell}
                if ! LL_ARG_PASS_RATE="$PASS_RATE" LL_ARG_MIN_PASS_RATE="$MIN_PASS_RATE" python3 -c "import os, sys; sys.exit(0 if float(os.environ['LL_ARG_PASS_RATE']) >= float(os.environ['LL_ARG_MIN_PASS_RATE']) else 1)"; then
                  ANY_FAIL=true
                fi
              fi
            fi
            ALL_SKIP=false
            ;;
        esac
      done

      if [ "$ANY_FAIL" = "true" ]; then
        VERDICT="GATE_FAILED"
      elif [ "$ALL_SKIP" = "true" ] && [ "$ANY_RAN" = "false" ]; then
        VERDICT="GATE_SKIP"
      else
        VERDICT="GATE_PASS"
      fi

      # Write final outcome token (F2b's reader — see FEAT-2552).
      echo "$VERDICT" > "subloop_outcome_${context.issue_id}.txt"  # ll-lint: mr11-ok(context.issue_id) ENH-3358 - ENH-3342 widening residual, tracked for conversion
      echo "$VERDICT"
    capture: gate_verdict
    evaluate:
      type: classify
      source: "${captured.gate_verdict.output}"
    route:
      GATE_PASS: done
      GATE_FAILED: failed
      GATE_SKIP: done
      _: failed
      _error: failed

  done:
    description: Terminal success (GATE_PASS or GATE_SKIP both reach here).
    terminal: true

  failed:
    description: Terminal failure (GATE_FAILED or unknown verdict).
    terminal: true