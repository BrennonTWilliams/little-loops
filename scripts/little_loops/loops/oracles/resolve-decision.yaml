name: resolve-decision
visibility: internal
description: |
  Extracted from autodev.yaml's inline decision cluster (BUG-3065). Probes
  whether an issue's decision_needed flag is decidable, deposits competing
  options if not, runs /ll:decide-issue --auto, and re-verifies the flag
  cleared. Returns done (flag cleared) or failed (still armed, errored before
  reaching decide, or rate-limit budget exhausted) — callers own their own
  post-resolution routing (re-score, defer, resume a mid-chain gate).
initial: route_entry
max_steps: 20
timeout: 3600
# Writes decide-options-deposited/decide-rate-limited markers under run_dir and,
# via /ll:refine-issue and /ll:decide-issue, mutates the target issue under
# .issues/ — matches refine-to-ready-issue.yaml's scope.
scope:
  - ".issues/"
  - "${context.run_dir}"
parameters:
  issue_id:
    type: string
    required: true
  skip_probe:
    type: string
    required: false
    default: "false"
context:
  issue_id: ""
  skip_probe: "false"
import:
  - lib/common.yaml

states:
  route_entry:
    # Entry demultiplexer (### Fifth entry point). Four callers enter via the
    # decidability probe (skip_probe unset/false). autodev's
    # triage_outcome_failure enters directly at run_decide (skip_probe:
    # "true") because its predicate is score_ambiguity <= 10 OR
    # decision_needed, where check-decidable is not the right gate. That
    # binding itself lands with ENH-3075; this sub-loop only needs to expose
    # the branch.
    action: "[ \"${context.skip_probe:shell}\" = \"true\" ]"
    fragment: shell_exit
    on_yes: run_decide
    on_no: check_decision_decidable

  check_decision_decidable:
    # ENH-2443 parity: decision_needed:true may have zero enumerable options
    # in ## Proposed Solution, in which case run_decide silently leaves the
    # flag unchanged and the issue never converges. ll-issues check-decidable
    # is the deterministic (non-LLM) companion to /ll:decide-issue
    # --validate-only. Marker-bounded: once deposit_options has run once for
    # this issue, skip re-validation and go straight to run_decide (bounds
    # the detour to one retry). ENH-2446: chain check-open-questions first —
    # coverage-aware probe that catches the mixed case (resolved options +
    # free-form open questions). Extracted from autodev.yaml's
    # check_decision_decidable.
    action: |
      if [ -f ${context.run_dir}/decide-options-deposited-${context.issue_id} ]; then  # ll-lint: mr11-ok(context.issue_id) ENH-3358 - ENH-3342 widening residual, tracked for conversion
        exit 0
      fi
      # ll-lint: mr11-ok(context.issue_id) ENH-3358 - ENH-3342 widening residual, tracked for conversion
      ll-issues check-open-questions ${context.issue_id} || \
        ll-issues check-decidable ${context.issue_id}  # ll-lint: mr11-ok(context.issue_id) ENH-3358 - ENH-3342 widening residual, tracked for conversion
    fragment: shell_exit
    on_yes: run_decide
    on_no: deposit_options
    on_error: run_decide

  deposit_options:
    # Bounded retry: refine --auto may deposit Option A/B/C blocks that
    # run_decide can then score. Write-once marker prevents infinite loops if
    # refine also can't deposit options — falls through to run_decide with no
    # enumerable options; assert_decision_cleared remains the safety net.
    # Extracted from autodev.yaml's deposit_options. on_rate_limit_exhausted
    # routes to failed, not done — a loop: sub-loop state can never observe
    # the rate-limit terminal (### Rate-limit exhaustion), so this is the
    # only signal a caller can act on.
    fragment: with_rate_limit_handling
    action_type: slash_command
    action: "/ll:refine-issue ${context.issue_id} --auto"
    pruning_profile:
      enabled: true
      name: refine-issue-auto
      suppress_claude_md: true
    on_yes: record_options_deposited
    on_no: run_decide
    on_partial: record_options_deposited
    on_error: run_decide
    on_rate_limit_exhausted: mark_decide_rate_limited

  record_options_deposited:
    # Marker ensures the deposit_options detour runs at most once per issue.
    # BUG-3065: named per-issue (autodev used to keep its own flat
    # autodev-decide-options-deposited before ENH-3075 converted it to call
    # this sub-loop) because the inherited run_dir may be shared across a
    # multi-issue queue (recursive-refine's context_passthrough) — a flat
    # name would make issue #2 onward find the marker already set and skip
    # deposit_options entirely.
    action_type: shell
    action: |
      printf '1' > ${context.run_dir}/decide-options-deposited-${context.issue_id}  # ll-lint: mr11-ok(context.issue_id) ENH-3358 - ENH-3342 widening residual, tracked for conversion
    next: check_open_question_progress

  check_open_question_progress:
    # ENH-2446: progress-gated deposit_options re-fire (parity with
    # rn-remediate.yaml). Appends the current unresolved-question count to a
    # per-issue history file, then lets the open_question_stall evaluator
    # decide whether to retry (on_yes: check_decision_decidable) or surface
    # via run_decide (on_no / on_error). BUG-3065 fix: declares
    # evaluate.history_file explicitly, per-issue, matching the write path —
    # the autodev original wrote this same per-issue file but never declared
    # history_file, so the evaluator fell back to a flat default path nothing
    # wrote and the gate was inert (always on_yes, rounds: 0).
    action_type: shell
    action: |
      ID="${context.issue_id}"  # ll-lint: mr11-ok(context.issue_id) ENH-3358 - ENH-3342 widening residual, tracked for conversion
      RUN_DIR="${context.run_dir}"
      HISTORY_FILE="$${RUN_DIR}/.open_questions_$${ID}.history"

      COUNT=$(python3 -c "
      from little_loops.cli.issues.show import _resolve_issue_id
      from little_loops.config import BRConfig
      from little_loops.issue_parser import (
          count_open_questions_in_sections,
          count_unresolved_options,
      )
      cfg = BRConfig('.')
      path = _resolve_issue_id(cfg, '$ID')
      if path is None:
          print(0)
      else:
          c = path.read_text()
          print(count_unresolved_options(c) + count_open_questions_in_sections(c))
      " 2>/dev/null || echo 0)

      echo "$${COUNT}"
      echo "$${COUNT}" >> "$${HISTORY_FILE}"
    fragment: open_question_stall_gate
    evaluate:
      history_file: "${context.run_dir}/.open_questions_${context.issue_id}.history"
    on_yes: check_decision_decidable
    on_no: run_decide
    on_error: run_decide

  run_decide:
    # Run /ll:decide-issue to select a winning implementation option and
    # clear decision_needed. Extracted from autodev.yaml's run_decide, minus
    # the caller-side mark_decide_ran / rerun_confidence_after_decide /
    # recheck_after_decide chain (### The extraction boundary) — those stay
    # in each caller, downstream of this sub-loop's terminal.
    # check_decision_after_decide_error (ENH-2717) collapses into
    # assert_decision_cleared below, which every exit path — success or
    # error — now reaches directly.
    fragment: with_rate_limit_handling
    action: "/ll:decide-issue ${context.issue_id} --auto"
    action_type: slash_command
    pruning_profile:
      enabled: true
      name: decide-issue-auto
      suppress_claude_md: true
    next: assert_decision_cleared
    on_error: assert_decision_cleared
    on_rate_limit_exhausted: mark_decide_rate_limited

  mark_decide_rate_limited:
    # ENH-3075 Option A: a `loop:` call state can never observe this
    # terminal's identity — _execute_sub_loop (executor.py:1055-1079) routes
    # a child's exit purely on terminated_by/failure_terminal (a bool, not a
    # terminal name), and the 429 interception at executor.py:1673-1686 is
    # gated on action_result, which a loop: state never produces
    # (recursive-refine.yaml:239-250 and rn-implement.yaml:745-746 document
    # the same limitation independently). on_rate_limit_exhausted is a
    # routing target (executor.py:3110), not a hook that runs before the
    # target, so the marker write needs its own state rather than being
    # attached to deposit_options/run_decide directly. Callers (autodev's
    # check_decide_rate_limited) read this marker on_failure/on_error to
    # terminate their run instead of deferring the issue and immediately
    # re-hitting the same 429 on the next queued issue. Per-issue and
    # run-dir-scoped, so it needs no explicit clearing.
    action_type: shell
    action: printf '1' > ${context.run_dir}/decide-rate-limited-${context.issue_id:shell}
    next: failed
    on_error: failed

  assert_decision_cleared:
    # BUG-2595: scores passing after run_decide does not prove decide-issue
    # actually cleared decision_needed — a silent no-op (BUG-1416) leaves the
    # flag armed. Re-verify the flag directly rather than trusting the
    # decide-issue exit code, which is exactly what let a manage-issue Phase
    # 2.3 halt get misclassified as a generic implementation failure.
    # Extracted from autodev.yaml's assert_decision_cleared; now sits
    # directly after run_decide instead of after the caller's re-score chain
    # — a tightening on the score-passing branch (checks sooner), with one
    # accepted behavior difference on the autodev path documented in
    # ### The extraction boundary.
    # on_error routes to failed rather than done (autodev's on_error:
    # implement_current would fail ENH-2825's failure-edge-to-success-terminal
    # gate here): an unverifiable flag state is treated conservatively as
    # unresolved, not silently as cleared.
    action: "ll-issues check-flag ${context.issue_id:shell} decision_needed"
    fragment: shell_exit
    on_yes: check_residual_decision
    on_no: done
    on_error: failed

  check_residual_decision:
    # BUG-3278: assert_decision_cleared's on_yes (flag still true) used to
    # route straight to failed, treating every still-set flag as a silent
    # no-op (BUG-2595). But decide-issue's own Phase 7b now leaves the flag
    # armed on purpose when a lower-precedence decision group survives the
    # pass (a residual bullet-tier group under --auto is a defined
    # human-review exit, not a bug) — routing that case to failed would turn
    # a correct, bounded stop into a hard oracle failure. This state tells
    # the two apart with the same group-aware probe decide-issue itself
    # gates on: ll-issues check-unresolved-decisions.
    #
    # Polarity follows fsm/evaluators.py:255-259 (0->on_yes, 1->on_no,
    # 2+->on_error) — do not swap these:
    #   - on_no (exit 1, a real residual group survives): the flag is
    #     *correctly* still set. Route to done — the sub-loop's job is
    #     finished; the caller's own decision_needed gate holds the issue
    #     for human review.
    #   - on_yes (exit 0, zero unresolved groups yet the flag is still
    #     true): nothing justifies the still-set flag — preserves BUG-2595's
    #     silent-no-op detection exactly. Route to failed.
    #   - on_error (exit 2+, including an unresolvable issue ID): an
    #     unverifiable state stays conservative, matching
    #     assert_decision_cleared's own on_error above.
    #
    # Do NOT route on_yes to check_open_question_progress: that counter is
    # blind to residual groups by construction (part 3's opt-in tier/directive
    # widening is not something it probes), so it would read flat and retry
    # forever — progress -> on_no -> run_decide -> assert -> on_yes ->
    # progress -> ... with no exit the stall gate can break.
    #
    # Verified non-spinning: autodev.yaml's decide_current short-circuits on
    # a write-once autodev-decide-ran marker, so a multi-decision issue under
    # autodev gets exactly one decide pass per dequeue before this state's
    # on_no routes it to human review — bounded by the caller, not by a
    # retry loop here.
    action: "ll-issues check-unresolved-decisions ${context.issue_id:shell}"
    fragment: shell_exit
    on_yes: failed
    on_no: done
    on_error: failed

  done:
    terminal: true

  failed:
    terminal: true
