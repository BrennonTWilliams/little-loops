# little-loops CI — split runner architecture.
#
# Security posture: push-only (no `pull_request`). This repo is PUBLIC. Only the
# `conformance` job runs on the self-hosted Thinky runner, which executes
# whatever it checks out — a fork-PR trigger on that job would be a
# remote-code-execution surface. Unit tests run on GitHub-hosted `ubuntu-latest`
# (ephemeral, isolated), so they carry no self-hosted RCE surface. If PR
# coverage is added later, gate it on approval / trusted-branch labels — never
# on fork events for the self-hosted job.
#
# Architectural split (Buzz #ci-cd 2026-08-18):
#   - unit-tests  -> ubuntu-latest. The Thinky runner cannot survive the
#                   CPU-heavy unit-test surface (four+ distinct fixes tried:
#                   auto-update, fixed-name, config-volume/reusage,
#                   DISABLE_AUTO_UPDATE — each bought survival time, none solved
#                   the mid-job death, and it is NOT resource starvation).
#                   GitHub-hosted runners are the only surface that completes a
#                   full unit run end-to-end.
#   - conformance -> Thinky (self-hosted). The host-conformance matrix needs
#                   host CLIs (claude/codex/gemini/…) pre-installed on Thinky;
#                   ephemeral runners would drop them every job.
#   - needs: [unit-tests] on conformance — explicit DAG serialization. This makes
#                   history.db persistence single-owner (conformance only) instead
#                   of race-conditioned between two jobs.
#
# Design constraints baked in (QA guardrails, Buzz #ci-cd 2026-08-17):
#   G1 clean-env-per-job — fresh venv each run (checkout clean + `python -m venv`).
#   G2 [dev] exercise     — `pip install -e ".[dev]"` + `pip check` + an explicit
#                           import assertion, so a missing test dep can't silently
#                           skip (the hermes pytest-asyncio gap class).
#   G3 history parity     — `.ll/history.db` is gitignored + mutated in place and
#                           wiped by checkout's `git clean -ffdx`; ci-history.sh
#                           restores the last snapshot before conformance and
#                           re-snapshots after, with two-tier retention (50
#                           rotated + 180d daily). Single-owner: conformance only.
#                           Unit tests isolate history.db to tmp_path (conftest
#                           `_isolate_history_db` + `_guard_real_history_db`), so
#                           they need no CI-level snapshot.
#   Pin assertion         — `pytest-xdist<3.8` (BUG-3208) is checked at the
#                           unit-test setup-step; a future commit that drops the
#                           pin fails fast before pytest runs.
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # upload-artifact needs the `actions: write` scope. Because `permissions` is
  # set explicitly here, every *other* scope (including `actions`) defaults to
  # `none` — without this line the failure-upload step 403s with "Resource not
  # accessible by integration" and the paper trail silently never uploads.
  actions: write
  # BUG-3208 Path E — diagnostic snapshot streaming needs `issues: write` for
  # `gh issue comment` against the sink issue (Path A in-runner diagnostics
  # failed three dispatches in a row; Path E writes to GitHub's servers via
  # `GITHUB_TOKEN`, which survives runner death). Without this line, the
  # snapshot writer 403s silently — same failure mode as the upload step.
  issues: write

jobs:
  unit-tests:
    name: Unit tests (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pin assertion (pytest-xdist < 3.8 — BUG-3208)
        # Fails fast on a future commit that drops the BUG-3208 pin, BEFORE
        # pytest runs — instead of silently reproducing the thread-method
        # watchdog wedge at ~98% (the failure mode that drove the pin).
        run: |
          grep -q 'pytest-xdist.*<3.8' scripts/pyproject.toml \
            || { echo "::error::pytest-xdist<3.8 pin missing from scripts/pyproject.toml (BUG-3208 regression)"; exit 1; }
          echo "pin assertion: pytest-xdist<3.8 present"

      - name: Clean venv + install [dev] (with exercise assertion)
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e "./scripts[dev]"
          .venv/bin/python -m pip check
          # G2: prove the dev extras actually landed — a missing plugin here is
          # exactly the silent-skip class we must not let through.
          .venv/bin/python -c "import pytest, pytest_cov, xdist, pytest_timeout, syrupy, hypothesis; print('dev deps verified')"

      - name: Run unit tests (exclude integration + conformance)
        # BUG-3208 diagnostic instrumentation (Path A — controller heartbeat +
        # resource sampler + log-survival backstop). `tee` mirrors pytest to
        # pytest.log without buffering the streamed CI log. `set -o pipefail`
        # is required: without it the pipeline's exit code is tee's (always 0),
        # masking pytest's real failure status.
        #
        # Three additions make the wedge's evidence SURVIVE the hang:
        #   1. mem.log sampler   — `free -m` + top-RSS every 30s. RSS climbing
        #      into a frozen tail => OOM; RSS flat => logical wedge (not memory).
        #   2. heartbeat.log     — full pytest process tree (PID/PPID/RSS/etime/
        #      stat/args) every 30s. This is the controller-side heartbeat: a
        #      live controller + idle workers => controller wait; controller
        #      gone + orphaned workers still holding the pipe => xdist reaping.
        #   3. `timeout 45m` backstop + orphan-reap — SIGTERM (+SIGKILL +30s)
        #      BEFORE the hosted runner's ~52m resource-watchdog fires, then
        #      `pkill -9 -f pytest` reaps any orphaned xdist workers that
        #      survive the controller kill (they otherwise hold the step's
        #      pipe open until the watchdog purges all logs as BlobNotFound).
        #      The step exits and the upload step (if: always()) persists
        #      pytest.log + mem.log + heartbeat.log + junit.
        run: |
          set -o pipefail
          ( while true; do \
              echo "== $(date -u +%H:%M:%S) =="; \
              free -m | awk 'NR==2{print "mem: used "$3"MB / "$2"MB"}'; \
              ps -eo rss,comm --sort=-rss | head -6 | awk '{printf "  %6.0f MB  %s\n", $1/1024, $2}'; \
              sleep 30; \
            done ) > mem.log 2>&1 &
          SAMPLER=$!
          ( while true; do \
              echo "== $(date -u +%H:%M:%S) == pytest process tree =="; \
              ps -eo pid,ppid,etime,rss,stat,args --sort=pid | grep -E '[p]ytest|[p]ython' || echo "  (no pytest/python processes)"; \
              sleep 30; \
            done ) > heartbeat.log 2>&1 &
          HEARTBEAT=$!
          # BUG-3208 Path A fix — background orphan-reaper, fires at T+46m
          # INDEPENDENT of the pipeline below. When `timeout` SIGKILLs the
          # wedged pytest controller, its surviving xdist workers / execnet
          # gateways keep the pipe's write-end open, so `tee` never sees EOF and
          # the `| tee pytest.log` pipeline never returns. A reap sequenced AFTER
          # the pipeline is therefore dead code — `RC=$?`, the kill/tail block,
          # and `exit` all sit unreachable behind a pipe that can't close, so the
          # step hangs at `in_progress` until the runner watchdog purges every
          # log as BlobNotFound (observed in dispatch 32879994072). This reaper
          # kills the orphaned processes on a timer (the `[p]ytest` bracket idiom
          # also matches `tee pytest.log`, so the read-end closes too), which
          # unblocks the pipeline, lets `RC=$?` fire, and lets the upload step
          # (`if: always()`) persist the evidence bundle.
          #
          # BUG-3208 Path A follow-up — `reaper.log` self-heartbeat. The reaper
          # subshell writes its own timestamped trace to `reaper.log` (spawn,
          # per-minute tick for 46 minutes, firing timestamp, pkill exit codes)
          # so a future dispatch can disambiguate runner-death from reap-failure.
          # If `reaper.log` survives to artifact upload → reap fired as expected
          # (any exit code is informative). If `reaper.log` is missing or only
          # has the spawn line → runner died before reap fired. This is the
          # diagnostic that's needed to name the runner-after-X failure mode.
          ( date -u +'reaper-spawned T=%H:%M:%S pid='$$ > reaper.log; \
            for i in $(seq 1 46); do sleep 60; date -u +"reaper-tick$i T=%H:%M:%S" >> reaper.log; done; \
            echo "reaper-firing T=$(date -u +%H:%M:%S)" >> reaper.log; \
            pkill -9 -f '[p]ytest' 2>/dev/null; echo "pkill-pytest rc=$?" >> reaper.log; \
            pkill -9 -f '[e]xecnet' 2>/dev/null; echo "pkill-execnet rc=$?" >> reaper.log; \
            echo "reaper-done T=$(date -u +%H:%M:%S)" >> reaper.log ) &
          REAPER=$!
          # BUG-3208 Path E — diagnostic snapshot streaming via GitHub issue comment
          # PATCH. Path A's in-runner diagnostics died with the runner three dispatches
          # in a row (no artifact upload reached GH storage because the upload step
          # never ran). Path E streams diagnostic snapshots to a single GitHub issue
          # comment via PATCH (the (d) branch pattern) — one comment, updated every
          # ~30s. The comment lives on GitHub's servers, NOT the runner's ephemeral
          # disk, so the most recent successful PATCH survives runner death. Same
          # survival property as S3, zero new secrets, zero owner-side action.
          #
          # Pattern: POST-once-then-PATCH (not POST-many). 45-min dispatch produces ONE
          # comment, updated every 30s, with the latest snapshot. Avoids spamming the
          # public tracker with ~90 comments. 65KB cap is handled by drop-oldest
          # meta-lines inside the comment body.
          #
          # Sink target: SINK_ISSUE env var. Not hardcoded — read from workflow_dispatch
          # input or repo variable, so a future sink-issue re-creation doesn't need a
          # YAML edit. Fails loud if unset (no comment gets created; the in-runner
          # diagnostic files still upload if the runner reaches terminal state).
          #
          # Worst-case data loss with 30s cadence: ~30s of evidence (last successful
          # PATCH before writer dies). Better than the previous 100% loss when Path A's
          # in-runner artifacts died with the runner.
          if [ -z "${SINK_ISSUE:-}" ]; then
            echo "::warning::SINK_ISSUE env var is unset; Path E diagnostic stream disabled for this run"
          else
            INITIAL_BODY="Path E diagnostic stream for run $GITHUB_RUN_ID. Updates every ~30s; 65KB cap handled by drop-oldest meta-lines. Last successful PATCH before runner death is the snapshot we want."
            # Path E POST-once-then-PATCH comment_id extraction.
            # Use `gh api` POST + `--jq .id` so the comment_id comes from the JSON
            # response field directly. URL-based parsing (e.g. `grep -oE '#[0-9]+$'`
            # on `https://github.com/.../issues/11#issuecomment-12345`) FAILS because
            # `#` is preceded by `issuecomment-`, not digits — the regex matches
            # nothing and the `|| echo ""` fallback silently fires. Result: Path E
            # would spam ~90 new comments per 45-min dispatch instead of PATCHing one,
            # opposite of the design intent at :172-175.
            #
            # JSON contract (`id` field on issue comment) is stable across GH URL
            # format changes. `--jq .id` returns the comment_id (numeric) or empty
            # on failure; `|| echo ""` normalizes the empty case.
            COMMENT_ID=$(gh api -X POST "/repos/${GITHUB_REPOSITORY:-BrennonTWilliams/little-loops}/issues/${SINK_ISSUE}/comments" \
              -f body="$INITIAL_BODY" --jq .id 2>/dev/null || echo "")
            COMMENT_URL="https://github.com/${GITHUB_REPOSITORY:-BrennonTWilliams/little-loops}/issues/${SINK_ISSUE}#issuecomment-${COMMENT_ID}"
            echo "Path E initial comment: issue=$SINK_ISSUE id=$COMMENT_ID url=$COMMENT_URL"
            # Silent-fallback hardening: if the initial POST returned no comment_id
            # (auth failure, rate limit, network, malformed SINK_ISSUE), skip ONLY
            # the PATCH loop. Do NOT `exit 0` — that would short-circuit the entire
            # CI step, killing pytest before it runs (silent test-coverage loss).
            # Wrap the PATCH loop in a positive guard (Option A from QA event d744c310).
            # POST fails → loop never starts, pytest runs normally. POST succeeds → loop
            # runs as designed. Logging ::error:: surfaces the failure mode for triage.
            if [ -n "$COMMENT_ID" ] && [ "$COMMENT_ID" != "null" ]; then
              ( while true; do
                  {
                    echo "Path E snapshot stream — run_id=$GITHUB_RUN_ID run_attempt=$GITHUB_RUN_ATTEMPT step=unit-tests"
                    echo "snapshot T=$(date -u +%H:%M:%S) (last update wins; older meta-lines truncated by 65KB cap)"
                    echo ""
                    echo "--- mem.log (last 3 lines) ---"
                    tail -3 mem.log 2>/dev/null || echo "(mem.log not present)"
                    echo ""
                    echo "--- heartbeat.log (last 3 lines) ---"
                    tail -3 heartbeat.log 2>/dev/null || echo "(heartbeat.log not present)"
                    echo ""
                    echo "--- sigprobe.log (last 3 lines) ---"
                    tail -3 sigprobe.log 2>/dev/null || echo "(sigprobe.log not present)"
                    echo ""
                    echo "--- reaper.log (last 3 lines) ---"
                    tail -3 reaper.log 2>/dev/null || echo "(reaper.log not present)"
                  } > /tmp/pathE_snapshot.txt
                  if [ -n "$COMMENT_ID" ]; then
                  # Path E drop-oldest body assembly.
                  # Server-as-source-of-truth: GET current body, append new snapshot,
                  # truncate from middle if approaching GitHub's 65536-char comment
                  # limit, PATCH. Without this, body accumulates at ~1.3KB/snapshot
                  # × 30s cadence = ~115KB over 45min, PATCH fails silently at ~25min
                  # into run, back half of dispatch lost. Same design-vs-implementation
                  # pathology as the grep bug.
                  CURRENT_BODY=$(gh api "/repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" --jq .body 2>/dev/null || echo "")
                  NEW_BODY="${CURRENT_BODY}"$'\n\n'"$(cat /tmp/pathE_snapshot.txt)"
                  # 60000 leaves 5536-char buffer for PATCH validation / future growth.
                  if [ "${#NEW_BODY}" -gt 60000 ]; then
                    TRUNCATED_AT_T=$(date -u +%H:%M:%S)
                    NEW_BODY="[...older snapshots truncated at 60KB cap T=${TRUNCATED_AT_T}...]"$'\n\n'"${NEW_BODY: -60000}"
                  fi
                  printf '%s' "$NEW_BODY" > /tmp/pathE_body.txt
                  gh api --method PATCH -H "Accept: application/vnd.github+json" \
                    "/repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" \
                    -F body=@/tmp/pathE_body.txt 2>/dev/null \
                    || echo "PATCH failed at $(date -u +%H:%M:%S) exit=$?" >> /tmp/pathE_failures.log
                else
                  # Fallback: POST a new comment if initial POST failed to yield ID
                  gh issue comment "$SINK_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/pathE_snapshot.txt 2>/dev/null \
                    || echo "POST failed at $(date -u +%H:%M:%S) exit=$?" >> /tmp/pathE_failures.log
                fi
                sleep 30
              done ) &
              SNAPSHOTTER=$!
            else
              echo "::error::Path E POST returned empty/null comment_id; PATCH loop disabled to avoid POST-many spam. Check SINK_ISSUE=$SINK_ISSUE, auth, and rate limits."
            fi
          fi
          set +e
          PYTHONUNBUFFERED=1 timeout --signal=TERM --kill-after=30s 45m \
            .venv/bin/python -m pytest scripts/tests/ \
              -m "not integration and not conformance" \
              -v \
              --tb=line \
              --junit-xml=pytest-junit.xml \
              | tee pytest.log
          RC=$?
          set -e
          # Reap orphaned xdist workers that survive the controller kill — they
          # would otherwise hold the step's stdout pipe open until the runner
          # watchdog fires (~52m) and purges every log as BlobNotFound.
          kill "$SAMPLER" "$HEARTBEAT" "$REAPER" "$SNAPSHOTTER" 2>/dev/null || true
          pkill -9 -f 'pytest' 2>/dev/null || true
          pkill -9 -f 'execnet' 2>/dev/null || true
          echo "pytest exit: $RC"
          echo "=== pytest.log tail (last test before stop) ==="
          tail -30 pytest.log || true
          echo "=== mem.log tail (final memory samples) ==="
          tail -15 mem.log || true
          echo "=== heartbeat.log tail (final process tree) ==="
          tail -40 heartbeat.log || true
          exit $RC

      - name: Upload unit-test artifacts
        # `if: always()` is the data-collection gate — green runs need to
        # upload too, because the clean-finish signal (junit pass, no busy-spin
        # tail) is exactly the verification surface for the BUG-3208 stack.
        # `if-no-files-found: error` is deliberate: if pytest hangs (the
        # BUG-3208 failure mode) junit XML never gets written, and the upload
        # step must surface that as a real failure — not as a silent warning
        # that's easy to miss in the run summary. The previous `warn` setting
        # hid hang-mode behind an annotation nobody reads.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-unit-failures-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            pytest.log
            pytest-junit.xml
            mem.log
            heartbeat.log
            sigprobe.log
            reaper.log
          retention-days: 30
          if-no-files-found: error

  conformance:
    name: Host conformance (Thinky)
    runs-on: [self-hosted, Linux, X64, thinky]
    # Explicit DAG serialization — conformance runs only after unit-tests
    # succeeds. Load-bearing for history.db: it makes conformance the single
    # owner of the snapshot, instead of two jobs racing on the same snapshot
    # root (the intra-run race that `git clean -ffdx` + two snapshot writers
    # would otherwise expose).
    needs: [unit-tests]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore .ll/history.db snapshot
        run: bash .github/scripts/ci-history.sh restore

      - name: Clean venv + install [dev]
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e "./scripts[dev]"

      - name: Run host conformance matrix
        # Same pipefail + tee + junit pattern as the unit job. Without
        # `set -o pipefail` the pipeline's exit code is tee's (always 0),
        # masking pytest's actual failure status from the GH Actions summary.
        run: |
          set -o pipefail
          .venv/bin/python -m pytest scripts/tests/ \
            -m conformance \
            -ra --tb=short \
            --junit-xml=pytest-conformance-junit.xml \
            2>&1 | tee /tmp/conformance.log

      - name: Upload conformance artifacts
        # Mirrors the unit job's upload shape. Separate artifact name
        # (`pytest-conformance-failures-*`) so the two jobs' artifacts don't
        # collide on the artifact store. `if: always()` so a clean green
        # conformance produces a junit-paper-trail alongside failure capture;
        # `if-no-files-found: error` mirrors the unit-job policy — missing
        # artifacts should be loud, not silent. (FEAT-992 host-CLI stub case
        # still ends up as `error` here; if that becomes an active problem we
        # can switch this job back to `warn` while keeping `error` on unit.)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-conformance-failures-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/conformance.log
            pytest-conformance-junit.xml
          retention-days: 7
          if-no-files-found: error

      - name: Surface conformance summary
        if: always()
        run: |
          grep -E "passed|failed|skipped|deselected|error" /tmp/conformance.log | tail -8 || true
          echo "::notice::Conformance SKIPs are host-CLI stubs (FEAT-992) — expected, not a regression signal."

      - name: Snapshot .ll/history.db (two-tier retention)
        if: always()
        run: bash .github/scripts/ci-history.sh snapshot
