# little-loops CI — split runner architecture.
#
# Security posture: push-only (no `pull_request`). This repo is PUBLIC. Only the
# `conformance` job runs on the self-hosted Thinky runner, which executes
# whatever it checks out — a fork-PR trigger on that job would be a
# remote-code-execution surface. Unit tests run on GitHub-hosted `ubuntu-latest`
# (ephemeral, isolated), so they carry no self-hosted RCE surface. If PR
# coverage is added later, gate it on approval / trusted-branch labels — never
# on fork events for the self-hosted job.
#
# Architectural split (Buzz #ci-cd 2026-08-18):
#   - unit-tests  -> ubuntu-latest. The Thinky runner cannot survive the
#                   CPU-heavy unit-test surface (four+ distinct fixes tried:
#                   auto-update, fixed-name, config-volume/reusage,
#                   DISABLE_AUTO_UPDATE — each bought survival time, none solved
#                   the mid-job death, and it is NOT resource starvation).
#                   GitHub-hosted runners are the only surface that completes a
#                   full unit run end-to-end.
#   - conformance -> Thinky (self-hosted). The host-conformance matrix needs
#                   host CLIs (claude/codex/gemini/…) pre-installed on Thinky;
#                   ephemeral runners would drop them every job.
#   - needs: [unit-tests] on conformance — explicit DAG serialization. This makes
#                   history.db persistence single-owner (conformance only) instead
#                   of race-conditioned between two jobs.
#
# Design constraints baked in (QA guardrails, Buzz #ci-cd 2026-08-17):
#   G1 clean-env-per-job — fresh venv each run (checkout clean + `python -m venv`).
#   G2 [dev] exercise     — `pip install -e ".[dev]"` + `pip check` + an explicit
#                           import assertion, so a missing test dep can't silently
#                           skip (the hermes pytest-asyncio gap class).
#   G3 history parity     — `.ll/history.db` is gitignored + mutated in place and
#                           wiped by checkout's `git clean -ffdx`; ci-history.sh
#                           restores the last snapshot before conformance and
#                           re-snapshots after, with two-tier retention (50
#                           rotated + 180d daily). Single-owner: conformance only.
#                           Unit tests isolate history.db to tmp_path (conftest
#                           `_isolate_history_db` + `_guard_real_history_db`), so
#                           they need no CI-level snapshot.
#   Pin assertion         — `pytest-xdist<3.8` (BUG-3208) is checked at the
#                           unit-test setup-step; a future commit that drops the
#                           pin fails fast before pytest runs.
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      # Diagnostic toggles (ci/diagnose-unit-hang) — isolate the BUG-3208 wedge
      # by disabling the ll-history plugin, capping workers, and/or switching
      # the timeout method off `thread`. Defaults reproduce the failing path.
      disable_ll_history:
        description: 'Add -p no:ll_history to rule out the sqlite plugin as the hang source'
        type: boolean
        default: false
      worker_count:
        description: 'xdist worker cap (empty = -n logical as shipped)'
        type: string
        default: ''
      timeout_method:
        description: 'pytest --timeout-method'
        type: choice
        options: [thread, signal]
        default: thread

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # upload-artifact needs the `actions: write` scope. Because `permissions` is
  # set explicitly here, every *other* scope (including `actions`) defaults to
  # `none` — without this line the failure-upload step 403s with "Resource not
  # accessible by integration" and the paper trail silently never uploads.
  actions: write

jobs:
  unit-tests:
    name: Unit tests (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pin assertion (pytest-xdist < 3.8 — BUG-3208)
        # Fails fast on a future commit that drops the BUG-3208 pin, BEFORE
        # pytest runs — instead of silently reproducing the thread-method
        # watchdog wedge at ~98% (the failure mode that drove the pin).
        run: |
          grep -q 'pytest-xdist.*<3.8' scripts/pyproject.toml \
            || { echo "::error::pytest-xdist<3.8 pin missing from scripts/pyproject.toml (BUG-3208 regression)"; exit 1; }
          echo "pin assertion: pytest-xdist<3.8 present"

      - name: Clean venv + install [dev] (with exercise assertion)
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e "./scripts[dev]"
          .venv/bin/python -m pip check
          # G2: prove the dev extras actually landed — a missing plugin here is
          # exactly the silent-skip class we must not let through.
          .venv/bin/python -c "import pytest, pytest_cov, xdist, pytest_timeout, syrupy, hypothesis; print('dev deps verified')"

      - name: Run unit tests (exclude integration + conformance)
        # Diagnostic instrumentation (ci/diagnose-unit-hang): a background
        # sampler records `date + free -m + top-RSS` every 20s to mem.log, and a
        # `timeout 48m` backstop SIGTERMs pytest BEFORE the hosted runner's
        # ~52m resource-watchdog fires — so the step completes with exit 124 and
        # the upload step (if: always()) runs, persisting pytest.log + mem.log
        # + junit that a lost-communication death would otherwise wipe.
        # A frozen tail in pytest.log + climbing RSS in mem.log = the hang/OOM
        # point, captured instead of purged.
        run: |
          set -o pipefail
          EXTRA=()
          [ "${{ inputs.disable_ll_history }}" = "true" ] && EXTRA+=("-p" "no:ll_history")
          if [ -n "${{ inputs.worker_count }}" ]; then
            EXTRA+=("-n" "${{ inputs.worker_count }}")
          fi
          EXTRA+=("--timeout-method" "${{ inputs.timeout_method }}")
          ( while true; do \
              echo "== $(date -u +%H:%M:%S) =="; \
              free -m | awk 'NR==2{print "mem: used "$3"MB / "$2"MB"}'; \
              ps -eo rss,comm --sort=-rss | head -6 | awk '{printf "  %6.0f MB  %s\n", $1/1024, $2}'; \
              sleep 20; \
            done ) > mem.log 2>&1 &
          SAMPLER=$!
          set +e
          # Cap VIRTUAL memory ~1GB below the runner's 7GB so the kernel OOM-killer
          # never fires: a leak instead fails inside Python as a MemoryError that
          # pytest catches and reports WITH the test name, writes junit, and lets
          # the upload step persist evidence — instead of silently nuking the
          # runner agent ("lost communication") and purging everything.
          ulimit -v 6500000
          PYTHONUNBUFFERED=1 timeout --signal=TERM --kill-after=30s 30m \
            .venv/bin/python -m pytest scripts/tests/ \
              -m "not integration and not conformance" \
              -v \
              --tb=line \
              "${EXTRA[@]}" \
              --junit-xml=pytest-junit.xml \
              | tee pytest.log
          RC=$?
          set -e
          kill "$SAMPLER" 2>/dev/null || true
          echo "pytest exit: $RC"
          echo "=== pytest.log tail (last test before stop) ==="
          tail -25 pytest.log || true
          echo "=== mem.log tail (final memory samples) ==="
          tail -30 mem.log || true
          exit $RC

      - name: Upload unit-test artifacts
        # `if: always()` is the data-collection gate — green runs need to
        # upload too, because the clean-finish signal (junit pass, no busy-spin
        # tail) is exactly the verification surface for the BUG-3208 stack.
        # `if-no-files-found: warn` is deliberate: if pytest hangs at 98-99%
        # (the BUG-3208 failure mode) junit XML never gets written, and the
        # upload step should not turn a hung run into a *double* failure.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-unit-failures-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            pytest.log
            pytest-junit.xml
            mem.log
          retention-days: 7
          if-no-files-found: warn

  conformance:
    name: Host conformance (Thinky)
    runs-on: [self-hosted, Linux, X64, thinky]
    # Explicit DAG serialization — conformance runs only after unit-tests
    # succeeds. Load-bearing for history.db: it makes conformance the single
    # owner of the snapshot, instead of two jobs racing on the same snapshot
    # root (the intra-run race that `git clean -ffdx` + two snapshot writers
    # would otherwise expose).
    needs: [unit-tests]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore .ll/history.db snapshot
        run: bash .github/scripts/ci-history.sh restore

      - name: Clean venv + install [dev]
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e "./scripts[dev]"

      - name: Run host conformance matrix
        # Same pipefail + tee + junit pattern as the unit job. Without
        # `set -o pipefail` the pipeline's exit code is tee's (always 0),
        # masking pytest's actual failure status from the GH Actions summary.
        run: |
          set -o pipefail
          .venv/bin/python -m pytest scripts/tests/ \
            -m conformance \
            -ra --tb=short \
            --junit-xml=pytest-conformance-junit.xml \
            2>&1 | tee /tmp/conformance.log

      - name: Upload conformance artifacts
        # Mirrors the unit job's upload shape. Separate artifact name
        # (`pytest-conformance-failures-*`) so the two jobs' artifacts don't
        # collide on the artifact store. `if: always()` so a clean green
        # conformance produces a junit-paper-trail alongside failure capture;
        # `if-no-files-found: warn` handles the FEAT-992 host-CLI stub case.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-conformance-failures-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/conformance.log
            pytest-conformance-junit.xml
          retention-days: 7
          if-no-files-found: warn

      - name: Surface conformance summary
        if: always()
        run: |
          grep -E "passed|failed|skipped|deselected|error" /tmp/conformance.log | tail -8 || true
          echo "::notice::Conformance SKIPs are host-CLI stubs (FEAT-992) — expected, not a regression signal."

      - name: Snapshot .ll/history.db (two-tier retention)
        if: always()
        run: bash .github/scripts/ci-history.sh snapshot
