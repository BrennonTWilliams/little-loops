# little-loops CI — self-hosted runner on Thinky.
#
# Security posture: push-only (no `pull_request`). This repo is PUBLIC and the
# runner executes whatever it checks out, so a fork-PR trigger would be a
# remote-code-execution surface on Thinky. If PR coverage is added later, gate
# it on approval / trusted-branch labels — never on fork events.
#
# Design constraints baked in here (QA guardrails, Buzz #ci-cd 2026-08-17):
#   G1 clean-env-per-job — fresh venv each run (checkout clean + `python -m venv`).
#   G2 [dev] exercise     — `pip install -e ".[dev]"` + `pip check` + an explicit
#                           import assertion, so a missing test dep can't silently
#                           skip (the hermes pytest-asyncio gap class).
#   G3 history parity     — `.ll/history.db` is gitignored + mutated in place and
#                           wiped by checkout's `git clean -ffdx`; ci-history.sh
#                           restores the last snapshot before tests and re-snapshots
#                           after, with two-tier retention (see script).
#   Persistent runner     — the host-conformance matrix needs host CLIs
#                           (claude/codex/gemini/…) pre-installed on Thinky; an
#                           ephemeral runner would drop them every job. Clean-env
#                           is therefore achieved via fresh venv, not ephemerality.
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (Thinky)
    runs-on: [self-hosted, Linux, X64, thinky]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore .ll/history.db snapshot
        run: bash .github/scripts/ci-history.sh restore

      - name: Clean venv + install [dev] (with exercise assertion)
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e "./scripts[dev]"
          .venv/bin/python -m pip check
          # G2: prove the dev extras actually landed — a missing plugin here is
          # exactly the silent-skip class we must not let through.
          .venv/bin/python -c "import pytest, pytest_cov, xdist, pytest_timeout, syrupy, hypothesis; print('dev deps verified')"

      - name: Run unit tests (exclude integration + conformance)
        run: .venv/bin/python -m pytest scripts/tests/ -m "not integration and not conformance"

      - name: Snapshot .ll/history.db (two-tier retention)
        if: always()
        run: bash .github/scripts/ci-history.sh snapshot

  conformance:
    name: Host conformance (Thinky)
    runs-on: [self-hosted, Linux, X64, thinky]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore .ll/history.db snapshot
        run: bash .github/scripts/ci-history.sh restore

      - name: Clean venv + install [dev]
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e "./scripts[dev]"

      - name: Run host conformance matrix
        run: |
          set -o pipefail
          .venv/bin/python -m pytest scripts/tests/ -m conformance -ra --tb=short 2>&1 | tee /tmp/conformance.log

      - name: Surface conformance summary
        if: always()
        run: |
          grep -E "passed|failed|skipped|deselected|error" /tmp/conformance.log | tail -8 || true
          echo "::notice::Conformance SKIPs are host-CLI stubs (FEAT-992) — expected, not a regression signal."

      - name: Snapshot .ll/history.db (two-tier retention)
        if: always()
        run: bash .github/scripts/ci-history.sh snapshot
