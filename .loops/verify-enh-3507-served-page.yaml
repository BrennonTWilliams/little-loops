name: verify-enh-3507-served-page
category: verification
description: |
  Served-page verification for ENH-3507 (policy builder connected storage).
  Starts `ll-artifact serve --policy-builder` on an explicit non-default port,
  loads the builder over http://127.0.0.1 with Playwright
  (.loops/probes/enh-3507-served-page-probes.mjs), asserts the stamped
  workspaceId against an independently computed value and that a committed
  edit writes only workspace-namespaced storage keys.

  Dev-only, on-demand; never a pytest gate. Ends in `skipped-no-playwright` —
  never a pass — when Playwright is unavailable. Verdict is owned by the probe
  exit marker.
scope:
  - ".loops/runs/"
context:
  probe_script: .loops/probes/enh-3507-served-page-probes.mjs
initial: preflight
states:
  preflight:
    action_type: shell
    action: |
      mkdir -p "${context.run_dir}"
      if ! command -v node >/dev/null 2>&1; then
        echo "PLAYWRIGHT_MISSING: node not on PATH"
        exit 0
      fi
      node ${context.probe_script:shell} --check > "${context.run_dir}/preflight.log" 2>&1
      cat "${context.run_dir}/preflight.log"
      exit 0
    timeout: 120
    evaluate:
      type: output_contains
      pattern: PLAYWRIGHT_OK
    on_yes: probe
    on_no: skipped-no-playwright
    on_error: skipped-no-playwright

  probe:
    action_type: shell
    action: |
      node ${context.probe_script:shell} "${context.run_dir}/probe-report.json" > "${context.run_dir}/probes.log" 2>&1
      cat "${context.run_dir}/probes.log"
      exit 0
    timeout: 600
    evaluate:
      type: output_contains
      pattern: SERVED_PROBES_PASSED
    on_yes: done
    on_no: failed
    on_error: failed

  done:
    terminal: true
  skipped-no-playwright:
    terminal: true
    failure: true
  failed:
    terminal: true
    failure: true

max_steps: 8
max_iterations: 1
timeout: 900
