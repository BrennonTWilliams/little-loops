name: ll-logs-telemetry-digest
category: telemetry
description: |
  One-pass telemetry digest: run the EPIC-1918 analysis subcommands (stats,
  sequences, scan-failures, dead-skill detection), triage findings into issues,
  and write a digest. Each analysis subcommand reads its own source directly —
  stats/dead-skills from .ll/history.db, scan-failures/sequences from the
  session JSONL tree — so none of them depend on the refresh_corpus step, which
  materializes logs/ for external readers only (BUG-3216).
initial: refresh_corpus
on_handoff: spawn
scope:
  - "${context.run_dir}"
  - ".issues/"
  - "logs/"

states:
  # Refreshes logs/ for readers outside this loop. Deliberately NOT a gate:
  # `ll-logs extract --all` has no failure path (cli/logs.py:796) and nothing
  # downstream reads what it writes, so there is no honest pass/fail signal
  # here to branch on (BUG-3216).
  refresh_corpus:
    action: |
      RUN="${context.run_dir}"
      ll-logs discover > "$RUN/discover.log" 2>&1 || true
      ll-logs extract --all > "$RUN/extract.log" 2>&1
      RC=$?
      echo "exit_code=$RC" >> "$RUN/extract.log"
      echo "REFRESH_ATTEMPTED:rc=$RC"
    action_type: shell
    capture: refresh_status
    next: run_stats

  run_stats:
    action: |
      RUN="${context.run_dir}"
      OUT="$RUN/stats.txt"
      ERR="$RUN/stats.err"
      ll-logs stats --all > "$OUT" 2> "$ERR"
      RC=$?
      echo "exit_code=$RC" >> "$ERR"
      if [ "$RC" -ne 0 ]; then
        echo "STATS_ERROR:rc=$RC"
      elif grep -q "No history.db found" "$ERR"; then
        echo "STATS_NO_DATA"
      else
        echo "STATS_OK"
      fi
    action_type: shell
    capture: stats_check
    next: scan_failures

  # --project . (not --all): this feeds triage_failures, which files issues into
  # THIS repo's .issues/. Cross-project capture is an explicit opt-in on the CLI
  # (`scan-failures --capture-foreign`) and must stay one here.
  scan_failures:
    action: |
      RUN="${context.run_dir}"
      OUT="$RUN/failures.json"
      ERR="$RUN/failures.err"
      ll-logs scan-failures --project . --json > "$OUT" 2> "$ERR"
      RC=$?
      echo "exit_code=$RC" >> "$ERR"
      if [ "$RC" -ne 0 ]; then
        echo "FAILURES_ERROR:rc=$RC"
      elif grep -q "No session project folder found" "$ERR"; then
        echo "FAILURES_NO_DATA"
      else
        COUNT=$(python3 -c "
      import json
      try:
          d = json.load(open('$OUT'))
          items = d.get('failures', d) if isinstance(d, dict) else d
          print(len(items) if isinstance(items, list) else -1)
      except Exception:
          print(-1)
      " 2>/dev/null || echo "-1")
        if [ "$COUNT" -lt 0 ]; then
          echo "FAILURES_ERROR:unparseable"
        elif [ "$COUNT" -eq 0 ]; then
          echo "NO_FAILURES"
        else
          echo "FAILURES_FOUND:$COUNT"
        fi
      fi
    action_type: shell
    capture: failures_check
    # Only a positive finding triages. An error or no-data result must not reach
    # triage_failures, and must not be reported as a clean corpus either.
    evaluate:
      type: output_contains
      source: "${captured.failures_check.output}"
      pattern: "FAILURES_FOUND"
    on_yes: triage_failures
    on_no: run_sequences
    on_error: run_sequences

  triage_failures:
    action_type: prompt
    timeout: 600
    action: |
      ll-logs scan-failures found failed ll-* tool invocations in interactive
      sessions. The JSON report is at ${context.run_dir}/failures.json.

      For each distinct failure pattern:
      1. Run `ll-issues list --filter=open --json` to check for existing coverage
      2. If not already tracked, run `/ll:capture-issue` with the failure context
      3. Skip one-off environment failures (missing auth, absent env vars, typos)
      4. Capture at most 3 net-new issues to avoid backlog flooding

      Print "TRIAGE_DONE" when finished.
    capture: triage_status
    next: run_sequences

  run_sequences:
    action: |
      RUN="${context.run_dir}"
      OUT="$RUN/sequences.txt"
      ERR="$RUN/sequences.err"
      ll-logs sequences --all --top 20 --min-count 3 > "$OUT" 2> "$ERR"
      RC=$?
      echo "exit_code=$RC" >> "$ERR"
      if [ "$RC" -ne 0 ]; then
        echo "SEQUENCES_ERROR:rc=$RC"
      else
        echo "SEQUENCES_OK"
      fi
    action_type: shell
    capture: sequences_check
    next: check_dead_skills

  # --project . for the same issue-filing reason as scan_failures above.
  check_dead_skills:
    action: |
      RUN="${context.run_dir}"
      OUT="$RUN/dead-skills.json"
      ERR="$RUN/dead-skills.err"
      ll-logs dead-skills --project . --json > "$OUT" 2> "$ERR"
      RC=$?
      echo "exit_code=$RC" >> "$ERR"
      if [ "$RC" -ne 0 ]; then
        echo "DEAD_SKILLS_ERROR:rc=$RC"
      elif grep -q "No catalog skills found" "$ERR"; then
        echo "DEAD_SKILLS_NO_DATA"
      else
        COUNT=$(python3 -c "
      import json
      try:
          d = json.load(open('$OUT'))
          items = d.get('dead', d) if isinstance(d, dict) else d
          print(len(items) if isinstance(items, list) else -1)
      except Exception:
          print(-1)
      " 2>/dev/null || echo "-1")
        if [ "$COUNT" -lt 0 ]; then
          echo "DEAD_SKILLS_ERROR:unparseable"
        elif [ "$COUNT" -eq 0 ]; then
          echo "NO_DEAD_SKILLS"
        else
          echo "DEAD_SKILLS_FOUND:$COUNT"
        fi
      fi
    action_type: shell
    capture: dead_check
    evaluate:
      type: output_contains
      source: "${captured.dead_check.output}"
      pattern: "DEAD_SKILLS_FOUND"
    on_yes: file_dead_skill_issues
    on_no: synthesize_digest
    on_error: synthesize_digest

  file_dead_skill_issues:
    action_type: prompt
    timeout: 300
    action: |
      Dead-skill detection found skills with zero invocations in the log corpus.
      The list is at ${context.run_dir}/dead-skills.json.

      For each never-invoked skill:
      1. Check if it is an intentional one-shot (migration, bootstrap) — skip those
      2. If it appears genuinely undiscoverable or obsolete, run `/ll:capture-issue`
         to propose improving its trigger documentation or deprecating it
      3. Capture at most 2 issues per run

      Print "DEAD_TRIAGE_DONE" when finished.
    capture: dead_triage_status
    next: synthesize_digest

  synthesize_digest:
    action_type: prompt
    timeout: 300
    action: |
      Synthesize a telemetry digest from this run. Read whichever of these
      artifacts exist under ${context.run_dir}/:
        stats.txt        → skill frequency / quality summary (ENH-1921)
        sequences.txt    → top tool-chain n-grams (ENH-1919)
        failures.json    → failed ll-* calls found (ENH-1922)
        dead-skills.json → never-invoked skills (ENH-1923)

      FIRST, establish which states actually produced data. Each shell state
      emitted one status token, and each wrote a matching `.err` file ending in
      `exit_code=N`:
        stats.err, failures.err, sequences.err, dead-skills.err, extract.log

      A state whose token ends in _ERROR or _NO_DATA did NOT produce a usable
      artifact. **Never report zero failures or zero dead skills on the strength
      of a state that errored or found no data** — an absent finding and a
      failed lookup are different results (BUG-3216).

      Write a concise Markdown file to ${context.run_dir}/digest.md with:

      ## Run Summary
      - Which subcommands produced data, which errored, which found no data —
        quote the status token and exit_code for anything not OK
      - Key numbers: failure count, dead-skill count, top sequence if available.
        Write "unknown (state errored)" rather than 0 where a state failed.

      ## Issues Created This Run
      - List any /ll:capture-issue calls made during triage steps

      ## Remaining EPIC-1918 Coverage
      - Which child issues (ENH-1919/1920/1921/1922/1923/1924) are still open,
        limiting what this loop can observe on subsequent runs

      Print "DIGEST_WRITTEN" when the file is saved.
    capture: digest_status
    evaluate:
      type: output_contains
      source: "${captured.digest_status.output}"
      pattern: "DIGEST_WRITTEN"
    on_yes: commit_if_needed
    on_no: done
    on_error: done

  commit_if_needed:
    action: |
      NEW=$(git status --porcelain .issues/ 2>/dev/null | grep -c '^?' || echo 0)
      [ "$NEW" -eq 0 ] && echo "NO_NEW_ISSUES" || echo "NEW_ISSUES:$NEW"
    action_type: shell
    evaluate:
      type: output_contains
      pattern: "NO_NEW_ISSUES"
    on_yes: done
    on_no: commit
    on_error: done

  commit:
    action_type: prompt
    timeout: 120
    action: |
      New issue files were created during this telemetry digest run.
      Run `/ll:commit` with a message like:
      "chore(telemetry): ll-logs digest — auto-filed bugs and dead-skill issues"
    next: done

  done:
    terminal: true

max_iterations: 2
timeout: 3600
